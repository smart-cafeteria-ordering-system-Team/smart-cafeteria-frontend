
<!-- ================================================================
     SMART CAFETERIA ORDERING SYSTEM - ORDER SUMMARY VIEW
     ================================================================
     Reusable template for displaying order summary.
     Used in: checkout.html, order-tracking.html
     ================================================================ -->

<div class="order-summary">

    <!-- Decorative Glow -->
    <div class="summary-glow"></div>

    <!-- Order Header -->
    <div class="summary-header">
        <div class="order-heading">
            <div class="order-icon">
                <i class="fas fa-receipt"></i>
            </div>

            <div>
                <span class="order-label">ORDER DETAILS</span>
                <span class="order-id">Order #{{orderId}}</span>
            </div>
        </div>

        <span class="order-status status-badge {{status}}">
            {{statusLabel}}
        </span>
    </div>

    <!-- Items -->
    <div class="summary-section-title">
        <i class="fas fa-utensils"></i>
        <span>Order Items</span>
    </div>

    <div class="summary-items">
        {{#each items}}
            <div class="summary-item">

                <div class="summary-item-info">
                    <div class="summary-item-icon">
                        <i class="fas fa-bowl-food"></i>
                    </div>

                    <div>
                        <span class="summary-item-name">
                            {{this.name}}
                        </span>

                        <span class="qty">
                            ×{{this.quantity}}
                        </span>
                    </div>
                </div>

                <span class="summary-item-price">
                    {{this.price}} <small>ብር</small>
                </span>

            </div>
        {{/each}}
    </div>

    <!-- Total -->
    <div class="summary-total">
        <div class="total-label">
            <span>Total Amount</span>
            <small>Order total</small>
        </div>

        <span class="amount">
            {{totalAmount}} <small>ብር</small>
        </span>
    </div>

    <!-- Payment Status -->
    <div class="summary-payment">
        <div class="payment-label">
            <span class="payment-icon">
                <i class="fas fa-credit-card"></i>
            </span>
            <span>Payment Status</span>
        </div>

        <span class="payment-status {{paymentStatus}}">
            {{#if_eq paymentStatus 'simulated'}}
                <i class="fas fa-circle-check"></i>
                <span>Paid</span>
            {{else}}
                <i class="fas fa-clock"></i>
                <span>Pending</span>
            {{/if_eq}}
        </span>
    </div>

    <!-- Time -->
    <div class="summary-time">
        <i class="far fa-clock"></i>
        <span>{{orderTime}}</span>
    </div>

</div>


<style>
    /* ============================================================
       ORDER SUMMARY
       ============================================================ */

    .order-summary {
        position: relative;
        overflow: hidden;
        width: 100%;
        box-sizing: border-box;
        background:
            linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.98),
                rgba(248, 250, 252, 0.98)
            );
        border: 1px solid rgba(37, 99, 235, 0.10);
        border-radius: 20px;
        padding: 22px;
        box-shadow:
            0 10px 35px rgba(15, 23, 42, 0.08),
            0 2px 8px rgba(37, 99, 235, 0.05);
        font-family: 'Poppins', sans-serif;
        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease,
            border-color 0.3s ease;
    }

    .order-summary:hover {
        transform: translateY(-2px);
        border-color: rgba(37, 99, 235, 0.20);
        box-shadow:
            0 18px 45px rgba(15, 23, 42, 0.11),
            0 5px 15px rgba(37, 99, 235, 0.08);
    }

    /* Decorative glow */

    .summary-glow {
        position: absolute;
        width: 150px;
        height: 150px;
        top: -85px;
        right: -65px;
        border-radius: 50%;
        background: rgba(37, 99, 235, 0.10);
        filter: blur(2px);
        pointer-events: none;
    }


    /* ============================================================
       HEADER
       ============================================================ */

    .order-summary .summary-header {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 18px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .order-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }

    .order-icon {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 13px;
        color: #ffffff;
        font-size: 18px;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        box-shadow:
            0 8px 18px rgba(37, 99, 235, 0.25);
    }

    .order-label {
        display: block;
        margin-bottom: 2px;
        color: #64748b;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .order-summary .summary-header .order-id {
        display: block;
        color: #0f172a;
        font-size: 17px;
        line-height: 1.35;
        font-weight: 800;
        word-break: break-word;
    }


    /* ============================================================
       STATUS BADGE
       ============================================================ */

    .status-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 5px 13px;
        border-radius: 999px;
        font-size: 10px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
        border: 1px solid transparent;
    }

    .status-badge.pending {
        background: #fff7d6;
        color: #92400e;
        border-color: #fde68a;
    }

    .status-badge.preparing {
        background: #e0f2fe;
        color: #075985;
        border-color: #bae6fd;
    }

    .status-badge.ready {
        background: #dcfce7;
        color: #166534;
        border-color: #bbf7d0;
    }

    .status-badge.served {
        background: #f1f5f9;
        color: #475569;
        border-color: #e2e8f0;
    }

    .status-badge.cancelled {
        background: #fee2e2;
        color: #991b1b;
        border-color: #fecaca;
    }


    /* ============================================================
       SECTION TITLE
       ============================================================ */

    .summary-section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 9px;
        color: #334155;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    .summary-section-title i {
        color: #2563eb;
        font-size: 13px;
    }


    /* ============================================================
       ITEMS
       ============================================================ */

    .order-summary .summary-items {
        margin-bottom: 15px;
    }

    .order-summary .summary-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 11px 0;
        color: #475569;
        font-size: 13px;
        border-bottom: 1px dashed rgba(148, 163, 184, 0.25);
    }

    .order-summary .summary-item:last-child {
        border-bottom: none;
    }

    .summary-item-info {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
    }

    .summary-item-icon {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: #eff6ff;
        color: #2563eb;
        font-size: 13px;
    }

    .summary-item-name {
        display: inline-block;
        max-width: 100%;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
        overflow-wrap: anywhere;
    }

    .order-summary .summary-item .qty {
        display: inline-block;
        margin-left: 5px;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
    }

    .summary-item-price {
        flex-shrink: 0;
        color: #0f172a;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
    }

    .summary-item-price small {
        color: #64748b;
        font-size: 11px;
        font-weight: 500;
    }


    /* ============================================================
       TOTAL
       ============================================================ */

    .order-summary .summary-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 16px 0;
        margin-top: 2px;
        border-top: 2px solid rgba(37, 99, 235, 0.10);
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .total-label span {
        display: block;
        color: #0f172a;
        font-size: 15px;
        font-weight: 800;
    }

    .total-label small {
        display: block;
        margin-top: 2px;
        color: #94a3b8;
        font-size: 10px;
        font-weight: 500;
    }

    .order-summary .summary-total .amount {
        color: #2563eb;
        font-size: 21px;
        font-weight: 800;
        white-space: nowrap;
    }

    .order-summary .summary-total .amount small {
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
    }


    /* ============================================================
       PAYMENT
       ============================================================ */

    .order-summary .summary-payment {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        padding: 11px 12px;
        border-radius: 11px;
        background: #f8fafc;
        color: #64748b;
        font-size: 12px;
    }

    .payment-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
    }

    .payment-icon {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #ffffff;
        color: #2563eb;
        box-shadow: 0 2px 7px rgba(15, 23, 42, 0.06);
    }

    .payment-status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
    }

    .payment-status.simulated {
        color: #16a34a;
    }

    .payment-status.pending {
        color: #f59e0b;
    }

    .payment-status i {
        font-size: 13px;
    }


    /* ============================================================
       TIME
       ============================================================ */

    .order-summary .summary-time {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 10px;
        padding-top: 10px;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 500;
    }

    .order-summary .summary-time i {
        color: #64748b;
        font-size: 12px;
    }


    /* ============================================================
       TABLET
       ============================================================ */

    @media (max-width: 768px) {

        .order-summary {
            padding: 18px;
            border-radius: 17px;
        }

        .order-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            font-size: 16px;
        }

        .order-summary .summary-header .order-id {
            font-size: 15px;
        }

        .order-summary .summary-total .amount {
            font-size: 19px;
        }
    }


    /* ============================================================
       MOBILE
       ============================================================ */

    @media (max-width: 480px) {

        .order-summary {
            padding: 15px;
            border-radius: 15px;
        }

        .order-summary .summary-header {
            align-items: flex-start;
        }

        .order-heading {
            gap: 9px;
        }

        .order-icon {
            width: 37px;
            height: 37px;
            font-size: 14px;
        }

        .order-label {
            font-size: 9px;
        }

        .order-summary .summary-header .order-id {
            font-size: 14px;
        }

        .status-badge {
            padding: 5px 10px;
            font-size: 9px;
        }

        .summary-item-icon {
            width: 31px;
            height: 31px;
            font-size: 11px;
        }

        .summary-item-name {
            font-size: 12px;
        }

        .summary-item-price {
            font-size: 12px;
        }

        .order-summary .summary-total {
            align-items: flex-end;
        }

        .total-label span {
            font-size: 14px;
        }

        .order-summary .summary-total .amount {
            font-size: 17px;
        }

        .order-summary .summary-payment {
            align-items: flex-start;
            flex-direction: column;
            gap: 7px;
        }

        .payment-status {
            align-self: flex-end;
        }
    }


    /* ============================================================
       VERY SMALL SCREENS
       ============================================================ */

    @media (max-width: 350px) {

        .order-summary {
            padding: 12px;
        }

        .summary-item-info {
            gap: 7px;
        }

        .summary-item-icon {
            width: 28px;
            height: 28px;
        }

        .summary-item-name {
            font-size: 11px;
        }

        .summary-item-price {
            font-size: 11px;
        }

        .order-summary .summary-total .amount {
            font-size: 15px;
        }
    }
</style>

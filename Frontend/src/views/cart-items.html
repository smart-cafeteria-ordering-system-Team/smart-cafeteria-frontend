
<!-- ================================================================
     SMART CAFETERIA ORDERING SYSTEM - CART ITEMS VIEW
     ================================================================
     Reusable template for displaying cart items.
     Used in: cart.html, checkout.html
     ================================================================ -->

<div class="cart-item" data-index="{{index}}">

    <!-- Icon -->
    <div class="item-icon" aria-hidden="true">
        {{icon}}
    </div>

    <!-- Info -->
    <div class="item-info">

        <div class="item-name">
            {{name}}
        </div>

        <div class="item-price">
            {{price}} <span class="currency">ብር</span> each
        </div>

        {{#if notes}}
            <div class="item-notes">
                <i class="fas fa-pen" aria-hidden="true"></i>
                <span>{{notes}}</span>
            </div>
        {{/if}}

    </div>

    <!-- Quantity Control -->
    <div class="qty-control" aria-label="Quantity controls">

        <button
            type="button"
            class="qty-minus"
            data-id="{{itemId}}"
            aria-label="Decrease quantity"
            title="Decrease quantity">
            <i class="fas fa-minus" aria-hidden="true"></i>
        </button>

        <span class="qty" aria-label="Quantity">
            {{quantity}}
        </span>

        <button
            type="button"
            class="qty-plus"
            data-id="{{itemId}}"
            aria-label="Increase quantity"
            title="Increase quantity">
            <i class="fas fa-plus" aria-hidden="true"></i>
        </button>

    </div>

    <!-- Total -->
    <div class="item-total">
        {{total}} <span class="currency">ብር</span>
    </div>

    <!-- Remove -->
    <button
        type="button"
        class="remove-btn"
        data-id="{{itemId}}"
        aria-label="Remove item"
        title="Remove item">
        <i class="fas fa-trash-alt" aria-hidden="true"></i>
    </button>

</div>

<style>
    /* ================================================================
       CART ITEM
       ================================================================ */

    .cart-item {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        box-sizing: border-box;
        background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid rgba(37, 99, 235, 0.10);
        box-shadow:
            0 4px 16px rgba(15, 23, 42, 0.06),
            0 1px 3px rgba(15, 23, 42, 0.04);
        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease,
            border-color 0.25s ease;
    }

    .cart-item:hover {
        transform: translateY(-2px);
        border-color: rgba(37, 99, 235, 0.20);
        box-shadow:
            0 10px 28px rgba(37, 99, 235, 0.10),
            0 3px 8px rgba(15, 23, 42, 0.06);
    }

    /* ================================================================
       ITEM ICON
       ================================================================ */

    .cart-item .item-icon {
        width: 52px;
        height: 52px;
        min-width: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
        color: #2563eb;
        font-size: 26px;
        text-align: center;
        flex-shrink: 0;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.08);
    }

    .cart-item .item-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* ================================================================
       ITEM INFORMATION
       ================================================================ */

    .cart-item .item-info {
        flex: 1;
        min-width: 0;
    }

    .cart-item .item-info .item-name {
        font-weight: 700;
        color: var(--gray-900);
        font-size: 15px;
        line-height: 1.4;
        overflow-wrap: anywhere;
    }

    .cart-item .item-info .item-price {
        margin-top: 3px;
        font-size: 13px;
        color: var(--gray-500);
    }

    .cart-item .currency {
        font-weight: 600;
        white-space: nowrap;
    }

    .cart-item .item-notes {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--gray-400);
        overflow-wrap: anywhere;
    }

    .cart-item .item-notes i {
        color: #64748b;
        font-size: 11px;
        flex-shrink: 0;
    }

    /* ================================================================
       QUANTITY CONTROL
       ================================================================ */

    .cart-item .qty-control {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        flex-shrink: 0;
        padding: 4px;
        border-radius: 12px;
        background: #f8fafc;
    }

    .cart-item .qty-control button {
        width: 32px;
        height: 32px;
        min-width: 32px;
        border: 1.5px solid #dbe3ef;
        border-radius: 50%;
        background: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        cursor: pointer;
        transition:
            all 0.2s ease;
        color: #475569;
        font-weight: 700;
        padding: 0;
        font-family: inherit;
    }

    .cart-item .qty-control button:hover {
        border-color: #2563eb;
        background: #eff6ff;
        color: #2563eb;
        transform: scale(1.08);
    }

    .cart-item .qty-control button:active {
        transform: scale(0.94);
    }

    .cart-item .qty-control button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.18);
        outline-offset: 2px;
    }

    .cart-item .qty-control .qty {
        min-width: 28px;
        text-align: center;
        font-weight: 700;
        font-size: 15px;
        color: var(--gray-900);
        line-height: 32px;
    }

    /* ================================================================
       TOTAL
       ================================================================ */

    .cart-item .item-total {
        font-weight: 800;
        font-size: 16px;
        color: #2563eb;
        min-width: 78px;
        text-align: right;
        white-space: nowrap;
    }

    /* ================================================================
       REMOVE BUTTON
       ================================================================ */

    .cart-item .remove-btn {
        width: 36px;
        height: 36px;
        min-width: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #fff5f5;
        border: 1px solid #fee2e2;
        border-radius: 10px;
        color: #94a3b8;
        font-size: 14px;
        cursor: pointer;
        padding: 0;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }

    .cart-item .remove-btn:hover {
        background: #fee2e2;
        border-color: #fecaca;
        color: #dc2626;
        transform: scale(1.06);
    }

    .cart-item .remove-btn:active {
        transform: scale(0.94);
    }

    .cart-item .remove-btn:focus-visible {
        outline: 3px solid rgba(220, 38, 38, 0.15);
        outline-offset: 2px;
    }

    /* ================================================================
       TABLET
       ================================================================ */

    @media (max-width: 768px) {

        .cart-item {
            gap: 11px;
            padding: 12px;
            border-radius: 14px;
        }

        .cart-item .item-icon {
            width: 46px;
            height: 46px;
            min-width: 46px;
            border-radius: 12px;
            font-size: 23px;
        }

        .cart-item .item-info .item-name {
            font-size: 14px;
        }

        .cart-item .item-info .item-price {
            font-size: 12px;
        }

        .cart-item .qty-control {
            gap: 5px;
        }

        .cart-item .qty-control button {
            width: 30px;
            height: 30px;
            min-width: 30px;
        }

        .cart-item .qty-control .qty {
            min-width: 24px;
            line-height: 30px;
        }

        .cart-item .item-total {
            min-width: 65px;
            font-size: 14px;
        }

        .cart-item .remove-btn {
            width: 34px;
            height: 34px;
            min-width: 34px;
        }
    }

    /* ================================================================
       MOBILE
       ================================================================ */

    @media (max-width: 560px) {

        .cart-item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 10px;
            padding: 12px;
        }

        .cart-item .item-icon {
            grid-row: 1 / span 2;
            align-self: center;
        }

        .cart-item .item-info {
            grid-column: 2;
            grid-row: 1;
            min-width: 0;
        }

        .cart-item .qty-control {
            grid-column: 2;
            grid-row: 2;
            justify-content: flex-start;
            width: max-content;
        }

        .cart-item .item-total {
            grid-column: 3;
            grid-row: 1;
            align-self: center;
            min-width: auto;
            font-size: 14px;
        }

        .cart-item .remove-btn {
            grid-column: 3;
            grid-row: 2;
            justify-self: end;
            align-self: center;
        }
    }

    /* ================================================================
       SMALL MOBILE
       ================================================================ */

    @media (max-width: 380px) {

        .cart-item {
            gap: 8px;
            padding: 10px;
        }

        .cart-item .item-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            font-size: 20px;
        }

        .cart-item .item-info .item-name {
            font-size: 13px;
        }

        .cart-item .item-total {
            font-size: 13px;
        }

        .cart-item .qty-control button {
            width: 28px;
            height: 28px;
            min-width: 28px;
        }

        .cart-item .qty-control .qty {
            min-width: 22px;
            line-height: 28px;
            font-size: 14px;
        }

        .cart-item .remove-btn {
            width: 31px;
            height: 31px;
            min-width: 31px;
            font-size: 12px;
        }
    }
</style>

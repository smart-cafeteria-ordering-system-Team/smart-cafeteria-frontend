

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Food Details | Smart Cafeteria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/components.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
    <!-- Theme -->
    <link rel="stylesheet" href="/src/css/theme.css" />
    <link rel="stylesheet" href="/src/css/themes/dark-theme.css" />
    <script src="/src/js/theme.js"></script>

    <style>

        /* =========================================================
           SMART CAFETERIA — PREMIUM FOOD DETAILS
           ========================================================= */

        .details-page,
        .details-page *,
        .details-page *::before,
        .details-page *::after {
            box-sizing: border-box;
        }

        .details-page {
            min-height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;

            padding: 35px 0 70px;

            background:
                radial-gradient(
                    circle at 8% 8%,
                    rgba(37, 99, 235, .16),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 92% 12%,
                    rgba(124, 58, 237, .15),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(16, 185, 129, .10),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #f5f3ff 48%,
                    #f0fdf9 100%
                );
        }

        /* Decorative background */
        .details-page::before {
            content: "";
            position: absolute;

            width: 360px;
            height: 360px;

            top: -170px;
            left: -170px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(37, 99, 235, .12),
                    rgba(124, 58, 237, .08)
                );

            filter: blur(2px);
            pointer-events: none;
        }

        .details-page::after {
            content: "";
            position: absolute;

            width: 420px;
            height: 420px;

            right: -210px;
            bottom: -220px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(16, 185, 129, .10),
                    rgba(37, 99, 235, .08)
                );

            pointer-events: none;
        }

        .details-page .container {
            position: relative;
            z-index: 2;

            width: min(1180px, calc(100% - 48px));
            max-width: 1180px;

            margin: 0 auto;
            padding: 0;
        }

        /* =========================================================
           BACK BUTTON
           ========================================================= */

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 48px;
            min-width: 156px;

            padding: 12px 20px;

            gap: 10px;

            border-radius: 13px;

            border: 1px solid rgba(37, 99, 235, .18);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, .98),
                    rgba(239, 246, 255, .96)
                );

            color: #1e40af;

            text-decoration: none;

            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 700;

            box-shadow:
                0 8px 24px rgba(37, 99, 235, .10),
                inset 0 1px 0 rgba(255,255,255,.9);

            margin-bottom: 24px;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease,
                color .25s ease;
        }

        .back-link i {
            width: 28px;
            height: 28px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #2563eb;
            color: white;

            font-size: 12px;

            transition: transform .25s ease;
        }

        .back-link:hover {
            color: #1d4ed8;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #eff6ff
                );

            transform: translateY(-3px);

            box-shadow:
                0 14px 30px rgba(37, 99, 235, .18);
        }

        .back-link:hover i {
            transform: translateX(-3px);
        }

        /* =========================================================
           MAIN CARD
           ========================================================= */

        .details-card {
            width: 100%;
            overflow: hidden;

            border-radius: 28px;

            border: 1px solid rgba(255,255,255,.85);

            background:
                rgba(255,255,255,.94);

            box-shadow:
                0 30px 80px rgba(15,23,42,.12),
                0 8px 30px rgba(37,99,235,.07);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* =========================================================
           IMAGE SECTION
           ========================================================= */

        .details-card .image-section {
            position: relative;

            width: 100%;
            height: 440px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: white;
            font-size: 100px;

            background:
                radial-gradient(
                    circle at 25% 20%,
                    rgba(255,255,255,.35),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #4f46e5 45%,
                    #7c3aed 100%
                );
        }

        .details-card .image-section::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.12),
                    transparent 35%,
                    rgba(0,0,0,.12)
                );

            z-index: 1;

            pointer-events: none;
        }

        .details-card .image-section::after {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            right: -100px;
            bottom: -150px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.10);

            z-index: 2;

            pointer-events: none;
        }

        .details-card .image-section img {
            position: relative;
            z-index: 3;

            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            transition: transform .7s ease;
        }

        .details-card:hover .image-section img {
            transform: scale(1.035);
        }

        /* =========================================================
           STATUS BADGE
           ========================================================= */

        .details-card
        .image-section
        .status-badge {
            position: absolute;

            top: 22px;
            right: 22px;

            z-index: 10;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 38px;

            padding: 8px 17px;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: .06em;

            text-transform: uppercase;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.16);
        }

        .details-card
        .image-section
        .status-badge.available {
            background:
                rgba(220,252,231,.94);

            color: #166534;

            border:
                1px solid rgba(22,101,52,.15);
        }

        .details-card
        .image-section
        .status-badge.unavailable {
            background:
                rgba(254,226,226,.94);

            color: #991b1b;

            border:
                1px solid rgba(153,27,27,.15);
        }

        /* =========================================================
           CONTENT
           ========================================================= */

        .details-card .content-section {
            padding: 38px 44px 44px;
        }

        .details-card
        .content-section
        .category-tag {
            display: inline-flex;
            align-items: center;

            padding: 7px 13px;

            margin-bottom: 10px;

            border-radius: 999px;

            color: #4338ca;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f5f3ff
                );

            border:
                1px solid rgba(99,102,241,.12);

            font-size: 11px;
            font-weight: 800;

            letter-spacing: .07em;
            text-transform: uppercase;
        }

        .details-card
        .content-section
        h1 {
            margin: 0 0 12px;

            color: #0f172a;

            font-size: clamp(
                28px,
                4vw,
                42px
            );

            line-height: 1.15;
            font-weight: 800;

            letter-spacing: -.035em;
        }

        .details-card
        .content-section
        .description {
            max-width: 950px;

            margin: 0 0 30px;

            color: #64748b;

            font-size: 15px;
            line-height: 1.8;

            overflow-wrap: anywhere;
        }

        /* =========================================================
           INFO GRID
           ========================================================= */

        .details-card
        .content-section
        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap: 15px;

            margin-bottom: 30px;

            padding: 14px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #eef2ff
                );

            border:
                1px solid rgba(226,232,240,.9);
        }

        .details-card
        .content-section
        .info-grid
        .info-item {
            min-width: 0;

            min-height: 92px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 12px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.90);

            border:
                1px solid rgba(255,255,255,.95);

            box-shadow:
                0 5px 15px rgba(15,23,42,.04);

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        .details-card
        .content-section
        .info-grid
        .info-item:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 26px rgba(37,99,235,.09);
        }

        .details-card
        .content-section
        .info-grid
        .info-item
        .label {
            margin-bottom: 6px;

            color: #94a3b8;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: .07em;
        }

        .details-card
        .content-section
        .info-grid
        .info-item
        .value {
            color: #0f172a;

            font-size: 19px;
            font-weight: 800;

            text-align: center;
        }

        .details-card
        .content-section
        .info-grid
        .info-item
        .value.price {
            color: #2563eb;
        }

        /* =========================================================
           ACTION ROW
           ========================================================= */

        .details-card
        .content-section
        .action-row {
            display: flex;
            align-items: center;

            gap: 18px;

            width: 100%;

            padding-top: 24px;

            border-top:
                1px solid #e2e8f0;
        }

        /* =========================================================
           QUANTITY
           ========================================================= */

        .details-card
        .content-section
        .action-row
        .qty-control {
            flex: 0 0 auto;

            display: flex;
            align-items: center;

            gap: 10px;

            min-height: 56px;

            padding: 6px 10px;

            border-radius: 15px;

            border:
                1px solid #dbe4ef;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #ffffff
                );

            box-shadow:
                0 5px 15px rgba(15,23,42,.04);
        }

        .details-card
        .content-section
        .action-row
        .qty-control
        button {
            width: 40px;
            height: 40px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border:
                1.5px solid #dbe2ea;

            border-radius: 50%;

            background: white;

            color: #475569;

            font-family: inherit;

            font-size: 20px;
            font-weight: 700;

            cursor: pointer;

            transition:
                all .2s ease;
        }

        .details-card
        .content-section
        .action-row
        .qty-control
        button:hover {
            color: white;

            border-color: #2563eb;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            transform: scale(1.07);

            box-shadow:
                0 7px 18px rgba(37,99,235,.22);
        }

        .details-card
        .content-section
        .action-row
        .qty-control
        .qty {
            min-width: 38px;

            color: #0f172a;

            font-size: 20px;
            font-weight: 800;

            text-align: center;
        }

        /* =========================================================
           ADD TO CART BUTTON
           ========================================================= */

        .details-card
        .content-section
        .action-row
        .btn-add-large {
            flex: 1;

            min-width: 220px;
            min-height: 56px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 14px 28px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #4f46e5 52%,
                    #7c3aed 100%
                );

            color: white;

            font-family: "Poppins", sans-serif;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(79,70,229,.25);

            transition:
                all .25s ease;
        }

        .details-card
        .content-section
        .action-row
        .btn-add-large:hover {
            transform: translateY(-3px);

            box-shadow:
                0 18px 38px rgba(79,70,229,.34);

            filter: brightness(1.05);
        }

        .details-card
        .content-section
        .action-row
        .btn-add-large:active {
            transform: translateY(0);
        }

        .details-card
        .content-section
        .action-row
        .btn-add-large:disabled {
            background: #cbd5e1;

            color: #64748b;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

            filter: none;
        }

        /* =========================================================
           RELATED SECTION
           ========================================================= */

        .related-section {
            width: 100%;

            margin-top: 42px;
        }

        .related-section h3 {
            margin: 0 0 20px;

            color: #0f172a;

            font-size: 24px;
            font-weight: 800;

            letter-spacing: -.025em;
        }

        .related-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0,1fr));

            gap: 18px;
        }

        .related-item {
            min-width: 0;

            padding: 20px 15px;

            border-radius: 17px;

            border:
                1px solid rgba(226,232,240,.9);

            background:
                rgba(255,255,255,.92);

            text-align: center;

            cursor: pointer;

            box-shadow:
                0 7px 20px rgba(15,23,42,.05);

            transition:
                all .25s ease;
        }

        .related-item:hover {
            transform: translateY(-6px);

            border-color:
                rgba(37,99,235,.20);

            box-shadow:
                0 17px 34px rgba(37,99,235,.12);
        }

        .related-item .r-icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 10px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #eef2ff
                );

            font-size: 34px;
        }

        .related-item .r-name {
            margin-bottom: 5px;

            color: #334155;

            font-size: 14px;
            font-weight: 700;

            line-height: 1.45;

            overflow-wrap: anywhere;
        }

        .related-item .r-price {
            color: #2563eb;

            font-size: 14px;
            font-weight: 800;
        }

        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 900px) {

            .details-page {
                padding-top: 28px;
            }

            .details-page .container {
                width: calc(100% - 32px);
            }

            .details-card
            .image-section {
                height: 360px;
            }

            .details-card
            .content-section {
                padding: 32px;
            }

            .related-grid {
                grid-template-columns:
                    repeat(2, minmax(0,1fr));
            }
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            .details-page {
                padding: 20px 0 45px;
            }

            .details-page .container {
                width: calc(100% - 20px);
            }

            .back-link {
                min-width: 150px;
                min-height: 46px;

                margin-bottom: 18px;

                padding: 11px 18px;

                font-size: 13px;
            }

            .details-card {
                border-radius: 21px;
            }

            .details-card
            .image-section {
                height: 270px;
            }

            .details-card
            .image-section
            .status-badge {
                top: 14px;
                right: 14px;

                min-height: 32px;

                padding: 6px 12px;

                font-size: 9px;
            }

            .details-card
            .content-section {
                padding: 24px 18px 25px;
            }

            .details-card
            .content-section
            h1 {
                font-size: 26px;
            }

            .details-card
            .content-section
            .description {
                font-size: 13px;
                line-height: 1.7;
            }

            .details-card
            .content-section
            .info-grid {
                grid-template-columns: 1fr;

                gap: 8px;
            }

            .details-card
            .content-section
            .info-grid
            .info-item {
                min-height: 62px;

                flex-direction: row;
                justify-content: space-between;
            }

            .details-card
            .content-section
            .info-grid
            .info-item
            .label {
                margin-bottom: 0;
            }

            .details-card
            .content-section
            .action-row {
                flex-direction: column;

                align-items: stretch;

                gap: 12px;
            }

            .details-card
            .content-section
            .action-row
            .qty-control {
                width: 100%;

                justify-content: center;
            }

            .details-card
            .content-section
            .action-row
            .btn-add-large {
                width: 100%;

                min-width: 0;
            }
        }

        /* =========================================================
           VERY SMALL PHONE
           ========================================================= */

        @media (max-width: 380px) {

            .details-page .container {
                width: calc(100% - 14px);
            }

            .back-link {
                min-width: 142px;
                min-height: 44px;

                padding: 10px 15px;
            }

            .details-card
            .image-section {
                height: 220px;
            }

            .details-card
            .content-section {
                padding: 20px 13px;
            }

            .details-card
            .content-section
            h1 {
                font-size: 23px;
            }

            .related-grid {
                gap: 8px;
            }

            .related-item {
                padding: 14px 7px;
            }

            .related-item .r-icon {
                width: 52px;
                height: 52px;

                border-radius: 14px;

                font-size: 28px;
            }
        }

        /* =========================================================
           LARGE SCREEN
           ========================================================= */

        @media (min-width: 1200px) {

            .details-page .container {
                max-width: 1180px;
            }

            .details-card
            .image-section {
                height: 460px;
            }

            .details-card
            .content-section {
                padding: 42px 48px 48px;
            }
        }

        /* =========================================================
           EXTRA LARGE
           ========================================================= */

        @media (min-width: 1600px) {

            .details-page .container {
                max-width: 1320px;
            }

            .details-card
            .image-section {
                height: 510px;
            }

            .details-card
            .content-section {
                padding: 48px 58px 52px;
            }
        }

        /* =========================================================
           ACCESSIBILITY
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .details-page *,
            .details-page *::before,
            .details-page *::after {
                animation: none !important;
                transition: none !important;
            }
        }

    </style>
</head>

<body>

    <div class="details-page">

        <!-- Header will be injected -->

        <div class="container">

            <a href="menu.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Menu
            </a>

            <div class="details-card" id="detailsCard">
                <!-- Will be injected by JavaScript -->
            </div>

            <div
                class="related-section"
                id="relatedSection"
                style="display:none;"
            >
                <h3>You Might Also Like</h3>

                <div
                    class="related-grid"
                    id="relatedGrid"
                ></div>
            </div>

        </div>
    </div>


    <!-- =========================================================
         SCRIPT
         ========================================================= -->

    <script type="module">

        import { createHeader } from '../../components/header.js';
        import { createFooter } from '../../components/footer.js';

        import {
            getMenuItemById,
            getRelatedItems,
            getCategoryById
        } from '../../js/menu.js';

        import {
            getCartCount,
            addToCart,
            isInCart
        } from '../../js/cart.js';

        import {
            isLoggedIn,
            getCurrentUser
        } from '../../js/auth.js';

        import {
            showToast
        } from '../../js/main.js';


        // =========================================================
        // RENDER HEADER
        // =========================================================

        const user = getCurrentUser();

        const isLoggedInUser = isLoggedIn();

        document.body.insertAdjacentHTML(
            'afterbegin',
            createHeader({

                navLinks: [
                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },
                    {
                        label: 'Order History',
                        href: 'order-history.html'
                    },
                    {
                        label: 'Profile',
                        href: 'profile.html'
                    }
                ],

                user: user,

                isLoggedIn: isLoggedInUser,

                cartCount: getCartCount(),

                theme:
                    localStorage.getItem('scos_theme')
                    || 'light',

                language:
                    localStorage.getItem('scos_language')
                    || 'en',

                authButtons: {
                    loginLabel: 'Login',
                    registerLabel: 'Register',
                    loginHref: '../common/login.html',
                    registerHref: '../common/register.html'
                },

                onToggleMenu: () => {
                    document
                        .getElementById('mainNav')
                        ?.classList
                        .toggle('open');
                },

                onToggleTheme: () => {
                    /* handled in menu page */
                },

                onToggleLanguage: () => {
                    /* handled in menu page */
                },

                onLogout: () => {

                    if (confirm('Are you sure?')) {

                        localStorage.removeItem(
                            'scos_user'
                        );

                        localStorage.removeItem(
                            'scos_token'
                        );

                        localStorage.removeItem(
                            'scos_cart'
                        );

                        window.location.href =
                            '../common/login.html';
                    }
                },

                onNotificationClick: () => {
                    window.location.href =
                        'notifications.html';
                }

            })
        );


        // =========================================================
        // RENDER FOOTER
        // =========================================================

        document.body.insertAdjacentHTML(
            'beforeend',
            createFooter({

                quickLinks: [
                    {
                        label: 'Home',
                        href: '../../index.html'
                    },
                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },
                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },
                    {
                        label: 'Register',
                        href: '../common/register.html'
                    }
                ],

                roleLinks: [
                    {
                        label: 'Customer',
                        href: 'menu.html'
                    },
                    {
                        label: 'Kitchen',
                        href: '../kitchen/dashboard.html'
                    },
                    {
                        label: 'Admin',
                        href: '../admin/dashboard.html'
                    }
                ]

            })
        );


        // =========================================================
        // GET ITEM ID
        // =========================================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const itemId =
            parseInt(
                urlParams.get('id')
            ) || 1;

        const item =
            getMenuItemById(itemId);


        // =========================================================
        // ITEM NOT FOUND
        // =========================================================

        if (!item) {

            document.getElementById(
                'detailsCard'
            ).innerHTML = `

                <div
                    style="
                        padding:60px 20px;
                        text-align:center;
                    "
                >

                    <i
                        class="fas fa-exclamation-circle"
                        style="
                            font-size:48px;
                            color:var(--gray-400);
                        "
                    ></i>

                    <h3
                        style="
                            margin-top:12px;
                            color:var(--gray-600);
                        "
                    >
                        Item not found
                    </h3>

                    <a
                        href="menu.html"
                        class="btn btn-primary"
                        style="margin-top:16px;"
                    >
                        Back to Menu
                    </a>

                </div>
            `;

        }


        // =========================================================
        // RENDER DETAILS
        // =========================================================

        else {

            const lang =
                localStorage.getItem(
                    'scos_language'
                ) || 'en';

            const name =
                item.name[lang]
                || item.name.en;

            const desc =
                item.description[lang]
                || item.description.en;

            const category =
                getCategoryById(
                    item.category,
                    lang
                )?.name
                || item.category;

            const inCart =
                isInCart(item.id);


            const detailsHTML = `

                <div class="image-section">

                    ${
                        item.image
                            ? `<img
                                src="${item.image}"
                                alt="${name}"
                            >`
                            : item.icon || '🍽️'
                    }

                    <span
                        class="
                            status-badge
                            ${
                                item.availability
                                    ? 'available'
                                    : 'unavailable'
                            }
                        "
                    >
                        ${
                            item.availability
                                ? 'Available'
                                : 'Unavailable'
                        }
                    </span>

                </div>


                <div class="content-section">

                    <div class="category-tag">
                        ${category}
                    </div>

                    <h1>
                        ${name}
                    </h1>

                    <p class="description">
                        ${
                            desc
                            || 'No description available.'
                        }
                    </p>


                    <div class="info-grid">

                        <div class="info-item">

                            <div class="label">
                                Price
                            </div>

                            <div class="value price">
                                ${item.price} ብር
                            </div>

                        </div>


                        <div class="info-item">

                            <div class="label">
                                Preparation Time
                            </div>

                            <div class="value">
                                ${
                                    item.preparationTime
                                    || 'N/A'
                                }
                                min
                            </div>

                        </div>


                        <div class="info-item">

                            <div class="label">
                                Status
                            </div>

                            <div
                                class="value"
                                style="
                                    font-size:16px;
                                    color:
                                    ${
                                        item.availability
                                            ? '#16a34a'
                                            : '#dc2626'
                                    }
                                "
                            >
                                ${
                                    item.availability
                                        ? '✅ Available'
                                        : '❌ Unavailable'
                                }
                            </div>

                        </div>

                    </div>


                    <div class="action-row">

                        <div class="qty-control">

                            <button
                                id="qtyMinus"
                                type="button"
                            >
                                −
                            </button>

                            <span
                                class="qty"
                                id="qtyDisplay"
                            >
                                1
                            </span>

                            <button
                                id="qtyPlus"
                                type="button"
                            >
                                +
                            </button>

                        </div>


                        <button
                            class="btn-add-large"
                            id="addToCartBtn"
                            ${
                                !item.availability
                                    ? 'disabled'
                                    : ''
                            }
                        >

                            <i
                                class="
                                    fas
                                    ${
                                        inCart
                                            ? 'fa-check'
                                            : 'fa-plus'
                                    }
                                "
                            ></i>

                            ${
                                inCart
                                    ? 'Added to Cart'
                                    : 'Add to Cart'
                            }

                        </button>

                    </div>

                </div>
            `;


            document.getElementById(
                'detailsCard'
            ).innerHTML = detailsHTML;


            // =====================================================
            // QUANTITY
            // =====================================================

            let quantity = 1;

            const qtyDisplay =
                document.getElementById(
                    'qtyDisplay'
                );

            const qtyMinus =
                document.getElementById(
                    'qtyMinus'
                );

            const qtyPlus =
                document.getElementById(
                    'qtyPlus'
                );

            const addBtn =
                document.getElementById(
                    'addToCartBtn'
                );


            qtyMinus.addEventListener(
                'click',
                () => {

                    if (quantity > 1) {

                        quantity--;

                        qtyDisplay.textContent =
                            quantity;
                    }

                }
            );


            qtyPlus.addEventListener(
                'click',
                () => {

                    if (quantity < 99) {

                        quantity++;

                        qtyDisplay.textContent =
                            quantity;
                    }

                }
            );


            // =====================================================
            // ADD TO CART
            // =====================================================

            addBtn.addEventListener(
                'click',
                function () {

                    if (!item.availability) {
                        return;
                    }

                    addToCart(
                        item.id,
                        quantity
                    );

                    this.innerHTML =
                        `<i class="fas fa-check"></i> Added to Cart`;

                    this.style.background =
                        '#16a34a';

                    showToast(
                        `Added ${quantity}x ${name} to cart! 🛒`,
                        'success'
                    );

                    setTimeout(
                        () => {

                            this.innerHTML =
                                `<i class="fas fa-plus"></i> Add to Cart`;

                            this.style.background =
                                '#2563eb';

                        },
                        1500
                    );

                }
            );


            // =====================================================
            // RELATED ITEMS
            // =====================================================

            const relatedItems =
                getRelatedItems(
                    item.id,
                    4
                );


            if (
                relatedItems.length > 0
            ) {

                document.getElementById(
                    'relatedSection'
                ).style.display =
                    'block';


                const relatedGrid =
                    document.getElementById(
                        'relatedGrid'
                    );


                relatedGrid.innerHTML =
                    relatedItems
                        .map(
                            rel => `

                                <div
                                    class="related-item"
                                    data-id="${rel.id}"
                                >

                                    <span
                                        class="r-icon"
                                    >
                                        ${
                                            rel.icon
                                            || '🍽️'
                                        }
                                    </span>

                                    <div
                                        class="r-name"
                                    >
                                        ${
                                            rel.name[lang]
                                            || rel.name.en
                                        }
                                    </div>

                                    <div
                                        class="r-price"
                                    >
                                        ${rel.price} ብር
                                    </div>

                                </div>

                            `
                        )
                        .join('');


                relatedGrid
                    .querySelectorAll(
                        '.related-item'
                    )
                    .forEach(
                        el => {

                            el.addEventListener(
                                'click',
                                function () {

                                    window.location.href =
                                        `food-details.html?id=${this.dataset.id}`;

                                }
                            );

                        }
                    );

            }

        }


        console.log(
            `🍽️ Food details page loaded for item ID: ${itemId}`
        );

    </script>

</body>
</html>

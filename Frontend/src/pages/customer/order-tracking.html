<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Tracking | Smart Cafeteria</title>

    <!-- =========================================================
         Google Fonts
    ========================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- =========================================================
         Font Awesome
    ========================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- =========================================================
         Existing Project CSS
    ========================================================== -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <!-- =========================================================
         Order Tracking Page CSS
         Scoped to .tracking-page to avoid conflicts
         with project-wide CSS files.
    ========================================================== -->
    <style>
        /* =====================================================
           RESET / SAFE FOUNDATION
        ====================================================== */

        .tracking-page,
        .tracking-page *,
        .tracking-page *::before,
        .tracking-page *::after {
            box-sizing: border-box;
        }

        .tracking-page {
            --tracking-blue: #2563eb;
            --tracking-blue-dark: #1d4ed8;
            --tracking-blue-light: #60a5fa;

            --tracking-purple: #7c3aed;
            --tracking-cyan: #06b6d4;

            --tracking-green: #16a34a;
            --tracking-red: #dc2626;
            --tracking-orange: #f59e0b;

            --tracking-white: #ffffff;
            --tracking-gray-50: #f8fafc;
            --tracking-gray-100: #f1f5f9;
            --tracking-gray-200: #e2e8f0;
            --tracking-gray-300: #cbd5e1;
            --tracking-gray-400: #94a3b8;
            --tracking-gray-500: #64748b;
            --tracking-gray-600: #475569;
            --tracking-gray-700: #334155;
            --tracking-gray-800: #1e293b;
            --tracking-gray-900: #0f172a;

            min-height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;

            font-family: "Poppins", sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(37, 99, 235, 0.22),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(124, 58, 237, 0.20),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 80% 90%,
                    rgba(6, 182, 212, 0.16),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #eef5ff 45%,
                    #f8f7ff 100%
                );

            padding: 34px 0 60px;
        }

        /*
         * Decorative glowing background elements
         */
        .tracking-page::before,
        .tracking-page::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(3px);
            z-index: 0;
        }

        .tracking-page::before {
            width: 360px;
            height: 360px;
            top: 100px;
            left: -180px;
            background: rgba(37, 99, 235, 0.10);
            box-shadow: 0 0 100px rgba(37, 99, 235, 0.16);
        }

        .tracking-page::after {
            width: 420px;
            height: 420px;
            right: -210px;
            bottom: 80px;
            background: rgba(124, 58, 237, 0.09);
            box-shadow: 0 0 120px rgba(124, 58, 237, 0.14);
        }


        /* =====================================================
           CONTAINER
        ====================================================== */

        .tracking-page .tracking-container {
            position: relative;
            z-index: 2;

            width: min(100% - 32px, 1100px);
            margin: 0 auto;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .tracking-page .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
            flex-wrap: wrap;

            margin-bottom: 24px;
            padding: 22px 26px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.94),
                    rgba(255, 255, 255, 0.78)
                );

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 15px 45px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .tracking-page .tracking-title-wrapper {
            min-width: 0;
        }

        .tracking-page .tracking-header h1 {
            margin: 0;

            font-size: clamp(24px, 4vw, 34px);
            line-height: 1.2;
            font-weight: 800;

            letter-spacing: -0.03em;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #2563eb 50%,
                    #7c3aed
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tracking-page .tracking-subtitle {
            margin: 6px 0 0;
            color: var(--tracking-gray-500);
            font-size: 13px;
            font-weight: 400;
        }

        .tracking-page .history-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            min-height: 44px;
            padding: 10px 17px;

            color: var(--tracking-blue);
            background: rgba(37, 99, 235, 0.08);

            border: 1px solid rgba(37, 99, 235, 0.12);
            border-radius: 12px;

            text-decoration: none;
            font-size: 13px;
            font-weight: 700;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .tracking-page .history-link:hover {
            transform: translateY(-2px);

            background: rgba(37, 99, 235, 0.13);

            box-shadow:
                0 8px 22px rgba(37, 99, 235, 0.15);
        }


        /* =====================================================
           MAIN TRACKING CARD
        ====================================================== */

        .tracking-page .tracking-card {
            position: relative;

            width: 100%;
            margin-bottom: 20px;

            padding: clamp(18px, 4vw, 32px);

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.97),
                    rgba(255, 255, 255, 0.87)
                );

            border: 1px solid rgba(255, 255, 255, 0.85);

            box-shadow:
                0 24px 65px rgba(15, 23, 42, 0.10),
                0 5px 18px rgba(37, 99, 235, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            overflow: hidden;
        }

        .tracking-page .tracking-card::before {
            content: "";

            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed,
                    #06b6d4
                );
        }


        /* =====================================================
           ORDER ID
        ====================================================== */

        .tracking-page .order-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 14px;
            flex-wrap: wrap;

            margin-bottom: 8px;
        }

        .tracking-page .order-id {
            min-width: 0;

            font-size: 14px;
            color: var(--tracking-gray-500);

            word-break: break-word;
        }

        .tracking-page .order-id strong {
            color: var(--tracking-gray-900);
            font-size: clamp(15px, 2vw, 18px);
            font-weight: 800;
        }

        .tracking-page .order-time {
            margin-bottom: 24px;

            color: var(--tracking-gray-500);
            font-size: 12px;
            line-height: 1.7;
        }

        .tracking-page .order-time i {
            color: var(--tracking-blue);
            margin-right: 4px;
        }


        /* =====================================================
           STATUS BADGE
        ====================================================== */

        .tracking-page .status-badge-large {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 30px;
            padding: 5px 12px;

            border-radius: 999px;

            font-size: 10px;
            line-height: 1.2;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.05em;

            white-space: nowrap;
        }

        .tracking-page .status-badge-large.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .tracking-page .status-badge-large.preparing {
            background: #e0f2fe;
            color: #075985;
        }

        .tracking-page .status-badge-large.ready {
            background: #dcfce7;
            color: #166534;
        }

        .tracking-page .status-badge-large.served {
            background: var(--tracking-gray-200);
            color: var(--tracking-gray-600);
        }

        .tracking-page .status-badge-large.cancelled {
            background: #fee2e2;
            color: #991b1b;
        }


        /* =====================================================
           PROGRESS STEPS
        ====================================================== */

        .tracking-page .progress-wrapper {
            width: 100%;
            padding: 10px 0 4px;
            margin-bottom: 22px;
        }

        .tracking-page .progress-steps {
            position: relative;

            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));

            width: 100%;

            padding: 8px 0 4px;
        }

        /*
         * Base progress line
         */
        .tracking-page .progress-steps::before {
            content: "";

            position: absolute;

            top: 29px;
            left: 12.5%;
            right: 12.5%;

            height: 4px;

            border-radius: 99px;

            background:
                linear-gradient(
                    90deg,
                    var(--tracking-gray-200),
                    var(--tracking-gray-100)
                );

            z-index: 0;
        }

        .tracking-page .progress-steps .step {
            position: relative;
            z-index: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            min-width: 0;

            gap: 9px;

            text-align: center;
        }

        .tracking-page .progress-steps .step .circle {
            width: 58px;
            height: 58px;

            flex: 0 0 58px;

            border-radius: 50%;

            border: 3px solid var(--tracking-gray-300);

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f8fafc
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
            color: var(--tracking-gray-400);

            box-shadow:
                0 7px 18px rgba(15, 23, 42, 0.07);

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease,
                background 0.35s ease;
        }

        .tracking-page .progress-steps .step .label {
            max-width: 120px;

            font-size: 11px;
            line-height: 1.35;

            font-weight: 600;

            color: var(--tracking-gray-400);

            text-transform: uppercase;
            letter-spacing: 0.035em;

            transition: color 0.3s ease;
        }


        /* =====================================================
           COMPLETED
        ====================================================== */

        .tracking-page .progress-steps .step.completed .circle {
            border-color: var(--tracking-green);

            background:
                linear-gradient(
                    145deg,
                    #22c55e,
                    #15803d
                );

            color: #fff;

            box-shadow:
                0 8px 25px rgba(22, 163, 74, 0.28);
        }

        .tracking-page .progress-steps .step.completed .label {
            color: var(--tracking-green);
        }


        /* =====================================================
           ACTIVE
        ====================================================== */

        .tracking-page .progress-steps .step.active .circle {
            border-color: var(--tracking-blue);

            background:
                linear-gradient(
                    145deg,
                    #3b82f6,
                    #1d4ed8
                );

            color: #fff;

            transform: scale(1.10);

            box-shadow:
                0 0 0 7px rgba(37, 99, 235, 0.11),
                0 12px 32px rgba(37, 99, 235, 0.30);
        }

        .tracking-page .progress-steps .step.active .label {
            color: var(--tracking-blue);
            font-weight: 800;
        }


        /* =====================================================
           CANCELLED
        ====================================================== */

        .tracking-page .progress-steps.cancelled-progress {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            max-width: 560px;
            margin: 0 auto;
        }

        .tracking-page .progress-steps.cancelled-progress::before {
            left: 25%;
            right: 25%;
        }

        .tracking-page .progress-steps .step.cancelled .circle {
            border-color: var(--tracking-red);

            background:
                linear-gradient(
                    145deg,
                    #ef4444,
                    #b91c1c
                );

            color: #fff;

            box-shadow:
                0 9px 25px rgba(220, 38, 38, 0.28);
        }

        .tracking-page .progress-steps .step.cancelled .label {
            color: var(--tracking-red);
            font-weight: 800;
        }


        /* =====================================================
           ORDER ITEMS
        ====================================================== */

        .tracking-page .order-items-list {
            margin: 4px 0 18px;

            border-radius: 16px;

            padding: 5px 14px;

            background:
                linear-gradient(
                    145deg,
                    rgba(248, 250, 252, 0.95),
                    rgba(241, 245, 249, 0.75)
                );

            border: 1px solid var(--tracking-gray-100);
        }

        .tracking-page .order-items-list .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 18px;

            min-height: 45px;

            padding: 9px 0;

            font-size: 13px;
            color: var(--tracking-gray-600);

            border-bottom: 1px solid var(--tracking-gray-200);
        }

        .tracking-page .order-items-list .item-row:last-child {
            border-bottom: none;
        }

        .tracking-page .order-items-list .item-row span:first-child {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .tracking-page .order-items-list .item-row span:last-child {
            flex-shrink: 0;

            color: var(--tracking-gray-800);
            font-weight: 700;
            white-space: nowrap;
        }


        /* =====================================================
           TOTAL
        ====================================================== */

        .tracking-page .order-total-display {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 16px;

            padding: 17px 0 0;
            margin-top: 10px;

            border-top: 2px solid var(--tracking-gray-200);

            color: var(--tracking-gray-900);

            font-size: 18px;
            font-weight: 800;
        }

        .tracking-page .order-total-display .amount {
            color: var(--tracking-blue);

            font-size: clamp(19px, 3vw, 24px);

            text-shadow:
                0 4px 18px rgba(37, 99, 235, 0.16);
        }


        /* =====================================================
           PAYMENT / CANCELLATION INFO
        ====================================================== */

        .tracking-page .tracking-info {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-top: 12px;
            padding: 10px 13px;

            border-radius: 11px;

            font-size: 12px;
            line-height: 1.5;
        }

        .tracking-page .tracking-info.payment-success {
            color: #166534;
            background: rgba(220, 252, 231, 0.75);
            border: 1px solid rgba(22, 163, 74, 0.12);
        }

        .tracking-page .tracking-info.payment-pending {
            color: var(--tracking-gray-600);
            background: var(--tracking-gray-50);
            border: 1px solid var(--tracking-gray-200);
        }

        .tracking-page .tracking-info.cancellation {
            color: #991b1b;
            background: rgba(254, 226, 226, 0.85);
            border: 1px solid rgba(220, 38, 38, 0.12);
        }


        /* =====================================================
           ACTION BUTTONS
        ====================================================== */

        .tracking-page .order-actions {
            display: flex;
            align-items: center;

            gap: 12px;
            flex-wrap: wrap;

            margin-top: 22px;
            padding-top: 20px;

            border-top: 1px solid var(--tracking-gray-200);
        }

        .tracking-page .order-actions .btn {
            min-height: 46px;

            padding: 10px 18px;

            border: 0;
            border-radius: 12px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .tracking-page .order-actions .btn:hover {
            transform: translateY(-2px);
        }

        .tracking-page .btn-cancel {
            color: #991b1b;
            background: #fee2e2;
        }

        .tracking-page .btn-cancel:hover {
            background: #fecaca;

            box-shadow:
                0 9px 24px rgba(220, 38, 38, 0.13);
        }

        .tracking-page .btn-track-history {
            color: var(--tracking-gray-700);
            background: var(--tracking-gray-100);
        }

        .tracking-page .btn-track-history:hover {
            background: var(--tracking-gray-200);

            box-shadow:
                0 8px 22px rgba(15, 23, 42, 0.10);
        }

        .tracking-page .btn-order-history {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            box-shadow:
                0 8px 22px rgba(37, 99, 235, 0.22);
        }

        .tracking-page .btn-order-history:hover {
            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #4338ca
                );

            box-shadow:
                0 12px 30px rgba(37, 99, 235, 0.30);
        }


        /* =====================================================
           NOT FOUND
        ====================================================== */

        .tracking-page .not-found {
            text-align: center;
            padding: clamp(45px, 8vw, 80px) 20px;
        }

        .tracking-page .not-found-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(37, 99, 235, 0.10),
                    rgba(124, 58, 237, 0.10)
                );

            box-shadow:
                0 15px 35px rgba(37, 99, 235, 0.10);
        }

        .tracking-page .not-found i {
            display: block;

            margin: 0;

            font-size: 42px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .tracking-page .not-found h3 {
            margin: 0 0 8px;

            color: var(--tracking-gray-900);

            font-size: 20px;
            font-weight: 800;
        }

        .tracking-page .not-found p {
            max-width: 440px;

            margin: 0 auto;

            color: var(--tracking-gray-500);

            font-size: 13px;
            line-height: 1.7;
        }

        .tracking-page .not-found .btn-primary {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            min-height: 46px;

            padding: 10px 18px;

            margin-top: 20px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            border-radius: 12px;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            box-shadow:
                0 9px 25px rgba(37, 99, 235, 0.22);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .tracking-page .not-found .btn-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 13px 32px rgba(37, 99, 235, 0.30);
        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 768px) {
            .tracking-page {
                padding: 24px 0 45px;
            }

            .tracking-page .tracking-container {
                width: min(100% - 24px, 680px);
            }

            .tracking-page .tracking-header {
                padding: 19px 20px;
                border-radius: 18px;
            }

            .tracking-page .tracking-card {
                border-radius: 20px;
            }

            .tracking-page .progress-steps .step .circle {
                width: 52px;
                height: 52px;
                flex-basis: 52px;
            }

            .tracking-page .progress-steps::before {
                top: 29px;
            }
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 560px) {
            .tracking-page {
                padding: 18px 0 35px;
            }

            .tracking-page .tracking-container {
                width: calc(100% - 20px);
            }

            .tracking-page .tracking-header {
                align-items: stretch;
                flex-direction: column;

                gap: 13px;

                padding: 18px;

                margin-bottom: 14px;

                border-radius: 17px;
            }

            .tracking-page .tracking-header h1 {
                font-size: 25px;
            }

            .tracking-page .tracking-subtitle {
                font-size: 11px;
            }

            .tracking-page .history-link {
                width: 100%;
            }

            .tracking-page .tracking-card {
                padding: 18px 15px;

                border-radius: 18px;
            }

            .tracking-page .order-meta {
                align-items: flex-start;
                flex-direction: column;
                gap: 9px;
            }

            .tracking-page .status-badge-large {
                margin-left: 0 !important;
            }

            .tracking-page .order-time {
                margin-bottom: 16px;
            }

            .tracking-page .progress-wrapper {
                overflow-x: hidden;
            }

            .tracking-page .progress-steps {
                grid-template-columns: repeat(4, minmax(0, 1fr));

                padding-top: 5px;
            }

            .tracking-page .progress-steps::before {
                top: 24px;

                left: 12%;
                right: 12%;

                height: 3px;
            }

            .tracking-page .progress-steps .step {
                gap: 7px;
            }

            .tracking-page .progress-steps .step .circle {
                width: 44px;
                height: 44px;

                flex-basis: 44px;

                border-width: 2px;

                font-size: 13px;
            }

            .tracking-page .progress-steps .step.active .circle {
                transform: scale(1.06);
                box-shadow:
                    0 0 0 5px rgba(37, 99, 235, 0.10),
                    0 8px 20px rgba(37, 99, 235, 0.25);
            }

            .tracking-page .progress-steps .step .label {
                max-width: 70px;

                font-size: 8px;
                letter-spacing: 0.02em;
            }

            .tracking-page .progress-steps.cancelled-progress {
                max-width: 320px;
            }

            .tracking-page .progress-steps.cancelled-progress::before {
                left: 25%;
                right: 25%;
            }

            .tracking-page .order-items-list {
                padding: 3px 11px;
                border-radius: 13px;
            }

            .tracking-page .order-items-list .item-row {
                align-items: flex-start;

                gap: 10px;

                font-size: 11px;
            }

            .tracking-page .order-total-display {
                font-size: 16px;
            }

            .tracking-page .order-total-display .amount {
                font-size: 19px;
            }

            .tracking-page .order-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .tracking-page .order-actions .btn {
                width: 100%;
                min-height: 47px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
        ====================================================== */

        @media (max-width: 360px) {
            .tracking-page .tracking-container {
                width: calc(100% - 14px);
            }

            .tracking-page .tracking-card {
                padding: 16px 11px;
            }

            .tracking-page .tracking-header {
                padding: 16px 14px;
            }

            .tracking-page .tracking-header h1 {
                font-size: 22px;
            }

            .tracking-page .progress-steps .step .circle {
                width: 38px;
                height: 38px;
                flex-basis: 38px;
                font-size: 11px;
            }

            .tracking-page .progress-steps::before {
                top: 21px;
            }

            .tracking-page .progress-steps .step .label {
                font-size: 7px;
            }

            .tracking-page .order-items-list .item-row {
                font-size: 10px;
            }
        }


        /* =====================================================
           LARGE SCREENS
        ====================================================== */

        @media (min-width: 1200px) {
            .tracking-page {
                padding-top: 45px;
            }

            .tracking-page .tracking-container {
                width: min(100% - 60px, 1100px);
            }

            .tracking-page .tracking-card {
                padding: 36px 40px;
            }

            .tracking-page .tracking-header {
                padding: 25px 30px;
            }
        }


        /* =====================================================
           EXTRA LARGE SCREENS
        ====================================================== */

        @media (min-width: 1600px) {
            .tracking-page .tracking-container {
                width: min(100% - 80px, 1180px);
            }

            .tracking-page .tracking-card {
                padding: 42px 48px;
            }
        }


        /* =====================================================
           REDUCED MOTION
        ====================================================== */

        @media (prefers-reduced-motion: reduce) {
            .tracking-page *,
            .tracking-page *::before,
            .tracking-page *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         ORDER TRACKING PAGE
    ========================================================== -->

    <div class="tracking-page">

        <div class="tracking-container">

            <!-- =================================================
                 PAGE HEADER
            ================================================== -->

            <div class="tracking-header">

                <div class="tracking-title-wrapper">
                    <h1>Order Tracking</h1>

                    <p class="tracking-subtitle">
                        Follow your cafeteria order from placement to pickup.
                    </p>
                </div>

                <a
                    href="order-history.html"
                    class="history-link"
                >
                    <i class="fas fa-list"></i>
                    <span>Order History</span>
                </a>

            </div>


            <!-- =================================================
                 DYNAMIC TRACKING CONTENT
            ================================================== -->

            <div id="trackingContent"></div>

        </div>
    </div>


    <!-- =========================================================
         SCRIPT
    ========================================================== -->

    <script type="module">

        /* =====================================================
           IMPORTS
        ====================================================== */

        import { createHeader }
            from '../../components/header.js';

        import { createFooter }
            from '../../components/footer.js';

        import {
            getOrderById,
            getOrderStatusHistory,
            canCancelOrder
        } from '../../js/orders.js';

        import { cancelOrder }
            from '../../js/order-cancellation.js';

        import {
            getCartCount,
            getCartItems
        } from '../../js/cart.js';

        import {
            isLoggedIn,
            getCurrentUser
        } from '../../js/auth.js';

        import { showToast }
            from '../../js/main.js';

        import {
            formatDate,
            formatTime,
            formatETB
        } from '../../js/utils/formatters.js';


        /* =====================================================
           USER / AUTH STATE
        ====================================================== */

        const user = getCurrentUser();
        const isLoggedInUser = isLoggedIn();


        /* =====================================================
           HEADER
        ====================================================== */

        document.body.insertAdjacentHTML(
            'afterbegin',

            createHeader({
                navLinks: [
                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },
                    {
                        label: 'Order History',
                        href: 'order-history.html'
                    },
                    {
                        label: 'Profile',
                        href: 'profile.html'
                    }
                ],

                user: user,

                isLoggedIn: isLoggedInUser,

                cartCount: getCartCount(),

                theme:
                    localStorage.getItem('scos_theme') ||
                    'light',

                language:
                    localStorage.getItem('scos_language') ||
                    'en',

                authButtons: {
                    loginLabel: 'Login',
                    registerLabel: 'Register',

                    loginHref:
                        '../common/login.html',

                    registerHref:
                        '../common/register.html'
                },

                onToggleMenu: () => {
                    document
                        .getElementById('mainNav')
                        ?.classList
                        .toggle('open');
                },

                onToggleTheme: () => {},

                onToggleLanguage: () => {},

                onLogout: () => {

                    if (confirm('Are you sure?')) {

                        localStorage.removeItem(
                            'scos_user'
                        );

                        localStorage.removeItem(
                            'scos_token'
                        );

                        localStorage.removeItem(
                            'scos_cart'
                        );

                        window.location.href =
                            '../common/login.html';
                    }
                },

                onNotificationClick: () => {
                    window.location.href =
                        'notifications.html';
                }
            })
        );


        /* =====================================================
           FOOTER
        ====================================================== */

        document.body.insertAdjacentHTML(
            'beforeend',

            createFooter({
                quickLinks: [
                    {
                        label: 'Home',
                        href: '../../index.html'
                    },
                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },
                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },
                    {
                        label: 'Register',
                        href: '../common/register.html'
                    }
                ],

                roleLinks: [
                    {
                        label: 'Customer',
                        href: 'menu.html'
                    },
                    {
                        label: 'Kitchen',
                        href:
                            '../kitchen/dashboard.html'
                    },
                    {
                        label: 'Admin',
                        href:
                            '../admin/dashboard.html'
                    }
                ]
            })
        );


        /* =====================================================
           GET ORDER ID
        ====================================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const orderId =
            urlParams.get('id');

        const container =
            document.getElementById(
                'trackingContent'
            );


        /* =====================================================
           NO ORDER ID
        ====================================================== */

        if (!orderId) {

            container.innerHTML = `

                <div class="tracking-card not-found">

                    <div class="not-found-icon">
                        <i class="fas fa-search"></i>
                    </div>

                    <h3>No Order Selected</h3>

                    <p>
                        Please select an order from your history.
                    </p>

                    <a
                        href="order-history.html"
                        class="btn-primary"
                    >
                        <i class="fas fa-list"></i>
                        View Order History
                    </a>

                </div>

            `;

        } else {

            /* =================================================
               GET ORDER
            ================================================== */

            const order =
                getOrderById(orderId);


            /* =================================================
               ORDER NOT FOUND
            ================================================== */

            if (!order) {

                container.innerHTML = `

                    <div class="tracking-card not-found">

                        <div class="not-found-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>

                        <h3>Order Not Found</h3>

                        <p>
                            The order you're looking for doesn't exist.
                        </p>

                        <a
                            href="order-history.html"
                            class="btn-primary"
                        >
                            <i class="fas fa-list"></i>
                            View Order History
                        </a>

                    </div>

                `;

            } else {

                /* =============================================
                   LANGUAGE
                ============================================== */

                const lang =
                    localStorage.getItem(
                        'scos_language'
                    ) || 'en';


                /* =============================================
                   STATUS LABELS
                ============================================== */

                const statusLabels = {

                    pending:
                        'Pending',

                    preparing:
                        'Preparing',

                    ready:
                        'Ready for Pickup',

                    served:
                        'Served',

                    cancelled:
                        'Cancelled'
                };


                const statusLabel =
                    statusLabels[order.status] ||
                    order.status;


                /* =============================================
                   PROGRESS STEPS
                ============================================== */

                const steps = [

                    {
                        key: 'pending',
                        label: 'Order Placed',
                        icon: 'fa-shopping-bag'
                    },

                    {
                        key: 'preparing',
                        label: 'Preparing',
                        icon: 'fa-utensil-spoon'
                    },

                    {
                        key: 'ready',
                        label: 'Ready',
                        icon: 'fa-check-circle'
                    },

                    {
                        key: 'served',
                        label: 'Served',
                        icon: 'fa-flag-checkered'
                    }

                ];


                const statusIndex =
                    steps.findIndex(
                        step =>
                            step.key ===
                            order.status
                    );


                const isCancelled =
                    order.status ===
                    'cancelled';


                let stepsHTML = '';


                /* =============================================
                   CANCELLED PROGRESS
                ============================================== */

                if (isCancelled) {

                    stepsHTML = `

                        <div class="progress-steps cancelled-progress">

                            <div class="step completed">

                                <div class="circle">
                                    <i class="fas fa-shopping-bag"></i>
                                </div>

                                <div class="label">
                                    Placed
                                </div>

                            </div>


                            <div class="step cancelled">

                                <div class="circle">
                                    <i class="fas fa-times"></i>
                                </div>

                                <div class="label">
                                    Cancelled
                                </div>

                            </div>

                        </div>

                    `;

                } else {

                    /* =========================================
                       NORMAL PROGRESS
                    ========================================== */

                    stepsHTML =
                        steps
                            .map(
                                (step, index) => {

                                    let statusClass =
                                        '';

                                    if (
                                        index <=
                                        statusIndex
                                    ) {
                                        statusClass =
                                            'completed';
                                    }

                                    if (
                                        index ===
                                        statusIndex
                                    ) {
                                        statusClass =
                                            'active';
                                    }

                                    return `

                                        <div
                                            class="step ${statusClass}"
                                        >

                                            <div class="circle">

                                                <i
                                                    class="fas ${step.icon}"
                                                ></i>

                                            </div>

                                            <div class="label">
                                                ${step.label}
                                            </div>

                                        </div>

                                    `;
                                }
                            )
                            .join('');
                }


                /* =============================================
                   ORDER ITEMS
                ============================================== */

                const itemsHTML =
                    order.items
                        .map(
                            item => {

                                const itemName =
                                    item.name?.[lang] ||
                                    item.name?.en ||
                                    item.name ||
                                    'Food Item';

                                const itemTotal =
                                    Number(item.price || 0) *
                                    Number(item.quantity || 0);

                                return `

                                    <div class="item-row">

                                        <span>
                                            ${itemName}
                                            ×
                                            ${item.quantity}
                                        </span>

                                        <span>
                                            ${itemTotal}
                                            ብር
                                        </span>

                                    </div>

                                `;
                            }
                        )
                        .join('');


                /* =============================================
                   CAN CANCEL
                ============================================== */

                const canCancel =
                    canCancelOrder(orderId);


                /* =============================================
                   ACTIONS
                ============================================== */

                const actionsHTML = `

                    <div class="order-actions">

                        ${
                            canCancel
                                ? `

                                    <button
                                        class="btn btn-cancel"
                                        id="cancelOrderBtn"
                                        type="button"
                                    >

                                        <i class="fas fa-times"></i>

                                        Cancel Order

                                    </button>

                                `
                                : ''
                        }


                        <a
                            href="order-history.html"
                            class="btn btn-track-history"
                        >

                            <i class="fas fa-list"></i>

                            All Orders

                        </a>


                        <a
                            href="menu.html"
                            class="btn btn-order-history"
                        >

                            <i class="fas fa-utensils"></i>

                            Order More

                        </a>

                    </div>

                `;


                /* =============================================
                   MAIN HTML
                ============================================== */

                container.innerHTML = `

                    <div class="tracking-card">


                        <!-- ===================================
                             ORDER META
                        ==================================== -->

                        <div class="order-meta">

                            <div class="order-id">

                                <strong>
                                    Order #${order.id}
                                </strong>

                            </div>


                            <span
                                class="status-badge-large ${order.status}"
                            >
                                ${statusLabel}
                            </span>

                        </div>


                        <!-- ===================================
                             ORDER TIME
                        ==================================== -->

                        <div class="order-time">

                            <i class="far fa-clock"></i>

                            ${formatDate(order.orderTime)}

                            •

                            ${formatTime(order.orderTime)}

                            ${
                                order.readyTime
                                    ? `
                                        • Ready:
                                        ${formatTime(
                                            order.readyTime
                                        )}
                                    `
                                    : ''
                            }

                        </div>


                        <!-- ===================================
                             PROGRESS
                        ==================================== -->

                        <div class="progress-wrapper">

                            ${stepsHTML}

                        </div>


                        <!-- ===================================
                             ITEMS
                        ==================================== -->

                        <div class="order-items-list">

                            ${itemsHTML}

                        </div>


                        <!-- ===================================
                             TOTAL
                        ==================================== -->

                        <div class="order-total-display">

                            <span>
                                Total
                            </span>

                            <span class="amount">

                                ${order.totalAmount}
                                ብር

                            </span>

                        </div>


                        <!-- ===================================
                             PAYMENT STATUS
                        ==================================== -->

                        ${
                            order.paymentStatus ===
                            'simulated'

                                ? `

                                    <div
                                        class="
                                            tracking-info
                                            payment-success
                                        "
                                    >

                                        <i
                                            class="
                                                fas
                                                fa-check-circle
                                            "
                                        ></i>

                                        <span>
                                            Payment:
                                            ${order.paymentStatus}
                                        </span>

                                    </div>

                                `

                                : `

                                    <div
                                        class="
                                            tracking-info
                                            payment-pending
                                        "
                                    >

                                        <i
                                            class="
                                                fas
                                                fa-clock
                                            "
                                        ></i>

                                        <span>
                                            Payment:
                                            ${order.paymentStatus}
                                        </span>

                                    </div>

                                `
                        }


                        <!-- ===================================
                             CANCELLATION REASON
                        ==================================== -->

                        ${
                            order.cancellationReason

                                ? `

                                    <div
                                        class="
                                            tracking-info
                                            cancellation
                                        "
                                    >

                                        <i
                                            class="
                                                fas
                                                fa-info-circle
                                            "
                                        ></i>

                                        <span>
                                            Cancelled:
                                            ${order.cancellationReason}
                                        </span>

                                    </div>

                                `

                                : ''
                        }


                        <!-- ===================================
                             ACTIONS
                        ==================================== -->

                        ${actionsHTML}

                    </div>

                `;


                /* =============================================
                   CANCEL ORDER HANDLER
                ============================================== */

                const cancelBtn =
                    document.getElementById(
                        'cancelOrderBtn'
                    );


                if (cancelBtn) {

                    cancelBtn.addEventListener(
                        'click',

                        async function () {

                            const reason =
                                prompt(
                                    'Why do you want to cancel this order?'
                                );


                            if (reason !== null) {

                                /*
                                 * Prevent accidental double click
                                 */
                                cancelBtn.disabled = true;

                                const originalText =
                                    cancelBtn.innerHTML;

                                cancelBtn.innerHTML = `
                                    <i class="fas fa-spinner fa-spin"></i>
                                    Cancelling...
                                `;


                                try {

                                    const result =
                                        await cancelOrder(
                                            orderId,
                                            reason ||
                                                'Customer requested cancellation'
                                        );


                                    if (result.success) {

                                        showToast(
                                            'Order cancelled successfully',
                                            'info'
                                        );

                                        setTimeout(
                                            () => {
                                                window.location.reload();
                                            },
                                            500
                                        );

                                    } else {

                                        cancelBtn.disabled =
                                            false;

                                        cancelBtn.innerHTML =
                                            originalText;

                                        showToast(
                                            result.error ||
                                                'Failed to cancel order',
                                            'error'
                                        );
                                    }

                                } catch (error) {

                                    console.error(
                                        'Cancel order error:',
                                        error
                                    );

                                    cancelBtn.disabled =
                                        false;

                                    cancelBtn.innerHTML =
                                        originalText;

                                    showToast(
                                        'Failed to cancel order',
                                        'error'
                                    );
                                }
                            }
                        }
                    );
                }


                /* =============================================
                   DEBUG
                ============================================== */

                console.log(
                    `📦 Tracking order: ${orderId} (${order.status})`
                );
            }
        }

    </script>

</body>
</html>

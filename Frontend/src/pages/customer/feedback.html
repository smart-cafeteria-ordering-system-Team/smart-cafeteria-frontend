

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Feedback | Smart Cafeteria</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Existing Project CSS -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           SMART CAFETERIA — FEEDBACK PAGE
           Premium / Colorful / Responsive UI
           Existing project files and functionality preserved
           ========================================================= */

        :root {
            --fb-primary: #2563eb;
            --fb-primary-dark: #1d4ed8;
            --fb-secondary: #7c3aed;
            --fb-pink: #ec4899;
            --fb-cyan: #06b6d4;
            --fb-green: #16a34a;
            --fb-orange: #f59e0b;

            --fb-white: #ffffff;
            --fb-text: #111827;
            --fb-muted: #64748b;
            --fb-border: #e5e7eb;

            --fb-shadow:
                0 18px 55px rgba(37, 99, 235, 0.10);

            --fb-shadow-hover:
                0 25px 70px rgba(37, 99, 235, 0.18);

            --fb-radius: 20px;
        }

        /* =========================================================
           PAGE BACKGROUND
           ========================================================= */

        .feedback-page {
            position: relative;
            min-height: 100vh;

            padding: 35px 0 70px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 8% 12%,
                    rgba(59, 130, 246, 0.13),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 92% 18%,
                    rgba(236, 72, 153, 0.12),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 78% 88%,
                    rgba(124, 58, 237, 0.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #f8fbff 45%,
                    #ffffff 100%
                );

            font-family: "Poppins", sans-serif;
        }

        /* Decorative glowing light */
        .feedback-page::before {
            content: "";
            position: absolute;

            width: 320px;
            height: 320px;

            top: 90px;
            left: -160px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(37, 99, 235, 0.17) 0%,
                    rgba(37, 99, 235, 0.05) 40%,
                    transparent 72%
                );

            filter: blur(8px);
            pointer-events: none;
        }

        .feedback-page::after {
            content: "";
            position: absolute;

            width: 400px;
            height: 400px;

            right: -200px;
            bottom: 40px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(236, 72, 153, 0.14) 0%,
                    rgba(124, 58, 237, 0.06) 42%,
                    transparent 72%
                );

            filter: blur(10px);
            pointer-events: none;
        }

        /* =========================================================
           CONTAINER
           ========================================================= */

        .feedback-page .container {
            position: relative;
            z-index: 2;

            width: min(100% - 32px, 850px);

            margin: 0 auto;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 16px;

            margin-bottom: 26px;

            padding: 22px 26px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.96),
                    rgba(248, 250, 255, 0.92)
                );

            border: 1px solid rgba(255, 255, 255, 0.95);

            box-shadow:
                0 16px 45px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .feedback-header h1 {
            position: relative;

            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;

            margin: 0;

            font-size: clamp(25px, 4vw, 34px);
            line-height: 1.2;
            font-weight: 800;

            letter-spacing: -0.6px;

            background:
                linear-gradient(
                    100deg,
                    var(--fb-primary),
                    var(--fb-secondary),
                    var(--fb-pink)
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .feedback-header h1::before {
            content: "✦";

            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            border-radius: 14px;

            color: #ffffff;

            font-size: 20px;

            background:
                linear-gradient(
                    135deg,
                    var(--fb-primary),
                    var(--fb-secondary)
                );

            box-shadow:
                0 8px 25px rgba(37, 99, 235, 0.28);
        }

        .feedback-header h1 small {
            align-self: center;

            padding: 6px 12px;

            border-radius: 999px;

            font-size: 12px;
            line-height: 1.4;
            font-weight: 500;

            letter-spacing: 0;

            color: #475569;

            background: #f1f5f9;

            border: 1px solid #e2e8f0;
        }

        /* =========================================================
           ALERT
           ========================================================= */

        .feedback-page .alert {
            position: relative;

            padding: 14px 18px;

            margin-bottom: 18px;

            border-radius: 14px;

            font-size: 14px;
            font-weight: 500;

            display: none;

            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);

            animation: feedbackAlertIn 0.35s ease;
        }

        .feedback-page .alert.show {
            display: flex;

            align-items: center;
            gap: 10px;
        }

        .feedback-page .alert-success {
            color: #166534;

            background:
                linear-gradient(
                    135deg,
                    #f0fdf4,
                    #dcfce7
                );

            border: 1px solid #bbf7d0;
            border-left: 4px solid #16a34a;
        }

        .feedback-page .alert-error {
            color: #991b1b;

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #fee2e2
                );

            border: 1px solid #fecaca;
            border-left: 4px solid #dc2626;
        }

        @keyframes feedbackAlertIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           CARD
           ========================================================= */

        .feedback-page .feedback-card {
            position: relative;

            margin-bottom: 20px;

            padding: 28px;

            border-radius: var(--fb-radius);

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(248, 250, 255, 0.96)
                );

            border: 1px solid rgba(226, 232, 240, 0.85);

            box-shadow: var(--fb-shadow);

            overflow: hidden;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .feedback-page .feedback-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--fb-primary),
                    var(--fb-cyan),
                    var(--fb-secondary),
                    var(--fb-pink)
                );
        }

        .feedback-page .feedback-card:hover {
            transform: translateY(-3px);

            border-color: rgba(147, 197, 253, 0.65);

            box-shadow: var(--fb-shadow-hover);
        }

        /* =========================================================
           CARD TITLE
           ========================================================= */

        .feedback-page .feedback-card h3 {
            display: flex;
            align-items: center;
            gap: 11px;

            margin: 0 0 22px;

            color: var(--fb-text);

            font-size: 17px;
            font-weight: 700;
        }

        .feedback-page .feedback-card h3 i {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            border-radius: 12px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    var(--fb-primary),
                    var(--fb-secondary)
                );

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.22);
        }

        /* =========================================================
           FORM
           ========================================================= */

        .feedback-page .form-group {
            margin-bottom: 20px;
        }

        .feedback-page .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.2px;
        }

        .feedback-page .form-control {
            display: block;

            width: 100%;

            box-sizing: border-box;

            padding: 13px 15px;

            font-family: "Poppins", sans-serif;
            font-size: 14px;
            line-height: 1.5;

            color: #1e293b;

            background: rgba(255, 255, 255, 0.96);

            border: 1.5px solid #dbe3ef;
            border-radius: 12px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

        .feedback-page .form-control::placeholder {
            color: #94a3b8;
        }

        .feedback-page .form-control:hover {
            border-color: #bfdbfe;
        }

        .feedback-page .form-control:focus {
            border-color: var(--fb-primary);

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, 0.10),
                0 8px 25px rgba(37, 99, 235, 0.07);
        }

        .feedback-page textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        /* =========================================================
           RATING
           ========================================================= */

        .feedback-page .rating-selector {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;

            width: fit-content;

            padding: 8px 13px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #fffaf0,
                    #fff7ed
                );

            border: 1px solid #fde68a;

            box-shadow:
                0 8px 24px rgba(245, 158, 11, 0.08);
        }

        .feedback-page .rating-selector .star-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 43px;
            height: 43px;

            padding: 0;

            font-family: Arial, sans-serif;
            font-size: 31px;
            line-height: 1;

            background: transparent;

            border: none;

            color: #cbd5e1;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                color 0.2s ease,
                filter 0.2s ease;
        }

        .feedback-page .rating-selector .star-btn:hover {
            color: #fbbf24;

            transform:
                translateY(-3px)
                scale(1.12);

            filter:
                drop-shadow(
                    0 5px 9px
                    rgba(245, 158, 11, 0.28)
                );
        }

        .feedback-page .rating-selector .star-btn.active {
            color: #f59e0b;

            filter:
                drop-shadow(
                    0 4px 8px
                    rgba(245, 158, 11, 0.30)
                );
        }

        /* =========================================================
           SUBMIT BUTTON
           ========================================================= */

        .feedback-page .btn-submit {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            min-height: 48px;

            padding: 12px 26px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #4f46e5 45%,
                    #7c3aed 100%
                );

            border: none;
            border-radius: 12px;

            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.28);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .feedback-page .btn-submit::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 80%;
            height: 100%;

            background:
                linear-gradient(
                    100deg,
                    transparent,
                    rgba(255, 255, 255, 0.38),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.65s ease;
        }

        .feedback-page .btn-submit:hover::before {
            left: 130%;
        }

        .feedback-page .btn-submit:hover {
            transform: translateY(-2px);

            filter: brightness(1.05);

            box-shadow:
                0 15px 35px rgba(37, 99, 235, 0.35);
        }

        .feedback-page .btn-submit:active {
            transform: translateY(0);
        }

        .feedback-page .btn-submit:disabled {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #94a3b8,
                    #64748b
                );

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        /* =========================================================
           FEEDBACK LIST
           ========================================================= */

        .feedback-page .feedback-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .feedback-page .feedback-item {
            position: relative;

            padding: 18px 20px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f8fafc
                );

            border: 1px solid #e2e8f0;

            box-shadow:
                0 8px 24px rgba(15, 23, 42, 0.055);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .feedback-page .feedback-item:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 34px rgba(37, 99, 235, 0.10);
        }

        .feedback-page .feedback-item::before {
            content: "";

            position: absolute;

            left: 0;
            top: 16px;
            bottom: 16px;

            width: 3px;

            border-radius: 10px;

            background:
                linear-gradient(
                    180deg,
                    var(--fb-primary),
                    var(--fb-secondary)
                );
        }

        .feedback-page .fb-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 10px;
        }

        .feedback-page .fb-rating {
            color: #f59e0b;

            font-size: 17px;
            letter-spacing: 2px;

            filter:
                drop-shadow(
                    0 3px 5px
                    rgba(245, 158, 11, 0.18)
                );
        }

        .feedback-page .fb-date {
            padding: 4px 9px;

            color: #64748b;

            background: #f1f5f9;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 500;
        }

        .feedback-page .fb-comment {
            margin: 10px 0 0;

            color: #475569;

            font-size: 14px;
            line-height: 1.7;

            overflow-wrap: anywhere;
        }

        .feedback-page .fb-reply {
            margin-top: 12px;

            padding: 12px 15px;

            color: #334155;

            background:
                linear-gradient(
                    135deg,
                    #f0fdf4,
                    #ecfdf5
                );

            border:
                1px solid #bbf7d0;

            border-left:
                4px solid #16a34a;

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.6;
        }

        .feedback-page .fb-reply .reply-label {
            display: block;

            margin-bottom: 3px;

            color: #15803d;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.06em;
        }

        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .feedback-page .empty-state {
            text-align: center;

            padding: 42px 20px;

            color: #64748b;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #ffffff
                );

            border: 1px dashed #cbd5e1;
        }

        .feedback-page .empty-state i {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 68px;
            height: 68px;

            margin: 0 auto 15px;

            border-radius: 50%;

            color: #94a3b8;

            background:
                linear-gradient(
                    135deg,
                    #f1f5f9,
                    #e2e8f0
                );

            font-size: 28px;
        }

        .feedback-page .empty-state p {
            margin: 0;

            font-size: 13px;
        }

        /* =========================================================
           PENDING STATUS
           ========================================================= */

        .feedback-page .pending-status {
            display: flex;
            align-items: center;
            gap: 6px;

            margin-top: 9px;

            color: #94a3b8;

            font-size: 12px;
        }

        /* =========================================================
           RESPONSIVE — SMALL PHONES
           ========================================================= */

        @media (max-width: 480px) {

            .feedback-page {
                padding:
                    20px 0
                    45px;
            }

            .feedback-page .container {
                width: min(
                    100% - 20px,
                    850px
                );
            }

            .feedback-header {
                padding: 17px;

                border-radius: 17px;

                margin-bottom: 18px;
            }

            .feedback-header h1 {
                gap: 9px;

                font-size: 24px;
            }

            .feedback-header h1::before {
                width: 35px;
                height: 35px;

                border-radius: 10px;

                font-size: 17px;
            }

            .feedback-header h1 small {
                width: 100%;

                padding: 5px 9px;

                font-size: 10px;

                text-align: center;
            }

            .feedback-page .feedback-card {
                padding: 20px 16px;

                border-radius: 17px;
            }

            .feedback-page .feedback-card h3 {
                font-size: 15px;

                margin-bottom: 18px;
            }

            .feedback-page .feedback-card h3 i {
                width: 34px;
                height: 34px;

                border-radius: 10px;

                font-size: 13px;
            }

            .feedback-page .rating-selector {
                gap: 2px;

                width: 100%;

                justify-content: center;

                padding: 7px 6px;
            }

            .feedback-page .rating-selector .star-btn {
                width: 40px;
                height: 40px;

                font-size: 28px;
            }

            .feedback-page .btn-submit {
                width: 100%;

                min-height: 49px;

                padding: 12px 18px;
            }

            .feedback-page .fb-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .feedback-page .fb-rating {
                font-size: 16px;
            }

            .feedback-page .feedback-item {
                padding: 16px;
            }
        }

        /* =========================================================
           RESPONSIVE — TABLETS
           ========================================================= */

        @media (min-width: 481px) and (max-width: 768px) {

            .feedback-page .container {
                width: min(
                    100% - 28px,
                    760px
                );
            }

            .feedback-page {
                padding-top: 28px;
            }

            .feedback-page .feedback-card {
                padding: 24px;
            }
        }

        /* =========================================================
           RESPONSIVE — LARGE DESKTOP
           ========================================================= */

        @media (min-width: 1200px) {

            .feedback-page {
                padding-top: 45px;
            }

            .feedback-page .container {
                width: min(
                    100% - 50px,
                    900px
                );
            }

            .feedback-page .feedback-card {
                padding: 32px;
            }
        }

        /* =========================================================
           EXTRA LARGE SCREENS
           ========================================================= */

        @media (min-width: 1600px) {

            .feedback-page {
                padding-top: 55px;
            }

            .feedback-page .container {
                width: 920px;
            }

            .feedback-page .feedback-card {
                padding: 34px;
            }
        }

        /* =========================================================
           ACCESSIBILITY / REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .feedback-page *,
            .feedback-page *::before,
            .feedback-page *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* =========================================================
           VERY NARROW DEVICES
           ========================================================= */

        @media (max-width: 340px) {

            .feedback-page .container {
                width: calc(100% - 14px);
            }

            .feedback-page .feedback-card {
                padding: 16px 12px;
            }

            .feedback-page .rating-selector .star-btn {
                width: 34px;
                height: 36px;

                font-size: 24px;
            }

            .feedback-page .feedback-header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         FEEDBACK PAGE
         ========================================================= -->

    <div class="feedback-page">

        <div class="container">

            <!-- Header -->
            <div class="feedback-header">

                <h1>
                    Feedback
                    <small id="fbCount">
                        Share your experience
                    </small>
                </h1>

            </div>


            <!-- Alert -->
            <div
                class="alert alert-success"
                id="alertMessage"
                role="alert"
                aria-live="polite"
            >
                <i class="fas fa-check-circle"></i>

                <span id="alertText">
                    Success
                </span>
            </div>


            <!-- =================================================
                 Submit Feedback
                 ================================================= -->

            <div
                class="feedback-card"
                id="submitSection"
            >

                <h3>
                    <i class="fas fa-star"></i>
                    Submit Feedback
                </h3>


                <form
                    id="feedbackForm"
                    onsubmit="return false;"
                >

                    <!-- Rating -->
                    <div class="form-group">

                        <label>
                            Your Rating
                        </label>

                        <div
                            class="rating-selector"
                            id="ratingSelector"
                            aria-label="Select rating"
                        >

                            <button
                                type="button"
                                class="star-btn"
                                data-value="1"
                                aria-label="1 star"
                            >
                                ★
                            </button>

                            <button
                                type="button"
                                class="star-btn"
                                data-value="2"
                                aria-label="2 stars"
                            >
                                ★
                            </button>

                            <button
                                type="button"
                                class="star-btn"
                                data-value="3"
                                aria-label="3 stars"
                            >
                                ★
                            </button>

                            <button
                                type="button"
                                class="star-btn"
                                data-value="4"
                                aria-label="4 stars"
                            >
                                ★
                            </button>

                            <button
                                type="button"
                                class="star-btn"
                                data-value="5"
                                aria-label="5 stars"
                            >
                                ★
                            </button>

                        </div>

                    </div>


                    <!-- Comment -->
                    <div class="form-group">

                        <label for="fbComment">
                            Comment
                        </label>

                        <textarea
                            id="fbComment"
                            class="form-control"
                            placeholder="Tell us about your experience..."
                            rows="4"
                        ></textarea>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn-submit"
                        id="submitBtn"
                    >

                        <i class="fas fa-paper-plane"></i>

                        Submit Feedback

                    </button>

                </form>

            </div>


            <!-- =================================================
                 My Feedback
                 ================================================= -->

            <div class="feedback-card">

                <h3>
                    <i class="fas fa-history"></i>
                    My Feedback
                </h3>

                <div id="myFeedbackContainer">

                    <!-- Will be injected -->

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         Existing project modules preserved
         ========================================================= -->

    <script type="module">

        import { createHeader }
            from '../../components/header.js';

        import { createFooter }
            from '../../components/footer.js';

        import { getCartCount }
            from '../../js/cart.js';

        import {
            getMyFeedback,
            submitFeedback
        } from '../../js/feedback.js';

        import {
            isLoggedIn,
            getCurrentUser
        } from '../../js/auth.js';

        import { showToast }
            from '../../js/main.js';

        import { formatDate }
            from '../../js/utils/formatters.js';


        /* =====================================================
           AUTHENTICATION
           ===================================================== */

        const user = getCurrentUser();

        const isLoggedInUser = isLoggedIn();

        if (!isLoggedInUser) {

            setTimeout(() => {

                window.location.href =
                    '../common/login.html';

            }, 1000);

        }


        /* =====================================================
           HEADER
           ===================================================== */

        document.body.insertAdjacentHTML(
            'afterbegin',

            createHeader({

                navLinks: [

                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },

                    {
                        label: 'Order History',
                        href: 'order-history.html'
                    },

                    {
                        label: 'Profile',
                        href: 'profile.html'
                    }

                ],

                user: user,

                isLoggedIn: isLoggedInUser,

                cartCount: getCartCount(),

                theme:
                    localStorage.getItem('scos_theme')
                    || 'light',

                language:
                    localStorage.getItem('scos_language')
                    || 'en',

                authButtons: {

                    loginLabel: 'Login',

                    registerLabel: 'Register',

                    loginHref:
                        '../common/login.html',

                    registerHref:
                        '../common/register.html'

                },

                onToggleMenu: () => {

                    document
                        .getElementById('mainNav')
                        ?.classList.toggle('open');

                },

                onToggleTheme: () => {},

                onToggleLanguage: () => {},

                onLogout: () => {},

                onNotificationClick: () => {

                    window.location.href =
                        'notifications.html';

                }

            })
        );


        /* =====================================================
           FOOTER
           ===================================================== */

        document.body.insertAdjacentHTML(

            'beforeend',

            createFooter({

                quickLinks: [

                    {
                        label: 'Home',
                        href: '../../index.html'
                    },

                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },

                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },

                    {
                        label: 'Register',
                        href: '../common/register.html'
                    }

                ],

                roleLinks: [

                    {
                        label: 'Customer',
                        href: 'menu.html'
                    },

                    {
                        label: 'Kitchen',
                        href:
                            '../kitchen/dashboard.html'
                    },

                    {
                        label: 'Admin',
                        href:
                            '../admin/dashboard.html'
                    }

                ]

            })
        );


        /* =====================================================
           DOM REFERENCES
           ===================================================== */

        const ratingSelector =
            document.getElementById(
                'ratingSelector'
            );

        const commentEl =
            document.getElementById(
                'fbComment'
            );

        const submitBtn =
            document.getElementById(
                'submitBtn'
            );

        const myFeedbackContainer =
            document.getElementById(
                'myFeedbackContainer'
            );

        const fbCount =
            document.getElementById(
                'fbCount'
            );

        const alertEl =
            document.getElementById(
                'alertMessage'
            );

        const alertText =
            document.getElementById(
                'alertText'
            );


        /* =====================================================
           STATE
           ===================================================== */

        let selectedRating = 0;


        /* =====================================================
           RATING SELECTOR
           ===================================================== */

        if (ratingSelector) {

            ratingSelector
                .querySelectorAll('.star-btn')
                .forEach(btn => {

                    btn.addEventListener(
                        'click',

                        function () {

                            const value =
                                parseInt(
                                    this.dataset.value,
                                    10
                                );

                            selectedRating =
                                value;

                            ratingSelector
                                .querySelectorAll(
                                    '.star-btn'
                                )
                                .forEach(star => {

                                    const starValue =
                                        parseInt(
                                            star.dataset.value,
                                            10
                                        );

                                    star.classList.toggle(
                                        'active',
                                        starValue <= value
                                    );

                                });

                        }
                    );

                });

        }


        /* =====================================================
           SHOW ALERT
           ===================================================== */

        function showAlert(
            message,
            type = 'success'
        ) {

            if (!alertEl || !alertText) {
                return;
            }

            alertEl.className =
                `alert alert-${type} show`;

            alertText.textContent =
                message;

            setTimeout(() => {

                alertEl.className =
                    'alert';

            }, 4000);

        }


        /* =====================================================
           SUBMIT FEEDBACK
           ===================================================== */

        async function handleSubmit(e) {

            e.preventDefault();

            if (selectedRating === 0) {

                showAlert(
                    'Please select a rating',
                    'error'
                );

                return;
            }


            const comment =
                commentEl.value.trim();


            if (!comment) {

                showAlert(
                    'Please write a comment',
                    'error'
                );

                return;
            }


            submitBtn.disabled = true;

            submitBtn.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Submitting...';


            /*
             * For demo, we'll use a mock order ID.
             * Existing behavior preserved.
             */

            const mockOrderId =
                'o' + Date.now();


            try {

                const result =
                    await submitFeedback(
                        mockOrderId,
                        selectedRating,
                        comment
                    );


                if (result && result.success) {

                    showAlert(
                        'Thank you for your feedback!',
                        'success'
                    );


                    selectedRating = 0;


                    ratingSelector
                        .querySelectorAll(
                            '.star-btn'
                        )
                        .forEach(star => {

                            star.classList.remove(
                                'active'
                            );

                        });


                    commentEl.value = '';


                    renderMyFeedback();

                } else {

                    showAlert(
                        result?.error
                            || 'Failed to submit feedback',
                        'error'
                    );

                }

            } catch (error) {

                console.error(
                    'Feedback submission error:',
                    error
                );

                showAlert(
                    'Failed to submit feedback',
                    'error'
                );

            } finally {

                submitBtn.disabled = false;

                submitBtn.innerHTML =
                    '<i class="fas fa-paper-plane"></i> Submit Feedback';

            }

        }


        /* =====================================================
           RENDER MY FEEDBACK
           ===================================================== */

        function renderMyFeedback() {

            let feedbacks = [];

            try {

                feedbacks =
                    getMyFeedback() || [];

            } catch (error) {

                console.error(
                    'Unable to load feedback:',
                    error
                );

                feedbacks = [];

            }


            if (fbCount) {

                fbCount.textContent =
                    `${feedbacks.length} submission${
                        feedbacks.length !== 1
                            ? 's'
                            : ''
                    }`;

            }


            if (!myFeedbackContainer) {
                return;
            }


            /* Empty state */

            if (feedbacks.length === 0) {

                myFeedbackContainer.innerHTML = `

                    <div class="empty-state">

                        <i class="fas fa-star"></i>

                        <p>
                            You haven't submitted
                            any feedback yet.
                        </p>

                    </div>

                `;

                return;
            }


            /* Feedback list */

            myFeedbackContainer.innerHTML = `

                <div class="feedback-list">

                    ${feedbacks.map(fb => `

                        <div class="feedback-item">

                            <div class="fb-header">

                                <span class="fb-rating">

                                    ${
                                        '★'.repeat(
                                            Math.max(
                                                0,
                                                Math.min(
                                                    5,
                                                    Number(fb.rating) || 0
                                                )
                                            )
                                        )
                                    }

                                    ${
                                        '☆'.repeat(
                                            5 -
                                            Math.max(
                                                0,
                                                Math.min(
                                                    5,
                                                    Number(fb.rating) || 0
                                                )
                                            )
                                        )
                                    }

                                </span>


                                <span class="fb-date">

                                    ${
                                        formatDate(
                                            fb.createdAt
                                        )
                                    }

                                </span>

                            </div>


                            <div class="fb-comment">

                                ${escapeHTML(
                                    fb.comment || ''
                                )}

                            </div>


                            ${
                                fb.reply
                                    ? `

                                        <div class="fb-reply">

                                            <div class="reply-label">

                                                <i
                                                    class="fas fa-reply"
                                                ></i>

                                                Reply

                                            </div>

                                            ${escapeHTML(
                                                fb.reply
                                            )}

                                        </div>

                                    `
                                    : ''
                            }


                            ${
                                fb.status === 'pending'
                                    ? `

                                        <div class="pending-status">

                                            <i
                                                class="fas fa-clock"
                                            ></i>

                                            Awaiting approval

                                        </div>

                                    `
                                    : ''
                            }

                        </div>

                    `).join('')}

                </div>

            `;

        }


        /* =====================================================
           BASIC HTML ESCAPE
           Prevents feedback text from breaking the UI
           ===================================================== */

        function escapeHTML(value) {

            return String(value)
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }


        /* =====================================================
           EVENT LISTENERS
           ===================================================== */

        submitBtn.addEventListener(
            'click',
            handleSubmit
        );


        /* =====================================================
           INITIALIZE
           ===================================================== */

        renderMyFeedback();

        console.log(
            '⭐ Feedback page loaded successfully!'
        );

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Reviews - TasteEthio Cafeteria</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/src/css/style.css">
    <link rel="stylesheet" href="/frontend/src/css/menu.css">
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar-header">
        <div class="nav-container">
            <div class="nav-left-group">
                <a href="menu.html" class="btn-back-home">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Menu</span>
                </a>
                <a href="menu.html" class="brand-logo">
                    <i class="fa-solid fa-utensils"></i> TasteEthio
                </a>
            </div>

            <div class="header-actions">
                <a href="order-history.html" class="nav-link-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>History</span>
                </a>
                <a href="cart.html" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-badge-count">0</span>
                </a>
                
                <!-- User Profile Dropdown using requested image element -->
                <div class="user-profile-menu">
                    <button class="user-profile-btn" id="user-menu-btn">
                       
                        <span class="user-name">Abebe K.</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="user-dropdown-menu">
                        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
                        <a href="order-history.html"><i class="fa-solid fa-receipt"></i> My Orders</a>
                        <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
                        <a href="feedback.html"><i class="fa-solid fa-comment-dots"></i> Feedback</a>
                        <hr>
                        <a href="../common/login.html" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container profile-layout">

        <!-- Sidebar Navigation -->
        <aside class="profile-sidebar">
            <nav class="profile-nav">
                <a href="profile.html" class="profile-nav-item">
                    <i class="fa-solid fa-user-gear"></i> Account Settings
                </a>
                <a href="order-history.html" class="profile-nav-item">
                    <i class="fa-solid fa-receipt"></i> Order History
                </a>
                <a href="notifications.html" class="profile-nav-item">
                    <i class="fa-solid fa-bell"></i> Notifications
                </a>
                <a href="feedback.html" class="profile-nav-item active">
                    <i class="fa-solid fa-comment-dots"></i> Feedback & Reviews
                </a>
                <a href="../common/login.html" class="profile-nav-item logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </nav>

        </aside>

        <!-- Main Content Area -->
        <section class="profile-content">
            <div class="content-header">
                <h2><i class="fa-solid fa-star-half-stroke"></i> Feedback & Reviews</h2>
                <p>We value your opinion! Rate your recent meal or cafeteria service.</p>
            </div>

            <!-- Feedback Submission Form -->
            <form id="feedback-form" class="feedback-form">
                <div id="feedback-alert" class="alert-box" style="display:none;"></div>

                <!-- Star Rating Selector -->
                <div class="form-group rating-container">
                    <label>Overall Experience Rating *</label>
                    <div class="star-rating" id="star-rating-group">
                        <i class="fa-solid fa-star star-btn" data-value="1"></i>
                        <i class="fa-solid fa-star star-btn" data-value="2"></i>
                        <i class="fa-solid fa-star star-btn" data-value="3"></i>
                        <i class="fa-solid fa-star star-btn" data-value="4"></i>
                        <i class="fa-solid fa-star star-btn" data-value="5"></i>
                    </div>
                    <span id="rating-text" class="rating-label-text">Select a rating</span>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="feedback-category">Feedback Topic</label>
                        <select id="feedback-category">
                            <option value="Food Quality">Food & Drink Quality</option>
                            <option value="Service Speed">Service & Preparation Speed</option>
                            <option value="Cleanliness">Cafeteria Cleanliness</option>
                            <option value="App Suggestion">Website / App Suggestion</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dish-reviewed">Specific Dish (Optional)</label>
                        <input type="text" id="dish-reviewed" placeholder="e.g. Special Kitfo, Macchiato">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 16px;">
                    <label for="feedback-comments">Your Comments / Review *</label>
                    <textarea id="feedback-comments" rows="4" required placeholder="Tell us what you enjoyed or what we can improve..."></textarea>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane"></i> Submit Feedback
                    </button>
                </div>
            </form>

            <hr class="form-divider">

            <!-- Previously Submitted Feedback List -->
            <div class="previous-feedback-section">
                <h3>My Past Reviews</h3>
                <div id="past-feedback-list" class="feedback-list">
                    <!-- Populated via feedback.js -->
                </div>
            </div>
        </section>

    </main>

    <script src="/frontend/src/js/profile.js" defer></script>
    <script src="/frontend/src/js/feedback.js" defer></script>
</body>
</html>

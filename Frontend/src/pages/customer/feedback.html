<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Reviews - TasteEthio Cafeteria</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/menu.css">
    <link rel="stylesheet" href="/src/css/theme.css">
    <link rel="stylesheet" href="/src/css/themes/dark-theme.css">
    <script src="/src/js/theme.js"></script>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar-header">
        <div class="nav-container">
            <div class="nav-left-group">
                <a href="menu.html" class="btn-back-home">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span data-i18n="nav_menu">Menu</span>
                </a>
                <a href="menu.html" class="brand-logo">
                    <i class="fa-solid fa-utensils"></i> TasteEthio
                </a>
            </div>

            <div class="header-actions">
                <a href="order-history.html" class="nav-link-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span data-i18n="nav_history">History</span>
                </a>
                <a href="cart.html" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-badge-count">0</span>
                </a>

                <!-- Back to Admin (admin only) -->
                <a id="adminBackBtn" href="../admin/dashboard.html" class="nav-link-item d-none" style="display:none;">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Back to Admin</span>
                </a>

                <!-- User Profile Dropdown using requested image element -->
                <div class="user-profile-menu">
                    <button class="user-profile-btn" id="user-menu-btn">
                       
                        <span class="user-name user-profile-name" id="userProfileName">Loading...</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="user-dropdown-menu">
                        <a href="profile.html"><i class="fa-solid fa-user"></i> <span data-i18n="nav_profile">My Profile</span></a>
                        <a href="order-history.html"><i class="fa-solid fa-receipt"></i> <span data-i18n="nav_orders">My Orders</span></a>
                        <a href="notifications.html"><i class="fa-solid fa-bell"></i> <span data-i18n="nav_notifications">Notifications</span></a>
                        <a href="feedback.html"><i class="fa-solid fa-comment-dots"></i> <span data-i18n="nav_feedback">Feedback</span></a>
                        <hr>
                        <a href="../common/login.html" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="nav_logout">Logout</span></a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container profile-layout">

        <!-- Sidebar Navigation -->
        <aside class="profile-sidebar">
            <nav class="profile-nav">
                <a href="profile.html" class="profile-nav-item">
                    <i class="fa-solid fa-user-gear"></i> Account Settings
                </a>
                <a href="order-history.html" class="profile-nav-item">
                    <i class="fa-solid fa-receipt"></i> <span data-i18n="nav_orders">Order History</span>
                </a>
                <a href="notifications.html" class="profile-nav-item">
                    <i class="fa-solid fa-bell"></i> <span data-i18n="nav_notifications">Notifications</span>
                </a>
                <a href="feedback.html" class="profile-nav-item active">
                    <i class="fa-solid fa-comment-dots"></i> <span data-i18n="nav_feedback">Feedback & Reviews</span>
                </a>
                <a href="../common/login.html" class="profile-nav-item logout">
                    <i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="nav_logout">Logout</span>
                </a>
            </nav>

        </aside>

        <!-- Main Content Area -->
        <section class="profile-content">
            <div class="content-header">
                <h2><i class="fa-solid fa-star-half-stroke"></i> <span data-i18n="feedback_title">Feedback &amp; Reviews</span></h2>
                <p data-i18n="feedback_subtitle">We value your opinion! Rate your recent meal or cafeteria service.</p>
            </div>

            <!-- Feedback Submission Form -->
            <form id="feedback-form" class="feedback-form">
                <div id="feedback-alert" class="alert-box" style="display:none;"></div>

                <!-- Star Rating Selector -->
                <div class="form-group rating-container">
                    <label data-i18n="rating_label">Overall Experience Rating *</label>
                    <div class="star-rating" id="star-rating-group">
                        <i class="fa-solid fa-star star-btn" data-value="1"></i>
                        <i class="fa-solid fa-star star-btn" data-value="2"></i>
                        <i class="fa-solid fa-star star-btn" data-value="3"></i>
                        <i class="fa-solid fa-star star-btn" data-value="4"></i>
                        <i class="fa-solid fa-star star-btn" data-value="5"></i>
                    </div>
                    <input type="hidden" id="ratingValue" value="0">
                    <input type="hidden" id="feedback-order-id" value="">
                    <span id="rating-text" class="rating-label-text" data-i18n="rating_placeholder">Select a rating</span>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="feedback-category" data-i18n="topic_label">Feedback Topic</label>
                        <select id="feedback-category">
                            <option value="Food Quality">Food & Drink Quality</option>
                            <option value="Service Speed">Service & Preparation Speed</option>
                            <option value="Cleanliness">Cafeteria Cleanliness</option>
                            <option value="App Suggestion">Website / App Suggestion</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dish-reviewed" data-i18n="dish_label">Specific Dish (Optional)</label>
                        <input type="text" id="dish-reviewed" placeholder="e.g. Special Kitfo, Macchiato">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 16px;">
                    <label for="feedback-comments" data-i18n="comments_label">Your Comments / Review *</label>
                    <textarea id="feedback-comments" rows="4" required data-i18n-placeholder="comment_placeholder" placeholder="Tell us what you enjoyed or what we can improve..."></textarea>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane"></i> <span data-i18n="btn_submit">Submit Feedback</span>
                    </button>
                </div>
            </form>

            <hr class="form-divider">

            <!-- Previously Submitted Feedback List -->
            <div class="previous-feedback-section">
                <h3 data-i18n="past_reviews">My Past Reviews</h3>
                <div id="past-feedback-list" class="feedback-list">
                    <!-- Populated via feedback.js -->
                </div>
            </div>
        </section>

    </main>

    <script src="/src/js/translations.js" defer></script>
    <script src="/src/js/language.js" defer></script>
    <script src="/src/js/profile.js" defer></script>
    <script src="/src/js/feedback.js" defer></script>
    <script src="/src/js/global-auth.js" defer></script>

    <!-- Feedback logic: star rating, user name, Back-to-Admin, form submit -->
    <script>
        (function () {
            var API = "https://smart-cafeteria-frontend.onrender.com/api/v1";

            function getToken() {
                return localStorage.getItem("auth_token") ||
                    localStorage.getItem("scos_token") ||
                    localStorage.getItem("token") || "";
            }

            function getStoredUser() {
                var raw =
                    localStorage.getItem("current_user") ||
                    localStorage.getItem("scos_user") ||
                    localStorage.getItem("user") ||
                    localStorage.getItem("loggedUser") ||
                    localStorage.getItem("userProfile");
                if (!raw) return null;
                try { return JSON.parse(raw); } catch (e) { return null; }
            }

            function getRole() {
                var r = (localStorage.getItem("userRole") || localStorage.getItem("role") || "").toLowerCase();
                if (r === "admin") return "admin";
                if (getStoredUser() && (getStoredUser().role || "").toLowerCase() === "admin") return "admin";
                return r;
            }

            function loadUserProfile() {
                var display = document.getElementById("userProfileName");
                if (!display) return;
                var user = getStoredUser();
                var name = user && (user.name || user.fullName || user.fname);
                if (name) {
                    display.textContent = name;
                } else {
                    display.textContent = "Customer";
                }

                var adminBtn = document.getElementById("adminBackBtn");
                if (adminBtn) {
                    if (getRole() === "admin") {
                        adminBtn.classList.remove("d-none");
                        adminBtn.style.display = "";
                    } else {
                        adminBtn.classList.add("d-none");
                        adminBtn.style.display = "none";
                    }
                }
            }

            function initStars() {
                var group = document.getElementById("star-rating-group");
                var ratingInput = document.getElementById("ratingValue");
                var ratingText = document.getElementById("rating-text");
                if (!group || !ratingInput) return;

                var labels = ["Select a rating", "Poor", "Fair", "Good", "Very Good", "Excellent"];

                function highlight(value) {
                    group.querySelectorAll(".star-btn").forEach(function (star) {
                        var v = parseInt(star.getAttribute("data-value"), 10);
                        star.classList.toggle("active", v <= value);
                        star.classList.toggle("text-warning", v <= value);
                    });
                }

                group.querySelectorAll(".star-btn").forEach(function (star) {
                    star.addEventListener("click", function () {
                        var value = parseInt(star.getAttribute("data-value"), 10);
                        ratingInput.value = value;
                        highlight(value);
                        if (ratingText) ratingText.textContent = labels[value] || "";
                    });
                });
            }

            function initForm() {
                var form = document.getElementById("feedback-form");
                if (!form) return;

                // Prefill order id from query string when provided (?orderId=...)
                (function prefillOrderId() {
                    var params = new URLSearchParams(window.location.search);
                    var orderId = params.get("orderId");
                    var orderInput = document.getElementById("feedback-order-id");
                    if (orderId && orderInput) orderInput.value = orderId;
                })();

                form.addEventListener("submit", async function (e) {
                    e.preventDefault();

                    var rating = parseInt(document.getElementById("ratingValue").value, 10);
                    var comment = document.getElementById("feedback-comments").value.trim();
                    var category = document.getElementById("feedback-category").value;
                    var dishName = document.getElementById("dish-reviewed").value.trim();

                    if (!rating || rating < 1 || rating > 5) {
                        alert("Please select a star rating between 1 and 5.");
                        return;
                    }
                    if (!comment) {
                        alert("Please enter your comments / review.");
                        return;
                    }

                    // Get orderId from URL search params, then localStorage
                    var orderId = new URLSearchParams(window.location.search).get('orderId') || localStorage.getItem('lastOrderId') || null;

                    var token = getToken();

                    var submitBtn = form.querySelector(".btn-primary");
                    if (submitBtn) { submitBtn.disabled = true; }

                    try {
                        var feedbackPayload = {
                            rating: Number(rating),
                            comment: comment,
                            category: category,
                            dishName: dishName
                        };
                        if (orderId) {
                            feedbackPayload.orderId = orderId;
                        }
                        var res = await fetch(API + "/feedback", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": "Bearer " + token
                            },
                            body: JSON.stringify(feedbackPayload)
                        });
                        var data = await res.json();
                        if (!res.ok) {
                            throw new Error(data.error || "Failed to submit feedback.");
                        }
                        alert(data.message || "Thank you for your feedback!");
                        form.reset();
                        document.getElementById("ratingValue").value = "0";
                        highlightStars(0);
                        if (document.getElementById("rating-text")) {
                            document.getElementById("rating-text").textContent = "Select a rating";
                        }
                    } catch (err) {
                        alert(err.message);
                    } finally {
                        if (submitBtn) { submitBtn.disabled = false; }
                    }
                });
            }

            function highlightStars(value) {
                var group = document.getElementById("star-rating-group");
                if (!group) return;
                group.querySelectorAll(".star-btn").forEach(function (star) {
                    var v = parseInt(star.getAttribute("data-value"), 10);
                    star.classList.toggle("active", v <= value);
                    star.classList.toggle("text-warning", v <= value);
                });
            }

            document.addEventListener("DOMContentLoaded", function () {
                loadUserProfile();
                initStars();
                initForm();
            });
        })();
    </script>
</body>
</html>

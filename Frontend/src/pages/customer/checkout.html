<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Cafeteria Menu</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/frontend/src/css/style.css">
     <link rel="stylesheet" href="/frontend/src/css/cart.css">
      <link rel="stylesheet" href="/frontend/src/css/menu.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">

        <div class="container nav-container">
            <a href="cart.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Back to Cart
            </a>
            <h2><i class="fa-solid fa-receipt"></i> Checkout</h2>
            <div></div>
        </div>
    </header>

    <main class="container cart-layout">

        <!-- Left Column: Customer Details & Payment Form -->
        <section class="checkout-form-section">
            <form id="checkout-form">
                
                <!-- 1. Dining Option --> 
                <div class="form-card">
                    <h3><i class="fa-solid fa-utensils"></i> Dining Option</h3>
                    <div class="radio-group-grid">
                        <label class="radio-card active">
                            <input type="radio" name="orderType" value="dine-in" checked>
                            <i class="fa-solid fa-chair"></i>
                            <span>Dine-In</span>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="orderType" value="takeaway">
                            <i class="fa-solid fa-bag-shopping"></i>
                            <span>Takeaway</span>
                        </label>
                    </div>

                    <!-- Table Number Field (Visible for Dine-In) -->
                    <div class="form-group" id="table-number-group">
                        <label for="table-number">Table Number <span class="required">*</span></label>
                        <input type="number" id="table-number" placeholder="e.g., 12" min="1" max="100" required>
                    </div>
                </div>

                <!-- 2. Customer Contact Info -->
                <div class="form-card">
                    <h3><i class="fa-solid fa-user"></i> Contact Details</h3> 
                    <div class="form-group">
                        <label for="customer-name">Full Name <span class="required">*</span></label>
                        <input type="text" id="customer-name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="customer-phone">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="customer-phone" placeholder="0911223344" pattern="^(09|07)[0-9]{8}$" required>
                        <small class="form-hint">Format: 09XXXXXXXX or 07XXXXXXXX</small>
                    </div>
                </div>

                <!-- 3. Payment Selection -->
                <div class="form-card">
                    <h3><i class="fa-solid fa-wallet"></i> Payment Method</h3>
                    <div class="payment-options">
                        
                        <label class="payment-card active">
                            <input type="radio" name="paymentMethod" value="Telebirr" checked>
                            <div class="payment-info">
                                <strong>Telebirr</strong>
                                <small>Pay instantly via Telebirr app or CBE birr</small>
                            </div>

                            <i class="fa-solid fa-mobile-screen-button"></i>
                        </label>

                        <label class="payment-card">
                            <input type="radio" name="paymentMethod" value="CBE Birr">
                            <div class="payment-info">
                                <strong>CBE Birr / Bank Transfer</strong>
                                <small>Commercial Bank of Ethiopia direct payment</small>
                            </div>
                            <i class="fa-solid fa-building-columns"></i>
                        </label>

                        <label class="payment-card"> 
                            <input type="radio" name="paymentMethod" value="Cash">
                            <div class="payment-info">
                                <strong>Cash on Delivery / Service</strong>
                                <small>Pay at your table or counter</small>
                            </div>
                            <i class="fa-solid fa-money-bill-wave"></i>
                        </label>

                    </div>
                </div>

                <!-- Submit Action for Mobile -->
                <button type="submit" class="btn btn-primary btn-block mobile-only-btn">
                    Confirm Order <i class="fa-solid fa-check-circle"></i>
                </button>
            </form>
        </section>

        <!-- Right Column: Order Summary Review -->
        <aside class="cart-summary-section">
            <div class="summary-card">
                <h3>Order Review</h3>
                <hr>

                <!-- Dynamic Item List Preview -->
                <div id="checkout-items-list" class="checkout-items-preview">
                    <!-- Loaded via checkout.js -->
                </div>

                <hr class="divider">

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span><strong id="checkout-subtotal">0</strong> <small>ETB</small></span>
                </div>
                
                <div class="summary-row">
                    <span>Service Fee</span>
                    <span><strong id="checkout-service-fee">20</strong> <small>ETB</small></span>
                </div>

                <hr class="divider">

                <div class="summary-row total-row">
                    <span>Total Amount</span>
                    <span><strong id="checkout-total">0</strong> <small>ETB</small></span>
                </div>

                <button type="submit" form="checkout-form" id="place-order-btn" class="btn btn-primary btn-block">
                    Place Order <i class="fa-solid fa-check-circle"></i>
                </button>
            </div>
        </aside>

    </main>

    <!-- Connect script -->
    <script src="/frontend/src/js/checkout.js" defer></script>
      <script src="/frontend/src/js/utils/storage.js"></script>
    <script src="/frontend/src/js/utils/validators.js"></script>
      <script src="/frontend/src/js/utils/formatters.js"></script>
   
</body>
</html>

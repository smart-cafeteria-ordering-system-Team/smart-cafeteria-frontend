<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Smart Cafeteria</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/src/css/style.css">
    <link rel="stylesheet" href="/frontend/src/css/menu.css">
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar-header">
        <div class="nav-container">
            <div class="nav-left-group">
                <a href="menu.html" class="btn-back-home">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Menu</span>
                </a>
                <a href="menu.html" class="brand-logo">
                    <i class="fa-solid fa-utensils"></i> Smart
                </a>
            </div>

            <div class="header-actions">
                <a href="order-history.html" class="nav-link-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>History</span>
                </a>
                <a href="cart.html" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-badge-count">0</span>
                </a>
                
                <!-- User Profile Dropdown -->
                <div class="user-profile-menu">
                    <button class="user-profile-btn" id="user-menu-btn">
                        
                        <span class="user-name">Abebe K.</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="user-dropdown-menu">
                        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
                        <a href="order-history.html"><i class="fa-solid fa-receipt"></i> My Orders</a>
                        <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
                        <a href="feedback.html"><i class="fa-solid fa-comment-dots"></i> Feedback</a>
                        <hr>
                        <a href="../common/login.html" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container profile-layout">

        <!-- Sidebar Navigation -->
        <aside class="profile-sidebar">
            <nav class="profile-nav">
                <a href="profile.html" class="profile-nav-item">
                    <i class="fa-solid fa-user-gear"></i> Account Settings
                </a>
                <a href="order-history.html" class="profile-nav-item">
                    <i class="fa-solid fa-receipt"></i> Order History
                </a>
                <a href="notifications.html" class="profile-nav-item active">
                    <i class="fa-solid fa-bell"></i> Notifications
                </a>
                <a href="feedback.html" class="profile-nav-item">
                    <i class="fa-solid fa-comment-dots"></i> Feedback & Reviews
                </a>
                <a href="../common/login.html" class="profile-nav-item logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <section class="profile-content">
            <div class="content-header-flex">
                <div>
                    <h2><i class="fa-solid fa-bell"></i> Notifications</h2>
                    <p>Stay updated on your food order status and special cafeteria promotions.</p>
                </div>
                <div class="notification-actions">
                    <button id="mark-all-read-btn" class="btn btn-sm btn-outline">
                        <i class="fa-solid fa-check-double"></i> Mark All as Read
                    </button>
                    <button id="clear-notifications-btn" class="btn btn-sm btn-outline-danger">
                        <i class="fa-solid fa-trash-can"></i> Clear All
                    </button>
                </div>
            </div>

            <!-- Notifications List Container -->
            <div id="notifications-container" class="notifications-list">
                <!-- Dynamically populated via notifications.js -->
            </div>
        </section>

    </main>

    <script src="/frontend/src/js/profile.js" defer></script>
    <script src="/components/notifications.js" defer></script>
</body>
</html>

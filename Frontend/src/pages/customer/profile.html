<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile | Smart Cafeteria</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Existing Project CSS -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* ============================================================
           PROFILE PAGE
           Luxury + Responsive + Safe Fallback Styling
           ============================================================ */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-width: 320px;
            font-family: "Poppins", sans-serif;
            overflow-x: hidden;
            background: #f8fbff;
        }

        button,
        input {
            font: inherit;
        }

        /* ============================================================
           MAIN PAGE BACKGROUND
           ============================================================ */

        .profile-page {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            padding: 42px 0 70px;

            background:
                radial-gradient(
                    circle at 8% 10%,
                    rgba(59, 130, 246, 0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 92% 12%,
                    rgba(168, 85, 247, 0.14),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(14, 165, 233, 0.12),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #f8fbff 38%,
                    #f5f7ff 68%,
                    #ffffff 100%
                );
        }

        /* Decorative glowing lights */

        .profile-page::before,
        .profile-page::after {
            content: "";
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(2px);
        }

        .profile-page::before {
            width: 280px;
            height: 280px;
            top: 60px;
            left: -150px;

            background: radial-gradient(
                circle,
                rgba(37, 99, 235, 0.18) 0%,
                rgba(37, 99, 235, 0.07) 42%,
                transparent 72%
            );
        }

        .profile-page::after {
            width: 340px;
            height: 340px;
            right: -170px;
            bottom: 80px;

            background: radial-gradient(
                circle,
                rgba(139, 92, 246, 0.17) 0%,
                rgba(139, 92, 246, 0.06) 44%,
                transparent 72%
            );
        }

        /* ============================================================
           CONTAINER
           ============================================================ */

        .profile-page .container {
            width: min(100% - 32px, 920px);
            margin: 0 auto;
            padding: 0;
        }

        /* ============================================================
           PROFILE HEADER
           ============================================================ */

        .profile-header {
            position: relative;
            text-align: center;
            margin: 0 auto 30px;
            padding: 8px 10px 4px;
        }

        .profile-header .avatar {
            position: relative;

            width: 108px;
            height: 108px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffffff;
            font-size: 42px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #4f46e5 45%,
                    #9333ea 100%
                );

            border: 5px solid rgba(255, 255, 255, 0.95);

            box-shadow:
                0 15px 35px rgba(37, 99, 235, 0.28),
                0 0 0 7px rgba(59, 130, 246, 0.07),
                0 0 45px rgba(99, 102, 241, 0.18);

            overflow: hidden;
        }

        /* Avatar shine */

        .profile-header .avatar::before {
            content: "";
            position: absolute;

            width: 70px;
            height: 160px;

            top: -45px;
            left: -100px;

            transform: rotate(28deg);

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.58),
                transparent
            );

            animation: avatarShine 4.5s ease-in-out infinite;
        }

        @keyframes avatarShine {
            0% {
                left: -110px;
            }

            45%,
            100% {
                left: 150px;
            }
        }

        .profile-header h1 {
            margin: 0;

            color: #111827;
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.5px;

            text-shadow: 0 2px 15px rgba(37, 99, 235, 0.08);
        }

        .profile-header .role-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 30px;

            margin-top: 9px;
            padding: 5px 17px;

            border-radius: 999px;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;

            border: 1px solid rgba(255, 255, 255, 0.9);

            box-shadow:
                0 6px 18px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .profile-header .role-badge.customer {
            background: linear-gradient(
                135deg,
                #dbeafe,
                #eff6ff
            );
            color: #1d4ed8;
        }

        .profile-header .role-badge.kitchen {
            background: linear-gradient(
                135deg,
                #fef3c7,
                #fffbeb
            );
            color: #92400e;
        }

        .profile-header .role-badge.admin {
            background: linear-gradient(
                135deg,
                #fee2e2,
                #fff1f2
            );
            color: #991b1b;
        }

        /* ============================================================
           ALERT
           ============================================================ */

        .alert {
            position: relative;

            width: 100%;
            padding: 13px 16px;

            margin: 0 0 18px;

            border-radius: 13px;

            font-size: 13px;
            font-weight: 600;

            display: none;
            align-items: center;
            gap: 9px;

            box-shadow:
                0 8px 24px rgba(15, 23, 42, 0.07);

            animation: alertIn 0.3s ease;
        }

        .alert.show {
            display: flex;
        }

        .alert-success {
            background: linear-gradient(
                135deg,
                #f0fdf4,
                #dcfce7
            );

            color: #166534;
            border: 1px solid #bbf7d0;
            border-left: 4px solid #16a34a;
        }

        .alert-error {
            background: linear-gradient(
                135deg,
                #fff1f2,
                #fee2e2
            );

            color: #991b1b;
            border: 1px solid #fecaca;
            border-left: 4px solid #dc2626;
        }

        @keyframes alertIn {
            from {
                opacity: 0;
                transform: translateY(-7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           PROFILE CARDS
           ============================================================ */

        .profile-card {
            position: relative;
            overflow: hidden;

            width: 100%;

            margin-bottom: 20px;
            padding: 27px 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(255, 255, 255, 0.91)
                );

            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 20px;

            box-shadow:
                0 12px 35px rgba(15, 23, 42, 0.07),
                0 2px 8px rgba(37, 99, 235, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }

        .profile-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -120px;
            right: -80px;

            border-radius: 50%;

            background: radial-gradient(
                circle,
                rgba(59, 130, 246, 0.11),
                transparent 70%
            );

            pointer-events: none;
        }

        .profile-card:hover {
            transform: translateY(-3px);

            border-color: rgba(147, 197, 253, 0.7);

            box-shadow:
                0 18px 45px rgba(15, 23, 42, 0.09),
                0 5px 18px rgba(37, 99, 235, 0.07);
        }

        .profile-card h3 {
            position: relative;

            margin: 0 0 20px;

            display: flex;
            align-items: center;
            gap: 10px;

            color: #111827;
            font-size: 16px;
            font-weight: 700;
        }

        .profile-card h3 i {
            width: 35px;
            height: 35px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            flex: 0 0 35px;

            border-radius: 10px;

            color: #2563eb;

            background: linear-gradient(
                135deg,
                #eff6ff,
                #dbeafe
            );

            box-shadow:
                0 5px 15px rgba(37, 99, 235, 0.12);
        }

        /* ============================================================
           INFORMATION ROWS
           ============================================================ */

        #infoDisplay {
            width: 100%;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;

            min-height: 49px;

            padding: 11px 4px;

            border-bottom: 1px solid #eef2f7;

            font-size: 13px;
        }

        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 2px;
        }

        .info-row .label {
            flex: 0 0 auto;

            color: #64748b;
            font-weight: 600;
        }

        .info-row .value {
            min-width: 0;

            color: #1e293b;
            font-weight: 600;
            text-align: right;

            overflow-wrap: anywhere;
        }

        /* ============================================================
           FORM
           ============================================================ */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin: 0 0 7px;

            color: #334155;

            font-size: 12px;
            font-weight: 700;
        }

        .form-control {
            display: block;

            width: 100%;
            min-height: 46px;

            padding: 11px 14px;

            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 500;

            color: #1e293b;
            background: #ffffff;

            border: 1.5px solid #dbe3ef;
            border-radius: 11px;

            outline: none;

            box-shadow:
                inset 0 1px 2px rgba(15, 23, 42, 0.025);

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:hover {
            border-color: #bfdbfe;
        }

        .form-control:focus {
            border-color: #2563eb;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, 0.10),
                0 5px 18px rgba(37, 99, 235, 0.06);
        }

        .form-control:disabled {
            color: #64748b;
            background: #f8fafc;

            cursor: not-allowed;
            opacity: 0.9;
        }

        /* ============================================================
           BUTTONS
           ============================================================ */

        .form-actions {
            display: flex;
            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 21px;
        }

        .btn-save,
        .btn-logout {
            min-height: 46px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 11px 24px;

            border-radius: 11px;

            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease;
        }

        .btn-save {
            position: relative;
            overflow: hidden;

            color: #ffffff;

            border: 1px solid #2563eb;

            background:
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #4f46e5 48%,
                    #7c3aed 100%
                );

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.22);
        }

        /* Button shine */

        .btn-save::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            transform: skewX(-25deg);

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.28),
                transparent
            );

            transition: left 0.65s ease;
        }

        .btn-save:hover::before {
            left: 150%;
        }

        .btn-save:hover {
            transform: translateY(-2px);

            box-shadow:
                0 13px 28px rgba(37, 99, 235, 0.30),
                0 0 22px rgba(99, 102, 241, 0.12);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-save:disabled {
            background: linear-gradient(
                135deg,
                #94a3b8,
                #64748b
            );

            border-color: #94a3b8;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        .btn-logout {
            color: #dc2626;

            background: #ffffff;

            border: 1.5px solid #fca5a5;
        }

        .btn-logout:hover {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #dc2626,
                    #ef4444
                );

            border-color: #dc2626;

            transform: translateY(-2px);

            box-shadow:
                0 10px 24px rgba(220, 38, 38, 0.20);
        }

        .btn-logout:active {
            transform: translateY(0);
        }

        /* ============================================================
           PASSWORD BUTTON
           ============================================================ */

        #changePasswordBtn {
            margin-top: 4px;
        }

        /* ============================================================
           VERY LARGE SCREENS
           ============================================================ */

        @media (min-width: 1400px) {
            .profile-page {
                padding-top: 55px;
                padding-bottom: 90px;
            }

            .profile-page .container {
                max-width: 980px;
            }

            .profile-card {
                padding: 31px 36px;
            }

            .profile-header {
                margin-bottom: 35px;
            }

            .profile-header .avatar {
                width: 118px;
                height: 118px;
                font-size: 46px;
            }
        }

        /* ============================================================
           TABLET
           ============================================================ */

        @media (max-width: 768px) {
            .profile-page {
                padding: 32px 0 55px;
            }

            .profile-page .container {
                width: min(100% - 28px, 680px);
            }

            .profile-card {
                padding: 23px 22px;
                border-radius: 17px;
            }

            .profile-header {
                margin-bottom: 25px;
            }

            .profile-header .avatar {
                width: 96px;
                height: 96px;
                font-size: 37px;
            }

            .info-row {
                gap: 18px;
            }
        }

        /* ============================================================
           MOBILE
           ============================================================ */

        @media (max-width: 560px) {
            .profile-page {
                padding: 25px 0 45px;
            }

            .profile-page .container {
                width: calc(100% - 22px);
            }

            .profile-header {
                margin-bottom: 22px;
            }

            .profile-header .avatar {
                width: 88px;
                height: 88px;
                margin-bottom: 12px;
                font-size: 34px;
            }

            .profile-header h1 {
                font-size: 22px;
            }

            .profile-card {
                margin-bottom: 15px;
                padding: 19px 17px;
                border-radius: 15px;
            }

            .profile-card h3 {
                margin-bottom: 17px;
                font-size: 14px;
            }

            .profile-card h3 i {
                width: 32px;
                height: 32px;
                flex-basis: 32px;
            }

            .info-row {
                align-items: flex-start;

                flex-direction: column;

                gap: 4px;

                min-height: auto;

                padding: 12px 2px;
            }

            .info-row .label,
            .info-row .value {
                width: 100%;
                text-align: left;
            }

            .form-group {
                margin-bottom: 14px;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;

                gap: 10px;
            }

            /* FIXED:
               Previously this targeted ".btn", but the actual
               buttons are ".btn-save" and ".btn-logout". */

            .form-actions .btn-save,
            .form-actions .btn-logout {
                width: 100%;
            }

            .btn-save,
            .btn-logout {
                width: 100%;
                min-height: 47px;
            }

            #changePasswordBtn {
                width: 100%;
                min-height: 47px;
            }
        }

        /* ============================================================
           VERY SMALL PHONES
           ============================================================ */

        @media (max-width: 380px) {
            .profile-page .container {
                width: calc(100% - 16px);
            }

            .profile-card {
                padding: 17px 14px;
            }

            .profile-header .avatar {
                width: 80px;
                height: 80px;
                font-size: 31px;
            }

            .profile-header h1 {
                font-size: 20px;
            }

            .form-control {
                min-height: 44px;
                padding: 10px 12px;
                font-size: 12.5px;
            }

            .btn-save,
            .btn-logout {
                font-size: 12.5px;
            }
        }

        /* ============================================================
           REDUCED MOTION
           ============================================================ */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
         PROFILE PAGE
         ============================================================ -->

    <div class="profile-page">

        <div class="container">

            <!-- Profile Header -->
            <div class="profile-header" id="profileHeader">
                <!-- Will be injected by JavaScript -->
            </div>

            <!-- Alert -->
            <div
                class="alert alert-success"
                id="alertMessage"
                role="alert"
                aria-live="polite"
            >
                <i class="fas fa-check-circle"></i>
                <span id="alertText">Success</span>
            </div>

            <!-- ====================================================
                 PROFILE INFORMATION
                 ==================================================== -->

            <div class="profile-card" id="profileInfo">

                <h3>
                    <i class="fas fa-user"></i>
                    Profile Information
                </h3>

                <div id="infoDisplay">
                    <!-- Will be injected -->
                </div>

            </div>

            <!-- ====================================================
                 EDIT PROFILE
                 ==================================================== -->

            <div class="profile-card">

                <h3>
                    <i class="fas fa-edit"></i>
                    Edit Profile
                </h3>

                <form id="profileForm">

                    <div class="form-group">

                        <label for="editName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="editName"
                            class="form-control"
                            autocomplete="name"
                        />

                    </div>

                    <div class="form-group">

                        <label for="editEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="editEmail"
                            class="form-control"
                            autocomplete="email"
                            disabled
                        />

                    </div>

                    <div class="form-group">

                        <label for="editPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="editPhone"
                            class="form-control"
                            placeholder="+251 912 345 678"
                            autocomplete="tel"
                        />

                    </div>

                    <div class="form-actions">

                        <button
                            type="submit"
                            class="btn-save"
                            id="saveProfileBtn"
                        >
                            <i class="fas fa-save"></i>
                            <span>Save Changes</span>
                        </button>

                        <button
                            type="button"
                            class="btn-logout"
                            id="logoutBtn"
                        >
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Logout</span>
                        </button>

                    </div>

                </form>

            </div>

            <!-- ====================================================
                 CHANGE PASSWORD
                 ==================================================== -->

            <div class="profile-card">

                <h3>
                    <i class="fas fa-lock"></i>
                    Change Password
                </h3>

                <form id="passwordForm">

                    <div class="form-group">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            class="form-control"
                            placeholder="Enter current password"
                            autocomplete="current-password"
                        />

                    </div>

                    <div class="form-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            class="form-control"
                            placeholder="Min. 6 characters"
                            autocomplete="new-password"
                        />

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Re-enter new password"
                            autocomplete="new-password"
                        />

                    </div>

                    <button
                        type="submit"
                        class="btn-save"
                        id="changePasswordBtn"
                    >
                        <i class="fas fa-key"></i>
                        <span>Change Password</span>
                    </button>

                </form>

            </div>

        </div>
    </div>


    <!-- ============================================================
         SCRIPT
         ============================================================ -->

    <script type="module">

        /* ============================================================
           IMPORTS
           ============================================================ */

        import { createHeader } from '../../components/header.js';
        import { createFooter } from '../../components/footer.js';

        import { getCartCount } from '../../js/cart.js';

        import {
            isLoggedIn,
            getCurrentUser,
            updateProfile,
            changePassword,
            logout
        } from '../../js/auth.js';

        import { showToast } from '../../js/main.js';


        /* ============================================================
           CURRENT USER
           ============================================================ */

        const user = getCurrentUser();
        const isLoggedInUser = isLoggedIn();


        /* ============================================================
           AUTH CHECK
           ============================================================ */

        if (!isLoggedInUser) {

            setTimeout(() => {
                window.location.href = '../common/login.html';
            }, 1000);

        }


        /* ============================================================
           RENDER HEADER
           ============================================================ */

        document.body.insertAdjacentHTML(
            'afterbegin',

            createHeader({

                navLinks: [
                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },

                    {
                        label: 'Order History',
                        href: 'order-history.html'
                    },

                    {
                        label: 'Profile',
                        href: 'profile.html',
                        active: true
                    }
                ],

                user: user,

                isLoggedIn: isLoggedInUser,

                cartCount: getCartCount(),

                theme:
                    localStorage.getItem('scos_theme') ||
                    'light',

                language:
                    localStorage.getItem('scos_language') ||
                    'en',

                authButtons: {
                    loginLabel: 'Login',
                    registerLabel: 'Register',

                    loginHref:
                        '../common/login.html',

                    registerHref:
                        '../common/register.html'
                },

                onToggleMenu: () => {

                    document
                        .getElementById('mainNav')
                        ?.classList
                        .toggle('open');

                },

                onToggleTheme: () => {},

                onToggleLanguage: () => {},

                onLogout: () => {},

                onNotificationClick: () => {

                    window.location.href =
                        'notifications.html';

                }

            })
        );


        /* ============================================================
           RENDER FOOTER
           ============================================================ */

        document.body.insertAdjacentHTML(
            'beforeend',

            createFooter({

                quickLinks: [
                    {
                        label: 'Home',
                        href: '../../index.html'
                    },

                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },

                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },

                    {
                        label: 'Register',
                        href: '../common/register.html'
                    }
                ],

                roleLinks: [
                    {
                        label: 'Customer',
                        href: 'menu.html'
                    },

                    {
                        label: 'Kitchen',
                        href: '../kitchen/dashboard.html'
                    },

                    {
                        label: 'Admin',
                        href: '../admin/dashboard.html'
                    }
                ]

            })
        );


        /* ============================================================
           DOM ELEMENTS
           ============================================================ */

        const profileHeader =
            document.getElementById('profileHeader');

        const infoDisplay =
            document.getElementById('infoDisplay');

        const alertEl =
            document.getElementById('alertMessage');

        const alertText =
            document.getElementById('alertText');

        const profileForm =
            document.getElementById('profileForm');

        const passwordForm =
            document.getElementById('passwordForm');

        const editName =
            document.getElementById('editName');

        const editEmail =
            document.getElementById('editEmail');

        const editPhone =
            document.getElementById('editPhone');

        const saveBtn =
            document.getElementById('saveProfileBtn');

        const currentPassword =
            document.getElementById('currentPassword');

        const newPassword =
            document.getElementById('newPassword');

        const confirmPassword =
            document.getElementById('confirmPassword');

        const changePassBtn =
            document.getElementById('changePasswordBtn');

        const logoutBtn =
            document.getElementById('logoutBtn');


        /* ============================================================
           SHOW ALERT
           ============================================================ */

        function showAlert(
            message,
            type = 'success'
        ) {

            alertEl.className =
                `alert alert-${type} show`;

            alertText.textContent =
                message;

            setTimeout(() => {

                alertEl.className =
                    'alert';

            }, 4000);

        }


        /* ============================================================
           RENDER PROFILE
           ============================================================ */

        function renderProfile() {

            if (!user) {
                return;
            }


            const roleLabels = {

                customer:
                    'Customer',

                kitchen:
                    'Kitchen Staff',

                admin:
                    'Administrator'

            };


            /* ---------------------------------------------
               Avatar + Name + Role
               --------------------------------------------- */

            const userName =
                user.name || 'User';

            const avatarLetter =
                userName
                    .charAt(0)
                    .toUpperCase();


            profileHeader.innerHTML = `

                <div class="avatar">
                    ${avatarLetter}
                </div>

                <h1>
                    ${userName}
                </h1>

                <span
                    class="role-badge ${user.role || ''}"
                >
                    ${roleLabels[user.role] || user.role || 'User'}
                </span>

            `;


            /* ---------------------------------------------
               Profile Information
               --------------------------------------------- */

            infoDisplay.innerHTML = `

                <div class="info-row">

                    <span class="label">
                        Full Name
                    </span>

                    <span class="value">
                        ${user.name || 'N/A'}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Email
                    </span>

                    <span class="value">
                        ${user.email || 'N/A'}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Phone
                    </span>

                    <span class="value">
                        ${user.phone || 'Not provided'}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Role
                    </span>

                    <span class="value">
                        ${roleLabels[user.role] || user.role || 'N/A'}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        Member Since
                    </span>

                    <span class="value">
                        ${
                            user.createdAt
                                ? new Date(
                                    user.createdAt
                                  ).toLocaleDateString()
                                : 'N/A'
                        }
                    </span>

                </div>

            `;


            /* ---------------------------------------------
               Form Values
               --------------------------------------------- */

            editName.value =
                user.name || '';

            editEmail.value =
                user.email || '';

            editPhone.value =
                user.phone || '';

        }


        /* ============================================================
           SAVE PROFILE
           ============================================================ */

        async function handleSaveProfile(e) {

            e.preventDefault();


            const name =
                editName.value.trim();

            const phone =
                editPhone.value.trim();


            if (!name) {

                showAlert(
                    'Name is required',
                    'error'
                );

                return;
            }


            saveBtn.disabled = true;

            saveBtn.innerHTML = `
                <i class="fas fa-spinner fa-spin"></i>
                <span>Saving...</span>
            `;


            try {

                const result =
                    await updateProfile({
                        name,
                        phone
                    });


                if (result.success) {

                    showAlert(
                        'Profile updated successfully!',
                        'success'
                    );


                    /* -----------------------------------------
                       Update Header User
                       ----------------------------------------- */

                    const headerUser =
                        getCurrentUser();


                    if (headerUser) {

                        const nameEl =
                            document.querySelector(
                                '.user-menu .admin-profile div:first-child'
                            );


                        if (nameEl) {

                            nameEl.textContent =
                                headerUser.name;

                        }

                    }


                    /* Re-render */
                    renderProfile();

                } else {

                    showAlert(
                        result.error ||
                        'Failed to update profile',
                        'error'
                    );

                }

            } catch (error) {

                console.error(
                    'Profile update error:',
                    error
                );

                showAlert(
                    'Something went wrong while updating profile.',
                    'error'
                );

            } finally {

                saveBtn.disabled = false;

                saveBtn.innerHTML = `
                    <i class="fas fa-save"></i>
                    <span>Save Changes</span>
                `;

            }

        }


        /* ============================================================
           CHANGE PASSWORD
           ============================================================ */

        async function handleChangePassword(e) {

            e.preventDefault();


            const current =
                currentPassword.value.trim();

            const newPass =
                newPassword.value.trim();

            const confirm =
                confirmPassword.value.trim();


            /* ---------------------------------------------
               Required Fields
               --------------------------------------------- */

            if (
                !current ||
                !newPass ||
                !confirm
            ) {

                showAlert(
                    'Please fill in all fields',
                    'error'
                );

                return;

            }


            /* ---------------------------------------------
               Minimum Password Length
               --------------------------------------------- */

            if (newPass.length < 6) {

                showAlert(
                    'New password must be at least 6 characters',
                    'error'
                );

                return;

            }


            /* ---------------------------------------------
               Password Match
               --------------------------------------------- */

            if (newPass !== confirm) {

                showAlert(
                    'Passwords do not match',
                    'error'
                );

                return;

            }


            changePassBtn.disabled = true;

            changePassBtn.innerHTML = `
                <i class="fas fa-spinner fa-spin"></i>
                <span>Changing...</span>
            `;


            try {

                const result =
                    await changePassword(
                        current,
                        newPass,
                        confirm
                    );


                if (result.success) {

                    showAlert(
                        'Password changed successfully!',
                        'success'
                    );


                    currentPassword.value =
                        '';

                    newPassword.value =
                        '';

                    confirmPassword.value =
                        '';

                } else {

                    showAlert(
                        result.error ||
                        'Failed to change password',
                        'error'
                    );

                }

            } catch (error) {

                console.error(
                    'Password change error:',
                    error
                );

                showAlert(
                    'Something went wrong while changing password.',
                    'error'
                );

            } finally {

                changePassBtn.disabled =
                    false;

                changePassBtn.innerHTML = `
                    <i class="fas fa-key"></i>
                    <span>Change Password</span>
                `;

            }

        }


        /* ============================================================
           LOGOUT
           ============================================================ */

        function handleLogout() {

            if (
                confirm(
                    'Are you sure you want to logout?'
                )
            ) {

                logout(true);

            }

        }


        /* ============================================================
           EVENT LISTENERS
           ============================================================ */

        /*
         * FIX:
         * Instead of relying only on button click,
         * listen to the actual form submit event.
         */

        profileForm.addEventListener(
            'submit',
            handleSaveProfile
        );


        passwordForm.addEventListener(
            'submit',
            handleChangePassword
        );


        logoutBtn.addEventListener(
            'click',
            handleLogout
        );


        /* ============================================================
           INITIALIZE
           ============================================================ */

        renderProfile();


        console.log(
            '👤 Profile page loaded successfully!'
        );

    </script>

</body>
</html>

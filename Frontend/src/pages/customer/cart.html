

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cart | Smart Cafeteria</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Existing Project CSS -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           SMART CAFETERIA
           LUXURY CART PAGE
           ========================================================= */

        :root {
            --luxury-blue: #2563eb;
            --luxury-indigo: #4f46e5;
            --luxury-purple: #7c3aed;
            --luxury-cyan: #06b6d4;
            --luxury-pink: #ec4899;
            --luxury-orange: #f97316;
            --luxury-green: #10b981;

            --luxury-dark: #0f172a;
            --luxury-dark-2: #1e293b;

            --luxury-white: rgba(255, 255, 255, 0.96);

            --luxury-shadow:
                0 20px 60px rgba(37, 99, 235, 0.12);

            --luxury-glow:
                0 0 35px rgba(37, 99, 235, 0.20);
        }


        /* =========================================================
           PAGE BACKGROUND
           ========================================================= */

        .cart-page {
            position: relative;
            min-height: 100vh;

            padding:
                clamp(30px, 5vw, 65px)
                0
                clamp(60px, 7vw, 90px);

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 8% 10%,
                    rgba(37, 99, 235, 0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 92% 12%,
                    rgba(124, 58, 237, 0.14),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(6, 182, 212, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #f5f3ff 45%,
                    #f0fdfa 100%
                );
        }


        /* Decorative glowing circles */

        .cart-page::before,
        .cart-page::after {
            content: "";
            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(2px);
        }

        .cart-page::before {
            width: 320px;
            height: 320px;

            top: 90px;
            left: -180px;

            background:
                radial-gradient(
                    circle,
                    rgba(37, 99, 235, 0.14),
                    transparent 70%
                );

            box-shadow:
                0 0 80px rgba(37, 99, 235, 0.10);
        }

        .cart-page::after {
            width: 380px;
            height: 380px;

            right: -220px;
            bottom: 80px;

            background:
                radial-gradient(
                    circle,
                    rgba(236, 72, 153, 0.12),
                    transparent 70%
                );

            box-shadow:
                0 0 100px rgba(236, 72, 153, 0.10);
        }


        /* =========================================================
           MAIN CONTAINER
           ========================================================= */

        .cart-page .container {
            position: relative;
            z-index: 2;

            width: min(1180px, calc(100% - 32px));

            margin: 0 auto;
        }


        /* =========================================================
           CART HEADER
           ========================================================= */

        .cart-header {
            position: relative;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 25px;

            margin-bottom: 30px;

            padding:
                clamp(22px, 4vw, 32px);

            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.96),
                    rgba(248,250,255,0.88)
                );

            border: 1px solid rgba(255,255,255,0.90);

            box-shadow:
                0 20px 55px rgba(15, 23, 42, 0.08),
                0 0 0 1px rgba(37,99,235,0.04);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }


        .cart-header::before {
            content: "";

            position: absolute;

            left: 0;
            top: 18px;
            bottom: 18px;

            width: 5px;

            border-radius: 0 8px 8px 0;

            background:
                linear-gradient(
                    180deg,
                    var(--luxury-blue),
                    var(--luxury-purple),
                    var(--luxury-pink)
                );

            box-shadow:
                0 0 18px rgba(79,70,229,0.35);
        }


        .cart-header h1 {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;

            gap: 10px;

            margin: 0;

            color: var(--luxury-dark);

            font-size:
                clamp(25px, 4vw, 36px);

            line-height: 1.15;

            font-weight: 800;

            letter-spacing: -0.7px;
        }


        .cart-header h1::first-letter {
            color: var(--luxury-blue);
        }


        .cart-header h1 small {
            display: inline-flex;
            align-items: center;

            min-height: 30px;

            padding: 5px 12px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,0.10),
                    rgba(124,58,237,0.10)
                );

            color: #64748b;

            font-size: 12px;

            font-weight: 500;

            letter-spacing: 0.2px;
        }


        /* =========================================================
           CLEAR BUTTON
           ========================================================= */

        .cart-header .clear-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            min-height: 44px;

            padding: 10px 19px;

            border: 1px solid rgba(239,68,68,0.25);

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.96),
                    rgba(254,242,242,0.95)
                );

            color: #dc2626;

            font-family: "Poppins", sans-serif;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(220,38,38,0.08);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease,
                color .25s ease;
        }


        .cart-header .clear-btn i {
            transition: transform .25s ease;
        }


        .cart-header .clear-btn:hover {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );

            transform: translateY(-3px);

            box-shadow:
                0 12px 28px rgba(220,38,38,0.28);
        }


        .cart-header .clear-btn:hover i {
            transform: rotate(-12deg) scale(1.08);
        }


        /* =========================================================
           EMPTY CART
           ========================================================= */

        .cart-empty {
            position: relative;

            overflow: hidden;

            text-align: center;

            padding:
                clamp(55px, 8vw, 90px)
                25px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.97),
                    rgba(248,250,255,0.92)
                );

            border: 1px solid rgba(255,255,255,0.95);

            box-shadow:
                var(--luxury-shadow),
                var(--luxury-glow);

            backdrop-filter: blur(16px);
        }


        .cart-empty::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -100px;
            right: -80px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(124,58,237,0.16),
                    transparent 70%
                );
        }


        .cart-empty::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            bottom: -90px;
            left: -70px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(6,182,212,0.14),
                    transparent 70%
                );
        }


        .cart-empty i {
            position: relative;
            z-index: 2;

            display: grid;
            place-items: center;

            width: 100px;
            height: 100px;

            margin: 0 auto 25px;

            border-radius: 30px;

            color: #fff;

            font-size: 42px;

            background:
                linear-gradient(
                    135deg,
                    var(--luxury-blue),
                    var(--luxury-purple)
                );

            box-shadow:
                0 18px 40px rgba(79,70,229,0.30),
                0 0 35px rgba(37,99,235,0.18);

            animation: cartFloat 3s ease-in-out infinite;
        }


        @keyframes cartFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        .cart-empty h3 {
            position: relative;
            z-index: 2;

            margin: 0 0 9px;

            color: var(--luxury-dark);

            font-size:
                clamp(20px, 4vw, 27px);

            font-weight: 800;
        }


        .cart-empty p {
            position: relative;
            z-index: 2;

            max-width: 500px;

            margin: 0 auto 24px;

            color: #64748b;

            font-size: 14px;

            line-height: 1.7;
        }


        /* =========================================================
           CART LIST
           ========================================================= */

        .cart-list {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        /* =========================================================
           CART ITEM
           ========================================================= */

        .cart-item {
            position: relative;

            display: grid;

            grid-template-columns:
                68px
                minmax(150px, 1fr)
                auto
                auto
                35px;

            align-items: center;

            gap: 18px;

            padding: 18px 21px;

            border-radius: 21px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.98),
                    rgba(249,250,255,0.94)
                );

            border: 1px solid rgba(255,255,255,0.95);

            box-shadow:
                0 12px 35px rgba(15,23,42,0.07);

            backdrop-filter: blur(15px);

            transition:
                transform .28s ease,
                box-shadow .28s ease,
                border-color .28s ease;
        }


        .cart-item::before {
            content: "";

            position: absolute;

            left: 0;
            top: 18px;
            bottom: 18px;

            width: 3px;

            border-radius: 0 6px 6px 0;

            background:
                linear-gradient(
                    180deg,
                    var(--luxury-blue),
                    var(--luxury-purple)
                );

            opacity: 0;

            transition: opacity .28s ease;
        }


        .cart-item:hover {
            transform: translateY(-4px);

            border-color:
                rgba(99,102,241,0.16);

            box-shadow:
                0 20px 45px rgba(37,99,235,0.12),
                0 0 28px rgba(124,58,237,0.06);
        }


        .cart-item:hover::before {
            opacity: 1;
        }


        /* =========================================================
           FOOD ICON
           ========================================================= */

        .cart-item .item-icon {
            display: grid;
            place-items: center;

            width: 68px;
            height: 68px;

            border-radius: 20px;

            font-size: 31px;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f5f3ff
                );

            border: 1px solid rgba(99,102,241,0.10);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.9),
                0 8px 22px rgba(79,70,229,0.08);

            transition: transform .28s ease;
        }


        .cart-item:hover .item-icon {
            transform:
                translateY(-2px)
                rotate(-2deg)
                scale(1.04);
        }


        /* =========================================================
           ITEM INFO
           ========================================================= */

        .cart-item .item-info {
            min-width: 0;
        }


        .cart-item .item-info .item-name {
            margin-bottom: 4px;

            overflow: hidden;

            color: var(--luxury-dark);

            font-size: 15px;

            font-weight: 700;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .cart-item .item-info .item-price {
            color: #64748b;

            font-size: 12px;

            font-weight: 500;
        }


        /* =========================================================
           QUANTITY
           ========================================================= */

        .cart-item .qty-control {
            display: inline-flex;
            align-items: center;

            gap: 7px;

            padding: 5px;

            border-radius: 999px;

            background:
                rgba(241,245,249,0.90);

            border: 1px solid rgba(148,163,184,0.13);

            box-shadow:
                inset 0 1px 2px rgba(15,23,42,0.04);
        }


        .cart-item .qty-control button {
            display: grid;
            place-items: center;

            width: 31px;
            height: 31px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background: #fff;

            color: #475569;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 4px 12px rgba(15,23,42,0.08);

            transition:
                transform .2s ease,
                color .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        .cart-item .qty-control button:hover {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    var(--luxury-blue),
                    var(--luxury-purple)
                );

            transform: scale(1.08);

            box-shadow:
                0 7px 18px rgba(37,99,235,0.25);
        }


        .cart-item .qty-control .qty {
            min-width: 28px;

            text-align: center;

            color: var(--luxury-dark);

            font-size: 14px;

            font-weight: 800;
        }


        /* =========================================================
           ITEM TOTAL
           ========================================================= */

        .cart-item .item-total {
            min-width: 85px;

            text-align: right;

            color: var(--luxury-blue);

            font-size: 16px;

            font-weight: 800;

            white-space: nowrap;
        }


        /* =========================================================
           REMOVE
           ========================================================= */

        .cart-item .remove-btn {
            display: grid;
            place-items: center;

            width: 35px;
            height: 35px;

            padding: 0;

            border: 1px solid rgba(148,163,184,0.12);

            border-radius: 11px;

            background: rgba(248,250,252,0.8);

            color: #94a3b8;

            font-size: 14px;

            cursor: pointer;

            transition:
                transform .2s ease,
                color .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        .cart-item .remove-btn:hover {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );

            transform:
                scale(1.08)
                rotate(5deg);

            box-shadow:
                0 8px 18px rgba(220,38,38,0.25);
        }


        /* =========================================================
           SUMMARY
           ========================================================= */

        .cart-summary {
            position: relative;

            overflow: hidden;

            margin-top: 22px;

            padding:
                clamp(22px, 4vw, 30px);

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.98),
                    rgba(248,250,255,0.94)
                );

            border: 1px solid rgba(255,255,255,0.95);

            box-shadow:
                0 20px 55px rgba(15,23,42,0.09),
                0 0 35px rgba(37,99,235,0.07);

            backdrop-filter: blur(18px);
        }


        .cart-summary::before {
            content: "";

            position: absolute;

            width: 230px;
            height: 230px;

            top: -145px;
            right: -65px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(124,58,237,0.13),
                    transparent 70%
                );

            pointer-events: none;
        }


        .cart-summary .summary-row {
            position: relative;
            z-index: 1;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            padding: 10px 0;

            color: #64748b;

            font-size: 14px;

            font-weight: 500;
        }


        .cart-summary .summary-row span:last-child {
            color: #334155;

            font-weight: 700;
        }


        .cart-summary .summary-row.total {
            margin-top: 12px;

            padding-top: 19px;

            border-top:
                1px solid rgba(148,163,184,0.20);

            color: var(--luxury-dark);

            font-size: 21px;

            font-weight: 800;
        }


        .cart-summary .summary-row.total .amount {
            color: transparent;

            background:
                linear-gradient(
                    90deg,
                    var(--luxury-blue),
                    var(--luxury-purple),
                    var(--luxury-pink)
                );

            -webkit-background-clip: text;
            background-clip: text;

            font-size: 23px;

            font-weight: 800;

            filter:
                drop-shadow(
                    0 4px 12px
                    rgba(79,70,229,0.15)
                );
        }


        /* =========================================================
           CHECKOUT BUTTON
           ========================================================= */

        .cart-summary .checkout-btn {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 11px;

            overflow: hidden;

            width: 100%;

            min-height: 54px;

            margin-top: 20px;

            padding: 14px 22px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    100deg,
                    #2563eb,
                    #4f46e5,
                    #7c3aed,
                    #ec4899
                );

            background-size: 250% 100%;

            color: #fff;

            font-family: "Poppins", sans-serif;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: .1px;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(79,70,229,0.28),
                0 0 25px rgba(37,99,235,0.13);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background-position .5s ease;
        }


        .cart-summary .checkout-btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.35),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left .6s ease;
        }


        .cart-summary .checkout-btn:hover {
            transform: translateY(-4px);

            background-position: 100% 0;

            box-shadow:
                0 18px 38px rgba(79,70,229,0.34),
                0 0 35px rgba(236,72,153,0.16);
        }


        .cart-summary .checkout-btn:hover::before {
            left: 140%;
        }


        .cart-summary .checkout-btn i {
            transition:
                transform .25s ease;
        }


        .cart-summary .checkout-btn:hover i {
            transform:
                translateX(5px);
        }


        .cart-summary .checkout-btn:disabled {
            background: #cbd5e1;

            color: #64748b;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =========================================================
           RESPONSIVE — TABLET
           ========================================================= */

        @media (max-width: 900px) {

            .cart-page .container {
                width: min(
                    100% - 26px,
                    760px
                );
            }


            .cart-item {
                grid-template-columns:
                    58px
                    minmax(130px, 1fr)
                    auto
                    auto;

                gap: 13px;
            }


            .cart-item .item-icon {
                width: 58px;
                height: 58px;

                font-size: 27px;
            }


            .cart-item .remove-btn {
                grid-column: 4;
                grid-row: 1;
            }


            .cart-item .item-total {
                grid-column: 3;
            }
        }


        /* =========================================================
           RESPONSIVE — MOBILE
           ========================================================= */

        @media (max-width: 650px) {

            .cart-page {
                padding-top: 25px;
            }


            .cart-page .container {
                width: min(
                    100% - 18px,
                    560px
                );
            }


            .cart-header {
                align-items: stretch;

                flex-direction: column;

                padding: 21px;

                border-radius: 21px;
            }


            .cart-header h1 {
                font-size: 25px;
            }


            .cart-header .clear-btn {
                width: 100%;
            }


            .cart-item {
                grid-template-columns:
                    54px
                    1fr
                    35px;

                gap: 13px;

                padding: 15px;
            }


            .cart-item .item-icon {
                width: 54px;
                height: 54px;

                border-radius: 16px;

                font-size: 25px;
            }


            .cart-item .item-info {
                grid-column: 2;
                grid-row: 1;
            }


            .cart-item .remove-btn {
                grid-column: 3;
                grid-row: 1;
            }


            .cart-item .qty-control {
                grid-column: 2;
                grid-row: 2;

                justify-self: start;
            }


            .cart-item .item-total {
                grid-column: 3;
                grid-row: 2;

                min-width: auto;

                font-size: 14px;
            }
        }


        /* =========================================================
           RESPONSIVE — SMALL PHONES
           ========================================================= */

        @media (max-width: 390px) {

            .cart-page .container {
                width: calc(100% - 12px);
            }


            .cart-header {
                padding: 18px;
            }


            .cart-header h1 {
                font-size: 22px;
            }


            .cart-header h1 small {
                width: 100%;

                justify-content: center;
            }


            .cart-item {
                padding: 13px;

                border-radius: 18px;
            }


            .cart-item .item-name {
                font-size: 13px !important;
            }


            .cart-item .item-price {
                font-size: 11px !important;
            }


            .cart-item .qty-control button {
                width: 28px;
                height: 28px;
            }


            .cart-summary {
                padding: 19px 16px;

                border-radius: 20px;
            }


            .cart-summary .summary-row {
                font-size: 13px;
            }


            .cart-summary .summary-row.total {
                font-size: 18px;
            }


            .cart-summary .summary-row.total .amount {
                font-size: 20px;
            }
        }


        /* =========================================================
           LARGE SCREENS
           ========================================================= */

        @media (min-width: 1400px) {

            .cart-page .container {
                width: min(
                    1280px,
                    calc(100% - 80px)
                );
            }


            .cart-header {
                padding: 34px 38px;
            }


            .cart-item {
                padding: 21px 25px;

                gap: 22px;
            }


            .cart-summary {
                padding: 32px;
            }
        }


        /* =========================================================
           EXTRA LARGE SCREENS
           ========================================================= */

        @media (min-width: 1800px) {

            .cart-page .container {
                max-width: 1400px;
            }


            .cart-header h1 {
                font-size: 40px;
            }


            .cart-item {
                min-height: 100px;
            }


            .cart-summary {
                max-width: 100%;
            }
        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;

                scroll-behavior: auto !important;

                transition-duration: .01ms !important;
            }
        }
    </style>
</head>


<body>

    <div class="cart-page">

        <!-- Header injected -->

        <div class="container">

            <!-- =====================================================
                 CART HEADER
                 ===================================================== -->

            <div class="cart-header">

                <h1>
                    Your Cart

                    <small id="cartSubtitle">
                        Review your items
                    </small>
                </h1>


                <button
                    class="clear-btn"
                    id="clearCartBtn"
                    type="button"
                >
                    <i class="fas fa-trash-alt"></i>
                    Clear Cart
                </button>

            </div>


            <!-- =====================================================
                 CART CONTENT
                 ===================================================== -->

            <div id="cartContent">
                <!-- Will be injected -->
            </div>

        </div>

    </div>


    <!-- =============================================================
         SCRIPT
         ============================================================= -->

    <script type="module">

        import { createHeader }
            from '../../components/header.js';

        import { createFooter }
            from '../../components/footer.js';

        import {
            getCartItems,
            getCartTotal,
            getCartCount,
            updateCartItem,
            removeFromCart,
            clearCart,
            isCartEmpty,
            addCartListener
        } from '../../js/cart.js';

        import {
            isLoggedIn,
            getCurrentUser
        } from '../../js/auth.js';

        import {
            showToast
        } from '../../js/main.js';


        // =========================================================
        // RENDER HEADER
        // =========================================================

        const user = getCurrentUser();

        const isLoggedInUser = isLoggedIn();


        document.body.insertAdjacentHTML(
            'afterbegin',

            createHeader({

                navLinks: [

                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },

                    {
                        label: 'Order History',
                        href: 'order-history.html'
                    },

                    {
                        label: 'Profile',
                        href: 'profile.html'
                    },

                ],

                user: user,

                isLoggedIn: isLoggedInUser,

                cartCount: getCartCount(),

                theme:
                    localStorage.getItem('scos_theme')
                    || 'light',

                language:
                    localStorage.getItem('scos_language')
                    || 'en',


                authButtons: {

                    loginLabel: 'Login',

                    registerLabel: 'Register',

                    loginHref:
                        '../common/login.html',

                    registerHref:
                        '../common/register.html',

                },


                onToggleMenu: () => {

                    document
                        .getElementById('mainNav')
                        ?.classList.toggle('open');

                },


                onToggleTheme: () => {},


                onToggleLanguage: () => {},


                onLogout: () => {

                    if (confirm('Are you sure?')) {

                        localStorage.removeItem(
                            'scos_user'
                        );

                        localStorage.removeItem(
                            'scos_token'
                        );

                        localStorage.removeItem(
                            'scos_cart'
                        );

                        window.location.href =
                            '../common/login.html';
                    }

                },


                onNotificationClick: () => {

                    window.location.href =
                        'notifications.html';

                },

            })
        );


        // =========================================================
        // RENDER FOOTER
        // =========================================================

        document.body.insertAdjacentHTML(

            'beforeend',

            createFooter({

                quickLinks: [

                    {
                        label: 'Home',
                        href: '../../index.html'
                    },

                    {
                        label: 'Menu',
                        href: 'menu.html'
                    },

                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },

                    {
                        label: 'Register',
                        href: '../common/register.html'
                    },

                ],


                roleLinks: [

                    {
                        label: 'Customer',
                        href: 'menu.html'
                    },

                    {
                        label: 'Kitchen',
                        href:
                            '../kitchen/dashboard.html'
                    },

                    {
                        label: 'Admin',
                        href:
                            '../admin/dashboard.html'
                    },

                ],

            })
        );


        // =========================================================
        // DOM
        // =========================================================

        const cartContent =
            document.getElementById(
                'cartContent'
            );

        const cartSubtitle =
            document.getElementById(
                'cartSubtitle'
            );

        const clearCartBtn =
            document.getElementById(
                'clearCartBtn'
            );


        // =========================================================
        // RENDER CART
        // =========================================================

        function renderCart() {

            const items =
                getCartItems();

            const isEmpty =
                isCartEmpty();


            // -----------------------------------------------------
            // EMPTY CART
            // -----------------------------------------------------

            if (isEmpty) {

                cartContent.innerHTML = `

                    <div class="cart-empty">

                        <i class="fas fa-shopping-cart"></i>

                        <h3>
                            Your cart is empty
                        </h3>

                        <p>
                            Browse our menu and add
                            your favorite items.
                        </p>

                        <a
                            href="menu.html"
                            class="btn btn-primary"
                        >
                            <i class="fas fa-utensils"></i>
                            Browse Menu
                        </a>

                    </div>

                `;


                cartSubtitle.textContent =
                    'No items added yet';


                clearCartBtn.style.display =
                    'none';


                return;
            }


            clearCartBtn.style.display =
                'inline-flex';


            cartSubtitle.textContent =
                `${items.length} item${items.length > 1 ? 's' : ''}`;


            const lang =
                localStorage.getItem(
                    'scos_language'
                ) || 'en';


            // -----------------------------------------------------
            // ITEMS HTML
            // -----------------------------------------------------

            const itemsHTML =
                items.map(
                    (item, index) => {

                        const name =
                            item.name[lang]
                            || item.name.en
                            || 'Item';


                        const total =
                            item.price *
                            item.quantity;


                        return `

                            <div
                                class="cart-item"
                                data-index="${index}"
                            >

                                <div class="item-icon">
                                    ${item.icon || '🍽️'}
                                </div>


                                <div class="item-info">

                                    <div class="item-name">
                                        ${name}
                                    </div>

                                    <div class="item-price">
                                        ${item.price} ብር each
                                    </div>

                                </div>


                                <div class="qty-control">

                                    <button
                                        class="qty-minus"
                                        data-id="${item.itemId}"
                                        type="button"
                                        aria-label="Decrease quantity"
                                    >
                                        −
                                    </button>


                                    <span class="qty">
                                        ${item.quantity}
                                    </span>


                                    <button
                                        class="qty-plus"
                                        data-id="${item.itemId}"
                                        type="button"
                                        aria-label="Increase quantity"
                                    >
                                        +
                                    </button>

                                </div>


                                <div class="item-total">
                                    ${total} ብር
                                </div>


                                <button
                                    class="remove-btn"
                                    data-id="${item.itemId}"
                                    type="button"
                                    aria-label="Remove item"
                                >
                                    <i class="fas fa-times"></i>
                                </button>

                            </div>

                        `;

                    }
                ).join('');


            const total =
                getCartTotal();


            // -----------------------------------------------------
            // CART CONTENT
            // -----------------------------------------------------

            cartContent.innerHTML = `

                <div class="cart-list">

                    ${itemsHTML}

                </div>


                <div class="cart-summary">

                    <div class="summary-row">

                        <span>
                            Subtotal (${getCartCount()} items)
                        </span>

                        <span>
                            ${total} ብር
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Service Fee
                        </span>

                        <span>
                            0 ብር
                        </span>

                    </div>


                    <div class="summary-row total">

                        <span>
                            Total
                        </span>

                        <span class="amount">
                            ${total} ብር
                        </span>

                    </div>


                    <button
                        class="checkout-btn"
                        id="checkoutBtn"
                        ${isEmpty ? 'disabled' : ''}
                        type="button"
                    >

                        <span>
                            <i class="fas fa-arrow-right"></i>
                        </span>

                        Proceed to Checkout

                    </button>

                </div>

            `;


            // =====================================================
            // QUANTITY MINUS
            // =====================================================

            document
                .querySelectorAll('.qty-minus')
                .forEach(btn => {

                    btn.addEventListener(
                        'click',

                        function () {

                            const id =
                                parseInt(
                                    this.dataset.id
                                );


                            const item =
                                getCartItems()
                                    .find(
                                        i =>
                                            i.itemId === id
                                    );


                            if (
                                item &&
                                item.quantity > 1
                            ) {

                                updateCartItem(
                                    id,
                                    item.quantity - 1
                                );

                                renderCart();

                            } else {

                                removeFromCart(id);

                                renderCart();

                            }

                        }
                    );

                });


            // =====================================================
            // QUANTITY PLUS
            // =====================================================

            document
                .querySelectorAll('.qty-plus')
                .forEach(btn => {

                    btn.addEventListener(
                        'click',

                        function () {

                            const id =
                                parseInt(
                                    this.dataset.id
                                );


                            const item =
                                getCartItems()
                                    .find(
                                        i =>
                                            i.itemId === id
                                    );


                            if (
                                item &&
                                item.quantity < 99
                            ) {

                                updateCartItem(
                                    id,
                                    item.quantity + 1
                                );

                                renderCart();

                            }

                        }
                    );

                });


            // =====================================================
            // REMOVE ITEM
            // =====================================================

            document
                .querySelectorAll('.remove-btn')
                .forEach(btn => {

                    btn.addEventListener(
                        'click',

                        function () {

                            const id =
                                parseInt(
                                    this.dataset.id
                                );


                            removeFromCart(id);

                            renderCart();


                            showToast(
                                'Item removed from cart',
                                'info'
                            );

                        }
                    );

                });


            // =====================================================
            // CHECKOUT
            // =====================================================

            document
                .getElementById('checkoutBtn')
                ?.addEventListener(
                    'click',

                    function () {

                        window.location.href =
                            'checkout.html';

                    }
                );

        }


        // =========================================================
        // CLEAR CART
        // =========================================================

        clearCartBtn.addEventListener(
            'click',

            function () {

                if (
                    confirm(
                        'Are you sure you want to clear your cart?'
                    )
                ) {

                    clearCart(false);

                    renderCart();


                    showToast(
                        'Cart cleared',
                        'info'
                    );

                }

            }
        );


        // =========================================================
        // CART LISTENER
        // =========================================================

        addCartListener(() => {

            renderCart();


            const count =
                getCartCount();


            const badge =
                document.getElementById(
                    'cartCount'
                );


            if (badge) {

                badge.textContent =
                    count;

            }

        });


        // =========================================================
        // INIT
        // =========================================================

        renderCart();


        console.log(
            '🛒 Cart page loaded successfully!'
        );

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart - Smart Cafeteria</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="/frontend/src/css/style.css">

    <!-- Cart CSS -->
    <link rel="stylesheet" href="/frontend/src/css/cart.css">

    <!--
        Food images are intentionally hidden in the cart.
        Remove this block if you want images later.
    -->
    <style>
        .cart-container img,
        .cart-items-section img,
        .cart-item img,
        .cart-food-image,
        .food-image,
        .item-image {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ==============================
         NAVIGATION
    =============================== -->
    <header class="navbar">

        <div class="container nav-container">

            <!-- Back to Menu -->
            <a href="menu.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Menu
            </a>

            <!-- Page Title -->
            <h2>
                <i class="fa-solid fa-cart-shopping"></i>
                My Food Cart
            </h2>

            <!-- Navigation Links -->
            <div class="nav-links">

                <a
                    href="order-tracking.html"
                    class="nav-link-track"
                >
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Track Order
                </a>

                <a
                    href="cart.html"
                    class="nav-cart-btn"
                    aria-label="Shopping Cart"
                >
                    <i class="fa-solid fa-cart-shopping"></i>

                    <!-- UNIQUE ID -->
                    <span id="navbar-cart-count">0</span>
                </a>

            </div>

        </div>

    </header>


    <!-- ==============================
         MAIN CART
    =============================== -->

    <main class="container cart-layout">

        <!-- ==============================
             LEFT: CART ITEMS
        =============================== -->

        <section class="cart-items-section">

            <div class="cart-header">

                <h3>
                    Order Items
                    (
                    <span id="items-cart-count">0</span>
                    )
                </h3>

                <button
                    id="clear-cart-btn"
                    class="btn btn-sm btn-outline-danger"
                    type="button"
                    style="display: none;"
                >
                    <i class="fa-solid fa-trash"></i>
                    Clear All
                </button>

            </div>


            <!--
                JavaScript will insert cart items here.
            -->
            <div
                id="cart-container"
                class="cart-container"
            >

                <!-- Empty state / cart items generated by cart.js -->

            </div>

        </section>


        <!-- ==============================
             RIGHT: ORDER SUMMARY
        =============================== -->

        <aside class="cart-summary-section">

            <div class="summary-card">

                <h3>Order Summary</h3>

                <hr>


                <!-- SUBTOTAL -->

                <div class="summary-row">

                    <span>Subtotal</span>

                    <span>
                        <strong id="summary-subtotal">0</strong>
                        <small>ETB</small>
                    </span>

                </div>


                <!-- SERVICE FEE -->

                <div class="summary-row">

                    <span>Service Fee</span>

                    <span>
                        <strong id="summary-service-fee">0</strong>
                        <small>ETB</small>
                    </span>

                </div>


                <hr class="divider">


                <!-- TOTAL -->

                <div class="summary-row total-row">

                    <span>Total Amount</span>

                    <span>
                        <strong id="summary-total">0</strong>
                        <small>ETB</small>
                    </span>

                </div>


                <!-- ACTIONS -->

                <div class="summary-actions">

                    <button
                        id="checkout-btn"
                        class="btn btn-primary btn-block"
                        type="button"
                        disabled
                    >
                        Proceed to Checkout

                        <i class="fa-solid fa-credit-card"></i>
                    </button>


                    <a
                        href="menu.html"
                        class="btn btn-secondary btn-block"
                    >
                        Add More Food
                    </a>

                </div>

            </div>

        </aside>

    </main>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <!-- Cart JavaScript -->
    <script src="/frontend/src/js/cart.js"></script>

</body>

</html>

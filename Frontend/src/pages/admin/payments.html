

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Payments | Smart Cafeteria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           SMART CAFETERIA - ADMIN PAYMENTS
           Premium / Modern / Luxury / Fully Responsive
           JS + Existing Paths Preserved
        ========================================================= */

        :root {
            --payments-primary: #2563eb;
            --payments-primary-dark: #1d4ed8;
            --payments-indigo: #4f46e5;
            --payments-purple: #7c3aed;
            --payments-cyan: #06b6d4;
            --payments-green: #16a34a;
            --payments-orange: #f59e0b;
            --payments-red: #ef4444;

            --payments-text: #0f172a;
            --payments-muted: #64748b;
            --payments-border: rgba(148, 163, 184, 0.18);

            --payments-radius: 20px;

            --payments-shadow:
                0 18px 50px rgba(15, 23, 42, 0.08),
                0 3px 14px rgba(37, 99, 235, 0.04);
        }

        /* =========================
           GLOBAL
        ========================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: 'Poppins', sans-serif;
            color: var(--payments-text);

            background:
                radial-gradient(
                    circle at 7% 8%,
                    rgba(37, 99, 235, 0.09),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 94% 15%,
                    rgba(124, 58, 237, 0.09),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(6, 182, 212, 0.07),
                    transparent 30%
                ),
                #f7f9fc;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background:
                linear-gradient(
                    125deg,
                    rgba(255, 255, 255, 0.3),
                    transparent 40%,
                    rgba(255, 255, 255, 0.2)
                );
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .admin-page .main-content {
            margin-left: 260px;
            padding: 30px 32px 70px;

            min-height: 100vh;

            transition:
                margin-left 0.3s ease,
                padding 0.3s ease;
        }

        /* =========================
           HEADER
        ========================= */

        .page-header {
            position: relative;

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;

            gap: 20px;

            margin-bottom: 24px;
            padding: 26px 28px;

            overflow: hidden;

            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.97),
                    rgba(248, 250, 252, 0.88)
                );

            box-shadow:
                0 18px 50px rgba(15, 23, 42, 0.07),
                0 3px 14px rgba(37, 99, 235, 0.04);
        }

        .page-header::before {
            content: "";

            position: absolute;
            width: 190px;
            height: 190px;

            top: -105px;
            right: 5%;

            border-radius: 50%;

            background:
                rgba(37, 99, 235, 0.08);

            filter: blur(3px);
        }

        .page-header::after {
            content: "";

            position: absolute;
            width: 130px;
            height: 130px;

            right: 31%;
            bottom: -80px;

            border-radius: 50%;

            background:
                rgba(124, 58, 237, 0.08);
        }

        .page-header > div {
            position: relative;
            z-index: 2;
        }

        .page-header h1 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            gap: 10px;

            margin: 0;

            font-size: clamp(20px, 2vw, 28px);
            line-height: 1.3;

            font-weight: 800;
            letter-spacing: -0.5px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #2563eb 55%,
                    #7c3aed
                );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header h1 i {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 45px;
            height: 45px;
            flex: 0 0 45px;

            border-radius: 14px;

            color: #fff !important;
            font-size: 18px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5,
                    #7c3aed
                );

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.26),
                inset 0 1px 1px rgba(255,255,255,0.4);

            -webkit-text-fill-color: #fff;
        }

        .page-header h1 small {
            display: inline-flex;
            align-items: center;

            padding: 6px 12px;

            border-radius: 999px;

            color: #2563eb;

            background:
                rgba(37, 99, 235, 0.09);

            font-size: 12px;
            font-weight: 600;

            -webkit-text-fill-color: #2563eb;
        }

        /* =========================
           PAYMENT STATS
        ========================= */

        .stats-mini {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 22px;
        }

        .stat-mini {
            position: relative;

            min-width: 0;

            padding: 20px 18px;

            overflow: hidden;

            border-radius: 19px;

            border: 1px solid rgba(255,255,255,0.9);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.96),
                    rgba(248,250,252,0.9)
                );

            box-shadow: var(--payments-shadow);

            text-align: left;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .stat-mini::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #4f46e5,
                    #7c3aed
                );
        }

        .stat-mini::after {
            content: "";

            position: absolute;

            width: 90px;
            height: 90px;

            right: -38px;
            bottom: -42px;

            border-radius: 50%;

            background:
                rgba(37, 99, 235, 0.055);
        }

        .stat-mini:hover {
            transform: translateY(-4px);

            border-color:
                rgba(37,99,235,0.16);

            box-shadow:
                0 20px 45px rgba(15,23,42,0.10),
                0 8px 22px rgba(37,99,235,0.06);
        }

        .stat-mini:nth-child(2)::before {
            background:
                linear-gradient(
                    90deg,
                    #10b981,
                    #16a34a,
                    #22c55e
                );
        }

        .stat-mini:nth-child(3)::before {
            background:
                linear-gradient(
                    90deg,
                    #ef4444,
                    #f43f5e,
                    #e11d48
                );
        }

        .stat-mini:nth-child(4)::before {
            background:
                linear-gradient(
                    90deg,
                    #f59e0b,
                    #f97316,
                    #ef4444
                );
        }

        .stat-mini .number {
            position: relative;
            z-index: 2;

            margin-bottom: 5px;

            font-size: clamp(20px, 2vw, 27px);
            line-height: 1.2;

            font-weight: 800;

            color: #0f172a;

            word-break: break-word;
        }

        .stat-mini:nth-child(2) .number {
            color: #16a34a;
        }

        .stat-mini:nth-child(3) .number {
            color: #dc2626;
        }

        .stat-mini:nth-child(4) .number {
            color: #ea580c;
        }

        .stat-mini .label {
            position: relative;
            z-index: 2;

            color: #64748b;

            font-size: 10px;
            line-height: 1.4;

            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.055em;
        }

        /* =========================
           TABLE CONTAINER
        ========================= */

        .payments-table-wrapper {
            width: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            border-radius: 22px;

            border:
                1px solid rgba(255,255,255,0.95);

            background:
                rgba(255,255,255,0.94);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 20px 55px rgba(15,23,42,0.08),
                0 3px 14px rgba(37,99,235,0.035);

            scrollbar-width: thin;
            scrollbar-color:
                #cbd5e1
                transparent;
        }

        .payments-table-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .payments-table-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .payments-table-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
        }

        .payments-table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* =========================
           TABLE
        ========================= */

        .payments-table {
            width: 100%;

            min-width: 720px;

            border-collapse: separate;
            border-spacing: 0;

            font-size: 13px;
        }

        .payments-table thead th {
            position: sticky;
            top: 0;
            z-index: 3;

            padding: 16px 18px;

            text-align: left;
            white-space: nowrap;

            color: #475569;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #f1f5f9
                );

            border-bottom:
                1px solid #e2e8f0;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .payments-table thead th:first-child {
            border-top-left-radius: 20px;
        }

        .payments-table thead th:last-child {
            border-top-right-radius: 20px;
        }

        .payments-table tbody tr {
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .payments-table tbody tr:hover {
            background:
                linear-gradient(
                    90deg,
                    rgba(37,99,235,0.045),
                    rgba(124,58,237,0.025),
                    transparent
                );
        }

        .payments-table td {
            padding: 16px 18px;

            color: #334155;

            border-bottom:
                1px solid #f1f5f9;

            vertical-align: middle;

            white-space: nowrap;
        }

        .payments-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           TRANSACTION ID
        ========================= */

        .payments-table td:first-child span {
            display: inline-flex;
            align-items: center;

            max-width: 180px;

            overflow: hidden;
            text-overflow: ellipsis;

            padding: 6px 9px;

            border-radius: 8px;

            color: #475569;

            background:
                #f8fafc;

            border:
                1px solid #e2e8f0;

            font-family: monospace !important;
            font-size: 11px !important;
        }

        /* =========================
           ORDER ID
        ========================= */

        .payments-table td:nth-child(2) strong {
            display: inline-flex;
            align-items: center;

            padding: 6px 9px;

            border-radius: 9px;

            color: #2563eb;

            background:
                rgba(37,99,235,0.08);

            font-size: 12px;
            font-weight: 700;
        }

        /* =========================
           AMOUNT
        ========================= */

        .payments-table td:nth-child(3) strong {
            color: #0f172a;

            font-size: 13px;
            font-weight: 750;
        }

        /* =========================
           PAYMENT METHOD
        ========================= */

        .payments-table td:nth-child(4) {
            font-weight: 600;
            color: #475569;
        }

        /* =========================
           PAYMENT STATUS
        ========================= */

        .payment-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 78px;

            padding: 6px 11px;

            border-radius: 999px;

            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.045em;

            border: 1px solid transparent;

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.45);
        }

        .payment-status.simulated {
            color: #166534;

            background:
                #dcfce7;

            border-color:
                #bbf7d0;
        }

        .payment-status.pending {
            color: #92400e;

            background:
                #fff7d6;

            border-color:
                #fde68a;
        }

        .payment-status.failed {
            color: #991b1b;

            background:
                #fee2e2;

            border-color:
                #fecaca;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            min-height: 310px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            padding: 55px 25px;

            text-align: center;

            color: #64748b;

            background:
                radial-gradient(
                    circle at center,
                    rgba(37,99,235,0.035),
                    transparent 65%
                );
        }

        .empty-state i {
            display: flex !important;

            align-items: center;
            justify-content: center;

            width: 82px;
            height: 82px;

            margin-bottom: 18px !important;

            border-radius: 50%;

            color: #94a3b8 !important;

            background:
                #f1f5f9;

            font-size: 30px !important;

            box-shadow:
                inset 0 0 0 8px
                rgba(255,255,255,0.75);
        }

        .empty-state p {
            margin: 0;

            color: #64748b;

            font-size: 14px;
            font-weight: 500;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1200px) {

            .admin-page .main-content {
                padding: 24px;
            }

            .stats-mini {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .payments-table {
                min-width: 700px;
            }
        }

        /* =========================
           SIDEBAR / 1024
        ========================= */

        @media (max-width: 1024px) {

            .admin-page .main-content {
                margin-left: 0;

                padding:
                    82px 22px
                    60px;
            }

            .page-header {
                padding: 22px;
                border-radius: 20px;
            }
        }

        /* =========================
           SMALL TABLET
        ========================= */

        @media (max-width: 820px) {

            .admin-page .main-content {
                padding:
                    76px 18px
                    50px;
            }

            .stats-mini {
                gap: 12px;
            }

            .stat-mini {
                padding: 17px 15px;
            }

            .payments-table thead th,
            .payments-table td {
                padding-left: 14px;
                padding-right: 14px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                background:
                    radial-gradient(
                        circle at 10% 5%,
                        rgba(37,99,235,0.08),
                        transparent 35%
                    ),
                    #f7f9fc;
            }

            .admin-page .main-content {
                width: 100%;

                padding:
                    70px 12px
                    40px;
            }

            .page-header {
                padding: 18px;

                border-radius: 18px;

                margin-bottom: 17px;
            }

            .page-header h1 {
                width: 100%;

                font-size: 20px;

                gap: 8px;
            }

            .page-header h1 i {
                width: 40px;
                height: 40px;

                flex-basis: 40px;

                border-radius: 12px;

                font-size: 16px;
            }

            .page-header h1 small {
                font-size: 10px;
                padding: 5px 9px;
            }

            .stats-mini {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;

                margin-bottom: 17px;
            }

            .stat-mini {
                min-height: 92px;

                padding:
                    16px 13px;

                border-radius: 16px;
            }

            .stat-mini .number {
                font-size: 20px;
            }

            .stat-mini .label {
                font-size: 8px;
            }

            .payments-table-wrapper {
                border-radius: 17px;
            }

            .payments-table {
                min-width: 700px;

                font-size: 12px;
            }

            .payments-table thead th {
                padding:
                    13px 12px;

                font-size: 9px;
            }

            .payments-table td {
                padding:
                    13px 12px;
            }

            .payment-status {
                min-width: 74px;

                padding:
                    5px 8px;

                font-size: 9px;
            }
        }

        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 400px) {

            .admin-page .main-content {
                padding:
                    66px 9px
                    34px;
            }

            .page-header {
                padding: 15px;
                border-radius: 16px;
            }

            .page-header h1 {
                font-size: 18px;
            }

            .page-header h1 i {
                width: 36px;
                height: 36px;

                flex-basis: 36px;

                font-size: 14px;
            }

            .stats-mini {
                gap: 8px;
            }

            .stat-mini {
                padding:
                    14px 10px;

                min-height: 84px;
            }

            .stat-mini .number {
                font-size: 18px;
            }

            .stat-mini .label {
                font-size: 7px;
            }

            .payments-table {
                min-width: 680px;
            }
        }

        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 320px) {

            .admin-page .main-content {
                padding-left: 7px;
                padding-right: 7px;
            }

            .page-header {
                padding: 13px;
            }

            .page-header h1 {
                font-size: 17px;
            }

            .stats-mini {
                grid-template-columns:
                    1fr 1fr;

                gap: 7px;
            }

            .stat-mini {
                padding:
                    12px 8px;
            }

            .stat-mini .number {
                font-size: 16px;
            }

            .stat-mini .label {
                font-size: 6.5px;
            }

            .payments-table {
                min-width: 660px;
            }
        }

        /* =========================
           ACCESSIBILITY
        ========================= */

        *:focus-visible {
            outline:
                3px solid
                rgba(37,99,235,0.22);

            outline-offset: 2px;
        }

        /* =========================
           REDUCE MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;

                transition-duration:
                    0.01ms !important;

                animation-duration:
                    0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="admin-page">

        <!-- Sidebar injected -->

        <div class="main-content">

            <!-- =========================
                 PAGE HEADER
            ========================= -->

            <div class="page-header">

                <div>

                    <h1>

                        <i
                            class="fas fa-credit-card"
                            style="color:#2563eb;"
                        ></i>

                        Payments

                        <small id="paymentCount">
                            Loading...
                        </small>

                    </h1>

                </div>

            </div>

            <!-- =========================
                 PAYMENT STATS
            ========================= -->

            <div
                class="stats-mini"
                id="paymentStats"
            >
                <!-- Injected by JS -->
            </div>

            <!-- =========================
                 PAYMENT TABLE
            ========================= -->

            <div class="payments-table-wrapper">

                <div id="paymentsContainer">

                    <!-- Injected by JS -->

                </div>

            </div>

        </div>

    </div>

    <!-- ===== Script ===== -->

    <script type="module">

        import { createSidebar } from '../../components/sidebar.js';
        import { createFooter } from '../../components/footer.js';
        import { isLoggedIn, getCurrentUser } from '../../js/auth.js';
        import { getAllPayments, getPaymentStats } from '../../js/payment.js';
        import { showToast } from '../../js/main.js';
        import { formatDate } from '../../js/utils/formatters.js';

        // ---- Check Admin ----

        const user = getCurrentUser();

        const isLoggedInUser = isLoggedIn();

        if (!isLoggedInUser || user?.role !== 'admin') {

            showToast(
                'Access denied. Admin only.',
                'error'
            );

            setTimeout(
                () =>
                    window.location.href =
                        '../common/login.html',
                1500
            );
        }

        // ---- Render Sidebar ----

        const sidebarContainer =
            document.createElement('div');

        sidebarContainer.id =
            'sidebarContainer';

        document.body.prepend(
            sidebarContainer
        );

        let sidebarOpen =
            window.innerWidth > 1024;

        function toggleSidebar() {

            sidebarOpen =
                !sidebarOpen;

            const sidebar =
                document.querySelector(
                    '.admin-sidebar'
                );

            const overlay =
                document.querySelector(
                    '.sidebar-overlay'
                );

            if (sidebar)
                sidebar.classList.toggle(
                    'open',
                    sidebarOpen
                );

            if (overlay)
                overlay.style.display =
                    sidebarOpen &&
                    window.innerWidth <= 1024
                        ? 'block'
                        : 'none';
        }

        sidebarContainer.innerHTML =
            createSidebar({

                brandText:
                    'SmartCafeteria',

                brandIcon:
                    'fa-utensils',

                userRole:
                    'admin',

                userName:
                    user?.name || 'Admin',

                isOpen:
                    sidebarOpen,

                onToggle:
                    toggleSidebar,

                navItems: [

                    {
                        label: 'Dashboard',
                        icon: 'fa-chart-pie',
                        href: 'dashboard.html'
                    },

                    {
                        label: 'Users',
                        icon: 'fa-users',
                        href: 'users.html'
                    },

                    {
                        label: 'Menu',
                        icon: 'fa-utensils',
                        href: 'menu.html'
                    },

                    {
                        label: 'Categories',
                        icon: 'fa-tags',
                        href: 'categories.html'
                    },

                    {
                        label: 'Orders',
                        icon: 'fa-shopping-bag',
                        href: 'orders.html'
                    },

                    {
                        label: 'Payments',
                        icon: 'fa-credit-card',
                        href: 'payments.html',
                        active: true
                    },

                    {
                        label: 'Feedback',
                        icon: 'fa-star',
                        href: 'feedback.html'
                    },

                    {
                        label: 'Cancellations',
                        icon: 'fa-times-circle',
                        href: 'cancellations.html'
                    },

                    {
                        label: 'Reports',
                        icon: 'fa-file-alt',
                        href: 'reports.html'
                    },

                    {
                        label: 'Settings',
                        icon: 'fa-cog',
                        href: 'settings.html'
                    },

                ],

            });

        // ---- Footer ----

        document.body.insertAdjacentHTML(
            'beforeend',

            createFooter({

                quickLinks: [

                    {
                        label: 'Home',
                        href: '../../index.html'
                    },

                    {
                        label: 'Menu',
                        href: '../customer/menu.html'
                    },

                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },

                    {
                        label: 'Register',
                        href: '../common/register.html'
                    },

                ],

                roleLinks: [

                    {
                        label: 'Customer',
                        href: '../customer/menu.html'
                    },

                    {
                        label: 'Kitchen',
                        href: '../kitchen/dashboard.html'
                    },

                    {
                        label: 'Admin',
                        href: 'dashboard.html'
                    },

                ],

            })
        );

        // ---- DOM ----

        const container =
            document.getElementById(
                'paymentsContainer'
            );

        const statsContainer =
            document.getElementById(
                'paymentStats'
            );

        const paymentCount =
            document.getElementById(
                'paymentCount'
            );

        // ---- Render ----

        function renderPayments() {

            const payments =
                getAllPayments();

            const stats =
                getPaymentStats();

            // Stats

            statsContainer.innerHTML = `

                <div class="stat-mini">

                    <div class="number">
                        ${stats.total}
                    </div>

                    <div class="label">
                        Total Payments
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.simulated}
                    </div>

                    <div class="label">
                        Successful
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.failed}
                    </div>

                    <div class="label">
                        Failed
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.totalAmount || 0} ብር
                    </div>

                    <div class="label">
                        Total Amount
                    </div>

                </div>

            `;

            paymentCount.textContent =
                `${payments.length} payment${
                    payments.length !== 1
                        ? 's'
                        : ''
                }`;

            if (payments.length === 0) {

                container.innerHTML = `

                    <div class="empty-state">

                        <i
                            class="fas fa-credit-card"
                            style="
                                font-size:40px;
                                color:var(--gray-300);
                                display:block;
                                margin-bottom:8px;
                            "
                        ></i>

                        <p>
                            No payment records found.
                        </p>

                    </div>

                `;

                return;
            }

            const methodLabels = {

                cbe_birr:
                    'CBE Birr',

                telebirr:
                    'TeleBirr',

            };

            container.innerHTML = `

                <table class="payments-table">

                    <thead>

                        <tr>

                            <th>
                                Transaction ID
                            </th>

                            <th>
                                Order
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Method
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Date
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        ${payments.map(p => `

                            <tr>

                                <td>

                                    <span
                                        style="
                                            font-family:monospace;
                                            font-size:12px;
                                        "
                                    >
                                        ${p.transactionId || '—'}
                                    </span>

                                </td>

                                <td>

                                    <strong>
                                        #${p.orderId}
                                    </strong>

                                </td>

                                <td>

                                    <strong>
                                        ${p.amount} ብር
                                    </strong>

                                </td>

                                <td>

                                    ${
                                        methodLabels[p.method] ||
                                        p.method
                                    }

                                </td>

                                <td>

                                    <span
                                        class="payment-status ${p.status}"
                                    >
                                        ${p.status}
                                    </span>

                                </td>

                                <td
                                    style="
                                        font-size:12px;
                                        color:var(--gray-400);
                                    "
                                >

                                    ${formatDate(
                                        p.createdAt
                                    )}

                                </td>

                            </tr>

                        `).join('')}

                    </tbody>

                </table>

            `;
        }

        // ---- Init ----

        renderPayments();

        // ---- Resize handler ----

        window.addEventListener(
            'resize',
            () => {

                if (window.innerWidth > 1024) {

                    sidebarOpen = true;

                    const sidebar =
                        document.querySelector(
                            '.admin-sidebar'
                        );

                    const overlay =
                        document.querySelector(
                            '.sidebar-overlay'
                        );

                    if (sidebar)
                        sidebar.classList.add(
                            'open'
                        );

                    if (overlay)
                        overlay.style.display =
                            'none';

                } else {

                    const overlay =
                        document.querySelector(
                            '.sidebar-overlay'
                        );

                    if (overlay)
                        overlay.style.display =
                            sidebarOpen
                                ? 'block'
                                : 'none';
                }

            }
        );

        console.log(
            '💳 Admin Payments page loaded successfully!'
        );

    </script>

</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manage Menu | Smart Cafeteria</title>

    <!-- =========================================================
         GOOGLE FONTS
         ========================================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- =========================================================
         FONT AWESOME
         ========================================================= -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- =========================================================
         EXISTING CSS — PATHS PRESERVED
         ========================================================= -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           PREMIUM LUXURY MENU PAGE
           ========================================================= */

        :root {
            --blue: #2563eb;
            --indigo: #4f46e5;
            --purple: #7c3aed;
            --violet: #8b5cf6;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --green: #10b981;
            --orange: #f97316;
            --yellow: #f59e0b;

            --dark: #111827;
            --dark-2: #1e293b;
            --muted: #64748b;

            --white: #ffffff;

            --glass-white: rgba(255,255,255,.86);

            --shadow:
                0 18px 45px rgba(15,23,42,.09);

            --shadow-hover:
                0 28px 65px rgba(37,99,235,.18);
        }

        /* =========================================================
           RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family: "Poppins", sans-serif;

            color: var(--dark);

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 5% 5%,
                    rgba(37,99,235,.14),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 95% 8%,
                    rgba(236,72,153,.13),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(124,58,237,.11),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(6,182,212,.10),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #ffffff 40%,
                    #faf8ff 70%,
                    #f8fbff 100%
                );
        }

        /* =========================================================
           PAGE BACKGROUND DECORATIONS
           ========================================================= */

        .admin-page {
            position: relative;

            min-height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 30% 20%,
                    rgba(59,130,246,.045),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 75% 55%,
                    rgba(236,72,153,.045),
                    transparent 30%
                );
        }

        .admin-page::before {
            content: "";

            position: fixed;

            width: 380px;
            height: 380px;

            top: 70px;
            right: -160px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,.13),
                    rgba(124,58,237,.08),
                    rgba(236,72,153,.08)
                );

            filter: blur(35px);

            pointer-events: none;

            z-index: 0;
        }

        .admin-page::after {
            content: "";

            position: fixed;

            width: 330px;
            height: 330px;

            left: 120px;
            bottom: -140px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(6,182,212,.10),
                    rgba(16,185,129,.07),
                    rgba(124,58,237,.07)
                );

            filter: blur(40px);

            pointer-events: none;

            z-index: 0;
        }

        /* =========================================================
           MAIN CONTENT
           ========================================================= */

        .admin-page .main-content {
            position: relative;

            z-index: 1;

            width: calc(100% - 260px);

            margin-left: 260px;

            padding:
                28px 30px 65px;

            transition:
                width .3s ease,
                margin-left .3s ease,
                padding .3s ease;
        }

        /* =========================================================
           PAGE HEADER
           ========================================================= */

        .page-header {
            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 18px;

            margin-bottom: 26px;

            padding:
                23px 26px;

            min-height: 94px;

            border:
                1px solid rgba(148,163,184,.16);

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.94),
                    rgba(248,250,255,.88)
                );

            box-shadow:
                0 20px 50px rgba(15,23,42,.08),
                inset 0 1px 0 rgba(255,255,255,.95);

            backdrop-filter: blur(18px);
        }

        .page-header::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 7px;
            height: 100%;

            background:
                linear-gradient(
                    180deg,
                    var(--blue),
                    var(--purple),
                    var(--pink)
                );
        }

        .page-header::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            right: -95px;
            top: -115px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,.15),
                    rgba(236,72,153,.07)
                );
        }

        .page-header > div {
            position: relative;
            z-index: 2;
        }

        .page-header h1 {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 9px;

            margin: 0;

            font-size: clamp(20px, 2vw, 27px);

            line-height: 1.25;

            font-weight: 800;

            letter-spacing: -.6px;

            background:
                linear-gradient(
                    90deg,
                    #172554,
                    #2563eb,
                    #7c3aed,
                    #ec4899
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .page-header h1 i {
            font-size: 24px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #ec4899
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header h1 small {
            display: inline-flex;

            align-items: center;

            padding:
                5px 10px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: .04em;

            color: #4f46e5;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f5f3ff
                );

            border:
                1px solid #ddd6fe;

            -webkit-text-fill-color: initial;
        }

        /* =========================================================
           ADD BUTTON
           ========================================================= */

        .btn-add {
            position: relative;

            z-index: 3;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            min-height: 46px;

            padding:
                11px 20px;

            border: 0;

            border-radius: 14px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #4f46e5,
                    #7c3aed
                );

            box-shadow:
                0 11px 25px rgba(79,70,229,.28);

            font-family: "Poppins", sans-serif;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: .15px;

            cursor: pointer;

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }

        .btn-add::before {
            content: "";

            position: absolute;

            inset: 1px;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.15),
                    transparent
                );

            pointer-events: none;
        }

        .btn-add:hover {
            transform: translateY(-3px);

            box-shadow:
                0 17px 35px rgba(79,70,229,.38);
        }

        .btn-add:active {
            transform: translateY(-1px);
        }

        .btn-add i {
            position: relative;
            z-index: 2;

            font-size: 13px;
        }

        /* =========================================================
           MENU CONTAINER
           ========================================================= */

        #menuContainer {
            width: 100%;
        }

        /* =========================================================
           MENU GRID
           ========================================================= */

        .menu-grid-admin {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        min(100%, 245px),
                        1fr
                    )
                );

            gap: 22px;

            width: 100%;
        }

        /* =========================================================
           MENU CARD
           ========================================================= */

        .menu-item-admin {
            position: relative;

            overflow: hidden;

            min-width: 0;

            border:
                1px solid rgba(148,163,184,.15);

            border-radius: 22px;

            background:
                rgba(255,255,255,.88);

            box-shadow:
                var(--shadow);

            backdrop-filter: blur(15px);

            transition:
                transform .35s ease,
                box-shadow .35s ease,
                border-color .35s ease;
        }

        .menu-item-admin::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed,
                    #ec4899
                );

            opacity: .9;

            z-index: 4;
        }

        .menu-item-admin::after {
            content: "";

            position: absolute;

            width: 110px;
            height: 110px;

            top: -55px;
            right: -55px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,.13),
                    rgba(236,72,153,.08)
                );

            pointer-events: none;
        }

        .menu-item-admin:hover {
            transform: translateY(-8px);

            border-color:
                rgba(99,102,241,.22);

            box-shadow:
                var(--shadow-hover);
        }

        /* =========================================================
           ITEM IMAGE / ICON
           ========================================================= */

        .menu-item-admin .item-image {
            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            height: 170px;

            overflow: hidden;

            font-size: 55px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,.85),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #ede9fe 50%,
                    #fce7f3
                );
        }

        .menu-item-admin .item-image::before {
            content: "";

            position: absolute;

            width: 115px;
            height: 115px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,.12),
                    rgba(236,72,153,.12)
                );

            filter: blur(3px);
        }

        .menu-item-admin .item-image::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    transparent 30%,
                    rgba(255,255,255,.30),
                    transparent 65%
                );

            transform:
                translateX(-100%);

            transition:
                transform .7s ease;
        }

        .menu-item-admin:hover .item-image::after {
            transform:
                translateX(100%);
        }

        .menu-item-admin .item-image {
            text-shadow:
                0 9px 18px rgba(15,23,42,.16);
        }

        /* =========================================================
           ITEM BODY
           ========================================================= */

        .menu-item-admin .item-body {
            position: relative;

            z-index: 3;

            padding:
                17px 18px 18px;
        }

        /* =========================================================
           CATEGORY
           ========================================================= */

        .menu-item-admin .item-category {
            display: inline-flex;

            align-items: center;

            max-width: 100%;

            margin-bottom: 7px;

            padding:
                5px 9px;

            border-radius: 999px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: #4f46e5;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f5f3ff
                );

            border:
                1px solid #ddd6fe;

            font-size: 9px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .08em;
        }

        /* =========================================================
           ITEM NAME
           ========================================================= */

        .menu-item-admin .item-name {
            min-height: 44px;

            display: flex;

            align-items: flex-start;

            color: #172033;

            font-size: 15px;

            line-height: 1.45;

            font-weight: 800;

            letter-spacing: -.15px;

            word-break: break-word;
        }

        /* =========================================================
           PRICE
           ========================================================= */

        .menu-item-admin .item-price {
            display: inline-flex;

            align-items: center;

            margin-top: 8px;

            color: #2563eb;

            font-size: 19px;

            font-weight: 800;

            letter-spacing: -.4px;
        }

        .menu-item-admin .item-price::before {
            content: "";

            width: 6px;
            height: 6px;

            margin-right: 7px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 0 0 4px rgba(37,99,235,.08);
        }

        /* =========================================================
           AVAILABILITY
           ========================================================= */

        .item-availability {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-top: 9px;

            padding:
                5px 9px;

            border-radius: 999px;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: .03em;
        }

        .item-availability.available {
            color: #047857;

            background:
                linear-gradient(
                    135deg,
                    #ecfdf5,
                    #d1fae5
                );

            border:
                1px solid #a7f3d0;
        }

        .item-availability.unavailable {
            color: #be123c;

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #ffe4e6
                );

            border:
                1px solid #fecdd3;
        }

        /* =========================================================
           ACTIONS
           ========================================================= */

        .menu-item-admin .item-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr auto;

            gap: 7px;

            margin-top: 15px;

            padding-top: 13px;

            border-top:
                1px solid #eef2f7;
        }

        .menu-item-admin .item-actions .btn-sm {
            min-width: 0;

            min-height: 34px;

            padding:
                7px 9px;

            border: 0;

            border-radius: 10px;

            font-family: "Poppins", sans-serif;

            font-size: 9px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;
        }

        .menu-item-admin .item-actions .btn-sm:hover {
            transform: translateY(-2px);
        }

        /* EDIT */

        .btn-sm-edit-item {
            color: #4338ca;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #e0e7ff
                );
        }

        .btn-sm-edit-item:hover {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            box-shadow:
                0 7px 16px rgba(79,70,229,.25);
        }

        /* TOGGLE */

        .btn-sm-toggle {
            color: #b45309;

            background:
                linear-gradient(
                    135deg,
                    #fff7ed,
                    #fef3c7
                );
        }

        .btn-sm-toggle:hover {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #f97316
                );

            box-shadow:
                0 7px 16px rgba(249,115,22,.24);
        }

        /* DELETE */

        .btn-sm-delete-item {
            width: 36px;

            color: #be123c;

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #ffe4e6
                );
        }

        .btn-sm-delete-item:hover {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #e11d48,
                    #ec4899
                );

            box-shadow:
                0 7px 16px rgba(225,29,72,.25);
        }

        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {
            position: relative;

            overflow: hidden;

            text-align: center;

            padding:
                70px 25px;

            border:
                1px solid rgba(148,163,184,.14);

            border-radius: 23px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.92),
                    rgba(248,250,255,.86),
                    rgba(250,245,255,.88)
                );

            box-shadow:
                var(--shadow);

            backdrop-filter: blur(15px);
        }

        .empty-state::before {
            content: "";

            position: absolute;

            width: 190px;
            height: 190px;

            top: -90px;
            left: -90px;

            border-radius: 50%;

            background:
                rgba(37,99,235,.10);
        }

        .empty-state::after {
            content: "";

            position: absolute;

            width: 190px;
            height: 190px;

            right: -90px;
            bottom: -90px;

            border-radius: 50%;

            background:
                rgba(236,72,153,.08);
        }

        .empty-state i {
            position: relative;
            z-index: 2;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 78px;
            height: 78px;

            margin:
                0 auto 17px;

            border-radius: 23px;

            color: #fff;

            font-size: 30px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #ec4899
                );

            box-shadow:
                0 15px 30px rgba(79,70,229,.25);
        }

        .empty-state h3 {
            position: relative;
            z-index: 2;

            margin:
                0 0 7px;

            color: #172033;

            font-size: 18px;

            font-weight: 800;
        }

        .empty-state p {
            position: relative;
            z-index: 2;

            margin: 0;

            color: #64748b;

            font-size: 12px;

            font-weight: 500;
        }

        /* =========================================================
           LARGE DESKTOP
           ========================================================= */

        @media (min-width: 1600px) {

            .admin-page .main-content {
                padding:
                    34px 42px 75px;
            }

            .menu-grid-admin {
                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(270px, 1fr)
                    );

                gap: 25px;
            }

            .menu-item-admin .item-image {
                height: 185px;
            }
        }

        /* =========================================================
           DESKTOP / LAPTOP
           ========================================================= */

        @media (max-width: 1200px) {

            .admin-page .main-content {
                width: calc(100% - 260px);

                padding:
                    24px 22px 55px;
            }

            .menu-grid-admin {
                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(225px, 1fr)
                    );

                gap: 17px;
            }
        }

        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 1024px) {

            .admin-page .main-content {
                width: 100%;

                margin-left: 0;

                padding:
                    20px 18px 50px;
            }

            .page-header {
                border-radius: 21px;

                padding:
                    20px 21px;
            }

            .menu-grid-admin {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

                gap: 16px;
            }

            .menu-item-admin .item-image {
                height: 150px;

                font-size: 47px;
            }
        }

        /* =========================================================
           TABLET SMALL
           ========================================================= */

        @media (max-width: 820px) {

            .menu-grid-admin {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            .admin-page .main-content {
                padding:
                    14px 12px 38px;
            }

            .page-header {
                align-items: stretch;

                flex-direction: column;

                gap: 14px;

                padding:
                    19px 17px;

                margin-bottom: 17px;

                border-radius: 19px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .page-header h1 i {
                font-size: 19px;
            }

            .page-header h1 small {
                font-size: 8px;

                padding:
                    4px 8px;
            }

            .btn-add {
                width: 100%;

                min-height: 44px;
            }

            .menu-grid-admin {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 11px;
            }

            .menu-item-admin {
                border-radius: 17px;
            }

            .menu-item-admin .item-image {
                height: 125px;

                font-size: 40px;
            }

            .menu-item-admin .item-body {
                padding:
                    12px 12px 13px;
            }

            .menu-item-admin .item-category {
                font-size: 7px;

                padding:
                    4px 7px;
            }

            .menu-item-admin .item-name {
                min-height: 40px;

                font-size: 12px;
            }

            .menu-item-admin .item-price {
                font-size: 16px;

                margin-top: 6px;
            }

            .menu-item-admin .item-price::before {
                width: 5px;
                height: 5px;

                margin-right: 6px;
            }

            .item-availability {
                font-size: 7px;

                padding:
                    4px 7px;

                gap: 4px;
            }

            .menu-item-admin .item-actions {
                grid-template-columns:
                    1fr 1fr;

                gap: 5px;

                margin-top: 11px;

                padding-top: 10px;
            }

            .menu-item-admin .item-actions .btn-sm {
                min-height: 31px;

                font-size: 8px;

                padding:
                    6px 5px;
            }

            .btn-sm-delete-item {
                width: auto;

                grid-column:
                    span 2;
            }

            .empty-state {
                padding:
                    55px 18px;
            }
        }

        /* =========================================================
           SMALL MOBILE
           ========================================================= */

        @media (max-width: 400px) {

            .admin-page .main-content {
                padding:
                    10px 8px 30px;
            }

            .menu-grid-admin {
                grid-template-columns:
                    1fr 1fr;

                gap: 8px;
            }

            .menu-item-admin {
                border-radius: 15px;
            }

            .menu-item-admin .item-image {
                height: 110px;

                font-size: 34px;
            }

            .menu-item-admin .item-body {
                padding:
                    10px;
            }

            .menu-item-admin .item-name {
                font-size: 11px;

                min-height: 36px;
            }

            .menu-item-admin .item-price {
                font-size: 14px;
            }

            .menu-item-admin .item-actions .btn-sm {
                font-size: 7px;
            }
        }

        /* =========================================================
           VERY SMALL DEVICES
           ========================================================= */

        @media (max-width: 330px) {

            .menu-grid-admin {
                grid-template-columns: 1fr;
            }

            .menu-item-admin .item-image {
                height: 145px;
            }

            .menu-item-admin .item-name {
                font-size: 13px;
            }

            .menu-item-admin .item-price {
                font-size: 17px;
            }
        }

        /* =========================================================
           TOUCH DEVICES
           ========================================================= */

        @media (hover: none) {

            .menu-item-admin:hover {
                transform: none;

                box-shadow:
                    var(--shadow);
            }

            .btn-add:hover {
                transform: none;
            }

            .menu-item-admin .item-actions .btn-sm:hover {
                transform: none;
            }
        }

        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: .01ms !important;

                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<div class="admin-page">

    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <div class="main-content">

        <!-- =====================================================
             PAGE HEADER
             ===================================================== -->

        <div class="page-header">

            <div>

                <h1>

                    <i class="fas fa-utensils"></i>

                    <span>Manage Menu</span>

                    <small id="menuCount">
                        Loading...
                    </small>

                </h1>

            </div>

            <button
                class="btn-add"
                id="addItemBtn"
                type="button"
            >

                <i class="fas fa-plus"></i>

                <span>Add Item</span>

            </button>

        </div>


        <!-- =====================================================
             MENU CONTAINER
             ===================================================== -->

        <div id="menuContainer">
            <!-- Injected by JS -->
        </div>

    </div>

</div>


<!-- =============================================================
     SCRIPT
     ============================================================= -->

<script type="module">

    /* =========================================================
       EXISTING IMPORTS — PRESERVED
       ========================================================= */

    import {
        createSidebar
    } from '../../components/sidebar.js';

    import {
        createFooter
    } from '../../components/footer.js';

    import {
        isLoggedIn,
        getCurrentUser
    } from '../../js/auth.js';

    import {
        getMenuItems,
        deleteMenuItem,
        toggleAvailability
    } from '../../js/menu.js';

    import {
        showToast
    } from '../../js/main.js';


    /* =========================================================
       CHECK ADMIN
       ========================================================= */

    const user =
        getCurrentUser();

    const isLoggedInUser =
        isLoggedIn();


    if (
        !isLoggedInUser ||
        user?.role !== 'admin'
    ) {

        showToast(
            'Access denied. Admin only.',
            'error'
        );

        setTimeout(
            () => {

                window.location.href =
                    '../common/login.html';

            },
            1500
        );
    }


    /* =========================================================
       SIDEBAR
       ========================================================= */

    const sidebarContainer =
        document.createElement('div');

    sidebarContainer.id =
        'sidebarContainer';

    document.body.prepend(
        sidebarContainer
    );


    let sidebarOpen =
        window.innerWidth > 1024;


    /* =========================================================
       SIDEBAR TOGGLE
       ========================================================= */

    function toggleSidebar() {

        sidebarOpen =
            !sidebarOpen;

        const sidebar =
            document.querySelector(
                '.admin-sidebar'
            );

        const overlay =
            document.querySelector(
                '.sidebar-overlay'
            );


        if (sidebar) {

            sidebar.classList.toggle(
                'open',
                sidebarOpen
            );
        }


        if (overlay) {

            overlay.style.display =
                sidebarOpen &&
                window.innerWidth <= 1024
                    ? 'block'
                    : 'none';
        }
    }


    /* =========================================================
       CREATE SIDEBAR
       ========================================================= */

    sidebarContainer.innerHTML =
        createSidebar({

            brandText:
                'SmartCafeteria',

            brandIcon:
                'fa-utensils',

            userRole:
                'admin',

            userName:
                user?.name ||
                'Admin',

            isOpen:
                sidebarOpen,

            onToggle:
                toggleSidebar,

            navItems: [

                {
                    label:
                        'Dashboard',

                    icon:
                        'fa-chart-pie',

                    href:
                        'dashboard.html'
                },

                {
                    label:
                        'Users',

                    icon:
                        'fa-users',

                    href:
                        'users.html'
                },

                {
                    label:
                        'Menu',

                    icon:
                        'fa-utensils',

                    href:
                        'menu.html',

                    active:
                        true
                },

                {
                    label:
                        'Categories',

                    icon:
                        'fa-tags',

                    href:
                        'categories.html'
                },

                {
                    label:
                        'Orders',

                    icon:
                        'fa-shopping-bag',

                    href:
                        'orders.html'
                },

                {
                    label:
                        'Payments',

                    icon:
                        'fa-credit-card',

                    href:
                        'payments.html'
                },

                {
                    label:
                        'Feedback',

                    icon:
                        'fa-star',

                    href:
                        'feedback.html'
                },

                {
                    label:
                        'Cancellations',

                    icon:
                        'fa-times-circle',

                    href:
                        'cancellations.html'
                },

                {
                    label:
                        'Reports',

                    icon:
                        'fa-file-alt',

                    href:
                        'reports.html'
                },

                {
                    label:
                        'Settings',

                    icon:
                        'fa-cog',

                    href:
                        'settings.html'
                }

            ]

        });


    /* =========================================================
       FOOTER
       ========================================================= */

    document.body.insertAdjacentHTML(

        'beforeend',

        createFooter({

            quickLinks: [

                {
                    label:
                        'Home',

                    href:
                        '../../index.html'
                },

                {
                    label:
                        'Menu',

                    href:
                        '../customer/menu.html'
                },

                {
                    label:
                        'Login',

                    href:
                        '../common/login.html'
                },

                {
                    label:
                        'Register',

                    href:
                        '../common/register.html'
                }

            ],

            roleLinks: [

                {
                    label:
                        'Customer',

                    href:
                        '../customer/menu.html'
                },

                {
                    label:
                        'Kitchen',

                    href:
                        '../kitchen/dashboard.html'
                },

                {
                    label:
                        'Admin',

                    href:
                        'dashboard.html'
                }

            ]

        })

    );


    /* =========================================================
       DOM
       ========================================================= */

    const container =
        document.getElementById(
            'menuContainer'
        );

    const menuCount =
        document.getElementById(
            'menuCount'
        );


    /* =========================================================
       RENDER MENU
       ========================================================= */

    function renderMenu() {

        const items =
            getMenuItems();

        const lang =
            localStorage.getItem(
                'scos_language'
            ) || 'en';


        /* =====================================================
           COUNT
           ===================================================== */

        menuCount.textContent =
            `${items.length} item${
                items.length !== 1
                    ? 's'
                    : ''
            }`;


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        if (
            items.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-state">

                    <i class="fas fa-utensils"></i>

                    <h3>
                        No Menu Items
                    </h3>

                    <p>
                        Add your first menu item now.
                    </p>

                </div>

            `;

            return;
        }


        /* =====================================================
           MENU CARDS
           ===================================================== */

        container.innerHTML = `

            <div class="menu-grid-admin">

                ${items.map(item => {

                    const name =
                        item.name?.[lang] ||
                        item.name?.en ||
                        'Unnamed Item';

                    const category =
                        item.category ||
                        'General';

                    const available =
                        Boolean(
                            item.availability
                        );


                    return `

                        <article
                            class="menu-item-admin"
                        >

                            <!-- =========================
                                 IMAGE / ICON
                                 ========================= -->

                            <div
                                class="item-image"
                                aria-label="${name}"
                            >
                                <span>
                                    ${item.icon || '🍽️'}
                                </span>
                            </div>


                            <!-- =========================
                                 BODY
                                 ========================= -->

                            <div class="item-body">

                                <div
                                    class="item-category"
                                >
                                    ${category}
                                </div>


                                <div
                                    class="item-name"
                                >
                                    ${name}
                                </div>


                                <div
                                    class="item-price"
                                >
                                    ${item.price} ብር
                                </div>


                                <div
                                    class="
                                        item-availability
                                        ${available
                                            ? 'available'
                                            : 'unavailable'}
                                    "
                                >

                                    <i
                                        class="
                                            fas
                                            ${available
                                                ? 'fa-circle-check'
                                                : 'fa-circle-xmark'}
                                        "
                                    ></i>

                                    ${
                                        available
                                            ? 'Available'
                                            : 'Unavailable'
                                    }

                                </div>


                                <!-- =====================
                                     ACTIONS
                                     ===================== -->

                                <div
                                    class="item-actions"
                                >

                                    <button
                                        type="button"
                                        class="
                                            btn-sm
                                            btn-sm-edit-item
                                        "
                                        data-id="${item.id}"
                                    >

                                        <i
                                            class="fas fa-edit"
                                        ></i>

                                        Edit

                                    </button>


                                    <button
                                        type="button"
                                        class="
                                            btn-sm
                                            btn-sm-toggle
                                        "
                                        data-id="${item.id}"
                                    >

                                        <i
                                            class="
                                                fas
                                                ${
                                                    available
                                                        ? 'fa-toggle-off'
                                                        : 'fa-toggle-on'
                                                }
                                            "
                                        ></i>

                                        ${
                                            available
                                                ? 'Disable'
                                                : 'Enable'
                                        }

                                    </button>


                                    <button
                                        type="button"
                                        class="
                                            btn-sm
                                            btn-sm-delete-item
                                        "
                                        data-id="${item.id}"
                                        aria-label="Delete ${name}"
                                        title="Delete item"
                                    >

                                        <i
                                            class="fas fa-trash"
                                        ></i>

                                    </button>

                                </div>

                            </div>

                        </article>

                    `;

                }).join('')}

            </div>

        `;


        /* =====================================================
           EDIT
           ===================================================== */

        document
            .querySelectorAll(
                '.btn-sm-edit-item'
            )
            .forEach(btn => {

                btn.addEventListener(
                    'click',
                    function () {

                        const id =
                            this.dataset.id;

                        showToast(
                            `Edit item ${id} (coming soon)`,
                            'info'
                        );

                    }
                );

            });


        /* =====================================================
           TOGGLE AVAILABILITY
           ===================================================== */

        document
            .querySelectorAll(
                '.btn-sm-toggle'
            )
            .forEach(btn => {

                btn.addEventListener(
                    'click',
                    async function () {

                        const id =
                            this.dataset.id;


                        const result =
                            await toggleAvailability(
                                id
                            );


                        if (
                            result.success
                        ) {

                            showToast(
                                `Item ${
                                    result.item.availability
                                        ? 'enabled'
                                        : 'disabled'
                                }`,
                                'success'
                            );

                            renderMenu();

                        } else {

                            showToast(
                                result.error ||
                                'Failed to toggle',
                                'error'
                            );

                        }

                    }
                );

            });


        /* =====================================================
           DELETE
           ===================================================== */

        document
            .querySelectorAll(
                '.btn-sm-delete-item'
            )
            .forEach(btn => {

                btn.addEventListener(
                    'click',
                    async function () {

                        const id =
                            this.dataset.id;


                        if (
                            !confirm(
                                'Are you sure you want to delete this item?'
                            )
                        ) {

                            return;
                        }


                        const result =
                            await deleteMenuItem(
                                id
                            );


                        if (
                            result.success
                        ) {

                            showToast(
                                'Item deleted',
                                'success'
                            );

                            renderMenu();

                        } else {

                            showToast(
                                result.error ||
                                'Failed to delete',
                                'error'
                            );

                        }

                    }
                );

            });

    }


    /* =========================================================
       ADD ITEM
       ========================================================= */

    document
        .getElementById(
            'addItemBtn'
        )
        .addEventListener(
            'click',
            () => {

                showToast(
                    'Add item form (coming soon)',
                    'info'
                );

            }
        );


    /* =========================================================
       INITIAL RENDER
       ========================================================= */

    renderMenu();


    /* =========================================================
       RESPONSIVE SIDEBAR
       ========================================================= */

    window.addEventListener(
        'resize',
        () => {

            if (
                window.innerWidth > 1024
            ) {

                sidebarOpen =
                    true;


                const sidebar =
                    document.querySelector(
                        '.admin-sidebar'
                    );

                const overlay =
                    document.querySelector(
                        '.sidebar-overlay'
                    );


                if (sidebar) {

                    sidebar.classList.add(
                        'open'
                    );
                }


                if (overlay) {

                    overlay.style.display =
                        'none';
                }

            } else {

                const overlay =
                    document.querySelector(
                        '.sidebar-overlay'
                    );


                if (overlay) {

                    overlay.style.display =
                        sidebarOpen
                            ? 'block'
                            : 'none';
                }

            }

        }
    );


    /* =========================================================
       SUCCESS LOG
       ========================================================= */

    console.log(
        '🍽️ Premium Admin Menu page loaded successfully!'
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/frontend/src/css/admin.css">
</head>
<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main"></main>
    </div>

    <!-- ===== ADD / EDIT MENU ITEM MODAL ===== -->
    <div class="modal-overlay" id="menuItemModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="menuModalTitle">Add New Menu Item</h3>
                <button class="modal-close" data-close-modal="menuItemModal">&times;</button>
            </div>
            <form id="menuItemForm">
                <input type="hidden" name="id" id="itemId">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="itemNameEn" class="form-label">English Name <span class="required">*</span></label>
                            <input type="text" name="name_en" id="itemNameEn" class="form-control" placeholder="e.g. Special Doro Wat" required>
                        </div>
                        <div class="form-group">
                            <label for="itemNameAm" class="form-label">Amharic Name <span class="required">*</span></label>
                            <input type="text" name="name_am" id="itemNameAm" class="form-control" placeholder="e.g. ዶሮ ወጥ" required>
                        </div>
                        <div class="form-group">
                            <label for="itemCategory" class="form-label">Category <span class="required">*</span></label>
                            <select name="category" id="itemCategory" class="form-select" required>
                                <option value="">Select category</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="itemPrice" class="form-label">Price (ETB) <span class="required">*</span></label>
                            <input type="number" name="price" id="itemPrice" class="form-control" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="itemPrepTime" class="form-label">Preparation Time (min)</label>
                            <input type="number" name="preparationTime" id="itemPrepTime" class="form-control" min="1" value="10">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Availability</label>
                            <label class="switch">
                                <input type="checkbox" name="available" id="itemAvailable" checked>
                                <span class="switch-slider"></span>
                            </label>
                            <small id="itemAvailableLabel" class="form-text">Available for ordering</small>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top:1rem;">
                        <label for="itemDescriptionEn" class="form-label">Description (English)</label>
                        <textarea name="description_en" id="itemDescriptionEn" class="form-control" rows="2" placeholder="Brief description in English..."></textarea>
                    </div>
                    <div class="form-group" style="margin-top:0.8rem;">
                        <label for="itemDescriptionAm" class="form-label">Description (Amharic)</label>
                        <textarea name="description_am" id="itemDescriptionAm" class="form-control" rows="2" placeholder="በአማርኛ መግለጫ..."></textarea>
                    </div>

                    <div class="form-row upload-row" style="margin-top:1rem;">
                        <div class="form-group">
                            <label for="itemImageFile" class="form-label">Upload Image (JPG, PNG, WEBP, max 2 MB)</label>
                            <input type="file" name="image" id="itemImageFile" class="form-control" accept="image/jpeg,image/png,image/webp">
                        </div>
                        <div class="form-group">
                            <label for="itemImageUrl" class="form-label">...or Image URL (optional)</label>
                            <input type="url" name="image_url" id="itemImageUrl" class="form-control" placeholder="https://example.com/image.jpg">
                        </div>
                    </div>

                    <div class="file-preview" id="imagePreviewRow" style="display:none;">
                        <img id="itemImagePreview" alt="Preview">
                        <button type="button" class="btn-remove-file" id="removeImageBtn"><i class="fa-solid fa-trash-can"></i> Remove Image</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal="menuItemModal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveMenuItemBtn">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== VIEW MENU ITEM MODAL ===== -->
    <div class="modal-overlay" id="viewItemModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Menu Item Details</h3>
                <button class="modal-close" data-close-modal="viewItemModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-hero">
                    <img id="viewItemImage" class="img-thumb" alt="Item image" src="">
                    <div>
                        <h4 id="viewItemName">—</h4>
                        <div id="viewItemCategory" class="form-text">—</div>
                    </div>
                </div>
                <div class="detail-grid">
                    <div class="detail-item"><span>Item ID</span><strong id="viewItemId">—</strong></div>
                    <div class="detail-item"><span>Price</span><strong id="viewItemPrice">—</strong></div>
                    <div class="detail-item"><span>Availability</span><strong id="viewItemAvailability">—</strong></div>
                    <div class="detail-item"><span>Prep Time</span><strong id="viewItemPrepTime">—</strong></div>
                    <div class="detail-item"><span>Description (EN)</span><strong id="viewItemDescEn">—</strong></div>
                    <div class="detail-item"><span>Description (AM)</span><strong id="viewItemDescAm">—</strong></div>
                    <div class="detail-item"><span>Created</span><strong id="viewItemCreated">—</strong></div>
                    <div class="detail-item"><span>Last Updated</span><strong id="viewItemUpdated">—</strong></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal="viewItemModal">Close</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../../js/admin-api.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/admin-ui.js"></script>
    <script src="../../js/admin-menu.js"></script>

    <script>
        // Page-specific initialization
        function initPageSpecific() {
            // admin-menu.js handles initialization via its own DOMContentLoaded
        }
    </script>
</body>
</html>

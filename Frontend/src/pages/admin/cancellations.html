

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancellations | Smart Cafeteria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           CANCELLATIONS PAGE — MODERN LUXURY UI
           ========================================================= */

        :root {
            --cancel-red: #ef4444;
            --cancel-red-dark: #dc2626;
            --cancel-orange: #f97316;
            --cancel-blue: #3b82f6;
            --cancel-purple: #8b5cf6;
            --cancel-green: #22c55e;
            --cancel-yellow: #f59e0b;

            --luxury-border: rgba(148, 163, 184, 0.18);
            --luxury-shadow: 0 15px 45px rgba(15, 23, 42, 0.08);
            --luxury-shadow-hover: 0 22px 55px rgba(15, 23, 42, 0.13);
        }

        /* =========================
           PAGE BACKGROUND
           ========================= */

        body {
            background:
                radial-gradient(
                    circle at 8% 10%,
                    rgba(239, 68, 68, 0.07),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 92% 15%,
                    rgba(139, 92, 246, 0.07),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 70% 90%,
                    rgba(59, 130, 246, 0.06),
                    transparent 30%
                ),
                #f8fafc;
            min-height: 100vh;
        }

        .admin-page {
            min-height: 100vh;
        }

        /* =========================
           MAIN CONTENT
           ========================= */

        .admin-page .main-content {
            margin-left: 260px;
            padding: 30px 30px 60px;
            min-height: 100vh;
            transition:
                margin-left 0.25s ease,
                padding 0.25s ease;
        }

        @media (max-width: 1200px) {
            .admin-page .main-content {
                padding: 26px 22px 50px;
            }
        }

        @media (max-width: 1024px) {
            .admin-page .main-content {
                margin-left: 0;
                padding: 22px 18px 45px;
            }
        }

        @media (max-width: 600px) {
            .admin-page .main-content {
                padding: 18px 13px 35px;
            }
        }

        /* =========================
           HEADER
           ========================= */

        .page-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;

            margin-bottom: 26px;
            padding: 24px 26px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(255, 255, 255, 0.90)
                );

            border: 1px solid var(--luxury-border);
            border-radius: 22px;

            box-shadow: var(--luxury-shadow);
            overflow: hidden;
        }

        .page-header::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            top: -110px;
            right: -50px;

            background: rgba(239, 68, 68, 0.10);
            border-radius: 50%;
            filter: blur(3px);
        }

        .page-header::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            bottom: -90px;
            left: 25%;

            background: rgba(139, 92, 246, 0.08);
            border-radius: 50%;
        }

        .page-header > div {
            position: relative;
            z-index: 1;
        }

        .page-header h1 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;

            margin: 0;
            font-size: clamp(22px, 2.5vw, 30px);
            line-height: 1.25;
            font-weight: 800;

            letter-spacing: -0.5px;

            background: linear-gradient(
                135deg,
                #111827,
                #374151,
                #7c2d12
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .page-header h1 i {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 48px;
            height: 48px;

            border-radius: 15px;

            color: #fff !important;

            background: linear-gradient(
                135deg,
                #ef4444,
                #dc2626,
                #f97316
            );

            box-shadow:
                0 10px 25px rgba(239, 68, 68, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);

            -webkit-background-clip: initial;
            background-clip: initial;
        }

        .page-header h1 small {
            display: inline-flex;
            align-items: center;

            min-height: 30px;
            padding: 5px 11px;

            border-radius: 999px;

            font-size: 12px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: 0.02em;

            color: #b45309;

            background: linear-gradient(
                135deg,
                #fff7ed,
                #fffbeb
            );

            border: 1px solid rgba(245, 158, 11, 0.18);
        }

        /* =========================
           STATS
           ========================= */

        .stats-mini {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-mini {
            position: relative;
            min-width: 0;
            overflow: hidden;

            padding: 21px 20px;

            text-align: left;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(248, 250, 252, 0.94)
                );

            border: 1px solid var(--luxury-border);
            border-radius: 19px;

            box-shadow: var(--luxury-shadow);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .stat-mini::before {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            right: -30px;
            top: -35px;

            border-radius: 50%;
            background: rgba(239, 68, 68, 0.08);
        }

        .stat-mini:nth-child(2)::before {
            background: rgba(245, 158, 11, 0.10);
        }

        .stat-mini:nth-child(3)::before {
            background: rgba(34, 197, 94, 0.10);
        }

        .stat-mini:nth-child(4)::before {
            background: rgba(59, 130, 246, 0.10);
        }

        .stat-mini:hover {
            transform: translateY(-4px);
            box-shadow: var(--luxury-shadow-hover);
            border-color: rgba(239, 68, 68, 0.18);
        }

        .stat-mini .number {
            position: relative;
            z-index: 1;

            font-size: clamp(24px, 3vw, 31px);
            line-height: 1.1;
            font-weight: 800;

            color: #111827;
        }

        .stat-mini .label {
            position: relative;
            z-index: 1;

            margin-top: 7px;

            font-size: 11px;
            font-weight: 700;
            color: #64748b;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* =========================
           CANCELLATION LIST
           ========================= */

        .cancellations-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cancel-item {
            position: relative;
            overflow: hidden;

            padding: 21px 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(255, 255, 255, 0.93)
                );

            border: 1px solid var(--luxury-border);
            border-radius: 20px;

            box-shadow: var(--luxury-shadow);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .cancel-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;

            background: linear-gradient(
                180deg,
                #ef4444,
                #f97316,
                #f59e0b
            );

            border-radius: 20px 0 0 20px;
        }

        .cancel-item::after {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            right: -70px;
            bottom: -80px;

            background: rgba(239, 68, 68, 0.045);
            border-radius: 50%;
        }

        .cancel-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--luxury-shadow-hover);
            border-color: rgba(239, 68, 68, 0.16);
        }

        .cancel-item .ci-header {
            position: relative;
            z-index: 1;

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;

            gap: 12px;
            padding-left: 5px;
        }

        .cancel-item .ci-header > div {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
        }

        .cancel-item .ci-header .ci-order {
            font-size: 15px;
            font-weight: 800;
            color: #111827;
        }

        .cancel-item .ci-header .ci-order::before {
            content: "\f291";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 32px;
            height: 32px;
            margin-right: 7px;

            border-radius: 10px;

            color: #fff;

            background: linear-gradient(
                135deg,
                #ef4444,
                #f97316
            );

            box-shadow: 0 6px 15px rgba(239, 68, 68, 0.20);
        }

        .cancel-item .ci-header .ci-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 27px;
            padding: 5px 11px;

            border-radius: 999px;

            font-size: 10px;
            line-height: 1;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.05em;

            border: 1px solid transparent;
        }

        .ci-status.pending {
            background: linear-gradient(
                135deg,
                #fffbeb,
                #fef3c7
            );
            color: #b45309;
            border-color: rgba(245, 158, 11, 0.18);
        }

        .ci-status.approved {
            background: linear-gradient(
                135deg,
                #f0fdf4,
                #dcfce7
            );
            color: #15803d;
            border-color: rgba(34, 197, 94, 0.18);
        }

        .ci-status.rejected {
            background: linear-gradient(
                135deg,
                #fff1f2,
                #fee2e2
            );
            color: #b91c1c;
            border-color: rgba(239, 68, 68, 0.18);
        }

        .cancel-item .ci-body {
            position: relative;
            z-index: 1;

            margin: 15px 0 15px;
            padding: 14px 16px;

            font-size: 13px;
            line-height: 1.75;

            color: #475569;

            background: linear-gradient(
                135deg,
                #f8fafc,
                #ffffff
            );

            border: 1px solid rgba(148, 163, 184, 0.13);
            border-radius: 13px;
        }

        .cancel-item .ci-body strong {
            color: #1e293b;
            font-weight: 700;
        }

        .cancel-item .ci-actions {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
        }

        .cancel-item .ci-actions .btn-sm {
            min-height: 38px;
            padding: 8px 16px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            border: 0;
            border-radius: 10px;

            font-family: "Poppins", sans-serif;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .cancel-item .ci-actions .btn-sm:hover {
            transform: translateY(-2px);
        }

        .cancel-item .ci-actions .btn-sm:active {
            transform: translateY(0);
        }

        .btn-sm-approve-cancel {
            color: #fff;
            background: linear-gradient(
                135deg,
                #22c55e,
                #16a34a
            );

            box-shadow:
                0 7px 18px rgba(34, 197, 94, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-sm-approve-cancel:hover {
            filter: brightness(1.04);
            box-shadow:
                0 10px 23px rgba(34, 197, 94, 0.28);
        }

        .btn-sm-reject-cancel {
            color: #fff;
            background: linear-gradient(
                135deg,
                #ef4444,
                #dc2626
            );

            box-shadow:
                0 7px 18px rgba(239, 68, 68, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-sm-reject-cancel:hover {
            filter: brightness(1.04);
            box-shadow:
                0 10px 23px rgba(239, 68, 68, 0.28);
        }

        /* =========================
           DATE
           ========================= */

        .cancel-date {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 6px 10px;

            border-radius: 9px;

            font-size: 11px !important;
            color: #64748b !important;

            background: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.13);
        }

        .cancel-date::before {
            content: "\f073";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: #94a3b8;
        }

        /* =========================
           EMPTY STATE
           ========================= */

        .empty-state {
            position: relative;
            overflow: hidden;

            text-align: center;
            padding: 65px 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(248, 250, 252, 0.95)
                );

            border: 1px solid var(--luxury-border);
            border-radius: 22px;

            box-shadow: var(--luxury-shadow);
        }

        .empty-state::before,
        .empty-state::after {
            content: "";
            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;
            filter: blur(3px);
        }

        .empty-state::before {
            top: -100px;
            left: -40px;
            background: rgba(239, 68, 68, 0.08);
        }

        .empty-state::after {
            right: -40px;
            bottom: -100px;
            background: rgba(139, 92, 246, 0.08);
        }

        .empty-state i {
            position: relative;
            z-index: 1;

            display: flex !important;
            align-items: center;
            justify-content: center;

            width: 74px;
            height: 74px;

            margin: 0 auto 15px !important;

            font-size: 27px !important;

            color: #ef4444 !important;

            background: linear-gradient(
                135deg,
                #fff1f2,
                #fee2e2
            );

            border: 1px solid rgba(239, 68, 68, 0.13);
            border-radius: 22px;

            box-shadow: 0 12px 28px rgba(239, 68, 68, 0.10);
        }

        .empty-state p {
            position: relative;
            z-index: 1;

            margin: 0;

            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }

        /* =========================
           RESPONSIVE TABLET
           ========================= */

        @media (max-width: 900px) {
            .stats-mini {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .page-header {
                padding: 21px;
            }
        }

        /* =========================
           RESPONSIVE MOBILE
           ========================= */

        @media (max-width: 600px) {
            .page-header {
                padding: 18px 16px;
                border-radius: 18px;
                margin-bottom: 17px;
            }

            .page-header h1 {
                font-size: 21px;
                gap: 8px;
            }

            .page-header h1 i {
                width: 41px;
                height: 41px;
                border-radius: 12px;
            }

            .page-header h1 small {
                font-size: 10px;
                padding: 5px 8px;
            }

            .stats-mini {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 17px;
            }

            .stat-mini {
                padding: 16px 14px;
                border-radius: 15px;
            }

            .stat-mini .number {
                font-size: 23px;
            }

            .stat-mini .label {
                font-size: 9px;
                letter-spacing: 0.05em;
            }

            .cancellations-list {
                gap: 12px;
            }

            .cancel-item {
                padding: 17px 15px;
                border-radius: 16px;
            }

            .cancel-item .ci-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .cancel-item .ci-header > div {
                width: 100%;
                gap: 7px;
            }

            .cancel-item .ci-header .ci-order {
                font-size: 14px;
            }

            .cancel-item .ci-header .ci-order::before {
                width: 29px;
                height: 29px;
                margin-right: 5px;
                border-radius: 9px;
            }

            .cancel-date {
                align-self: flex-start;
            }

            .cancel-item .ci-body {
                padding: 12px 13px;
                margin: 12px 0;
                font-size: 12px;
                line-height: 1.7;
            }

            .cancel-item .ci-actions {
                width: 100%;
            }

            .cancel-item .ci-actions .btn-sm {
                flex: 1 1 130px;
                min-height: 40px;
            }

            .empty-state {
                padding: 48px 18px;
                border-radius: 18px;
            }
        }

        /* =========================
           SMALL PHONES
           ========================= */

        @media (max-width: 380px) {
            .admin-page .main-content {
                padding-left: 10px;
                padding-right: 10px;
            }

            .stats-mini {
                gap: 8px;
            }

            .stat-mini {
                padding: 14px 10px;
            }

            .stat-mini .number {
                font-size: 21px;
            }

            .stat-mini .label {
                font-size: 8px;
            }

            .page-header h1 {
                font-size: 19px;
            }

            .page-header h1 i {
                width: 38px;
                height: 38px;
            }
        }

        /* =========================
           REDUCED MOTION
           ========================= */

        @media (prefers-reduced-motion: reduce) {
            .stat-mini,
            .cancel-item,
            .cancel-item .ci-actions .btn-sm {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="admin-page">

        <!-- Sidebar injected -->
        <div class="main-content">

            <div class="page-header">
                <div>
                    <h1>
                        <i class="fas fa-times-circle" style="color:#dc2626;"></i>
                        Cancellations
                        <small id="cancelCount">Loading...</small>
                    </h1>
                </div>
            </div>

            <div class="stats-mini" id="cancelStats">
                <!-- Injected by JS -->
            </div>

            <div id="cancellationsContainer">
                <!-- Injected by JS -->
            </div>

        </div>
    </div>

    <!-- ===== Script ===== -->
    <script type="module">

        import { createSidebar } from '../../components/sidebar.js';
        import { createFooter } from '../../components/footer.js';
        import { isLoggedIn, getCurrentUser } from '../../js/auth.js';
        import {
            getAllCancellations,
            getCancellationStats,
            approveCancellation,
            rejectCancellation
        } from '../../js/order-cancellation.js';
        import { showToast } from '../../js/main.js';
        import { formatDate } from '../../js/utils/formatters.js';

        // ---- Check Admin ----

        const user = getCurrentUser();
        const isLoggedInUser = isLoggedIn();

        if (!isLoggedInUser || user?.role !== 'admin') {
            showToast('Access denied. Admin only.', 'error');

            setTimeout(() => {
                window.location.href = '../common/login.html';
            }, 1500);
        }

        // ---- Render Sidebar ----

        const sidebarContainer = document.createElement('div');
        sidebarContainer.id = 'sidebarContainer';

        document.body.prepend(sidebarContainer);

        let sidebarOpen = window.innerWidth > 1024;

        function toggleSidebar() {

            sidebarOpen = !sidebarOpen;

            const sidebar =
                document.querySelector('.admin-sidebar');

            const overlay =
                document.querySelector('.sidebar-overlay');

            if (sidebar) {
                sidebar.classList.toggle(
                    'open',
                    sidebarOpen
                );
            }

            if (overlay) {
                overlay.style.display =
                    sidebarOpen &&
                    window.innerWidth <= 1024
                        ? 'block'
                        : 'none';
            }
        }

        sidebarContainer.innerHTML = createSidebar({

            brandText: 'SmartCafeteria',

            brandIcon: 'fa-utensils',

            userRole: 'admin',

            userName: user?.name || 'Admin',

            isOpen: sidebarOpen,

            onToggle: toggleSidebar,

            navItems: [

                {
                    label: 'Dashboard',
                    icon: 'fa-chart-pie',
                    href: 'dashboard.html'
                },

                {
                    label: 'Users',
                    icon: 'fa-users',
                    href: 'users.html'
                },

                {
                    label: 'Menu',
                    icon: 'fa-utensils',
                    href: 'menu.html'
                },

                {
                    label: 'Categories',
                    icon: 'fa-tags',
                    href: 'categories.html'
                },

                {
                    label: 'Orders',
                    icon: 'fa-shopping-bag',
                    href: 'orders.html'
                },

                {
                    label: 'Payments',
                    icon: 'fa-credit-card',
                    href: 'payments.html'
                },

                {
                    label: 'Feedback',
                    icon: 'fa-star',
                    href: 'feedback.html'
                },

                {
                    label: 'Cancellations',
                    icon: 'fa-times-circle',
                    href: 'cancellations.html',
                    active: true
                },

                {
                    label: 'Reports',
                    icon: 'fa-file-alt',
                    href: 'reports.html'
                },

                {
                    label: 'Settings',
                    icon: 'fa-cog',
                    href: 'settings.html'
                }

            ]

        });

        // ---- Footer ----

        document.body.insertAdjacentHTML(
            'beforeend',
            createFooter({

                quickLinks: [

                    {
                        label: 'Home',
                        href: '../../index.html'
                    },

                    {
                        label: 'Menu',
                        href: '../customer/menu.html'
                    },

                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },

                    {
                        label: 'Register',
                        href: '../common/register.html'
                    }

                ],

                roleLinks: [

                    {
                        label: 'Customer',
                        href: '../customer/menu.html'
                    },

                    {
                        label: 'Kitchen',
                        href: '../kitchen/dashboard.html'
                    },

                    {
                        label: 'Admin',
                        href: 'dashboard.html'
                    }

                ]

            })
        );

        // ---- DOM ----

        const container =
            document.getElementById(
                'cancellationsContainer'
            );

        const statsContainer =
            document.getElementById(
                'cancelStats'
            );

        const cancelCount =
            document.getElementById(
                'cancelCount'
            );

        // ---- Render ----

        function renderCancellations() {

            const cancellations =
                getAllCancellations();

            const stats =
                getCancellationStats();

            // Stats

            statsContainer.innerHTML = `

                <div class="stat-mini">

                    <div class="number">
                        ${stats.total}
                    </div>

                    <div class="label">
                        Total Requests
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.pending}
                    </div>

                    <div class="label">
                        Pending
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.approved}
                    </div>

                    <div class="label">
                        Approved
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.rejected}
                    </div>

                    <div class="label">
                        Rejected
                    </div>

                </div>

            `;

            cancelCount.textContent =
                `${cancellations.length} request${
                    cancellations.length !== 1
                        ? 's'
                        : ''
                }`;

            // Empty state

            if (cancellations.length === 0) {

                container.innerHTML = `

                    <div class="empty-state">

                        <i
                            class="fas fa-times-circle"
                            style="
                                font-size:40px;
                                color:var(--gray-300);
                                display:block;
                                margin-bottom:8px;
                            "
                        ></i>

                        <p>
                            No cancellation requests.
                        </p>

                    </div>

                `;

                return;
            }

            // Cancellation cards

            container.innerHTML = `

                <div class="cancellations-list">

                    ${cancellations.map(c => `

                        <div class="cancel-item">

                            <div class="ci-header">

                                <div>

                                    <span class="ci-order">
                                        Order #${c.orderId}
                                    </span>

                                    <span
                                        class="ci-status ${c.status}"
                                    >
                                        ${c.status}
                                    </span>

                                </div>

                                <span
                                    class="cancel-date"
                                >
                                    ${formatDate(c.createdAt)}
                                </span>

                            </div>

                            <div class="ci-body">

                                <strong>
                                    Reason:
                                </strong>

                                ${c.reasonLabel || c.reason}

                                <br />

                                ${
                                    c.details
                                        ? `
                                            <strong>
                                                Details:
                                            </strong>

                                            ${c.details}
                                        `
                                        : ''
                                }

                                ${
                                    c.resolutionNote
                                        ? `
                                            <br />

                                            <strong>
                                                Note:
                                            </strong>

                                            ${c.resolutionNote}
                                        `
                                        : ''
                                }

                            </div>

                            ${
                                c.status === 'pending'
                                    ? `

                                        <div class="ci-actions">

                                            <button
                                                class="btn-sm btn-sm-approve-cancel"
                                                data-id="${c.id}"
                                            >
                                                <i class="fas fa-check"></i>
                                                Approve
                                            </button>

                                            <button
                                                class="btn-sm btn-sm-reject-cancel"
                                                data-id="${c.id}"
                                            >
                                                <i class="fas fa-times"></i>
                                                Reject
                                            </button>

                                        </div>

                                    `
                                    : ''
                            }

                        </div>

                    `).join('')}

                </div>

            `;

            // ---- Approve ----

            document
                .querySelectorAll(
                    '.btn-sm-approve-cancel'
                )
                .forEach(btn => {

                    btn.addEventListener(
                        'click',
                        async function () {

                            const id =
                                this.dataset.id;

                            const note =
                                prompt(
                                    'Add a note (optional):'
                                );

                            if (note !== null) {

                                const result =
                                    await approveCancellation(
                                        id,
                                        note ||
                                            'Approved by admin'
                                    );

                                if (result.success) {

                                    showToast(
                                        'Cancellation approved!',
                                        'success'
                                    );

                                    renderCancellations();

                                } else {

                                    showToast(
                                        result.error ||
                                            'Failed',
                                        'error'
                                    );

                                }
                            }
                        }
                    );

                });

            // ---- Reject ----

            document
                .querySelectorAll(
                    '.btn-sm-reject-cancel'
                )
                .forEach(btn => {

                    btn.addEventListener(
                        'click',
                        async function () {

                            const id =
                                this.dataset.id;

                            const reason =
                                prompt(
                                    'Rejection reason:'
                                );

                            if (
                                reason !== null &&
                                reason.trim()
                            ) {

                                const result =
                                    await rejectCancellation(
                                        id,
                                        reason.trim()
                                    );

                                if (result.success) {

                                    showToast(
                                        'Cancellation rejected',
                                        'info'
                                    );

                                    renderCancellations();

                                } else {

                                    showToast(
                                        result.error ||
                                            'Failed',
                                        'error'
                                    );

                                }
                            }
                        }
                    );

                });

        }

        // ---- Init ----

        renderCancellations();

        // ---- Resize handler ----

        window.addEventListener(
            'resize',
            () => {

                if (window.innerWidth > 1024) {

                    sidebarOpen = true;

                    const sidebar =
                        document.querySelector(
                            '.admin-sidebar'
                        );

                    const overlay =
                        document.querySelector(
                            '.sidebar-overlay'
                        );

                    if (sidebar) {
                        sidebar.classList.add('open');
                    }

                    if (overlay) {
                        overlay.style.display =
                            'none';
                    }

                } else {

                    const overlay =
                        document.querySelector(
                            '.sidebar-overlay'
                        );

                    if (overlay) {
                        overlay.style.display =
                            sidebarOpen
                                ? 'block'
                                : 'none';
                    }
                }

            }
        );

        console.log(
            '❌ Admin Cancellations page loaded successfully!'
        );

    </script>
</body>
</html>

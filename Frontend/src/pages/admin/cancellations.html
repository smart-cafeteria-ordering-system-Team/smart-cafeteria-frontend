<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancellations - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/frontend/src/css/admin.css">
</head>
<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main"></main>
    </div>

    <!-- ===== CANCELLATION DETAILS MODAL ===== -->
    <div class="modal-overlay" id="cancellationDetailsModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 class="modal-title">Cancellation Request - <span id="modalCancellationOrderId">#0000</span></h3>
                <button class="modal-close" data-close-modal="cancellationDetailsModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="order-summary-header">
                    <div>
                        <strong>Customer:</strong> <span id="modalCancCustomer">-</span><br>
                        <strong>Phone:</strong> <span id="modalCancPhone">-</span><br>
                        <strong>Email:</strong> <span id="modalCancEmail">-</span>
                    </div>
                    <div>
                        <strong>Order Type:</strong> <span id="modalCancOrderType">-</span><br>
                        <strong>Table:</strong> <span id="modalCancTableNumber">-</span><br>
                        <strong>Order Status:</strong> <span id="modalCancOrderStatus">-</span>
                    </div>
                    <div>
                        <strong>Payment Status:</strong> <span id="modalCancPaymentStatus">-</span><br>
                        <strong>Amount:</strong> <span id="modalCancAmount">-</span>
                    </div>
                </div>

                <hr class="form-divider">

                <div class="detail-grid">
                    <div class="detail-item"><span>Reason</span><strong id="modalCancReason">—</strong></div>
                    <div class="detail-item"><span>Requested At</span><strong id="modalCancRequestedAt">—</strong></div>
                    <div class="detail-item"><span>Status</span><strong id="modalCancStatus">—</strong></div>
                </div>

                <hr class="form-divider">

                <h4 class="section-heading"><i class="fa-solid fa-list"></i> Order Items</h4>
                <div class="table-wrapper">
                    <table class="admin-table compact">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Unit Price</th>
                                <th>Qty</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="modalCancItemsBody">
                            <tr><td colspan="4" class="table-empty">No items</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="order-total-summary">
                    <span>Subtotal: <strong id="modalCancSubtotal">0.00 ETB</strong></span>
                    <span>Service Fee: <strong id="modalCancServiceFee">0.00 ETB</strong></span>
                    <span class="grand-total">Total: <strong id="modalCancTotal">0.00 ETB</strong></span>
                </div>

                <hr class="form-divider">

                <div class="form-group">
                    <label for="cancAdminNote" class="form-label"><strong>Admin Note</strong></label>
                    <textarea id="cancAdminNote" class="form-control" rows="3" placeholder="Add a note for the customer..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label"><strong>Action</strong></label>
                    <div class="btn-group" style="gap:8px;">
                        <button type="button" class="btn btn-success" id="approveCancellationBtn"><i class="fa-solid fa-check"></i> Approve</button>
                        <button type="button" class="btn btn-danger" id="rejectCancellationBtn"><i class="fa-solid fa-times"></i> Reject</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal="cancellationDetailsModal">Close</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../../js/admin-api.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/admin-ui.js"></script>
    <script src="../../js/admin-cancellations.js"></script>

    <script>
        // Page-specific initialization
        function initPageSpecific() {
            // admin-cancellations.js handles initialization via its own DOMContentLoaded
        }
    </script>
</body>
</html>

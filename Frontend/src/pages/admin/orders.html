


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Orders | Smart Cafeteria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           SMART CAFETERIA - ADMIN ORDERS
           Premium / Modern / Responsive UI
           JS + Existing Paths Preserved
        ========================================================= */

        :root {
            --orders-primary: #2563eb;
            --orders-primary-dark: #1d4ed8;
            --orders-secondary: #7c3aed;
            --orders-cyan: #06b6d4;
            --orders-green: #16a34a;
            --orders-orange: #f59e0b;
            --orders-red: #ef4444;

            --orders-bg: #f5f7fb;
            --orders-card: rgba(255, 255, 255, 0.92);
            --orders-border: rgba(148, 163, 184, 0.18);

            --orders-text: #0f172a;
            --orders-muted: #64748b;

            --orders-radius: 20px;
            --orders-shadow:
                0 15px 45px rgba(15, 23, 42, 0.08),
                0 3px 12px rgba(37, 99, 235, 0.04);
        }

        /* =========================
           PAGE BASE
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(circle at 8% 10%, rgba(37, 99, 235, 0.08), transparent 26%),
                radial-gradient(circle at 92% 18%, rgba(124, 58, 237, 0.08), transparent 25%),
                radial-gradient(circle at 50% 100%, rgba(6, 182, 212, 0.06), transparent 30%),
                #f7f9fc;
            color: var(--orders-text);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,0.35),
                    transparent 35%,
                    rgba(255,255,255,0.25)
                );
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .admin-page .main-content {
            margin-left: 260px;
            padding: 30px 32px 70px;
            min-height: 100vh;
            transition:
                margin-left 0.3s ease,
                padding 0.3s ease;
        }

        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;

            margin-bottom: 24px;
            padding: 26px 28px;

            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.8);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.96),
                    rgba(248,250,252,0.86)
                );

            box-shadow:
                0 18px 50px rgba(15,23,42,0.07),
                0 2px 10px rgba(37,99,235,0.04);

            overflow: hidden;
        }

        .page-header::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            top: -90px;
            right: 7%;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.08);
            filter: blur(4px);
        }

        .page-header::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            bottom: -70px;
            right: 30%;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.08);
        }

        .page-header > div {
            position: relative;
            z-index: 2;
        }

        .page-header h1 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;

            margin: 0;
            font-size: clamp(20px, 2vw, 28px);
            line-height: 1.3;
            font-weight: 800;
            letter-spacing: -0.5px;

            background: linear-gradient(
                135deg,
                #0f172a,
                #2563eb 60%,
                #7c3aed
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header h1 i {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 44px;
            height: 44px;
            flex: 0 0 44px;

            border-radius: 14px;

            color: #fff !important;
            font-size: 18px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5,
                    #7c3aed
                );

            box-shadow:
                0 10px 24px rgba(37,99,235,0.25),
                inset 0 1px 1px rgba(255,255,255,0.35);

            -webkit-text-fill-color: #fff;
        }

        .page-header h1 small {
            display: inline-flex;
            align-items: center;

            padding: 6px 12px;
            border-radius: 999px;

            font-size: 12px;
            line-height: 1.4;
            font-weight: 600;

            color: #2563eb;
            background: rgba(37,99,235,0.09);

            -webkit-text-fill-color: #2563eb;
        }

        /* =========================
           FILTER BAR
        ========================= */

        .search-filter-bar {
            position: relative;

            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(160px, 210px) minmax(160px, 210px);
            gap: 14px;
            align-items: center;

            margin-bottom: 22px;
            padding: 18px;

            border-radius: var(--orders-radius);
            border: 1px solid rgba(255,255,255,0.9);

            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow: var(--orders-shadow);
        }

        .search-filter-bar::before {
            content: "";
            position: absolute;
            left: 18px;
            top: 0;

            width: 90px;
            height: 3px;

            border-radius: 0 0 10px 10px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed,
                    #06b6d4
                );
        }

        .search-filter-bar .search-box {
            min-width: 0;
            width: 100%;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 4px 15px;

            border: 1.5px solid #e2e8f0;
            border-radius: 13px;

            background: #f8fafc;

            transition:
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

        .search-filter-bar .search-box:hover {
            background: #fff;
            border-color: #cbd5e1;
        }

        .search-filter-bar .search-box:focus-within {
            background: #fff;
            border-color: var(--orders-primary);

            box-shadow:
                0 0 0 4px rgba(37,99,235,0.09),
                0 8px 20px rgba(37,99,235,0.08);

            transform: translateY(-1px);
        }

        .search-filter-bar .search-box i {
            flex: 0 0 auto;
            color: #64748b;
            font-size: 14px;
        }

        .search-filter-bar .search-box input {
            width: 100%;
            min-width: 0;

            border: none;
            outline: none;

            padding: 10px 0;

            background: transparent;

            color: #0f172a;

            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
        }

        .search-filter-bar .search-box input::placeholder {
            color: #94a3b8;
        }

        .search-filter-bar select {
            width: 100%;
            min-width: 0;

            appearance: none;
            -webkit-appearance: none;

            padding: 12px 38px 12px 14px;

            border: 1.5px solid #e2e8f0;
            border-radius: 13px;

            outline: none;
            cursor: pointer;

            color: #334155;
            background:
                linear-gradient(45deg, transparent 50%, #64748b 50%) calc(100% - 18px) 50% / 5px 5px no-repeat,
                linear-gradient(135deg, #64748b 50%, transparent 50%) calc(100% - 13px) 50% / 5px 5px no-repeat,
                #f8fafc;

            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .search-filter-bar select:hover {
            background-color: #fff;
            border-color: #cbd5e1;
        }

        .search-filter-bar select:focus {
            background-color: #fff;
            border-color: var(--orders-primary);

            box-shadow:
                0 0 0 4px rgba(37,99,235,0.08);
        }

        /* =========================
           ORDERS TABLE CARD
        ========================= */

        .orders-table-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;

            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.95);

            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 20px 55px rgba(15,23,42,0.08),
                0 3px 14px rgba(37,99,235,0.035);

            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .orders-table-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .orders-table-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .orders-table-wrapper::-webkit-scrollbar-thumb {
            border-radius: 20px;
            background: #cbd5e1;
        }

        .orders-table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .orders-table {
            width: 100%;
            min-width: 850px;

            border-collapse: separate;
            border-spacing: 0;

            font-size: 13px;
        }

        /* =========================
           TABLE HEADER
        ========================= */

        .orders-table thead th {
            position: sticky;
            top: 0;
            z-index: 3;

            padding: 16px 18px;

            text-align: left;
            white-space: nowrap;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #f1f5f9
                );

            color: #475569;

            border-bottom: 1px solid #e2e8f0;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .orders-table thead th:first-child {
            border-top-left-radius: 20px;
        }

        .orders-table thead th:last-child {
            border-top-right-radius: 20px;
        }

        /* =========================
           TABLE BODY
        ========================= */

        .orders-table tbody td {
            padding: 16px 18px;

            color: #334155;

            border-bottom: 1px solid #f1f5f9;

            vertical-align: middle;
            white-space: nowrap;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .orders-table tbody tr {
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .orders-table tbody tr:hover {
            background:
                linear-gradient(
                    90deg,
                    rgba(37,99,235,0.045),
                    rgba(124,58,237,0.025),
                    transparent
                );
        }

        .orders-table tbody tr:last-child td {
            border-bottom: none;
        }

        .orders-table tbody td:first-child strong {
            display: inline-flex;
            align-items: center;

            min-width: 74px;
            padding: 6px 9px;

            border-radius: 9px;

            color: #2563eb;
            background: rgba(37,99,235,0.08);

            font-size: 12px;
            font-weight: 700;
        }

        .orders-table tbody td:nth-child(2) {
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .orders-table tbody td:nth-child(3) strong {
            color: #0f172a;
            font-weight: 700;
        }

        /* =========================
           STATUS BADGES
        ========================= */

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 84px;
            padding: 6px 11px;

            border-radius: 999px;

            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.045em;

            border: 1px solid transparent;

            box-shadow: inset 0 1px 1px rgba(255,255,255,0.45);
        }

        .status-badge.pending {
            color: #92400e;
            background: #fff7d6;
            border-color: #fde68a;
        }

        .status-badge.preparing {
            color: #075985;
            background: #e0f7ff;
            border-color: #bae6fd;
        }

        .status-badge.ready {
            color: #166534;
            background: #dcfce7;
            border-color: #bbf7d0;
        }

        .status-badge.served {
            color: #475569;
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .status-badge.cancelled {
            color: #991b1b;
            background: #fee2e2;
            border-color: #fecaca;
        }

        /* =========================
           ACTION BUTTON
        ========================= */

        .action-btns {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .action-btns .btn-sm {
            min-height: 34px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            padding: 7px 13px;

            border: none;
            border-radius: 10px;

            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 700;

            cursor: pointer;
            text-decoration: none;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn-sm-view-order {
            color: #fff !important;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            box-shadow:
                0 7px 16px rgba(37,99,235,0.20);
        }

        .btn-sm-view-order:hover {
            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #4338ca
                );

            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(37,99,235,0.28);
        }

        .btn-sm-view-order:active {
            transform: translateY(0);
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            min-height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            padding: 55px 25px;

            text-align: center;
            color: #64748b;

            background:
                radial-gradient(
                    circle at center,
                    rgba(37,99,235,0.035),
                    transparent 65%
                );
        }

        .empty-state i {
            display: flex !important;
            align-items: center;
            justify-content: center;

            width: 82px;
            height: 82px;

            margin-bottom: 18px !important;

            border-radius: 50%;

            color: #94a3b8 !important;
            background: #f1f5f9;

            font-size: 30px !important;

            box-shadow:
                inset 0 0 0 8px rgba(255,255,255,0.75);
        }

        .empty-state p {
            margin: 0;

            font-size: 14px;
            font-weight: 500;
            color: #64748b;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1200px) {

            .admin-page .main-content {
                padding: 24px;
            }

            .search-filter-bar {
                grid-template-columns:
                    minmax(200px, 1fr)
                    minmax(150px, 190px)
                    minmax(150px, 190px);
            }

            .orders-table {
                min-width: 820px;
            }
        }

        /* =========================
           SIDEBAR COLLAPSED / TABLET
        ========================= */

        @media (max-width: 1024px) {

            .admin-page .main-content {
                margin-left: 0;
                padding:
                    82px 22px
                    60px;
            }

            .page-header {
                padding: 22px;
                border-radius: 20px;
            }

            .search-filter-bar {
                grid-template-columns:
                    minmax(200px, 1fr)
                    minmax(150px, 180px)
                    minmax(150px, 180px);
            }
        }

        /* =========================
           SMALL TABLET
        ========================= */

        @media (max-width: 820px) {

            .admin-page .main-content {
                padding:
                    76px 18px
                    50px;
            }

            .search-filter-bar {
                grid-template-columns: 1fr 1fr;
            }

            .search-filter-bar .search-box {
                grid-column: 1 / -1;
            }

            .page-header {
                margin-bottom: 18px;
            }

            .orders-table thead th,
            .orders-table tbody td {
                padding: 13px 14px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                background:
                    radial-gradient(
                        circle at 10% 5%,
                        rgba(37,99,235,0.08),
                        transparent 35%
                    ),
                    #f7f9fc;
            }

            .admin-page .main-content {
                width: 100%;
                padding:
                    70px 12px
                    40px;
            }

            .page-header {
                padding: 18px;
                border-radius: 18px;
                gap: 12px;
            }

            .page-header h1 {
                width: 100%;
                font-size: 20px;
                gap: 8px;
            }

            .page-header h1 i {
                width: 40px;
                height: 40px;
                flex-basis: 40px;
                border-radius: 12px;
                font-size: 16px;
            }

            .page-header h1 small {
                margin-top: 2px;
                font-size: 10px;
                padding: 5px 9px;
            }

            .search-filter-bar {
                grid-template-columns: 1fr;

                gap: 10px;
                padding: 14px;

                border-radius: 17px;
            }

            .search-filter-bar .search-box {
                grid-column: auto;
            }

            .search-filter-bar select {
                min-height: 45px;
            }

            .orders-table-wrapper {
                border-radius: 17px;
            }

            .orders-table {
                min-width: 820px;
                font-size: 12px;
            }

            .orders-table thead th {
                padding: 13px 12px;
                font-size: 10px;
            }

            .orders-table tbody td {
                padding: 13px 12px;
            }

            .status-badge {
                min-width: 78px;
                padding: 5px 8px;
                font-size: 9px;
            }

            .action-btns .btn-sm {
                min-height: 32px;
                padding: 6px 10px;
                font-size: 10px;
            }
        }

        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 400px) {

            .admin-page .main-content {
                padding:
                    66px 9px
                    34px;
            }

            .page-header {
                padding: 15px;
                border-radius: 16px;
            }

            .page-header h1 {
                font-size: 18px;
            }

            .page-header h1 i {
                width: 36px;
                height: 36px;
                flex-basis: 36px;
                font-size: 14px;
            }

            .search-filter-bar {
                padding: 11px;
                border-radius: 15px;
            }

            .search-filter-bar .search-box {
                padding-left: 11px;
                padding-right: 11px;
            }

            .search-filter-bar .search-box input {
                font-size: 12px;
            }

            .orders-table {
                min-width: 790px;
            }
        }

        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 320px) {

            .admin-page .main-content {
                padding-left: 7px;
                padding-right: 7px;
            }

            .page-header {
                padding: 13px;
            }

            .page-header h1 {
                font-size: 17px;
            }

            .search-filter-bar {
                padding: 9px;
            }
        }

        /* =========================
           ACCESSIBILITY
        ========================= */

        .search-filter-bar input:focus-visible,
        .search-filter-bar select:focus-visible,
        .btn-sm:focus-visible {
            outline: 3px solid rgba(37,99,235,0.22);
            outline-offset: 2px;
        }

        /* =========================
           REDUCE MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="admin-page">

        <!-- Sidebar injected -->
        <div class="main-content">

            <div class="page-header">
                <div>
                    <h1>
                        <i class="fas fa-shopping-bag" style="color:#2563eb;"></i>
                        All Orders
                        <small id="orderCount">Loading...</small>
                    </h1>
                </div>
            </div>

            <div class="search-filter-bar">

                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by order ID..."
                    />
                </div>

                <select id="statusFilter">
                    <option value="all">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="preparing">Preparing</option>
                    <option value="ready">Ready for Pickup</option>
                    <option value="served">Served</option>
                    <option value="cancelled">Cancelled</option>
                </select>

                <select id="dateFilter">
                    <option value="all">All Time</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>

            </div>

            <div class="orders-table-wrapper">

                <div id="ordersContainer">
                    <!-- Injected by JS -->
                </div>

            </div>

        </div>
    </div>

    <!-- ===== Script ===== -->

    <script type="module">

        import { createSidebar } from '../../components/sidebar.js';
        import { createFooter } from '../../components/footer.js';
        import { isLoggedIn, getCurrentUser } from '../../js/auth.js';
        import { getAllOrders } from '../../js/orders.js';
        import { showToast } from '../../js/main.js';
        import { formatDate, formatTime } from '../../js/utils/formatters.js';

        // ---- Check Admin ----

        const user = getCurrentUser();
        const isLoggedInUser = isLoggedIn();

        if (!isLoggedInUser || user?.role !== 'admin') {

            showToast('Access denied. Admin only.', 'error');

            setTimeout(
                () => window.location.href = '../common/login.html',
                1500
            );
        }

        // ---- Render Sidebar ----

        const sidebarContainer = document.createElement('div');

        sidebarContainer.id = 'sidebarContainer';

        document.body.prepend(sidebarContainer);

        let sidebarOpen = window.innerWidth > 1024;

        function toggleSidebar() {

            sidebarOpen = !sidebarOpen;

            const sidebar =
                document.querySelector('.admin-sidebar');

            const overlay =
                document.querySelector('.sidebar-overlay');

            if (sidebar)
                sidebar.classList.toggle(
                    'open',
                    sidebarOpen
                );

            if (overlay)
                overlay.style.display =
                    sidebarOpen && window.innerWidth <= 1024
                        ? 'block'
                        : 'none';
        }

        sidebarContainer.innerHTML = createSidebar({

            brandText: 'SmartCafeteria',

            brandIcon: 'fa-utensils',

            userRole: 'admin',

            userName: user?.name || 'Admin',

            isOpen: sidebarOpen,

            onToggle: toggleSidebar,

            navItems: [

                {
                    label: 'Dashboard',
                    icon: 'fa-chart-pie',
                    href: 'dashboard.html'
                },

                {
                    label: 'Users',
                    icon: 'fa-users',
                    href: 'users.html'
                },

                {
                    label: 'Menu',
                    icon: 'fa-utensils',
                    href: 'menu.html'
                },

                {
                    label: 'Categories',
                    icon: 'fa-tags',
                    href: 'categories.html'
                },

                {
                    label: 'Orders',
                    icon: 'fa-shopping-bag',
                    href: 'orders.html',
                    active: true
                },

                {
                    label: 'Payments',
                    icon: 'fa-credit-card',
                    href: 'payments.html'
                },

                {
                    label: 'Feedback',
                    icon: 'fa-star',
                    href: 'feedback.html'
                },

                {
                    label: 'Cancellations',
                    icon: 'fa-times-circle',
                    href: 'cancellations.html'
                },

                {
                    label: 'Reports',
                    icon: 'fa-file-alt',
                    href: 'reports.html'
                },

                {
                    label: 'Settings',
                    icon: 'fa-cog',
                    href: 'settings.html'
                },

            ],

        });

        // ---- Footer ----

        document.body.insertAdjacentHTML(
            'beforeend',

            createFooter({

                quickLinks: [

                    {
                        label: 'Home',
                        href: '../../index.html'
                    },

                    {
                        label: 'Menu',
                        href: '../customer/menu.html'
                    },

                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },

                    {
                        label: 'Register',
                        href: '../common/register.html'
                    },

                ],

                roleLinks: [

                    {
                        label: 'Customer',
                        href: '../customer/menu.html'
                    },

                    {
                        label: 'Kitchen',
                        href: '../kitchen/dashboard.html'
                    },

                    {
                        label: 'Admin',
                        href: 'dashboard.html'
                    },

                ],

            })
        );

        // ---- DOM ----

        const container =
            document.getElementById('ordersContainer');

        const orderCount =
            document.getElementById('orderCount');

        const searchInput =
            document.getElementById('searchInput');

        const statusFilter =
            document.getElementById('statusFilter');

        const dateFilter =
            document.getElementById('dateFilter');

        let allOrders = [];

        // ---- Render ----

        function renderOrders() {

            const search =
                searchInput.value
                    .toLowerCase()
                    .trim();

            const status =
                statusFilter.value;

            const date =
                dateFilter.value;

            let filtered = [...allOrders];

            if (search) {

                filtered =
                    filtered.filter(
                        o =>
                            o.id
                                .toLowerCase()
                                .includes(search)
                    );
            }

            if (status !== 'all') {

                filtered =
                    filtered.filter(
                        o =>
                            o.status === status
                    );
            }

            if (date !== 'all') {

                const now = new Date();

                const today =
                    now.toISOString()
                        .split('T')[0];

                const weekAgo =
                    new Date(now);

                weekAgo.setDate(
                    weekAgo.getDate() - 7
                );

                const monthAgo =
                    new Date(now);

                monthAgo.setMonth(
                    monthAgo.getMonth() - 1
                );

                filtered =
                    filtered.filter(o => {

                        const orderDate =
                            o.orderTime
                                .split('T')[0];

                        if (date === 'today')
                            return orderDate === today;

                        if (date === 'week')
                            return orderDate >=
                                weekAgo
                                    .toISOString()
                                    .split('T')[0];

                        if (date === 'month')
                            return orderDate >=
                                monthAgo
                                    .toISOString()
                                    .split('T')[0];

                        return true;
                    });
            }

            filtered.sort(
                (a, b) =>
                    new Date(b.orderTime) -
                    new Date(a.orderTime)
            );

            orderCount.textContent =
                `${filtered.length} order${
                    filtered.length !== 1
                        ? 's'
                        : ''
                }`;

            if (filtered.length === 0) {

                container.innerHTML = `

                    <div class="empty-state">

                        <i
                            class="fas fa-shopping-bag"
                            style="
                                font-size:40px;
                                color:var(--gray-300);
                                display:block;
                                margin-bottom:8px;
                            "
                        ></i>

                        <p>
                            No orders found matching your criteria.
                        </p>

                    </div>

                `;

                return;
            }

            const lang =
                localStorage.getItem(
                    'scos_language'
                ) || 'en';

            container.innerHTML = `

                <table class="orders-table">

                    <thead>

                        <tr>

                            <th>Order ID</th>

                            <th>Items</th>

                            <th>Total</th>

                            <th>Status</th>

                            <th>Payment</th>

                            <th>Date</th>

                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody>

                        ${filtered.map(order => {

                            const itemsSummary =
                                order.items
                                    .map(
                                        item =>
                                            `${
                                                item.name[lang] ||
                                                item.name.en ||
                                                item.name
                                            } ×${item.quantity}`
                                    )
                                    .join(', ');

                            return `

                                <tr>

                                    <td>
                                        <strong>
                                            #${order.id}
                                        </strong>
                                    </td>

                                    <td
                                        style="
                                            font-size:13px;
                                            color:var(--gray-600);
                                            max-width:200px;
                                            overflow:hidden;
                                            text-overflow:ellipsis;
                                            white-space:nowrap;
                                        "
                                    >
                                        ${itemsSummary || '—'}
                                    </td>

                                    <td>
                                        <strong>
                                            ${order.totalAmount} ብር
                                        </strong>
                                    </td>

                                    <td>
                                        <span
                                            class="status-badge ${order.status}"
                                        >
                                            ${order.status}
                                        </span>
                                    </td>

                                    <td>

                                        ${
                                            order.paymentStatus === 'simulated'

                                            ? `
                                                <span
                                                    style="
                                                        color:#16a34a;
                                                        font-weight:600;
                                                    "
                                                >
                                                    <i class="fas fa-check-circle"></i>
                                                    Paid
                                                </span>
                                            `

                                            : `
                                                <span
                                                    style="
                                                        color:var(--gray-400);
                                                        font-weight:500;
                                                    "
                                                >
                                                    Pending
                                                </span>
                                            `
                                        }

                                    </td>

                                    <td
                                        style="
                                            font-size:12px;
                                            color:var(--gray-400);
                                        "
                                    >
                                        ${formatDate(order.orderTime)}
                                    </td>

                                    <td>

                                        <div class="action-btns">

                                            <a
                                                href="../customer/order-tracking.html?id=${order.id}"
                                                target="_blank"
                                                class="btn-sm btn-sm-view-order"
                                                style="
                                                    display:inline-block;
                                                    padding:4px 12px;
                                                    border-radius:6px;
                                                    text-decoration:none;
                                                    font-size:11px;
                                                    font-weight:600;
                                                "
                                            >

                                                <i class="fas fa-eye"></i>

                                                View

                                            </a>

                                        </div>

                                    </td>

                                </tr>

                            `;

                        }).join('')}

                    </tbody>

                </table>

            `;
        }

        // ---- Event Listeners ----

        searchInput.addEventListener(
            'input',
            renderOrders
        );

        statusFilter.addEventListener(
            'change',
            renderOrders
        );

        dateFilter.addEventListener(
            'change',
            renderOrders
        );

        // ---- Load ----

        allOrders = getAllOrders();

        renderOrders();

        // ---- Resize handler ----

        window.addEventListener(
            'resize',
            () => {

                if (window.innerWidth > 1024) {

                    sidebarOpen = true;

                    const sidebar =
                        document.querySelector(
                            '.admin-sidebar'
                        );

                    const overlay =
                        document.querySelector(
                            '.sidebar-overlay'
                        );

                    if (sidebar)
                        sidebar.classList.add(
                            'open'
                        );

                    if (overlay)
                        overlay.style.display =
                            'none';

                } else {

                    const overlay =
                        document.querySelector(
                            '.sidebar-overlay'
                        );

                    if (overlay)
                        overlay.style.display =
                            sidebarOpen
                                ? 'block'
                                : 'none';
                }

            }
        );

        console.log(
            '📦 Admin Orders page loaded successfully!'
        );

    </script>

</body>
</html>

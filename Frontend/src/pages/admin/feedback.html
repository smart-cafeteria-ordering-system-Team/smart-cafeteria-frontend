

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Feedback | Smart Cafeteria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           SMART CAFETERIA - ADMIN FEEDBACK
           Premium / Modern / Luxury / Fully Responsive
           Existing JS + Paths Preserved
        ========================================================= */

        :root {
            --feedback-blue: #2563eb;
            --feedback-indigo: #4f46e5;
            --feedback-purple: #7c3aed;
            --feedback-cyan: #06b6d4;
            --feedback-green: #16a34a;
            --feedback-orange: #f59e0b;
            --feedback-red: #ef4444;

            --feedback-text: #0f172a;
            --feedback-muted: #64748b;
            --feedback-border: rgba(148, 163, 184, 0.18);

            --feedback-shadow:
                0 18px 50px rgba(15, 23, 42, 0.08),
                0 3px 14px rgba(37, 99, 235, 0.04);
        }

        /* =========================================================
           GLOBAL
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: 'Poppins', sans-serif;

            color: var(--feedback-text);

            background:
                radial-gradient(
                    circle at 6% 7%,
                    rgba(37, 99, 235, 0.09),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 94% 12%,
                    rgba(124, 58, 237, 0.09),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(6, 182, 212, 0.07),
                    transparent 30%
                ),
                #f7f9fc;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            z-index: -1;

            pointer-events: none;

            background:
                linear-gradient(
                    125deg,
                    rgba(255, 255, 255, 0.28),
                    transparent 40%,
                    rgba(255, 255, 255, 0.18)
                );
        }

        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        .admin-page .main-content {
            margin-left: 260px;

            min-height: 100vh;

            padding:
                30px 32px
                70px;

            transition:
                margin-left 0.3s ease,
                padding 0.3s ease;
        }

        /* =========================================================
           PAGE HEADER
        ========================================================= */

        .page-header {
            position: relative;

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;

            gap: 20px;

            margin-bottom: 24px;
            padding: 26px 28px;

            overflow: hidden;

            border-radius: 24px;

            border:
                1px solid rgba(255, 255, 255, 0.95);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(248, 250, 252, 0.9)
                );

            box-shadow:
                0 18px 50px rgba(15, 23, 42, 0.07),
                0 3px 14px rgba(37, 99, 235, 0.04);
        }

        .page-header::before {
            content: "";

            position: absolute;

            width: 190px;
            height: 190px;

            top: -105px;
            right: 5%;

            border-radius: 50%;

            background:
                rgba(245, 158, 11, 0.09);

            filter: blur(3px);
        }

        .page-header::after {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            right: 31%;
            bottom: -80px;

            border-radius: 50%;

            background:
                rgba(124, 58, 237, 0.08);
        }

        .page-header > div {
            position: relative;
            z-index: 2;
        }

        .page-header h1 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            gap: 10px;

            margin: 0;

            font-size: clamp(20px, 2vw, 28px);

            line-height: 1.3;

            font-weight: 800;

            letter-spacing: -0.5px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #2563eb 48%,
                    #7c3aed
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .page-header h1 i {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 45px;
            height: 45px;

            flex: 0 0 45px;

            border-radius: 14px;

            color: #fff !important;

            font-size: 18px;

            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #f97316,
                    #ef4444
                );

            box-shadow:
                0 10px 25px
                rgba(245, 158, 11, 0.28),

                inset 0 1px 1px
                rgba(255, 255, 255, 0.45);

            -webkit-text-fill-color: #fff;
        }

        .page-header h1 small {
            display: inline-flex;

            align-items: center;

            padding:
                6px 12px;

            border-radius: 999px;

            color: #7c3aed;

            background:
                rgba(124, 58, 237, 0.08);

            font-size: 12px;
            font-weight: 600;

            -webkit-text-fill-color: #7c3aed;
        }

        /* =========================================================
           STATS
        ========================================================= */

        .stats-mini {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 22px;
        }

        .stat-mini {
            position: relative;

            min-width: 0;

            padding: 20px 18px;

            overflow: hidden;

            border-radius: 19px;

            border:
                1px solid rgba(255,255,255,0.95);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.98),
                    rgba(248,250,252,0.9)
                );

            box-shadow: var(--feedback-shadow);

            text-align: left;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .stat-mini::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #4f46e5,
                    #7c3aed
                );
        }

        .stat-mini::after {
            content: "";

            position: absolute;

            width: 90px;
            height: 90px;

            right: -38px;
            bottom: -42px;

            border-radius: 50%;

            background:
                rgba(37, 99, 235, 0.055);
        }

        .stat-mini:hover {
            transform: translateY(-4px);

            border-color:
                rgba(37,99,235,0.15);

            box-shadow:
                0 20px 45px
                rgba(15,23,42,0.10),

                0 8px 22px
                rgba(37,99,235,0.06);
        }

        .stat-mini:nth-child(2)::before {
            background:
                linear-gradient(
                    90deg,
                    #f59e0b,
                    #f97316,
                    #ef4444
                );
        }

        .stat-mini:nth-child(3)::before {
            background:
                linear-gradient(
                    90deg,
                    #fbbf24,
                    #f59e0b,
                    #eab308
                );
        }

        .stat-mini:nth-child(4)::before {
            background:
                linear-gradient(
                    90deg,
                    #10b981,
                    #16a34a,
                    #22c55e
                );
        }

        .stat-mini .number {
            position: relative;
            z-index: 2;

            margin-bottom: 5px;

            font-size:
                clamp(20px, 2vw, 27px);

            line-height: 1.2;

            font-weight: 800;

            color: #0f172a;

            word-break: break-word;
        }

        .stat-mini:nth-child(2) .number {
            color: #ea580c;
        }

        .stat-mini:nth-child(3) .number {
            color: #d97706;
        }

        .stat-mini:nth-child(4) .number {
            color: #16a34a;
        }

        .stat-mini .label {
            position: relative;
            z-index: 2;

            color: #64748b;

            font-size: 10px;

            line-height: 1.4;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.055em;
        }

        /* =========================================================
           FEEDBACK LIST
        ========================================================= */

        .feedback-list {
            display: flex;

            flex-direction: column;

            gap: 16px;

            width: 100%;
        }

        /* =========================================================
           FEEDBACK CARD
        ========================================================= */

        .feedback-item-admin {
            position: relative;

            overflow: hidden;

            padding: 22px 24px;

            border-radius: 20px;

            border:
                1px solid rgba(255,255,255,0.95);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.98),
                    rgba(248,250,252,0.94)
                );

            box-shadow:
                0 16px 45px
                rgba(15,23,42,0.07),

                0 3px 12px
                rgba(37,99,235,0.035);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .feedback-item-admin::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 4px;

            background:
                linear-gradient(
                    180deg,
                    #f59e0b,
                    #f97316,
                    #ef4444
                );
        }

        .feedback-item-admin::after {
            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            right: -55px;
            top: -65px;

            border-radius: 50%;

            background:
                rgba(245,158,11,0.045);

            pointer-events: none;
        }

        .feedback-item-admin:hover {
            transform: translateY(-3px);

            border-color:
                rgba(245,158,11,0.18);

            box-shadow:
                0 22px 55px
                rgba(15,23,42,0.10),

                0 8px 25px
                rgba(245,158,11,0.06);
        }

        /* =========================================================
           FEEDBACK HEADER
        ========================================================= */

        .feedback-item-admin .fb-header {
            position: relative;
            z-index: 2;

            display: flex;

            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;

            gap: 12px;

            padding-bottom: 14px;

            border-bottom:
                1px solid #f1f5f9;
        }

        .feedback-item-admin .fb-header > div {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 9px;
        }

        /* =========================================================
           RATING
        ========================================================= */

        .feedback-item-admin .fb-header .fb-rating {
            display: inline-flex;

            align-items: center;

            padding:
                7px 10px;

            border-radius: 10px;

            color: #f59e0b;

            background:
                linear-gradient(
                    135deg,
                    #fff7d6,
                    #fffbeb
                );

            border:
                1px solid #fde68a;

            font-size: 15px;

            line-height: 1;

            letter-spacing: 1px;

            box-shadow:
                inset 0 1px 1px
                rgba(255,255,255,0.7);
        }

        /* =========================================================
           USER
        ========================================================= */

        .feedback-item-admin .fb-header .fb-user {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            color: #334155;

            font-size: 13px;

            font-weight: 700;
        }

        .feedback-item-admin .fb-header .fb-user::before {
            content: "\f007";

            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 26px;
            height: 26px;

            border-radius: 50%;

            color: #2563eb;

            background:
                rgba(37,99,235,0.09);

            font-family:
                "Font Awesome 6 Free";

            font-weight: 900;

            font-size: 10px;
        }

        /* =========================================================
           DATE
        ========================================================= */

        .feedback-item-admin .fb-header .fb-date {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            color: #94a3b8;

            font-size: 11px;

            font-weight: 500;
        }

        .feedback-item-admin .fb-header .fb-date::before {
            content: "\f017";

            font-family:
                "Font Awesome 6 Free";

            font-weight: 900;

            font-size: 10px;
        }

        /* =========================================================
           STATUS
        ========================================================= */

        .fb-status {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 70px;

            padding:
                5px 10px;

            border-radius: 999px;

            font-size: 9px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.05em;

            border:
                1px solid transparent;
        }

        .fb-status.pending {
            background:
                #fff7d6;

            color:
                #92400e;

            border-color:
                #fde68a;
        }

        .fb-status.approved {
            background:
                #dcfce7;

            color:
                #166534;

            border-color:
                #bbf7d0;
        }

        /* =========================================================
           COMMENT
        ========================================================= */

        .feedback-item-admin .fb-comment {
            position: relative;
            z-index: 2;

            margin:
                17px 0 14px;

            padding-left: 2px;

            color: #475569;

            font-size: 14px;

            line-height: 1.8;

            font-weight: 400;

            overflow-wrap: anywhere;
        }

        .feedback-item-admin .fb-comment::before {
            content: "\f10d";

            display: inline-block;

            margin-right: 7px;

            color: #cbd5e1;

            font-family:
                "Font Awesome 6 Free";

            font-weight: 900;

            font-size: 12px;
        }

        /* =========================================================
           REPLY BOX
        ========================================================= */

        .feedback-item-admin .fb-header + .fb-comment + div {
            position: relative;
            z-index: 2;

            margin:
                12px 0 15px !important;

            padding:
                13px 16px !important;

            border-radius: 12px !important;

            background:
                linear-gradient(
                    135deg,
                    #f0fdf4,
                    #ecfdf5
                ) !important;

            border:
                1px solid #bbf7d0 !important;

            border-left:
                4px solid #16a34a !important;

            color: #475569 !important;

            font-size: 12px !important;

            line-height: 1.65;
        }

        .feedback-item-admin .fb-header + .fb-comment + div strong {
            color: #16a34a !important;
        }

        /* =========================================================
           ACTIONS
        ========================================================= */

        .feedback-item-admin .fb-actions {
            position: relative;
            z-index: 3;

            display: flex;

            align-items: center;

            gap: 9px;

            flex-wrap: wrap;

            padding-top: 2px;
        }

        .feedback-item-admin .fb-actions .btn-sm {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            min-height: 36px;

            padding:
                7px 14px;

            border: none;

            border-radius: 10px;

            font-family: 'Poppins', sans-serif;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .feedback-item-admin .fb-actions .btn-sm:hover {
            transform: translateY(-2px);
        }

        .feedback-item-admin .fb-actions .btn-sm:active {
            transform: translateY(0);
        }

        /* Approve */

        .btn-sm-approve {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #15803d
                );

            box-shadow:
                0 7px 18px
                rgba(22,163,74,0.18);
        }

        .btn-sm-approve:hover {
            background:
                linear-gradient(
                    135deg,
                    #15803d,
                    #166534
                );

            box-shadow:
                0 10px 23px
                rgba(22,163,74,0.25);
        }

        /* Reply */

        .btn-sm-reply {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            box-shadow:
                0 7px 18px
                rgba(37,99,235,0.18);
        }

        .btn-sm-reply:hover {
            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #4338ca
                );

            box-shadow:
                0 10px 23px
                rgba(37,99,235,0.25);
        }

        /* Delete */

        .btn-sm-delete-fb {
            color: #991b1b;

            background:
                #fff1f2;

            border:
                1px solid #fecdd3 !important;

            box-shadow:
                none;
        }

        .btn-sm-delete-fb:hover {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );

            border-color:
                transparent !important;

            box-shadow:
                0 9px 22px
                rgba(239,68,68,0.2);
        }

        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .empty-state {
            min-height: 320px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            padding:
                55px 25px;

            text-align: center;

            color: #64748b;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.97),
                    rgba(248,250,252,0.92)
                );

            border:
                1px solid rgba(255,255,255,0.95);

            box-shadow:
                0 18px 50px
                rgba(15,23,42,0.07);
        }

        .empty-state i {
            display: flex !important;

            align-items: center;
            justify-content: center;

            width: 84px;
            height: 84px;

            margin-bottom: 18px !important;

            border-radius: 50%;

            color: #f59e0b !important;

            background:
                linear-gradient(
                    135deg,
                    #fff7d6,
                    #fffbeb
                );

            border:
                1px solid #fde68a;

            font-size: 30px !important;

            box-shadow:
                0 12px 30px
                rgba(245,158,11,0.12);
        }

        .empty-state p {
            margin: 0;

            color: #64748b;

            font-size: 14px;

            font-weight: 500;
        }

        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 1200px) {

            .admin-page .main-content {
                padding: 24px;
            }

            .stats-mini {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        /* =========================================================
           1024px
        ========================================================= */

        @media (max-width: 1024px) {

            .admin-page .main-content {
                margin-left: 0;

                padding:
                    82px 22px
                    60px;
            }

            .page-header {
                padding: 22px;

                border-radius: 20px;
            }
        }

        /* =========================================================
           820px
        ========================================================= */

        @media (max-width: 820px) {

            .admin-page .main-content {
                padding:
                    76px 18px
                    50px;
            }

            .stats-mini {
                gap: 12px;
            }

            .stat-mini {
                padding:
                    17px 15px;
            }

            .feedback-item-admin {
                padding:
                    19px 20px;
            }
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            body {
                background:
                    radial-gradient(
                        circle at 10% 5%,
                        rgba(37,99,235,0.08),
                        transparent 35%
                    ),
                    #f7f9fc;
            }

            .admin-page .main-content {
                width: 100%;

                padding:
                    70px 12px
                    40px;
            }

            .page-header {
                padding: 18px;

                border-radius: 18px;

                margin-bottom: 17px;
            }

            .page-header h1 {
                width: 100%;

                font-size: 20px;

                gap: 8px;
            }

            .page-header h1 i {
                width: 40px;
                height: 40px;

                flex-basis: 40px;

                border-radius: 12px;

                font-size: 16px;
            }

            .page-header h1 small {
                font-size: 10px;

                padding:
                    5px 9px;
            }

            .stats-mini {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;

                margin-bottom: 17px;
            }

            .stat-mini {
                min-height: 92px;

                padding:
                    16px 13px;

                border-radius: 16px;
            }

            .stat-mini .number {
                font-size: 20px;
            }

            .stat-mini .label {
                font-size: 8px;
            }

            .feedback-list {
                gap: 12px;
            }

            .feedback-item-admin {
                padding:
                    17px 16px;

                border-radius: 17px;
            }

            .feedback-item-admin .fb-header {
                align-items: flex-start;

                flex-direction: column;

                gap: 10px;
            }

            .feedback-item-admin .fb-header > div {
                width: 100%;
            }

            .feedback-item-admin .fb-header .fb-date {
                align-self: flex-start;
            }

            .feedback-item-admin .fb-comment {
                font-size: 13px;

                line-height: 1.7;

                margin:
                    14px 0 13px;
            }

            .feedback-item-admin .fb-actions {
                width: 100%;
            }

            .feedback-item-admin .fb-actions .btn-sm {
                flex: 1 1 auto;

                min-height: 38px;

                padding:
                    8px 11px;

                font-size: 10px;
            }

            .empty-state {
                min-height: 280px;

                padding:
                    45px 18px;
            }
        }

        /* =========================================================
           SMALL MOBILE
        ========================================================= */

        @media (max-width: 400px) {

            .admin-page .main-content {
                padding:
                    66px 9px
                    34px;
            }

            .page-header {
                padding: 15px;

                border-radius: 16px;
            }

            .page-header h1 {
                font-size: 18px;
            }

            .page-header h1 i {
                width: 36px;
                height: 36px;

                flex-basis: 36px;

                font-size: 14px;
            }

            .stats-mini {
                gap: 8px;
            }

            .stat-mini {
                padding:
                    14px 10px;

                min-height: 84px;
            }

            .stat-mini .number {
                font-size: 18px;
            }

            .stat-mini .label {
                font-size: 7px;
            }

            .feedback-item-admin {
                padding:
                    15px 13px;

                border-radius: 15px;
            }

            .feedback-item-admin .fb-header > div {
                gap: 6px;
            }

            .feedback-item-admin .fb-header .fb-rating {
                padding:
                    6px 8px;

                font-size: 13px;
            }

            .feedback-item-admin .fb-header .fb-user {
                font-size: 11px;
            }

            .feedback-item-admin .fb-header .fb-user::before {
                width: 23px;
                height: 23px;
            }

            .fb-status {
                min-width: 62px;

                padding:
                    4px 7px;

                font-size: 8px;
            }

            .feedback-item-admin .fb-comment {
                font-size: 12px;
            }

            .feedback-item-admin .fb-actions {
                display: grid;

                grid-template-columns:
                    1fr 1fr;

                gap: 7px;
            }

            .feedback-item-admin .fb-actions .btn-sm {
                width: 100%;

                min-width: 0;
            }

            .feedback-item-admin .fb-actions
            .btn-sm-delete-fb {
                grid-column:
                    1 / -1;
            }
        }

        /* =========================================================
           VERY SMALL
        ========================================================= */

        @media (max-width: 320px) {

            .admin-page .main-content {
                padding-left: 7px;
                padding-right: 7px;
            }

            .page-header {
                padding: 13px;
            }

            .page-header h1 {
                font-size: 17px;
            }

            .stats-mini {
                gap: 7px;
            }

            .stat-mini {
                padding:
                    12px 8px;
            }

            .stat-mini .number {
                font-size: 16px;
            }

            .stat-mini .label {
                font-size: 6.5px;
            }

            .feedback-item-admin {
                padding:
                    13px 11px;
            }

            .feedback-item-admin .fb-comment {
                font-size: 11px;
            }

            .feedback-item-admin .fb-actions .btn-sm {
                font-size: 9px;
            }
        }

        /* =========================================================
           ACCESSIBILITY
        ========================================================= */

        *:focus-visible {
            outline:
                3px solid
                rgba(37,99,235,0.22);

            outline-offset: 2px;
        }

        /* =========================================================
           REDUCE MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                scroll-behavior: auto !important;

                transition-duration:
                    0.01ms !important;

                animation-duration:
                    0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="admin-page">

        <!-- Sidebar injected -->

        <div class="main-content">

            <!-- =========================
                 PAGE HEADER
            ========================= -->

            <div class="page-header">

                <div>

                    <h1>

                        <i
                            class="fas fa-star"
                            style="color:#f59e0b;"
                        ></i>

                        Feedback

                        <small id="fbCount">
                            Loading...
                        </small>

                    </h1>

                </div>

            </div>

            <!-- =========================
                 FEEDBACK STATS
            ========================= -->

            <div
                class="stats-mini"
                id="fbStats"
            >
                <!-- Injected by JS -->
            </div>

            <!-- =========================
                 FEEDBACK
            ========================= -->

            <div id="feedbackContainer">
                <!-- Injected by JS -->
            </div>

        </div>

    </div>

    <!-- ===== Script ===== -->

    <script type="module">

        import { createSidebar } from '../../components/sidebar.js';
        import { createFooter } from '../../components/footer.js';
        import { isLoggedIn, getCurrentUser } from '../../js/auth.js';
        import {
            getAllFeedback,
            getFeedbackStats,
            deleteFeedback,
            replyToFeedback
        } from '../../js/feedback.js';

        import { showToast } from '../../js/main.js';

        import {
            formatDate
        } from '../../js/utils/formatters.js';

        // ---- Check Admin ----

        const user = getCurrentUser();

        const isLoggedInUser = isLoggedIn();

        if (
            !isLoggedInUser ||
            user?.role !== 'admin'
        ) {

            showToast(
                'Access denied. Admin only.',
                'error'
            );

            setTimeout(
                () =>
                    window.location.href =
                        '../common/login.html',
                1500
            );
        }

        // ---- Render Sidebar ----

        const sidebarContainer =
            document.createElement('div');

        sidebarContainer.id =
            'sidebarContainer';

        document.body.prepend(
            sidebarContainer
        );

        let sidebarOpen =
            window.innerWidth > 1024;

        function toggleSidebar() {

            sidebarOpen =
                !sidebarOpen;

            const sidebar =
                document.querySelector(
                    '.admin-sidebar'
                );

            const overlay =
                document.querySelector(
                    '.sidebar-overlay'
                );

            if (sidebar)
                sidebar.classList.toggle(
                    'open',
                    sidebarOpen
                );

            if (overlay)
                overlay.style.display =
                    sidebarOpen &&
                    window.innerWidth <= 1024
                        ? 'block'
                        : 'none';
        }

        sidebarContainer.innerHTML =
            createSidebar({

                brandText:
                    'SmartCafeteria',

                brandIcon:
                    'fa-utensils',

                userRole:
                    'admin',

                userName:
                    user?.name || 'Admin',

                isOpen:
                    sidebarOpen,

                onToggle:
                    toggleSidebar,

                navItems: [

                    {
                        label: 'Dashboard',
                        icon: 'fa-chart-pie',
                        href: 'dashboard.html'
                    },

                    {
                        label: 'Users',
                        icon: 'fa-users',
                        href: 'users.html'
                    },

                    {
                        label: 'Menu',
                        icon: 'fa-utensils',
                        href: 'menu.html'
                    },

                    {
                        label: 'Categories',
                        icon: 'fa-tags',
                        href: 'categories.html'
                    },

                    {
                        label: 'Orders',
                        icon: 'fa-shopping-bag',
                        href: 'orders.html'
                    },

                    {
                        label: 'Payments',
                        icon: 'fa-credit-card',
                        href: 'payments.html'
                    },

                    {
                        label: 'Feedback',
                        icon: 'fa-star',
                        href: 'feedback.html',
                        active: true
                    },

                    {
                        label: 'Cancellations',
                        icon: 'fa-times-circle',
                        href: 'cancellations.html'
                    },

                    {
                        label: 'Reports',
                        icon: 'fa-file-alt',
                        href: 'reports.html'
                    },

                    {
                        label: 'Settings',
                        icon: 'fa-cog',
                        href: 'settings.html'
                    },

                ],

            });

        // ---- Footer ----

        document.body.insertAdjacentHTML(
            'beforeend',

            createFooter({

                quickLinks: [

                    {
                        label: 'Home',
                        href: '../../index.html'
                    },

                    {
                        label: 'Menu',
                        href: '../customer/menu.html'
                    },

                    {
                        label: 'Login',
                        href: '../common/login.html'
                    },

                    {
                        label: 'Register',
                        href: '../common/register.html'
                    },

                ],

                roleLinks: [

                    {
                        label: 'Customer',
                        href: '../customer/menu.html'
                    },

                    {
                        label: 'Kitchen',
                        href: '../kitchen/dashboard.html'
                    },

                    {
                        label: 'Admin',
                        href: 'dashboard.html'
                    },

                ],

            })
        );

        // ---- DOM ----

        const container =
            document.getElementById(
                'feedbackContainer'
            );

        const statsContainer =
            document.getElementById(
                'fbStats'
            );

        const fbCount =
            document.getElementById(
                'fbCount'
            );

        // ---- Render ----

        function renderFeedback() {

            const feedbacks =
                getAllFeedback();

            const stats =
                getFeedbackStats();

            // Stats

            statsContainer.innerHTML = `

                <div class="stat-mini">

                    <div class="number">
                        ${stats.total}
                    </div>

                    <div class="label">
                        Total
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.pending}
                    </div>

                    <div class="label">
                        Pending
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.averageRating || 0}
                    </div>

                    <div class="label">
                        Avg Rating
                    </div>

                </div>

                <div class="stat-mini">

                    <div class="number">
                        ${stats.approved}
                    </div>

                    <div class="label">
                        Approved
                    </div>

                </div>

            `;

            fbCount.textContent =
                `${feedbacks.length} feedback${
                    feedbacks.length !== 1
                        ? 's'
                        : ''
                }`;

            if (feedbacks.length === 0) {

                container.innerHTML = `

                    <div class="empty-state">

                        <i
                            class="fas fa-star"
                            style="
                                font-size:40px;
                                color:var(--gray-300);
                                display:block;
                                margin-bottom:8px;
                            "
                        ></i>

                        <p>
                            No feedback submitted yet.
                        </p>

                    </div>

                `;

                return;
            }

            container.innerHTML = `

                <div class="feedback-list">

                    ${feedbacks.map(
                        fb => `

                        <div
                            class="feedback-item-admin"
                        >

                            <div
                                class="fb-header"
                            >

                                <div>

                                    <span
                                        class="fb-rating"
                                    >
                                        ${
                                            '★'.repeat(
                                                fb.rating
                                            )
                                        }${
                                            '☆'.repeat(
                                                5 - fb.rating
                                            )
                                        }
                                    </span>

                                    <span
                                        class="fb-user"
                                    >
                                        ${
                                            fb.userId ||
                                            'Anonymous'
                                        }
                                    </span>

                                    <span
                                        class="fb-status ${fb.status}"
                                    >
                                        ${fb.status}
                                    </span>

                                </div>

                                <span
                                    class="fb-date"
                                >
                                    ${formatDate(
                                        fb.createdAt
                                    )}
                                </span>

                            </div>

                            <div
                                class="fb-comment"
                            >
                                ${fb.comment}
                            </div>

                            ${
                                fb.reply
                                    ? `

                                <div
                                    style="
                                        margin:8px 0 10px;
                                        padding:8px 14px;
                                        background:#f0fdf4;
                                        border-radius:8px;
                                        border-left:3px solid #16a34a;
                                        font-size:13px;
                                        color:var(--gray-700);
                                    "
                                >

                                    <strong
                                        style="
                                            color:#16a34a;
                                        "
                                    >
                                        Reply:
                                    </strong>

                                    ${fb.reply}

                                </div>

                            `
                                    : ''
                            }

                            <div
                                class="fb-actions"
                            >

                                ${
                                    fb.status ===
                                    'pending'
                                        ? `

                                    <button
                                        class="
                                            btn-sm
                                            btn-sm-approve
                                        "
                                        data-id="${fb.id}"
                                    >

                                        <i
                                            class="fas fa-check"
                                        ></i>

                                        Approve

                                    </button>

                                `
                                        : ''
                                }

                                <button
                                    class="
                                        btn-sm
                                        btn-sm-reply
                                    "
                                    data-id="${fb.id}"
                                >

                                    <i
                                        class="fas fa-reply"
                                    ></i>

                                    Reply

                                </button>

                                <button
                                    class="
                                        btn-sm
                                        btn-sm-delete-fb
                                    "
                                    data-id="${fb.id}"
                                >

                                    <i
                                        class="fas fa-trash"
                                    ></i>

                                    Delete

                                </button>

                            </div>

                        </div>

                    `
                    ).join('')}

                </div>

            `;

            // ---- Approve ----

            document
                .querySelectorAll(
                    '.btn-sm-approve'
                )
                .forEach(btn => {

                    btn.addEventListener(
                        'click',
                        async function() {

                            const id =
                                this.dataset.id;

                            const reply =
                                prompt(
                                    'Reply to this feedback (optional):'
                                );

                            if (
                                reply !== null
                            ) {

                                const result =
                                    await replyToFeedback(
                                        id,
                                        reply ||
                                            'Thank you for your feedback!'
                                    );

                                if (
                                    result.success
                                ) {

                                    showToast(
                                        'Feedback approved!',
                                        'success'
                                    );

                                    renderFeedback();

                                } else {

                                    showToast(
                                        result.error ||
                                            'Failed',
                                        'error'
                                    );
                                }
                            }
                        }
                    );
                });

            // ---- Reply ----

            document
                .querySelectorAll(
                    '.btn-sm-reply'
                )
                .forEach(btn => {

                    btn.addEventListener(
                        'click',
                        async function() {

                            const id =
                                this.dataset.id;

                            const reply =
                                prompt(
                                    'Enter your reply:'
                                );

                            if (
                                reply &&
                                reply.trim()
                            ) {

                                const result =
                                    await replyToFeedback(
                                        id,
                                        reply.trim()
                                    );

                                if (
                                    result.success
                                ) {

                                    showToast(
                                        'Reply sent!',
                                        'success'
                                    );

                                    renderFeedback();

                                } else {

                                    showToast(
                                        result.error ||
                                            'Failed',
                                        'error'
                                    );
                                }
                            }
                        }
                    );
                });

            // ---- Delete ----

            document
                .querySelectorAll(
                    '.btn-sm-delete-fb'
                )
                .forEach(btn => {

                    btn.addEventListener(
                        'click',
                        async function() {

                            const id =
                                this.dataset.id;

                            if (
                                confirm(
                                    'Delete this feedback?'
                                )
                            ) {

                                const result =
                                    await deleteFeedback(
                                        id
                                    );

                                if (
                                    result.success
                                ) {

                                    showToast(
                                        'Feedback deleted',
                                        'info'
                                    );

                                    renderFeedback();

                                } else {

                                    showToast(
                                        result.error ||
                                            'Failed',
                                        'error'
                                    );
                                }
                            }
                        }
                    );
                });
        }

        // ---- Init ----

        renderFeedback();

        // ---- Resize handler ----

        window.addEventListener(
            'resize',
            () => {

                if (
                    window.innerWidth > 1024
                ) {

                    sidebarOpen = true;

                    const sidebar =
                        document.querySelector(
                            '.admin-sidebar'
                        );

                    const overlay =
                        document.querySelector(
                            '.sidebar-overlay'
                        );

                    if (sidebar)
                        sidebar.classList.add(
                            'open'
                        );

                    if (overlay)
                        overlay.style.display =
                            'none';

                } else {

                    const overlay =
                        document.querySelector(
                            '.sidebar-overlay'
                        );

                    if (overlay)
                        overlay.style.display =
                            sidebarOpen
                                ? 'block'
                                : 'none';
                }

            }
        );

        console.log(
            '⭐ Admin Feedback page loaded successfully!'
        );

    </script>

</body>
</html>

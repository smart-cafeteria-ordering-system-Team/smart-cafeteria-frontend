<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/frontend/src/css/admin.css">
</head>
<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main">
            <div class="page-header">
                <div>
                    <h1>Categories</h1>
                    <p class="subtitle">Manage menu categories and their visibility.</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="openAddCategoryBtn">
                        <i class="fa-solid fa-plus"></i> Add Category
                    </button>
                </div>
            </div>

            <!-- FILTER TOOLBAR -->
            <section class="card">
                <div class="card-header users-toolbar">
                    <div class="search-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="categorySearchInput" class="form-control" placeholder="Search categories...">
                    </div>
                    <div class="filter-group">
                        <select id="statusFilter" class="form-select">
                            <option value="">All Status</option>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                        <button class="btn btn-secondary" id="resetFiltersBtn" title="Reset filters">
                            <i class="fa-solid fa-filter-circle-xmark"></i> Reset
                        </button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Description</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesTableBody">
                            <tr><td colspan="6" class="table-empty">Loading categories...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination">
                    <span class="pagination-info" id="paginationInfo">Page 1</span>
                    <div class="pagination-actions">
                        <button class="btn btn-secondary" id="prevPageBtn" title="Previous page"><i class="fa-solid fa-chevron-left"></i> Prev</button>
                        <button class="btn btn-secondary" id="nextPageBtn" title="Next page">Next <i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ===== ADD / EDIT CATEGORY MODAL ===== -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="categoryModalTitle">Add New Category</h3>
                <button class="modal-close" data-close-modal="categoryModal">&times;</button>
            </div>
            <form id="categoryForm">
                <input type="hidden" name="id" id="categoryId">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="categoryName" class="form-label">Category Name <span class="required">*</span></label>
                            <input type="text" name="name" id="categoryName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="categoryIcon" class="form-label">Icon</label>
                            <input type="text" name="icon" id="categoryIcon" class="form-control" placeholder="fa-solid fa-utensils">
                        </div>
                        <div class="form-group">
                            <label for="categoryDescription" class="form-label">Description</label>
                            <textarea name="description" id="categoryDescription" class="form-control" rows="3" placeholder="Optional description"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Status</label>
                            <label class="switch">
                                <input type="checkbox" name="isActive" id="categoryIsActive" checked>
                                <span class="switch-slider"></span>
                            </label>
                            <small class="form-text">Active categories are visible to customers</small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal="categoryModal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveCategoryBtn">Save Category</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../../js/admin-api.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/admin-ui.js"></script>
    <script src="../../js/admin-categories.js"></script>

    <script>
        // Page-specific initialization
        function initPageSpecific() {
            // admin-categories.js handles initialization via its own DOMContentLoaded
        }
    </script>
</body>
</html>

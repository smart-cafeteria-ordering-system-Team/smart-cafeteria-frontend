<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/frontend/src/css/admin.css">
</head>
<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main"></main>
    </div>

    <!-- ===== ADD / EDIT USER MODAL ===== -->
    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add New User</h3>
                <button class="modal-close" data-close-modal="userModal">&times;</button>
            </div>
            <form id="userForm">
                <input type="hidden" name="id" id="userId">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="userName" class="form-label">Full Name <span class="required">*</span></label>
                            <input type="text" name="name" id="userName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="userEmail" class="form-label">Email Address <span class="required">*</span></label>
                            <input type="email" name="email" id="userEmail" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="userPhone" class="form-label">Phone (09XXXXXXXX) <span class="required">*</span></label>
                            <input type="tel" name="phone" id="userPhone" class="form-control" pattern="(09|07)[0-9]{8}" placeholder="09XXXXXXXX" required>
                        </div>
                        <div class="form-group">
                            <label for="userRole" class="form-label">Role <span class="required">*</span></label>
                            <select name="role" id="userRole" class="form-select" required>
                                <option value="STUDENT">Student</option>
                                <option value="STAFF">Staff</option>
                                <option value="KITCHEN_STAFF">Kitchen Staff</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="userBalance" class="form-label">Wallet Balance (ETB)</label>
                            <input type="number" name="balance" id="userBalance" class="form-control" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label for="userPassword" id="passwordLabel" class="form-label">Password <span class="required">*</span></label>
                            <input type="password" name="password" id="userPassword" class="form-control" autocomplete="new-password">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal="userModal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveUserBtn">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== VIEW USER DETAILS MODAL ===== -->
    <div class="modal-overlay" id="viewUserModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">User Details</h3>
                <button class="modal-close" data-close-modal="viewUserModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-hero">
                    <div class="avatar detail-avatar" id="detailAvatar">U</div>
                    <div>
                        <h4 id="detailName">—</h4>
                        <div id="detailRoleWrap">—</div>
                    </div>
                </div>
                <div class="detail-grid">
                    <div class="detail-item"><span>User ID</span><strong id="detailId">—</strong></div>
                    <div class="detail-item"><span>Email</span><strong id="detailEmail">—</strong></div>
                    <div class="detail-item"><span>Phone</span><strong id="detailPhone">—</strong></div>
                    <div class="detail-item"><span>Balance</span><strong id="detailBalance">0 ETB</strong></div>
                    <div class="detail-item"><span>Status</span><strong id="detailStatus">—</strong></div>
                    <div class="detail-item"><span>Joined</span><strong id="detailJoined">—</strong></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal="viewUserModal">Close</button>
            </div>
        </div>
    </div>

    <!-- ===== ASSIGN ROLE MODAL ===== -->
    <div class="modal-overlay" id="assignRoleModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Assign Role</h3>
                <button class="modal-close" data-close-modal="assignRoleModal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="form-text" style="margin-bottom:1rem;">Change role for <strong id="assignRoleName">—</strong></p>
                <div class="form-group">
                    <label for="assignRoleSelect" class="form-label">Role</label>
                    <select id="assignRoleSelect" class="form-select">
                        <option value="STUDENT">Student</option>
                        <option value="STAFF">Staff</option>
                        <option value="KITCHEN_STAFF">Kitchen Staff</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal="assignRoleModal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmAssignRoleBtn">Save Role</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../../js/admin-api.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/admin-ui.js"></script>
    <script src="../../js/users.js"></script>

    <script>
        // Page-specific initialization
        function initPageSpecific() {
            // users.js handles initialization via its own DOMContentLoaded
            // This function is called by admin-layout.js after layout is rendered
        }
    </script>
</body>
</html>

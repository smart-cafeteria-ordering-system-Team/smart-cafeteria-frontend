<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard | Smart Cafeteria</title>

    <!-- =========================================================
         GOOGLE FONTS
         ========================================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- =========================================================
         FONT AWESOME
         ========================================================= -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- =========================================================
         EXISTING CSS FILES — PATHS PRESERVED
         ========================================================= -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           SMART CAFETERIA — PREMIUM RESPONSIVE ADMIN DASHBOARD
           ========================================================= */

        :root {
            --sidebar-width: 260px;

            --luxury-blue: #2563eb;
            --luxury-indigo: #4f46e5;
            --luxury-purple: #7c3aed;
            --luxury-pink: #ec4899;
            --luxury-cyan: #06b6d4;
            --luxury-green: #10b981;
            --luxury-orange: #f97316;
            --luxury-yellow: #f59e0b;

            --dark: #111827;
            --dark-2: #172033;
            --muted: #64748b;
            --soft: #f8fafc;
            --white: #ffffff;

            --border: rgba(148,163,184,.16);

            --premium-shadow:
                0 20px 50px rgba(15,23,42,.10);

            --premium-shadow-hover:
                0 28px 65px rgba(37,99,235,.18);
        }

        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-width: 0;
            min-height: 100vh;
            margin: 0;

            font-family: "Poppins", sans-serif;

            color: var(--dark);

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 5% 5%,
                    rgba(37,99,235,.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 95% 10%,
                    rgba(236,72,153,.10),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(16,185,129,.09),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #ffffff 45%,
                    #f8f7ff 100%
                );
        }

        img,
        svg,
        video,
        canvas {
            max-width: 100%;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================
           PAGE BACKGROUND
           ========================================================= */

        .admin-page {
            position: relative;

            width: 100%;
            min-height: 100vh;

            overflow-x: clip;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(59,130,246,.07),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 30%,
                    rgba(168,85,247,.06),
                    transparent 30%
                );
        }

        .admin-page::before {
            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            top: 60px;
            right: -120px;

            background:
                linear-gradient(
                    135deg,
                    rgba(99,102,241,.12),
                    rgba(236,72,153,.06)
                );

            filter: blur(35px);

            border-radius: 50%;

            pointer-events: none;

            z-index: 0;
        }

        .admin-page::after {
            content: "";

            position: fixed;

            width: 260px;
            height: 260px;

            bottom: 30px;
            left: 150px;

            background:
                linear-gradient(
                    135deg,
                    rgba(6,182,212,.08),
                    rgba(16,185,129,.06)
                );

            filter: blur(38px);

            border-radius: 50%;

            pointer-events: none;

            z-index: 0;
        }

        /* =========================================================
           MAIN CONTENT
           ========================================================= */

        .admin-page .main-content {
            position: relative;
            z-index: 1;

            width: auto;
            min-width: 0;

            margin-left: var(--sidebar-width);

            padding:
                clamp(18px, 2.2vw, 32px)
                clamp(18px, 2.5vw, 38px)
                70px;

            transition:
                margin-left .3s ease,
                padding .3s ease;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .admin-header {
            position: relative;

            width: 100%;
            min-width: 0;

            display: flex !important;

            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;

            gap: 18px;

            overflow: hidden;

            padding:
                clamp(18px, 2vw, 27px) !important;

            margin-bottom: 25px !important;

            border:
                1px solid rgba(148,163,184,.16) !important;

            border-radius:
                clamp(18px, 2vw, 24px) !important;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.96),
                    rgba(248,250,255,.93)
                ) !important;

            box-shadow:
                0 18px 45px rgba(15,23,42,.08),
                inset 0 1px 0 rgba(255,255,255,.95);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .admin-header::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 6px;
            height: 100%;

            background:
                linear-gradient(
                    180deg,
                    #2563eb,
                    #7c3aed,
                    #ec4899
                );

            border-radius:
                20px 0 0 20px;
        }

        .admin-header::after {
            content: "";

            position: absolute;

            width: 190px;
            height: 190px;

            top: -95px;
            right: -60px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,.14),
                    rgba(236,72,153,.05)
                );

            pointer-events: none;
        }

        .admin-header > div:first-child {
            position: relative;
            z-index: 2;

            min-width: 0;

            flex: 1 1 280px;
        }

        .admin-header h1 {
            position: relative;
            z-index: 2;

            margin: 0 !important;

            font-size:
                clamp(20px, 2vw, 26px) !important;

            line-height: 1.2;

            font-weight: 800 !important;

            letter-spacing: -.5px;

            background:
                linear-gradient(
                    90deg,
                    #172554,
                    #2563eb,
                    #7c3aed
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-header h1 i {
            margin-right: 8px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-header p {
            position: relative;
            z-index: 2;

            margin:
                7px 0 0 !important;

            color: #64748b !important;

            font-size:
                clamp(11px, 1vw, 13px) !important;

            font-weight: 500 !important;

            line-height: 1.5;
        }

        .admin-header > div:last-child {
            position: relative;
            z-index: 4;

            display: flex !important;

            align-items: center;

            justify-content: flex-end;

            gap: 9px !important;

            flex:
                0 1 auto;
        }

        .admin-header > div:last-child > span {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            min-width: max-content;

            padding:
                9px 13px;

            color: #475569;

            background:
                rgba(248,250,252,.92);

            border:
                1px solid #e2e8f0;

            border-radius: 12px;

            font-size: 11px;

            font-weight: 600;

            white-space: nowrap;
        }

        #refreshDashboardBtn {
            display: inline-flex !important;

            align-items: center;
            justify-content: center;

            min-height: 40px;

            padding:
                10px 17px !important;

            border: 0 !important;

            border-radius: 12px !important;

            color: #fff !important;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5,
                    #7c3aed
                ) !important;

            box-shadow:
                0 9px 20px rgba(79,70,229,.24);

            font-size: 12px !important;
            font-weight: 700 !important;

            white-space: nowrap;

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        #refreshDashboardBtn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 28px rgba(79,70,229,.32);
        }

        #refreshDashboardBtn i {
            margin-right: 6px;
        }

        /* =========================================================
           STATS GRID
           ========================================================= */

        .stats-grid {
            display: grid;

            width: 100%;
            min-width: 0;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap:
                clamp(12px, 1.4vw, 19px);

            margin-bottom: 25px;
        }

        .stat-card {
            position: relative;

            min-width: 0;
            min-height: 172px;

            overflow: hidden;

            padding:
                clamp(17px, 1.7vw, 24px) !important;

            border:
                1px solid rgba(148,163,184,.14) !important;

            border-radius:
                clamp(17px, 1.7vw, 22px) !important;

            background:
                rgba(255,255,255,.90) !important;

            box-shadow:
                0 15px 40px rgba(15,23,42,.08) !important;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }

        .stat-card:hover {
            transform: translateY(-6px) !important;

            box-shadow:
                0 24px 50px rgba(15,23,42,.14) !important;
        }

        .stat-card::before {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            right: -45px;
            top: -45px;

            border-radius: 50%;

            opacity: .13;

            pointer-events: none;
        }

        .stat-card.primary::before {
            background: #2563eb;
        }

        .stat-card.success::before {
            background: #10b981;
        }

        .stat-card.warning::before {
            background: #f59e0b;
        }

        .stat-card.danger::before {
            background: #ec4899;
        }

        .stat-card::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 4px;
        }

        .stat-card.primary::after {
            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #60a5fa
                );
        }

        .stat-card.success::after {
            background:
                linear-gradient(
                    90deg,
                    #059669,
                    #34d399
                );
        }

        .stat-card.warning::after {
            background:
                linear-gradient(
                    90deg,
                    #f59e0b,
                    #fbbf24
                );
        }

        .stat-card.danger::after {
            background:
                linear-gradient(
                    90deg,
                    #ec4899,
                    #a855f7
                );
        }

        .stat-card .stat-icon {
            position: relative;
            z-index: 2;

            width: 52px;
            height: 52px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 12px;

            border-radius: 16px;

            color: #fff !important;

            font-size: 21px !important;

            box-shadow:
                0 10px 22px rgba(15,23,42,.16);
        }

        .stat-card.primary .stat-icon {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );
        }

        .stat-card.success .stat-icon {
            background:
                linear-gradient(
                    135deg,
                    #059669,
                    #10b981
                );
        }

        .stat-card.warning .stat-icon {
            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #f97316
                );
        }

        .stat-card.danger .stat-icon {
            background:
                linear-gradient(
                    135deg,
                    #ec4899,
                    #8b5cf6
                );
        }

        .stat-card .stat-number {
            position: relative;
            z-index: 2;

            min-width: 0;

            overflow: hidden;

            text-overflow: ellipsis;

            font-size:
                clamp(20px, 2vw, 28px) !important;

            line-height: 1.15;

            font-weight: 800 !important;

            color: #111827 !important;

            letter-spacing: -.6px;
        }

        .stat-card .stat-label {
            position: relative;
            z-index: 2;

            margin-top: 4px;

            color: #64748b !important;

            font-size:
                clamp(9px, .8vw, 12px) !important;

            font-weight: 700 !important;

            text-transform: uppercase;

            letter-spacing: .5px;

            line-height: 1.35;
        }

        .stat-card .stat-change {
            position: relative;
            z-index: 2;

            margin-top: 9px !important;

            font-size:
                clamp(9px, .8vw, 11px) !important;

            font-weight: 700 !important;

            line-height: 1.3;
        }

        .stat-change.up {
            color: #059669;
        }

        /* =========================================================
           CHART ROW
           ========================================================= */

        .charts-row {
            display: grid;

            width: 100%;
            min-width: 0;

            grid-template-columns:
                minmax(0, 1.85fr)
                minmax(300px, .95fr);

            align-items: stretch;

            gap:
                clamp(14px, 1.8vw, 22px);

            margin-bottom: 28px;
        }

        .chart-card {
            position: relative;

            width: 100%;
            min-width: 0;

            overflow: hidden;

            padding:
                clamp(17px, 1.8vw, 24px) !important;

            border:
                1px solid rgba(148,163,184,.14) !important;

            border-radius:
                clamp(18px, 1.8vw, 23px) !important;

            background:
                rgba(255,255,255,.92) !important;

            box-shadow:
                0 18px 45px rgba(15,23,42,.075) !important;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .chart-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed,
                    #ec4899
                );
        }

        .chart-card h3 {
            position: relative;

            display: flex;

            align-items: center;

            gap: 9px;

            min-width: 0;

            margin:
                2px 0 20px !important;

            color: #172033 !important;

            font-size:
                clamp(14px, 1.2vw, 17px) !important;

            line-height: 1.3;

            font-weight: 800 !important;
        }

        .chart-card h3 i {
            flex: 0 0 34px;

            width: 34px;
            height: 34px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #eef2ff
                );

            box-shadow:
                0 6px 14px rgba(37,99,235,.08);
        }

        /* =========================================================
           RECENT ORDERS
           ========================================================= */

        #recentOrdersContainer {
            width: 100%;
            max-width: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            border-radius: 15px;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: thin;
        }

        .recent-orders-table {
            width: 100%;

            min-width: 600px;

            border-collapse: separate;
            border-spacing: 0;

            font-size: 13px !important;
        }

        .recent-orders-table th {
            padding:
                12px 13px !important;

            background:
                linear-gradient(
                    90deg,
                    #f8fafc,
                    #f1f5f9
                );

            color: #64748b !important;

            border-bottom:
                1px solid #e2e8f0 !important;

            font-size: 10px !important;

            font-weight: 800 !important;

            letter-spacing: .08em;

            white-space: nowrap;
        }

        .recent-orders-table th:first-child {
            border-radius: 12px 0 0 0;
        }

        .recent-orders-table th:last-child {
            border-radius: 0 12px 0 0;
        }

        .recent-orders-table td {
            padding:
                14px 13px !important;

            border-bottom:
                1px solid #f1f5f9 !important;

            color: #475569;

            font-weight: 500;

            white-space: nowrap;
        }

        .recent-orders-table tbody tr {
            transition:
                background .2s ease;
        }

        .recent-orders-table tbody tr:hover {
            background:
                linear-gradient(
                    90deg,
                    #f8fbff,
                    #faf7ff
                ) !important;
        }

        .recent-orders-table td strong {
            color: #1e3a8a;

            font-weight: 800;
        }

        /* =========================================================
           STATUS
           ========================================================= */

        .status-badge {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding:
                5px 11px !important;

            border-radius: 999px !important;

            font-size: 9px !important;

            font-weight: 800 !important;

            letter-spacing: .06em;

            border: 1px solid transparent;

            white-space: nowrap;
        }

        .status-badge.pending {
            background: #fff7ed !important;
            color: #c2410c !important;
            border-color: #fed7aa;
        }

        .status-badge.preparing {
            background: #ecfeff !important;
            color: #0e7490 !important;
            border-color: #a5f3fc;
        }

        .status-badge.ready {
            background: #ecfdf5 !important;
            color: #047857 !important;
            border-color: #a7f3d0;
        }

        .status-badge.served {
            background: #f1f5f9 !important;
            color: #475569 !important;
            border-color: #e2e8f0;
        }

        .status-badge.cancelled {
            background: #fff1f2 !important;
            color: #be123c !important;
            border-color: #fecdd3;
        }

        /* =========================================================
           QUICK ACTIONS
           ========================================================= */

        .quick-actions {
            display: flex;

            flex-direction: column;

            gap: 12px;

            width: 100%;
        }

        .quick-action {
            position: relative;

            display: flex !important;

            align-items: center;

            width: 100%;
            min-width: 0;
            min-height: 66px;

            gap: 12px;

            padding:
                10px 13px !important;

            border-radius: 17px !important;

            text-decoration: none !important;

            overflow: hidden;

            isolation: isolate;

            transition:
                transform .3s ease,
                box-shadow .3s ease,
                border-color .3s ease;
        }

        .quick-action::before {
            content: "";

            position: absolute;

            top: 0;
            left: -130%;

            width: 80%;
            height: 100%;

            background:
                linear-gradient(
                    105deg,
                    transparent,
                    rgba(255,255,255,.35),
                    transparent
                );

            transform: skewX(-20deg);

            transition:
                left .65s ease;

            z-index: -1;
        }

        .quick-action:hover::before {
            left: 130%;
        }

        .quick-action .quick-icon {
            width: 45px;
            height: 45px;

            flex:
                0 0 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            font-size: 17px;

            color: #fff;

            box-shadow:
                0 9px 20px rgba(0,0,0,.16);

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }

        .quick-action:hover .quick-icon {
            transform:
                rotate(-6deg)
                scale(1.08);

            box-shadow:
                0 13px 27px rgba(0,0,0,.22);
        }

        .quick-action .quick-text {
            display: flex;

            flex-direction: column;

            flex: 1 1 auto;

            min-width: 0;

            line-height: 1.2;
        }

        .quick-action .quick-title {
            display: block;

            min-width: 0;

            overflow: hidden;

            text-overflow: ellipsis;

            font-family: "Poppins", sans-serif;

            font-size:
                clamp(11px, .9vw, 13px);

            font-weight: 800;

            letter-spacing: .15px;

            line-height: 1.35;

            white-space: nowrap;
        }

        .quick-action .quick-subtitle {
            display: block;

            min-width: 0;

            overflow: hidden;

            text-overflow: ellipsis;

            margin-top: 4px;

            font-family: "Poppins", sans-serif;

            font-size:
                clamp(8px, .7vw, 10px);

            font-weight: 600;

            letter-spacing: .3px;

            opacity: .78;

            white-space: nowrap;
        }

        .quick-action .quick-arrow {
            margin-left: auto;

            width: 30px;
            height: 30px;

            flex:
                0 0 30px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 10px;

            transition:
                transform .3s ease,
                background .3s ease;
        }

        .quick-action:hover .quick-arrow {
            transform: translateX(4px);
        }

        /* =========================================================
           MENU ACTION
           ========================================================= */

        .quick-action.menu-action {
            color: #fff !important;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #2563eb 45%,
                    #6366f1
                ) !important;

            box-shadow:
                0 11px 25px rgba(37,99,235,.25);
        }

        .quick-action.menu-action:hover {
            transform: translateY(-4px);

            box-shadow:
                0 19px 38px rgba(37,99,235,.34);
        }

        .quick-action.menu-action .quick-icon {
            background:
                linear-gradient(
                    135deg,
                    #60a5fa,
                    #4f46e5
                );
        }

        .quick-action.menu-action .quick-arrow {
            background: rgba(255,255,255,.16);
        }

        /* =========================================================
           USERS
           ========================================================= */

        .quick-action.users-action {
            color: #5b21b6 !important;

            border:
                1px solid rgba(124,58,237,.18) !important;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #faf5ff
                ) !important;

            box-shadow:
                0 9px 22px rgba(124,58,237,.10);
        }

        .quick-action.users-action:hover {
            transform: translateY(-4px);

            border-color:
                rgba(124,58,237,.30) !important;

            box-shadow:
                0 18px 35px rgba(124,58,237,.18);
        }

        .quick-action.users-action .quick-icon {
            background:
                linear-gradient(
                    135deg,

    } from '../../js/orders.js';

    import {
        getFeedbackStats
    } from '../../js/feedback.js';

    /* =========================================================

       ========================================================= */

    const user = getCurrentUser();

    const isLoggedInUser = isLoggedIn();

    if (
        !isLoggedInUser ||
        user?.role !== 'admin'
    ) {

        showToast(
            'Access denied. Admin only.',
            'error'
        );

        setTimeout(() => {

            window.location.href =
                '../common/login.html';

        }, 1500);
    }


    /* =========================================================
       SIDEBAR
       ========================================================= */

    const sidebarContainer =
        document.createElement('div');

    sidebarContainer.id =
        'sidebarContainer';

    document.body.prepend(
        sidebarContainer
    );


    let sidebarOpen =
        window.innerWidth > 1024;


    function toggleSidebar() {

        sidebarOpen =
            !sidebarOpen;

        const sidebar =
            document.querySelector(
                '.admin-sidebar'
            );

        const overlay =
            document.querySelector(
                '.sidebar-overlay'
            );


        if (sidebar) {

            sidebar.classList.toggle(
                'open',
                sidebarOpen
            );
        }


        if (overlay) {

            overlay.style.display =
                sidebarOpen &&
                window.innerWidth <= 1024
                    ? 'block'
                    : 'none';
        }
    }


    renderSidebar();


    function renderSidebar() {

        sidebarContainer.innerHTML =
            createSidebar({

                brandText:
                    'SmartCafeteria',

                brandIcon:
                    'fa-utensils',

                userRole:
                    'admin',

                userName:
                    user?.name ||
                    'Admin',

                isOpen:
                    sidebarOpen,

                onToggle:
                    toggleSidebar,

                navItems: [

                    {
                        label:

                            'fa-chart-pie',

                        href:

        /* =====================================================

           ===================================================== */

        statsGrid.innerHTML = `

            </div>


            <div class="stat-card danger">

                <div class="stat-label">

                </div>

                <div class="stat-change">
                    ${feedbackStats.total} reviews

            </div>

        `;


        /* =====================================================
           RECENT ORDERS
           ===================================================== */

        const recentOrders =
            getAllOrders().slice(0, 5);


        if (
            recentOrders.length === 0
        ) {

            recentOrdersContainer.innerHTML = `

                <div
                    style="
                        text-align:center;
                        padding:35px 15px;
                        color:var(--gray-400);

                    <i
                        class="fas fa-shopping-bag"
                        style="
                            font-size:34px;
                            display:block;
                            margin-bottom:10px;
                        "
                    ></i>

                    <strong
                        style="
                            display:block;
                            font-size:14px;
                            color:#64748b;
                            margin-bottom:4px;
                        "
                    >

                    </strong>

                    <span
                        style="
                            font-size:11px;
                        "
                    >
                        New orders will appear here
                    </span>

                </div>

            `;

        } else {

            recentOrdersContainer.innerHTML = `

                <table
                    class="recent-orders-table"
                >

                    <thead>

                        <tr>

                            <th>
                                Order
                            </th>

                            <th>
                                Items
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Time
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${recentOrders.map(order => `

                            <tr>

                                <td>
                                    <strong>
                                        #${order.id}
                                    </strong>
                                </td>

                                <td>
                                    ${order.items.length}
                                    items
                                </td>

                                <td>
                                    ${order.totalAmount}
                                    ብር
                                </td>

                                <td>

                                    <span
                                        class="
                                            status-badge
                                            ${order.status}
                                        "
                                    >
                                        ${order.status}
                                    </span>

                                </td>

                                <td
                                    style="
                                        font-size:11px;
                                        color:#94a3b8;
                                        white-space:nowrap;
                                    "
                                >
                                    ${formatTime(
                                        order.orderTime
                                    )}
                                </td>

                            </tr>

                        `).join('')}

                    </tbody>

                </table>

            `;
        }
    }


    /* =========================================================
       REFRESH
       ========================================================= */

    document
        .getElementById(
            'refreshDashboardBtn'
        )
        .addEventListener(
            'click',
            () => {

                renderDashboard();

                showToast(
                    'Dashboard refreshed',
                    'success'
                );

            }
        );


    /* =========================================================
       AUTO REFRESH
       ========================================================= */

    setInterval(
        renderDashboard,
        60000
    );


    /* =========================================================
       INIT
       ========================================================= */

    renderDashboard();


    /* =========================================================
       RESPONSIVE SIDEBAR
       ========================================================= */

    window.addEventListener(
        'resize',
        () => {

            if (
                window.innerWidth > 1024
            ) {

                sidebarOpen = true;

                const sidebar =
                    document.querySelector(
                        '.admin-sidebar'
                    );

                const overlay =
                    document.querySelector(
                        '.sidebar-overlay'
                    );


                if (sidebar) {

                    sidebar.classList.add(
                        'open'
                    );
                }


                if (overlay) {

                    overlay.style.display =
                        'none';
                }

            } else {

                const overlay =
                    document.querySelector(
                        '.sidebar-overlay'
                    );

                if (overlay) {

                    overlay.style.display =
                        sidebarOpen
                            ? 'block'
                            : 'none';
                }
            }

        }
    );


    console.log(
        '📊 Admin Dashboard loaded successfully!'
    );

</script>

</body>
</html>

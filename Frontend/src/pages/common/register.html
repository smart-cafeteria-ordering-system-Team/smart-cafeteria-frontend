


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | Smart Cafeteria</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Project CSS -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           SMART CAFETERIA
           PREMIUM ALL-DEVICE RESPONSIVE REGISTER PAGE

           Base:
           WHITE + BLUE

           Accent:
           PURPLE / VIOLET / CYAN / GREEN /
           ORANGE / GOLD / PINK
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
        }

        .auth-page {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --blue-light: #60a5fa;

            --purple: #7c3aed;
            --violet: #8b5cf6;

            --cyan: #06b6d4;
            --teal: #14b8a6;

            --green: #10b981;
            --orange: #f97316;
            --gold: #f59e0b;
            --pink: #ec4899;

            --white: #ffffff;

            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            position: relative;
            isolation: isolate;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;

            padding:
                clamp(18px, 3vw, 50px)
                clamp(12px, 4vw, 70px);

            font-family: "Poppins", sans-serif;

            background:
                radial-gradient(
                    circle at 5% 8%,
                    rgba(37, 99, 235, .20),
                    transparent 24%
                ),
                radial-gradient(
                    circle at 95% 8%,
                    rgba(124, 58, 237, .18),
                    transparent 24%
                ),
                radial-gradient(
                    circle at 8% 92%,
                    rgba(6, 182, 212, .16),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 94% 92%,
                    rgba(16, 185, 129, .16),
                    transparent 24%
                ),
                linear-gradient(
                    135deg,
                    #eff6ff 0%,
                    #ffffff 37%,
                    #f5f3ff 67%,
                    #ecfeff 100%
                );
        }

        /* =========================================================
           BACKGROUND DECORATIONS
        ========================================================= */

        .auth-page::before {
            content: "";
            position: absolute;

            width: clamp(260px, 32vw, 560px);
            height: clamp(260px, 32vw, 560px);

            top: clamp(-240px, -14vw, -100px);
            left: clamp(-240px, -13vw, -80px);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(37, 99, 235, .25) 0%,
                    rgba(124, 58, 237, .14) 38%,
                    rgba(236, 72, 153, .07) 56%,
                    transparent 72%
                );

            filter: blur(2px);

            pointer-events: none;

            z-index: -2;
        }

        .auth-page::after {
            content: "";
            position: absolute;

            width: clamp(280px, 35vw, 620px);
            height: clamp(280px, 35vw, 620px);

            bottom: clamp(-280px, -15vw, -100px);
            right: clamp(-260px, -14vw, -90px);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(6, 182, 212, .20) 0%,
                    rgba(16, 185, 129, .13) 40%,
                    rgba(245, 158, 11, .07) 56%,
                    transparent 73%
                );

            filter: blur(2px);

            pointer-events: none;

            z-index: -2;
        }

        /* =========================================================
           CARD
        ========================================================= */

        .auth-card {
            width: min(100%, 560px);

            position: relative;
            z-index: 2;

            padding:
                clamp(24px, 3vw, 42px)
                clamp(18px, 3vw, 42px)
                clamp(22px, 2.5vw, 34px);

            border-radius:
                clamp(20px, 2vw, 30px);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.985),
                    rgba(255,255,255,.91)
                );

            border: 1px solid rgba(255,255,255,.95);

            box-shadow:
                0 35px 85px rgba(15,23,42,.14),
                0 15px 35px rgba(37,99,235,.09),
                0 5px 15px rgba(124,58,237,.05);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            overflow: hidden;

            animation:
                premiumAppear .65s cubic-bezier(.22,1,.36,1) both;
        }

        /* Gradient top decoration */

        .auth-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 7%;
            right: 7%;

            height: 4px;

            border-radius:
                0 0 10px 10px;

            background:
                linear-gradient(
                    90deg,
                    var(--blue),
                    var(--cyan),
                    var(--purple),
                    var(--pink),
                    var(--orange),
                    var(--green)
                );

            box-shadow:
                0 4px 16px rgba(124,58,237,.22);
        }

        /* Decorative glow */

        .auth-card::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -95px;
            top: -90px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(236,72,153,.14),
                    rgba(124,58,237,.08),
                    transparent 70%
                );

            pointer-events: none;
        }

        /* =========================================================
           BACK LINK
        ========================================================= */

        .auth-card .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: clamp(12px, 1.5vw, 18px);

            color: var(--gray-500);

            font-size: clamp(12px, 1vw, 13px);
            font-weight: 500;

            text-decoration: none;

            transition:
                color .25s ease,
                transform .25s ease;
        }

        .auth-card .back-link i {
            color: var(--blue);

            transition:
                color .25s ease,
                transform .25s ease;
        }

        .auth-card .back-link:hover {
            color: var(--purple);
            transform: translateX(-4px);
        }

        .auth-card .back-link:hover i {
            color: var(--pink);
        }

        /* =========================================================
           BRAND
        ========================================================= */

        .auth-card .brand {
            display: flex;
            align-items: center;

            margin-bottom: 5px;

            font-size:
                clamp(22px, 2.3vw, 29px);

            line-height: 1.2;

            font-weight: 800;

            letter-spacing: -.8px;

            color: transparent;

            background:
                linear-gradient(
                    90deg,
                    var(--blue),
                    var(--purple),
                    var(--pink)
                );

            -webkit-background-clip: text;
            background-clip: text;
        }

        .auth-card .brand i {
            flex-shrink: 0;

            margin-right: 9px;

            color: var(--orange);

            filter:
                drop-shadow(
                    0 5px 10px
                    rgba(249,115,22,.27)
                );
        }

        .auth-card .brand span {
            color: var(--gray-900);
        }

        .auth-card .subtitle {
            margin:
                0 0 clamp(17px, 2vw, 23px);

            color: var(--gray-500);

            font-size:
                clamp(11.5px, 1vw, 13px);

            line-height: 1.6;
        }

        /* =========================================================
           ALERT
        ========================================================= */

        .alert {
            display: none;

            width: 100%;

            margin-bottom: 15px;

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.5;
        }

        .alert.show {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .alert-error {
            color: #991b1b;

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #fee2e2
                );

            border:
                1px solid rgba(239,68,68,.18);

            border-left:
                4px solid #ef4444;
        }

        .alert-success {
            color: #166534;

            background:
                linear-gradient(
                    135deg,
                    #ecfdf5,
                    #dcfce7
                );

            border:
                1px solid rgba(16,185,129,.18);

            border-left:
                4px solid var(--green);
        }

        /* =========================================================
           FORM
        ========================================================= */

        #registerForm {
            width: 100%;
        }

        .form-row {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap:
                clamp(9px, 1.3vw, 14px);
        }

        .form-group {
            width: 100%;
            min-width: 0;

            margin-bottom:
                clamp(11px, 1.2vw, 15px);

            text-align: left;
        }

        .form-group label {
            display: block;

            margin-bottom: 5px;

            color: var(--gray-700);

            font-size:
                clamp(11.5px, .9vw, 12.5px);

            line-height: 1.4;

            font-weight: 600;
        }

        .form-group label .required {
            color: var(--pink);
        }

        /* =========================================================
           INPUT
        ========================================================= */

        .form-control {
            display: block;

            width: 100%;
            min-width: 0;

            height:
                clamp(43px, 3.2vw, 48px);

            padding:
                9px clamp(10px, 1.2vw, 14px);

            color: var(--gray-800);

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f8fbff
                );

            border:
                1.8px solid var(--gray-200);

            border-radius: 12px;

            outline: none;

            font-family: "Poppins", sans-serif;

            font-size:
                clamp(11.5px, .95vw, 13px);

            transition:
                border .25s ease,
                box-shadow .25s ease,
                transform .25s ease,
                background .25s ease;
        }

        .form-control::placeholder {
            color: var(--gray-400);
            opacity: .9;
        }

        .form-control:hover {
            border-color: #a5b4fc;
        }

        .form-control:focus {
            border-color: var(--purple);

            background: #ffffff;

            transform: translateY(-1px);

            box-shadow:
                0 0 0 4px rgba(124,58,237,.08),
                0 8px 22px rgba(37,99,235,.07);
        }

        .form-control.error {
            border-color: #ef4444 !important;

            box-shadow:
                0 0 0 4px rgba(239,68,68,.08);
        }

        .form-control.success {
            border-color: var(--green) !important;

            box-shadow:
                0 0 0 4px rgba(16,185,129,.07);
        }

        .form-hint {
            margin-top: 4px;

            color: var(--gray-400);

            font-size:
                clamp(9.5px, .8vw, 10.5px);

            line-height: 1.4;
        }

        /* =========================================================
           ROLE SELECTOR
        ========================================================= */

        .role-selector {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap:
                clamp(5px, .7vw, 8px);

            width: 100%;
        }

        .role-option {
            position: relative;

            width: 100%;
            min-width: 0;

            padding:
                clamp(7px, .8vw, 10px)
                4px;

            border:
                1.8px solid var(--gray-200);

            border-radius: 13px;

            text-align: center;

            cursor: pointer;

            color: var(--gray-600);

            background: #ffffff;

            font-size: 10px;

            overflow: hidden;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease,
                background .25s ease;
        }

        .role-option::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            opacity: 0;

            transition: opacity .25s ease;
        }

        .role-option:nth-child(1)::before {
            background:
                linear-gradient(
                    90deg,
                    var(--blue),
                    var(--cyan)
                );
        }

        .role-option:nth-child(2)::before {
            background:
                linear-gradient(
                    90deg,
                    var(--orange),
                    var(--gold)
                );
        }

        .role-option:nth-child(3)::before {
            background:
                linear-gradient(
                    90deg,
                    var(--purple),
                    var(--pink)
                );
        }

        .role-option:nth-child(1) i {
            color: var(--blue);
        }

        .role-option:nth-child(2) i {
            color: var(--orange);
        }

        .role-option:nth-child(3) i {
            color: var(--purple);
        }

        .role-option:hover {
            transform: translateY(-3px);

            box-shadow:
                0 9px 22px
                rgba(15,23,42,.09);
        }

        .role-option.active {
            transform: translateY(-2px);

            color: var(--gray-800);

            border-color: transparent;

            box-shadow:
                0 9px 25px
                rgba(37,99,235,.11),
                inset 0 0 0 1.5px
                rgba(37,99,235,.15);
        }

        .role-option.active::before {
            opacity: 1;
        }

        .role-option:nth-child(1).active {
            background:
                linear-gradient(
                    145deg,
                    #eff6ff,
                    #ecfeff
                );
        }

        .role-option:nth-child(2).active {
            background:
                linear-gradient(
                    145deg,
                    #fff7ed,
                    #fffbeb
                );
        }

        .role-option:nth-child(3).active {
            background:
                linear-gradient(
                    145deg,
                    #f5f3ff,
                    #fdf2f8
                );
        }

        .role-option i {
            display: block;

            margin-bottom: 3px;

            font-size:
                clamp(15px, 1.5vw, 18px);
        }

        .role-label {
            display: block;

            font-size:
                clamp(7.5px, .75vw, 9.5px);

            line-height: 1.25;

            text-transform: uppercase;

            letter-spacing: .045em;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        /* =========================================================
           REGISTER BUTTON
        ========================================================= */

        .btn-register {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;

            min-height:
                clamp(45px, 3.4vw, 51px);

            margin-top: 3px;

            padding:
                10px 16px;

            border: 0;

            border-radius: 13px;

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size:
                clamp(12px, 1vw, 14px);

            font-weight: 700;

            cursor: pointer;

            overflow: hidden;

            background:
                linear-gradient(
                    100deg,
                    #2563eb 0%,
                    #4f46e5 22%,
                    #7c3aed 45%,
                    #ec4899 70%,
                    #f97316 100%
                );

            background-size: 250% 100%;

            box-shadow:
                0 10px 25px
                rgba(124,58,237,.23),
                0 4px 12px
                rgba(37,99,235,.14);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background-position .4s ease;
        }

        .btn-register::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    100deg,
                    transparent,
                    rgba(255,255,255,.35),
                    transparent
                );

            transform: skewX(-25deg);

            transition: left .6s ease;
        }

        .btn-register:hover {
            transform: translateY(-3px);

            background-position: 100% 50%;

            box-shadow:
                0 16px 35px
                rgba(124,58,237,.27),
                0 7px 18px
                rgba(37,99,235,.17);
        }

        .btn-register:hover::before {
            left: 150%;
        }

        .btn-register:active {
            transform: translateY(-1px);
        }

        .btn-register:disabled {
            opacity: .65;

            cursor: not-allowed;

            transform: none;
        }

        .btn-register .spinner {
            display: none;
        }

        .btn-register.loading .spinner {
            display: inline-block;

            animation:
                spin 1s linear infinite;
        }

        .btn-register.loading .btn-text {
            display: none;
        }

        /* =========================================================
           FOOTER
        ========================================================= */

        .footer-text {
            margin-top:
                clamp(14px, 1.6vw, 19px);

            color: var(--gray-500);

            text-align: center;

            font-size:
                clamp(10.5px, .9vw, 12.5px);

            line-height: 1.8;
        }

        .footer-text a {
            color: var(--blue);

            font-weight: 700;

            text-decoration: none;

            transition: color .2s ease;
        }

        .footer-text a:hover {
            color: var(--pink);
        }

        .demo-info {
            margin:
                10px 0 0;

            color: var(--gray-400);

            font-size:
                clamp(9px, .8vw, 11px);

            line-height: 1.5;

            text-align: center;
        }

        .demo-info i {
            color: var(--gold);
        }

        /* =========================================================
           LARGE PC
           1440px+
        ========================================================= */

        @media (min-width: 1440px) {

            .auth-page {
                padding:
                    55px
                    80px;
            }

            .auth-card {
                width: 570px;

                padding:
                    43px
                    45px
                    35px;
            }

            .form-row {
                gap: 16px;
            }
        }

        /* =========================================================
           STANDARD LAPTOP / PC
           1025px - 1439px
        ========================================================= */

        @media (min-width: 1025px) and (max-width: 1439px) {

            .auth-page {
                padding:
                    35px
                    35px;
            }

            .auth-card {
                width: min(100%, 550px);
            }
        }

        /* =========================================================
           TABLET LANDSCAPE / SMALL LAPTOP
           769px - 1024px
        ========================================================= */

        @media (min-width: 769px) and (max-width: 1024px) {

            .auth-page {
                padding:
                    30px
                    24px;
            }

            .auth-card {
                width: min(100%, 520px);

                padding:
                    34px
                    30px
                    28px;
            }

            .form-row {
                gap: 12px;
            }

            .auth-card .brand {
                font-size: 25px;
            }
        }

        /* =========================================================
           TABLET PORTRAIT
           601px - 768px
        ========================================================= */

        @media (min-width: 601px) and (max-width: 768px) {

            .auth-page {
                align-items: center;

                padding:
                    25px
                    18px;
            }

            .auth-card {
                width: min(100%, 500px);

                padding:
                    30px
                    26px
                    27px;
            }

            .form-row {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;
            }

            .auth-card .brand {
                font-size: 24px;
            }

            .form-control {
                height: 45px;
            }
        }

        /* =========================================================
           MOBILE
           481px - 600px
        ========================================================= */

        @media (max-width: 600px) {

            .auth-page {
                align-items: flex-start;

                padding:
                    20px
                    13px
                    28px;
            }

            .auth-card {
                width: 100%;

                max-width: 500px;

                padding:
                    28px
                    21px
                    24px;

                border-radius: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;

                gap: 0;
            }

            .form-group {
                margin-bottom: 13px;
            }

            .form-control {
                height: 46px;

                font-size: 13px;
            }

            .auth-card .brand {
                font-size: 23px;
            }

            .role-selector {
                gap: 6px;
            }
        }

        /* =========================================================
           SMALL MOBILE
           351px - 480px
        ========================================================= */

        @media (max-width: 480px) {

            .auth-page {
                padding:
                    15px
                    9px
                    24px;
            }

            .auth-card {
                padding:
                    26px
                    16px
                    22px;

                border-radius: 20px;
            }

            .auth-card .back-link {
                margin-bottom: 13px;
            }

            .auth-card .brand {
                font-size: 21px;
            }

            .auth-card .brand i {
                margin-right: 7px;
                font-size: 19px;
            }

            .auth-card .subtitle {
                font-size: 11px;

                margin-bottom: 17px;
            }

            .role-option {
                padding:
                    8px
                    3px;
            }

            .role-option i {
                font-size: 16px;
            }

            .role-label {
                font-size: 8px;
            }

            .btn-register {
                min-height: 47px;
            }
        }

        /* =========================================================
           VERY SMALL PHONE
           <= 350px
        ========================================================= */

        @media (max-width: 350px) {

            .auth-page {
                padding:
                    10px
                    6px
                    18px;
            }

            .auth-card {
                padding:
                    23px
                    12px
                    20px;

                border-radius: 18px;
            }

            .auth-card .brand {
                font-size: 19px;
            }

            .auth-card .brand i {
                font-size: 17px;
            }

            .role-selector {
                gap: 4px;
            }

            .role-option {
                padding:
                    7px
                    2px;
            }

            .role-option i {
                font-size: 14px;
            }

            .role-label {
                font-size: 7px;
            }

            .form-control {
                height: 44px;
                font-size: 12px;
            }
        }

        /* =========================================================
           LANDSCAPE MOBILE
        ========================================================= */

        @media (max-height: 620px) and (orientation: landscape) {

            .auth-page {
                align-items: flex-start;

                padding:
                    15px
                    20px;
            }

            .auth-card {
                margin:
                    0
                    auto;

                padding:
                    22px
                    25px;
            }

            .auth-card .subtitle {
                margin-bottom: 12px;
            }

            .form-group {
                margin-bottom: 9px;
            }

            .form-control {
                height: 42px;
            }
        }

        /* =========================================================
           ACCESSIBILITY / REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .auth-card,
            .role-option,
            .btn-register,
            .form-control,
            .back-link {
                animation: none !important;
                transition: none !important;
            }
        }

    </style>
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <!-- Back Link -->
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back
            </a>

            <!-- Brand -->
            <div class="brand">
                <i class="fas fa-utensils"></i>
                Smart<span>Cafeteria</span>
            </div>

            <p class="subtitle">
                Create your account / መለያ ይፍጠሩ
            </p>

            <!-- Alert -->
            <div
                class="alert alert-error"
                id="alertMessage"
                role="alert"
                aria-live="polite"
            >
                <i class="fas fa-exclamation-circle"></i>

                <span id="alertText">
                    Error message
                </span>
            </div>

            <!-- Register Form -->
            <form
                id="registerForm"
                onsubmit="return false;"
            >

                <!-- Full Name + Email -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            class="form-control"
                            placeholder="e.g., Abebe Kebede"
                            required
                        />

                    </div>

                    <div class="form-group">

                        <label for="email">
                            Email
                            <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="e.g., abebe@gmail.com"
                            required
                        />

                    </div>

                </div>

                <!-- Phone + Role -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            placeholder="e.g., +251 912 345 678"
                        />

                        <div class="form-hint">
                            Optional / አማራጭ
                        </div>

                    </div>

                    <div class="form-group">

                        <label for="role">
                            Role
                            <span class="required">*</span>
                        </label>

                        <div
                            class="role-selector"
                            id="roleSelector"
                        >

                            <div
                                class="role-option active"
                                data-role="customer"
                            >
                                <i class="fas fa-user"></i>

                                <span class="role-label">
                                    Customer
                                </span>
                            </div>

                            <div
                                class="role-option"
                                data-role="kitchen"
                            >
                                <i class="fas fa-utensil-spoon"></i>

                                <span class="role-label">
                                    Kitchen
                                </span>
                            </div>

                            <div
                                class="role-option"
                                data-role="admin"
                            >
                                <i class="fas fa-shield-alt"></i>

                                <span class="role-label">
                                    Admin
                                </span>
                            </div>

                        </div>

                    </div>

                </div>

                <!-- Password + Confirm Password -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="password">
                            Password
                            <span class="required">*</span>
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Min. 6 characters"
                            required
                        />

                        <div class="form-hint">
                            At least 6 characters /
                            ቢያንስ 6 ፊደሎች
                        </div>

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                            <span class="required">*</span>
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Re-enter password"
                            required
                        />

                    </div>

                </div>

                <!-- Register Button -->
                <button
                    type="submit"
                    class="btn-register"
                    id="registerBtn"
                >

                    <span class="btn-text">
                        <i class="fas fa-user-plus"></i>
                        Register / ምዝገባ
                    </span>

                    <span class="spinner">
                        <i class="fas fa-spinner"></i>
                    </span>

                </button>

            </form>

            <!-- Footer -->
            <div class="footer-text">

                Already have an account?
                <a href="login.html">
                    Login
                </a>

                <br />

                <span
                    style="
                        font-size:12px;
                        color:#94a3b8;
                    "
                >
                    መለያ አለህ?

                    <a
                        href="login.html"
                        style="font-size:12px;"
                    >
                        መግቢያ
                    </a>

                </span>

            </div>

            <!-- Demo -->
            <p class="demo-info">
                <i class="fas fa-info-circle"></i>
                Demo: Any email/password works for testing
            </p>

        </div>
    </div>

    <!-- =========================================================
         JAVASCRIPT
         Original functionality preserved
    ========================================================= -->

    <script type="module">

        import { register } from '../../js/auth.js';

        // ---- Elements ----

        const form =
            document.getElementById('registerForm');

        const fullName =
            document.getElementById('fullName');

        const email =
            document.getElementById('email');

        const phone =
            document.getElementById('phone');

        const password =
            document.getElementById('password');

        const confirmPassword =
            document.getElementById('confirmPassword');

        const registerBtn =
            document.getElementById('registerBtn');

        const alertEl =
            document.getElementById('alertMessage');

        const alertText =
            document.getElementById('alertText');

        const roleOptions =
            document.querySelectorAll('.role-option');

        let selectedRole = 'customer';


        // ---- Role Selection ----

        roleOptions.forEach(opt => {

            opt.addEventListener(
                'click',
                function () {

                    roleOptions.forEach(o =>
                        o.classList.remove('active')
                    );

                    this.classList.add('active');

                    selectedRole =
                        this.dataset.role;
                }
            );

        });


        // ---- Show Alert ----

        function showAlert(
            message,
            type = 'error'
        ) {

            alertEl.className =
                `alert alert-${type} show`;

            alertText.textContent =
                message;
        }


        // ---- Hide Alert ----

        function hideAlert() {

            alertEl.className =
                'alert';
        }


        // ---- Validate Field ----

        function validateField(input) {

            if (
                input.value.trim() === ''
            ) {

                input.classList.add('error');

                input.classList.remove(
                    'success'
                );

                return false;
            }

            input.classList.remove(
                'error'
            );

            input.classList.add(
                'success'
            );

            return true;
        }


        // ---- Register Handler ----

        async function handleRegister(e) {

            e.preventDefault();

            hideAlert();


            // Validate all fields

            const isNameValid =
                validateField(fullName);

            const isEmailValid =
                validateField(email);

            const isPassValid =
                validateField(password);

            const isConfirmValid =
                validateField(confirmPassword);


            if (
                !isNameValid ||
                !isEmailValid ||
                !isPassValid ||
                !isConfirmValid
            ) {

                showAlert(
                    'Please fill in all required fields',
                    'error'
                );

                return;
            }


            // Password length

            if (
                password.value.length < 6
            ) {

                showAlert(
                    'Password must be at least 6 characters',
                    'error'
                );

                password.classList.add(
                    'error'
                );

                return;
            }


            // Password confirmation

            if (
                password.value !==
                confirmPassword.value
            ) {

                showAlert(
                    'Passwords do not match',
                    'error'
                );

                confirmPassword.classList.add(
                    'error'
                );

                return;
            }


            // Loading

            registerBtn.classList.add(
                'loading'
            );

            registerBtn.disabled = true;


            try {

                const result =
                    await register({

                        name:
                            fullName.value.trim(),

                        email:
                            email.value.trim(),

                        phone:
                            phone.value.trim(),

                        password:
                            password.value,

                        confirmPassword:
                            confirmPassword.value,

                        role:
                            selectedRole

                    });


                if (result.success) {

                    showAlert(
                        'Account created successfully! Redirecting...',
                        'success'
                    );


                    // Redirect based on role

                    const rolePaths = {

                        admin:
                            '../admin/dashboard.html',

                        kitchen:
                            '../kitchen/dashboard.html',

                        customer:
                            '../customer/menu.html'

                    };


                    setTimeout(() => {

                        window.location.href =
                            rolePaths[selectedRole] ||
                            '../customer/menu.html';

                    }, 500);

                }

                else {

                    showAlert(
                        result.error ||
                        'Registration failed. Please try again.',
                        'error'
                    );

                    registerBtn.classList.remove(
                        'loading'
                    );

                    registerBtn.disabled =
                        false;
                }

            }

            catch (error) {

                console.error(
                    'Registration error:',
                    error
                );

                showAlert(
                    'An error occurred. Please try again.',
                    'error'
                );

                registerBtn.classList.remove(
                    'loading'
                );

                registerBtn.disabled =
                    false;
            }
        }


        // ---- Event Listeners ----

        form.addEventListener(
            'submit',
            handleRegister
        );


        // ---- Real-time validation ----

        [
            fullName,
            email,
            password,
            confirmPassword

        ].forEach(input => {

            input.addEventListener(
                'blur',
                () => {

                    if (
                        input.value.trim() !== ''
                    ) {

                        input.classList.remove(
                            'error'
                        );

                        input.classList.add(
                            'success'
                        );
                    }

                }
            );


            input.addEventListener(
                'focus',
                () => {

                    input.classList.remove(
                        'error'
                    );

                }
            );

        });


        console.log(
            '📝 Registration page loaded.'
        );

    </script>

</body>
</html>





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen Dashboard | Smart Cafeteria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/kitchen.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />

    <style>
        /* =========================================================
           SMART CAFETERIA — VIBRANT LUXURY KITCHEN DASHBOARD
        ========================================================= */

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #7c3aed;
            --cyan: #06b6d4;
            --pink: #ec4899;
            --orange: #f97316;
            --yellow: #f59e0b;
            --green: #10b981;
            --red: #ef4444;

            --text: #172033;
            --muted: #64748b;
            --light: #f8fafc;
            --white: #ffffff;

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;

            --shadow:
                0 10px 30px rgba(30, 41, 59, .08);

            --shadow-hover:
                0 18px 45px rgba(79, 70, 229, .16);
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            min-width: 0;
            margin: 0;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            line-height: 1.55;
            color: var(--text);
            background: #f8fafc;
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        /* =========================================================
           MAIN BACKGROUND
        ========================================================= */

        .kitchen-page {
            position: relative;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 0% 0%,
                    rgba(79, 70, 229, .13),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 100% 0%,
                    rgba(236, 72, 153, .12),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(6, 182, 212, .11),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(249, 115, 22, .08),
                    transparent 25%
                ),
                #f8fafc;
        }

        .kitchen-page::before {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            top: 15%;
            left: -180px;
            border-radius: 50%;
            background: rgba(124, 58, 237, .08);
            filter: blur(70px);
            pointer-events: none;
        }

        .kitchen-page::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            right: -160px;
            bottom: 10%;
            border-radius: 50%;
            background: rgba(6, 182, 212, .08);
            filter: blur(70px);
            pointer-events: none;
        }

        .kitchen-page .container {
            position: relative;
            z-index: 2;
            width: min(100% - 40px, 1400px);
            margin: 0 auto;
            padding: 28px 0 55px;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .kitchen-header {
            position: relative;
            min-height: 112px;
            padding: 24px 28px !important;
            margin-bottom: 24px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,.8);
            border-radius: var(--radius-lg);

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,.97),
                    rgba(248,250,252,.92)
                );

            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .kitchen-header::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            right: -90px;
            top: -150px;
            border-radius: 50%;
            background:
                linear-gradient(
                    135deg,
                    rgba(79,70,229,.18),
                    rgba(236,72,153,.12)
                );
        }

        .kitchen-header::after {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            right: 170px;
            bottom: -100px;
            border-radius: 50%;
            background: rgba(6,182,212,.12);
        }

        .kitchen-header > div {
            position: relative;
            z-index: 2;
        }

        .kitchen-header h1 {
            display: flex;
            align-items: center;
            gap: 11px;

            margin: 0 !important;

            font-size: clamp(20px, 2vw, 27px) !important;
            line-height: 1.3;
            font-weight: 700 !important;
            letter-spacing: -.3px;
            color: #111827 !important;
        }

        .kitchen-header h1 i {
            width: 46px;
            height: 46px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            color: white !important;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed 55%,
                    #ec4899
                ) !important;

            box-shadow:
                0 9px 24px rgba(79,70,229,.25);
        }

        .kitchen-header p {
            margin: 7px 0 0 !important;
            font-size: 13px !important;
            line-height: 1.5;
            color: var(--muted) !important;
        }

        /* =========================================================
           LIVE STATUS
        ========================================================= */

        #liveStatus {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 7px 13px !important;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 600;

            background: rgba(16,185,129,.10) !important;
            color: #047857 !important;

            border: 1px solid rgba(16,185,129,.18);

            box-shadow:
                0 6px 18px rgba(16,185,129,.10);
        }

        #liveStatus i {
            animation: pulseLive 1.6s infinite;
        }

        @keyframes pulseLive {
            0%,100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .4;
                transform: scale(.75);
            }
        }

        /* =========================================================
           STATS
        ========================================================= */

        .kitchen-stats {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 22px;
        }

        .stat-card {
            position: relative;
            min-width: 0;
            min-height: 130px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 20px;

            overflow: hidden;

            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,.9);

            background: rgba(255,255,255,.94);

            box-shadow: var(--shadow);

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        .stat-card::before {
            content: "";
            position: absolute;
            width: 95px;
            height: 95px;
            right: -35px;
            top: -45px;
            border-radius: 50%;
            opacity: .18;
        }

        .stat-card:nth-child(1)::before {
            background: #f59e0b;
        }

        .stat-card:nth-child(2)::before {
            background: #06b6d4;
        }

        .stat-card:nth-child(3)::before {
            background: #10b981;
        }

        .stat-card:nth-child(4)::before {
            background: #8b5cf6;
        }

        .stat-card::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }

        .stat-card:nth-child(1)::after {
            background: linear-gradient(#f59e0b,#f97316);
        }

        .stat-card:nth-child(2)::after {
            background: linear-gradient(#06b6d4,#2563eb);
        }

        .stat-card:nth-child(3)::after {
            background: linear-gradient(#10b981,#22c55e);
        }

        .stat-card:nth-child(4)::after {
            background: linear-gradient(#7c3aed,#ec4899);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .number {
            position: relative;
            z-index: 2;

            font-size: 30px;
            line-height: 1.2;
            font-weight: 700;

            letter-spacing: -.5px;
        }

        .stat-card .label {
            position: relative;
            z-index: 2;

            margin-top: 6px;

            font-size: 11px;
            line-height: 1.4;
            font-weight: 600;

            color: #64748b;

            text-transform: uppercase;
            letter-spacing: .06em;

            text-align: center;
        }

        .stat-card .number.pending {
            color: #d97706;
        }

        .stat-card .number.preparing {
            color: #0891b2;
        }

        .stat-card .number.ready {
            color: #059669;
        }

        .stat-card .number.served {
            color: #7c3aed;
        }

        /* =========================================================
           TABS
        ========================================================= */

        .order-tabs {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 20px;
            padding: 10px;

            overflow-x: auto;

            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,.9);

            background: rgba(255,255,255,.92);

            box-shadow: 0 8px 25px rgba(30,41,59,.06);

            scrollbar-width: thin;
        }

        .order-tabs .tab-btn {
            flex: 0 0 auto;

            min-height: 38px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;

            padding: 8px 16px;

            border: 1px solid #e2e8f0;
            border-radius: 10px;

            background: #fff;

            color: #64748b;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            transition:
                color .2s ease,
                background .2s ease,
                border .2s ease,
                transform .2s ease;
        }

        .order-tabs .tab-btn:hover {
            color: #4f46e5;
            border-color: rgba(79,70,229,.25);
            background: #f8f7ff;
            transform: translateY(-1px);
        }

        .order-tabs .tab-btn.active {
            color: #fff;
            border-color: transparent;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            box-shadow:
                0 7px 18px rgba(79,70,229,.24);
        }

        .order-tabs .tab-btn:nth-child(2).active {
            background: linear-gradient(135deg,#f59e0b,#f97316);
        }

        .order-tabs .tab-btn:nth-child(3).active {
            background: linear-gradient(135deg,#06b6d4,#2563eb);
        }

        .order-tabs .tab-btn:nth-child(4).active {
            background: linear-gradient(135deg,#10b981,#059669);
        }

        .order-tabs .tab-btn:nth-child(5).active {
            background: linear-gradient(135deg,#64748b,#475569);
        }

        .order-tabs .tab-btn .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 22px;
            height: 21px;

            padding: 0 6px;

            border-radius: 999px;

            background: #f1f5f9;
            color: #64748b;

            font-size: 10px;
            font-weight: 700;
        }

        .order-tabs .tab-btn.active .badge {
            color: white;
            background: rgba(255,255,255,.22);
        }

        /* =========================================================
           ORDER GRID
        ========================================================= */

        .order-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 18px;

            width: 100%;
        }

        /* =========================================================
           ORDER CARD
        ========================================================= */

        .order-card {
            position: relative;
            min-width: 0;

            overflow: hidden;

            padding: 18px;

            border-radius: var(--radius-md);

            border: 1px solid rgba(255,255,255,.95);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.98),
                    rgba(248,250,252,.94)
                );

            box-shadow: var(--shadow);

            border-left: 5px solid #cbd5e1;

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        .order-card::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            right: -80px;
            bottom: -90px;

            border-radius: 50%;

            opacity: .08;
        }

        .order-card.pending {
            border-left-color: #f59e0b;
        }

        .order-card.pending::after {
            background: #f59e0b;
        }

        .order-card.preparing {
            border-left-color: #06b6d4;
        }

        .order-card.preparing::after {
            background: #06b6d4;
        }

        .order-card.ready {
            border-left-color: #10b981;
        }

        .order-card.ready::after {
            background: #10b981;
        }

        .order-card.served {
            border-left-color: #8b5cf6;
        }

        .order-card.served::after {
            background: #8b5cf6;
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .order-card .order-top {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
            flex-wrap: wrap;

            margin-bottom: 10px;
        }

        .order-card .order-top .order-id {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
        }

        .order-card .order-top .order-time {
            font-size: 11px;
            color: #94a3b8;
        }

        .order-card .order-items {
            position: relative;
            z-index: 2;

            margin: 10px 0;
        }

        .order-card .order-items .item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 7px 0;

            border-bottom: 1px dashed #e2e8f0;

            font-size: 12px;
            color: #475569;
        }

        .order-card .order-items .item:last-child {
            border-bottom: none;
        }

        .order-card .order-items .item span:first-child {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .order-card .order-items .item .qty {
            flex: 0 0 auto;

            min-width: 30px;

            padding: 3px 7px;

            text-align: center;

            border-radius: 7px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 10px;
            font-weight: 700;
        }

        .order-card .order-footer {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;
            flex-wrap: wrap;

            margin-top: 11px;
            padding-top: 12px;

            border-top: 1px solid #edf2f7;
        }

        .order-card .order-footer .order-total {
            font-size: 15px;
            font-weight: 700;
            color: #4f46e5;
            white-space: nowrap;
        }

        .order-card .order-footer .actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .order-card .order-footer .actions .btn-action {
            min-height: 34px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;

            padding: 7px 12px;

            border: 0;
            border-radius: 9px;

            color: #fff;

            font-size: 11px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;
        }

        .order-card .order-footer .actions .btn-action:hover {
            transform: translateY(-2px);
            filter: brightness(.97);
        }

        .btn-accept {
            background:
                linear-gradient(
                    135deg,
                    #06b6d4,
                    #2563eb
                );
            box-shadow:
                0 6px 15px rgba(6,182,212,.20);
        }

        .btn-ready {
            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #059669
                );
            box-shadow:
                0 6px 15px rgba(16,185,129,.20);
        }

        .btn-serve {
            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #7c3aed
                );
            box-shadow:
                0 6px 15px rgba(124,58,237,.20);
        }

        /* =========================================================
           STATUS
        ========================================================= */

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 5px 10px;

            border-radius: 999px;

            font-size: 10px;
            line-height: 1.2;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: .04em;

            white-space: nowrap;
        }

        .status-badge.pending {
            color: #b45309;
            background: #fff7ed;
            border: 1px solid #fed7aa;
        }

        .status-badge.preparing {
            color: #0369a1;
            background: #ecfeff;
            border: 1px solid #a5f3fc;
        }

        .status-badge.ready {
            color: #047857;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .status-badge.served {
            color: #6d28d9;
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
        }

        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .empty-state {
            position: relative;
            overflow: hidden;

            padding: 70px 20px;

            text-align: center;

            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,.9);

            background: rgba(255,255,255,.94);

            box-shadow: var(--shadow);
        }

        .empty-state::before {
            content: "";
            position: absolute;

            width: 180px;
            height: 180px;

            left: -90px;
            top: -90px;

            border-radius: 50%;

            background: rgba(79,70,229,.08);
        }

        .empty-state i {
            position: relative;

            display: block;

            margin-bottom: 15px;

            font-size: 50px;

            color: #10b981 !important;

            filter:
                drop-shadow(
                    0 8px 15px
                    rgba(16,185,129,.18)
                );
        }

        .empty-state h3 {
            position: relative;

            margin: 0 0 5px;

            font-size: 18px;
            font-weight: 700;

            color: #172033;
        }

        .empty-state p {
            position: relative;

            margin: 0;

            font-size: 13px;

            color: #64748b;
        }

        /* =========================================================
           LARGE DESKTOP
        ========================================================= */

        @media (min-width: 1600px) {

            .kitchen-page .container {
                width: min(100% - 64px, 1500px);
            }

            .order-grid {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }

            .kitchen-stats {
                gap: 22px;
            }

            .order-card {
                padding: 20px;
            }
        }

        /* =========================================================
           LAPTOP
        ========================================================= */

        @media (max-width: 1200px) {

            .order-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .kitchen-stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 768px) {

            .kitchen-page .container {
                width: min(100% - 28px, 680px);
                padding: 20px 0 40px;
            }

            .kitchen-header {
                min-height: auto;
                padding: 20px !important;
                gap: 15px !important;
            }

            .kitchen-header h1 {
                font-size: 21px !important;
            }

            .kitchen-header h1 i {
                width: 40px;
                height: 40px;
                border-radius: 11px;
            }

            .kitchen-header p {
                font-size: 12px !important;
            }

            .kitchen-header > div:last-child {
                width: 100%;
                justify-content: space-between;
            }

            .kitchen-stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .stat-card {
                min-height: 115px;
                padding: 16px 12px;
            }

            .stat-card .number {
                font-size: 28px;
            }

            .order-tabs {
                width: 100%;
                padding: 8px;
            }

            .order-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 480px) {

            .kitchen-page .container {
                width: calc(100% - 20px);
                padding: 13px 0 28px;
            }

            .kitchen-header {
                padding: 16px !important;
                border-radius: 16px;
            }

            .kitchen-header h1 {
                font-size: 18px !important;
                gap: 8px;
            }

            .kitchen-header h1 i {
                width: 35px;
                height: 35px;
                border-radius: 9px;
                font-size: 14px;
            }

            .kitchen-header p {
                font-size: 11px !important;
                line-height: 1.45;
            }

            #liveStatus {
                padding: 6px 10px !important;
                font-size: 10px;
            }

            .kitchen-stats {
                gap: 9px;
            }

            .stat-card {
                min-height: 100px;
                padding: 13px 7px;
                border-radius: 13px;
            }

            .stat-card .number {
                font-size: 25px;
            }

            .stat-card .label {
                font-size: 8px;
                letter-spacing: .04em;
            }

            .order-tabs {
                border-radius: 13px;
                margin-bottom: 14px;
            }

            .order-tabs .tab-btn {
                min-height: 35px;
                padding: 7px 11px;
                font-size: 10px;
                border-radius: 8px;
            }

            .order-tabs .tab-btn .badge {
                min-width: 19px;
                height: 18px;
                font-size: 9px;
            }

            .order-card {
                padding: 15px;
                border-radius: 15px;
            }

            .order-card .order-top .order-id {
                font-size: 14px;
            }

            .order-card .order-top .order-time {
                font-size: 10px;
            }

            .order-card .order-items .item {
                font-size: 11px;
            }

            .order-card .order-footer {
                flex-direction: column;
                align-items: stretch;
            }

            .order-card .order-footer .order-total {
                font-size: 14px;
            }

            .order-card .order-footer .actions {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr;
            }

            .order-card .order-footer .actions .btn-action {
                width: 100%;
                min-height: 38px;
            }

            .empty-state {
                padding: 55px 15px;
            }

            .empty-state i {
                font-size: 44px;
            }

            .empty-state h3 {
                font-size: 17px;
            }

            .empty-state p {
                font-size: 12px;
            }
        }

        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-width: 360px) {

            .kitchen-stats {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card .number {
                font-size: 23px;
            }

            .stat-card .label {
                font-size: 7.5px;
            }

            .kitchen-header > div:last-child {
                align-items: flex-start !important;
            }
        }

        /* =========================================================
           TOUCH DEVICES
        ========================================================= */

        @media (hover: none) {

            .stat-card:hover,
            .order-card:hover,
            .order-tabs .tab-btn:hover,
            .order-card .order-footer .actions .btn-action:hover {
                transform: none;
            }
        }

        /* =========================================================
           ACCESSIBILITY
        ========================================================= */

        :focus-visible {
            outline: 3px solid rgba(79,70,229,.28);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<div class="kitchen-page">

    <div class="container">

        <div
            class="kitchen-header"
            style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:24px;"
        >

            <div>

                <h1
                    style="font-size:28px; font-weight:700; color:var(--gray-900); margin:0;"
                >
                    <i
                        class="fas fa-utensil-spoon"
                        style="color:#2563eb;"
                    ></i>

                    Kitchen Dashboard
                </h1>

                <p
                    style="color:var(--gray-500); margin:0; font-size:14px;"
                >
                    Manage incoming orders and food preparation
                </p>

            </div>

            <div
                style="display:flex; gap:8px; align-items:center;"
            >

                <span
                    style="font-size:13px; color:var(--gray-400);"
                >
                    <i class="fas fa-sync-alt fa-fw"></i>
                    Live Updates
                </span>

                <span
                    class="status-badge"
                    id="liveStatus"
                    style="background:#dcfce7; color:#166534;"
                >
                    <i
                        class="fas fa-circle"
                        style="font-size:8px; color:#16a34a;"
                    ></i>

                    Active
                </span>

            </div>

        </div>


        <div
            class="kitchen-stats"
            id="kitchenStats"
        >
        </div>


        <div
            class="order-tabs"
            id="orderTabs"
        >

            <button
                class="tab-btn active"
                data-status="all"
            >
                All
                <span class="badge" id="allCount">0</span>
            </button>

            <button
                class="tab-btn"
                data-status="pending"
            >
                Pending
                <span class="badge" id="pendingCount">0</span>
            </button>

            <button
                class="tab-btn"
                data-status="preparing"
            >
                Preparing
                <span class="badge" id="preparingCount">0</span>
            </button>

            <button
                class="tab-btn"
                data-status="ready"
            >
                Ready
                <span class="badge" id="readyCount">0</span>
            </button>

            <button
                class="tab-btn"
                data-status="served"
            >
                Served
                <span class="badge" id="servedCount">0</span>
            </button>

        </div>


        <div id="ordersContainer"></div>

    </div>

</div>


<script type="module">

    import { createHeader } from '../../components/header.js';
    import { createFooter } from '../../components/footer.js';
    import { getCartCount } from '../../js/cart.js';
    import { isLoggedIn, getCurrentUser } from '../../js/auth.js';

    import {
        getAllOrders,
        updateOrderStatus,
        markOrderReady
    } from '../../js/orders.js';

    import { getKitchenStats } from '../../js/orders.js';
    import { showToast } from '../../js/main.js';

    import {
        formatDate,
        formatTime
    } from '../../js/utils/formatters.js';


    const user = getCurrentUser();
    const isLoggedInUser = isLoggedIn();


    if (!isLoggedInUser || user?.role !== 'kitchen') {

        showToast(
            'Access denied. Kitchen staff only.',
            'error'
        );

        setTimeout(() => {

            window.location.href =
                '../common/login.html';

        }, 1500);
    }


    document.body.insertAdjacentHTML(
        'afterbegin',

        createHeader({

            navLinks: [

                {
                    label: 'Dashboard',
                    href: 'dashboard.html',
                    active: true
                },

                {
                    label: 'Orders',
                    href: 'orders.html'
                }

            ],

            user: user,

            isLoggedIn: isLoggedInUser,

            cartCount: getCartCount(),

            theme:
                localStorage.getItem('scos_theme') ||
                'light',

            language:
                localStorage.getItem('scos_language') ||
                'en',

            authButtons: {

                loginLabel: 'Login',

                registerLabel: 'Register',

                loginHref:
                    '../common/login.html',

                registerHref:
                    '../common/register.html'

            },

            onToggleMenu: () => {

                document
                    .getElementById('mainNav')
                    ?.classList
                    .toggle('open');

            },

            onToggleTheme: () => {},

            onToggleLanguage: () => {},

            onLogout: () => {

                if (confirm('Are you sure?')) {

                    localStorage.removeItem(
                        'scos_user'
                    );

                    localStorage.removeItem(
                        'scos_token'
                    );

                    localStorage.removeItem(
                        'scos_cart'
                    );

                    window.location.href =
                        '../common/login.html';
                }

            },

            onNotificationClick: () => {}

        })
    );


    document.body.insertAdjacentHTML(
        'beforeend',

        createFooter({

            quickLinks: [

                {
                    label: 'Home',
                    href: '../../index.html'
                },

                {
                    label: 'Menu',
                    href: '../customer/menu.html'
                },

                {
                    label: 'Login',
                    href: '../common/login.html'
                },

                {
                    label: 'Register',
                    href: '../common/register.html'
                }

            ],

            roleLinks: [

                {
                    label: 'Customer',
                    href: '../customer/menu.html'
                },

                {
                    label: 'Kitchen',
                    href: 'dashboard.html'
                },

                {
                    label: 'Admin',
                    href: '../admin/dashboard.html'
                }

            ]

        })
    );


    const statsContainer =
        document.getElementById(
            'kitchenStats'
        );

    const ordersContainer =
        document.getElementById(
            'ordersContainer'
        );

    const tabs =
        document.querySelectorAll(
            '.tab-btn'
        );


    const statusCounts = {

        all:
            document.getElementById(
                'allCount'
            ),

        pending:
            document.getElementById(
                'pendingCount'
            ),

        preparing:
            document.getElementById(
                'preparingCount'
            ),

        ready:
            document.getElementById(
                'readyCount'
            ),

        served:
            document.getElementById(
                'servedCount'
            )

    };


    let currentFilter = 'all';
    let allOrders = [];


    function renderStats() {

        const stats =
            getKitchenStats();

        statsContainer.innerHTML = `

            <div class="stat-card">

                <div class="number pending">
                    ${stats.pending}
                </div>

                <div class="label">
                    Pending
                </div>

            </div>


            <div class="stat-card">

                <div class="number preparing">
                    ${stats.preparing}
                </div>

                <div class="label">
                    Preparing
                </div>

            </div>


            <div class="stat-card">

                <div class="number ready">
                    ${stats.ready}
                </div>

                <div class="label">
                    Ready
                </div>

            </div>


            <div class="stat-card">

                <div class="number served">
                    ${stats.activeOrders}
                </div>

                <div class="label">
                    Active Orders
                </div>

            </div>

        `;
    }


    function renderOrders(filter = 'all') {

        allOrders =
            Array.isArray(getAllOrders())
                ? getAllOrders()
                : [];


        const pendingCount =
            allOrders.filter(
                o => o.status === 'pending'
            ).length;

        const preparingCount =
            allOrders.filter(
                o => o.status === 'preparing'
            ).length;

        const readyCount =
            allOrders.filter(
                o => o.status === 'ready'
            ).length;

        const servedCount =
            allOrders.filter(
                o => o.status === 'served'
            ).length;


        statusCounts.all.textContent =
            allOrders.length;

        statusCounts.pending.textContent =
            pendingCount;

        statusCounts.preparing.textContent =
            preparingCount;

        statusCounts.ready.textContent =
            readyCount;

        statusCounts.served.textContent =
            servedCount;


        let filtered =
            [...allOrders];


        if (filter !== 'all') {

            filtered =
                filtered.filter(
                    o => o.status === filter
                );
        }


        const orderPriority = {

            pending: 0,
            preparing: 1,
            ready: 2,
            served: 3

        };


        filtered.sort(

            (a,b) =>
                (orderPriority[a.status] ?? 99) -
                (orderPriority[b.status] ?? 99)

        );


        if (filtered.length === 0) {

            ordersContainer.innerHTML = `

                <div class="empty-state">

                    <i
                        class="fas fa-check-circle"
                        style="color:#10b981;"
                    ></i>

                    <h3>
                        All Caught Up!
                    </h3>

                    <p>
                        No ${
                            filter === 'all'
                                ? ''
                                : filter
                        } orders to display.
                    </p>

                </div>

            `;

            return;
        }


        const lang =
            localStorage.getItem(
                'scos_language'
            ) || 'en';


        ordersContainer.innerHTML = `

            <div class="order-grid">

                ${
                    filtered.map(order => {

                        const statusLabel = {

                            pending:
                                'Pending',

                            preparing:
                                'Preparing',

                            ready:
                                'Ready for Pickup',

                            served:
                                'Served'

                        }[order.status]
                        || order.status;


                        const items =
                            Array.isArray(order.items)
                                ? order.items
                                : [];


                        const itemsHTML =
                            items.map(item => {

                                let itemName =
                                    item.name;

                                if (
                                    typeof itemName ===
                                    'object'
                                ) {

                                    itemName =
                                        itemName[lang]
                                        ||
                                        itemName.en
                                        ||
                                        itemName.am
                                        ||
                                        'Food Item';
                                }

                                if (
                                    !itemName
                                ) {

                                    itemName =
                                        'Food Item';
                                }


                                return `

                                    <div class="item">

                                        <span>
                                            ${itemName}
                                        </span>

                                        <span class="qty">
                                            ×${item.quantity || 0}
                                        </span>

                                    </div>

                                `;

                            }).join('');


                        const canAccept =
                            order.status ===
                            'pending';

                        const canReady =
                            order.status ===
                            'preparing';

                        const canServe =
                            order.status ===
                            'ready';


                        return `

                            <div
                                class="order-card ${order.status}"
                                data-id="${order.id}"
                            >

                                <div class="order-top">

                                    <span class="order-id">
                                        #${order.id}
                                    </span>

                                    <span class="order-time">
                                        ${formatTime(
                                            order.orderTime
                                        )}
                                    </span>

                                </div>


                                <div
                                    style="
                                        display:flex;
                                        gap:8px;
                                        flex-wrap:wrap;
                                        margin-bottom:6px;
                                    "
                                >

                                    <span
                                        class="status-badge ${order.status}"
                                    >
                                        ${statusLabel}
                                    </span>

                                    ${
                                        order.paymentStatus ===
                                        'simulated'

                                        ? `

                                            <span
                                                style="
                                                    font-size:11px;
                                                    color:#059669;
                                                    font-weight:600;
                                                "
                                            >

                                                <i
                                                    class="fas fa-check-circle"
                                                ></i>

                                                Paid

                                            </span>

                                        `

                                        : ''
                                    }

                                </div>


                                <div class="order-items">

                                    ${
                                        itemsHTML ||
                                        `
                                            <div class="item">

                                                <span>
                                                    No items
                                                </span>

                                                <span class="qty">
                                                    ×0
                                                </span>

                                            </div>
                                        `
                                    }

                                </div>


                                <div class="order-footer">

                                    <span class="order-total">
                                        ${order.totalAmount} ብር
                                    </span>


                                    <div class="actions">

                                        ${
                                            canAccept

                                            ? `

                                                <button
                                                    class="btn-action btn-accept"
                                                    data-id="${order.id}"
                                                    data-action="accept"
                                                >

                                                    <i
                                                        class="fas fa-check"
                                                    ></i>

                                                    Accept

                                                </button>

                                            `

                                            : ''
                                        }


                                        ${
                                            canReady

                                            ? `

                                                <button
                                                    class="btn-action btn-ready"
                                                    data-id="${order.id}"
                                                    data-action="ready"
                                                >

                                                    <i
                                                        class="fas fa-utensils"
                                                    ></i>

                                                    Ready

                                                </button>

                                            `

                                            : ''
                                        }


                                        ${
                                            canServe

                                            ? `

                                                <button
                                                    class="btn-action btn-serve"
                                                    data-id="${order.id}"
                                                    data-action="serve"
                                                >

                                                    <i
                                                        class="fas fa-flag-checkered"
                                                    ></i>

                                                    Serve

                                                </button>

                                            `

                                            : ''
                                        }

                                    </div>

                                </div>

                            </div>

                        `;

                    }).join('')
                }

            </div>

        `;


        document
            .querySelectorAll('.btn-action')
            .forEach(btn => {

                btn.dataset.originalHTML =
                    btn.innerHTML;


                btn.addEventListener(
                    'click',
                    async function(e) {

                        e.stopPropagation();


                        const orderId =
                            this.dataset.id;

                        const action =
                            this.dataset.action;


                        this.disabled = true;

                        this.innerHTML =
                            '<i class="fas fa-spinner fa-spin"></i>';


                        let result;


                        try {

                            switch (action) {

                                case 'accept':

                                    result =
                                        await updateOrderStatus(
                                            orderId,
                                            'preparing'
                                        );

                                    if (
                                        result?.success
                                    ) {

                                        showToast(
                                            `Order ${orderId} accepted`,
                                            'success'
                                        );
                                    }

                                    break;


                                case 'ready':

                                    result =
                                        await markOrderReady(
                                            orderId
                                        );

                                    if (
                                        result?.success
                                    ) {

                                        showToast(
                                            `Order ${orderId} ready for pickup`,
                                            'success'
                                        );
                                    }

                                    break;


                                case 'serve':

                                    result =
                                        await updateOrderStatus(
                                            orderId,
                                            'served'
                                        );

                                    if (
                                        result?.success
                                    ) {

                                        showToast(
                                            `Order ${orderId} served`,
                                            'info'
                                        );
                                    }

                                    break;


                                default:

                                    result = {
                                        success: false,
                                        error:
                                            'Action failed'
                                    };

                            }

                        } catch (error) {

                            console.error(
                                'Order action error:',
                                error
                            );

                            result = {
                                success: false,
                                error:
                                    error?.message ||
                                    'Action failed'
                            };

                        }


                        if (result?.success) {

                            renderStats();

                            renderOrders(
                                currentFilter
                            );

                        } else {

                            showToast(
                                result?.error ||
                                'Action failed',
                                'error'
                            );

                            this.disabled =
                                false;

                            this.innerHTML =
                                this.dataset.originalHTML ||
                                'Retry';
                        }

                    }
                );

            });

    }


    tabs.forEach(tab => {

        tab.addEventListener(
            'click',
            function() {

                tabs.forEach(
                    t =>
                        t.classList.remove(
                            'active'
                        )
                );

                this.classList.add(
                    'active'
                );

                currentFilter =
                    this.dataset.status;

                renderOrders(
                    currentFilter
                );

            }
        );

    });


    setInterval(() => {

        renderStats();

        renderOrders(
            currentFilter
        );

    }, 30000);


    renderStats();

    renderOrders('all');


    console.log(
        '🍳 Kitchen Dashboard loaded successfully!'
    );

</script>

</body>
</html>

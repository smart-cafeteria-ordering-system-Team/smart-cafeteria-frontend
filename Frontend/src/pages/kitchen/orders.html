<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System - Orders List</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared Kitchen Stylesheet -->
    <link rel="stylesheet" href="../../css/kitchen.css">
    <style>
        :root {

            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --accent-orange: #f97316;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body.admin-body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .admin-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: var(--panel-dark);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-orange);
        }

        .brand-logo span { color: var(--text-light); }

        .admin-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0 0 4px 0;
            font-size: 1.5rem;
        }

        .subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--panel-dark);
            color: var(--text-light);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover, .btn.active {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        .dashboard-card {
            background-color: var(--panel-dark);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th, .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-pending { background-color: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-preparing { background-color: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .badge-ready { background-color: rgba(16, 185, 129, 0.2); color: #10b981; }
    </style>
</head>
<body class="admin-body">

    <!-- TOP NAVBAR -->
    <header class="admin-navbar">
        <div class="nav-left">
            <div class="brand-logo">
                <i class="fa-solid fa-fire-burner"></i>
                <span>Kitchen Display System</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="dashboard.html" class="btn">
                <i class="fa-solid fa-grip"></i> Grid View
            </a>
        </div>
    </header>

    <!-- MAIN ORDERS LIST CONTENT -->
    <main class="admin-main">
        <div class="page-header">
            <div>
                
                <h1>Kitchen Order Queue</h1>
                <p class="subtitle">Detailed list view for tracking, filtering, and completing kitchen orders.</p>
            </div>
            
           <div class="filter-group">
    <button class="btn active" data-status="all">All Active</button>
    <button class="btn" data-status="Pending">Pending</button>
    <button class="btn" data-status="Preparing">Preparing</button>
    <button class="btn" data-status="Ready">Ready</button>
    <button class="btn" data-status="Cancelled">Cancelled</button>
</div>
        </div>

        <!-- ORDERS TABLE -->
        <div class="dashboard-card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Ticket #</th>
                        <th>Customer</th>
                        <th>Items & Quantities</th>
                        <th>Status</th>
                        <th>Time Elapsed</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="kitchenOrdersBody">
                    <!-- Dynamic Order Rows Injected Here -->
                    <tr>
                        <td><strong>#1042</strong></td>
                        <td>John Doe</td>
                        <td>2x Burger, 1x Fries</td>
                        <td><span class="badge badge-preparing">Preparing</span></td>
                        <td>08 mins</td>
                        <td>
                            <button class="btn"><i class="fa-solid fa-check"></i> Mark Ready</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

       <!-- JavaScript Dependencies -->
    <script src="/frontend/src/js/api.js"></script>
    <script src="/frontend/src/js/auth.js"></script>
    <script src="/Frontend/src/pages/kitchen/kitchen.js"></script>

</body>

</html>

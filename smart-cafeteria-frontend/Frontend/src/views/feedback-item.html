

<!-- ================================================================
     SMART CAFETERIA ORDERING SYSTEM - FEEDBACK ITEM VIEW
     ================================================================
     Reusable template for displaying feedback entries.
     Used in: feedback.html, admin/feedback.html
     ================================================================ -->

<div class="feedback-item" data-id="{{id}}">

    <!-- Decorative Accent -->
    <div class="feedback-accent"></div>

    <!-- Header -->
    <div class="fb-header">

        <div class="fb-user-section">

            <!-- User Avatar -->
            <div class="fb-avatar">
                <i class="fas fa-user"></i>
            </div>

            <div class="fb-user-info">

                <div class="fb-user-row">

                    <span class="fb-user">
                        {{userName}}
                    </span>

                    <span class="fb-status {{status}}">
                        {{status}}
                    </span>

                </div>

                <!-- Rating -->
                <div class="fb-rating" aria-label="Rating">
                    {{#each (range 1 5)}}
                        {{#if (<= this ../rating)}}
                            <i class="fas fa-star"></i>
                        {{else}}
                            <i class="far fa-star"></i>
                        {{/if}}
                    {{/each}}

                    <span class="rating-number">
                        {{rating}}/5
                    </span>
                </div>

            </div>

        </div>

        <div class="fb-date">
            <i class="far fa-clock"></i>
            <span>{{createdAt}}</span>
        </div>

    </div>


    <!-- Comment -->
    <div class="fb-comment-wrapper">

        <div class="comment-icon">
            <i class="fas fa-comment-dots"></i>
        </div>

        <div class="fb-comment">
            {{comment}}
        </div>

    </div>


    <!-- Reply (if exists) -->
    {{#if reply}}

        <div class="fb-reply">

            <div class="reply-header">
                <div class="reply-label">
                    <span class="reply-icon">
                        <i class="fas fa-reply"></i>
                    </span>
                    Admin Reply
                </div>
            </div>

            <div class="reply-content">
                {{reply}}
            </div>

        </div>

    {{/if}}


    <!-- Actions (Admin only) -->
    {{#if showActions}}

        <div class="fb-actions">

            {{#if_eq status 'pending'}}

                <button
                    class="btn-sm btn-sm-approve"
                    data-id="{{id}}"
                    type="button"
                >
                    <i class="fas fa-check"></i>
                    <span>Approve</span>
                </button>

            {{/if_eq}}


            <button
                class="btn-sm btn-sm-reply"
                data-id="{{id}}"
                type="button"
            >
                <i class="fas fa-reply"></i>
                <span>Reply</span>
            </button>


            <button
                class="btn-sm btn-sm-delete-fb"
                data-id="{{id}}"
                type="button"
            >
                <i class="fas fa-trash-alt"></i>
                <span>Delete</span>
            </button>

        </div>

    {{/if}}

</div>


<style>

    /* ============================================================
       FEEDBACK CARD
       ============================================================ */

    .feedback-item {
        position: relative;
        overflow: hidden;
        width: 100%;
        box-sizing: border-box;
        padding: 20px;
        background:
            linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.98),
                rgba(248, 250, 252, 0.98)
            );
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 18px;
        box-shadow:
            0 8px 25px rgba(15, 23, 42, 0.06),
            0 2px 7px rgba(37, 99, 235, 0.04);
        font-family: 'Poppins', sans-serif;
        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease,
            border-color 0.3s ease;
    }

    .feedback-item:hover {
        transform: translateY(-3px);
        border-color: rgba(37, 99, 235, 0.18);
        box-shadow:
            0 16px 38px rgba(15, 23, 42, 0.10),
            0 5px 14px rgba(37, 99, 235, 0.06);
    }


    /* ============================================================
       DECORATIVE ACCENT
       ============================================================ */

    .feedback-accent {
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: linear-gradient(
            180deg,
            #2563eb,
            #4f46e5
        );
        border-radius: 18px 0 0 18px;
    }


    /* ============================================================
       HEADER
       ============================================================ */

    .feedback-item .fb-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }


    /* ============================================================
       USER SECTION
       ============================================================ */

    .fb-user-section {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
    }

    .fb-avatar {
        width: 43px;
        height: 43px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 13px;
        color: #ffffff;
        font-size: 16px;
        background: linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );
        box-shadow:
            0 7px 16px rgba(37, 99, 235, 0.22);
    }

    .fb-user-info {
        min-width: 0;
    }

    .fb-user-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .feedback-item .fb-header .fb-user {
        color: #0f172a;
        font-size: 14px;
        font-weight: 700;
        overflow-wrap: anywhere;
    }


    /* ============================================================
       RATING
       ============================================================ */

    .feedback-item .fb-header .fb-rating {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-top: 4px;
        color: #f59e0b;
        font-size: 12px;
        line-height: 1;
    }

    .feedback-item .fb-rating i {
        width: 12px;
        text-align: center;
    }

    .feedback-item .fb-rating .rating-number {
        margin-left: 5px;
        color: #64748b;
        font-size: 10px;
        font-weight: 600;
    }


    /* ============================================================
       STATUS
       ============================================================ */

    .feedback-item .fb-header .fb-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 23px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .feedback-item .fb-header .fb-status.pending {
        background: #fff7d6;
        color: #92400e;
        border: 1px solid #fde68a;
    }

    .feedback-item .fb-header .fb-status.approved {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #bbf7d0;
    }


    /* ============================================================
       DATE
       ============================================================ */

    .feedback-item .fb-header .fb-date {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
    }

    .feedback-item .fb-header .fb-date i {
        color: #64748b;
        font-size: 11px;
    }


    /* ============================================================
       COMMENT
       ============================================================ */

    .fb-comment-wrapper {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 16px;
        padding: 13px 14px;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid rgba(226, 232, 240, 0.75);
    }

    .comment-icon {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        background: #eff6ff;
        color: #2563eb;
        font-size: 12px;
    }

    .feedback-item .fb-comment {
        flex: 1;
        min-width: 0;
        color: #475569;
        font-size: 13px;
        line-height: 1.7;
        overflow-wrap: anywhere;
    }


    /* ============================================================
       ADMIN REPLY
       ============================================================ */

    .feedback-item .fb-reply {
        margin-top: 12px;
        padding: 13px 15px;
        background: linear-gradient(
            135deg,
            #f0fdf4,
            #f7fee7
        );
        border: 1px solid rgba(34, 197, 94, 0.15);
        border-left: 4px solid #16a34a;
        border-radius: 12px;
    }

    .reply-header {
        margin-bottom: 7px;
    }

    .reply-label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #15803d;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
    }

    .reply-icon {
        width: 25px;
        height: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        background: rgba(22, 163, 74, 0.10);
        font-size: 11px;
    }

    .reply-content {
        color: #475569;
        font-size: 12px;
        line-height: 1.65;
        overflow-wrap: anywhere;
    }


    /* ============================================================
       ACTIONS
       ============================================================ */

    .feedback-item .fb-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 15px;
        padding-top: 14px;
        border-top: 1px solid rgba(148, 163, 184, 0.16);
    }

    .feedback-item .fb-actions .btn-sm {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 34px;
        padding: 6px 13px;
        border: none;
        border-radius: 9px;
        font-family: 'Poppins', sans-serif;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }

    .feedback-item .fb-actions .btn-sm:hover {
        transform: translateY(-2px);
    }


    /* Approve */

    .btn-sm-approve {
        background: linear-gradient(
            135deg,
            #16a34a,
            #15803d
        );
        color: #ffffff;
        box-shadow:
            0 5px 13px rgba(22, 163, 74, 0.18);
    }

    .btn-sm-approve:hover {
        background: #15803d;
        box-shadow:
            0 8px 18px rgba(22, 163, 74, 0.25);
    }


    /* Reply */

    .btn-sm-reply {
        background: linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );
        color: #ffffff;
        box-shadow:
            0 5px 13px rgba(37, 99, 235, 0.18);
    }

    .btn-sm-reply:hover {
        background: #1d4ed8;
        box-shadow:
            0 8px 18px rgba(37, 99, 235, 0.25);
    }


    /* Delete */

    .btn-sm-delete-fb {
        background: #fff1f2;
        color: #be123c;
        border: 1px solid #fecdd3 !important;
    }

    .btn-sm-delete-fb:hover {
        background: #dc2626;
        color: #ffffff;
        border-color: #dc2626 !important;
        box-shadow:
            0 8px 18px rgba(220, 38, 38, 0.20);
    }


    /* ============================================================
       TABLET
       ============================================================ */

    @media (max-width: 768px) {

        .feedback-item {
            padding: 17px;
            border-radius: 16px;
        }

        .fb-avatar {
            width: 39px;
            height: 39px;
            border-radius: 11px;
            font-size: 14px;
        }

        .feedback-item .fb-header .fb-user {
            font-size: 13px;
        }

        .feedback-item .fb-comment {
            font-size: 12px;
        }
    }


    /* ============================================================
       MOBILE
       ============================================================ */

    @media (max-width: 480px) {

        .feedback-item {
            padding: 15px;
            border-radius: 15px;
        }

        .feedback-item .fb-header {
            align-items: flex-start;
            flex-direction: column;
        }

        .fb-user-section {
            width: 100%;
        }

        .feedback-item .fb-header .fb-date {
            margin-left: 50px;
        }

        .fb-comment-wrapper {
            padding: 11px;
        }

        .feedback-item .fb-actions {
            gap: 6px;
        }

        .feedback-item .fb-actions .btn-sm {
            flex: 1;
            min-width: 90px;
            padding: 7px 9px;
            font-size: 10px;
        }
    }


    /* ============================================================
       VERY SMALL SCREENS
       ============================================================ */

    @media (max-width: 350px) {

        .feedback-item {
            padding: 12px;
        }

        .fb-avatar {
            width: 34px;
            height: 34px;
            font-size: 12px;
        }

        .feedback-item .fb-header .fb-user {
            font-size: 12px;
        }

        .feedback-item .fb-header .fb-date {
            margin-left: 43px;
            font-size: 10px;
        }

        .feedback-item .fb-actions .btn-sm {
            width: 100%;
            flex: none;
        }
    }

</style>

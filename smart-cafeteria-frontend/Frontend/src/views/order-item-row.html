<!-- ================================================================
     SMART CAFETERIA ORDERING SYSTEM - ORDER ITEM ROW VIEW
     ================================================================
     Reusable template for displaying a single order item row.
     Used in: order-tracking.html, order-history.html, admin/orders.html
     ================================================================ -->

<div class="order-item-row" data-item-id="{{itemId}}">

    <!-- Food Indicator -->
    <div class="oir-food-icon" aria-hidden="true">
        <i class="fas fa-utensils"></i>
    </div>

    <!-- Item Information -->
    <div class="oir-item-info">
        <div class="oir-item-name">
            {{name}}
        </div>

        {{#if notes}}
            <div class="oir-notes">
                <i class="fas fa-pen"></i>
                <span>{{notes}}</span>
            </div>
        {{/if}}
    </div>

    <!-- Quantity -->
    <div class="oir-quantity">
        <span class="oir-label">Qty</span>
        <span class="oir-qty-value">×{{quantity}}</span>
    </div>

    <!-- Unit Price -->
    <div class="oir-price">
        <span class="oir-label">Price</span>
        <span>{{price}} <small>ብር</small></span>
    </div>

    <!-- Subtotal -->
    <div class="oir-subtotal">
        <span class="oir-label">Subtotal</span>
        <strong>{{subtotal}} <small>ብር</small></strong>
    </div>

</div>

<style>
/* ================================================================
   ORDER ITEM ROW — PREMIUM / MODERN DESIGN
   ================================================================ */

.order-item-row {
    --oir-primary: #2563eb;
    --oir-primary-dark: #1d4ed8;
    --oir-primary-soft: #eff6ff;
    --oir-purple: #7c3aed;
    --oir-text: #172033;
    --oir-muted: #64748b;
    --oir-border: #e8edf5;

    position: relative;
    display: grid;
    grid-template-columns: 48px minmax(180px, 1fr) 78px 110px 125px;
    align-items: center;
    gap: 14px;

    width: 100%;
    padding: 14px 16px;

    background:
        linear-gradient(135deg,
            rgba(255,255,255,0.98),
            rgba(248,250,255,0.98));

    border: 1px solid var(--oir-border);
    border-radius: 16px;

    box-shadow:
        0 4px 14px rgba(15, 23, 42, 0.05),
        0 1px 2px rgba(15, 23, 42, 0.03);

    overflow: hidden;
    box-sizing: border-box;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
}

/* Decorative gradient line */
.order-item-row::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 4px;

    border-radius: 0 8px 8px 0;

    background:
        linear-gradient(
            180deg,
            var(--oir-primary),
            var(--oir-purple)
        );

    opacity: 0.9;
}

/* Hover */
.order-item-row:hover {
    transform: translateY(-2px);

    border-color: rgba(37, 99, 235, 0.25);

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8faff
        );

    box-shadow:
        0 12px 30px rgba(37, 99, 235, 0.10),
        0 4px 10px rgba(15, 23, 42, 0.05);
}


/* ================================================================
   FOOD ICON
   ================================================================ */

.order-item-row .oir-food-icon {
    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #eef2ff
        );

    color: var(--oir-primary);

    font-size: 18px;

    border: 1px solid rgba(37, 99, 235, 0.10);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.8),
        0 4px 12px rgba(37, 99, 235, 0.08);

    transition: all 0.25s ease;
}

.order-item-row:hover .oir-food-icon {
    transform: rotate(-5deg) scale(1.06);

    background:
        linear-gradient(
            135deg,
            #dbeafe,
            #ede9fe
        );

    box-shadow:
        0 7px 18px rgba(37, 99, 235, 0.14);
}


/* ================================================================
   ITEM INFORMATION
   ================================================================ */

.order-item-row .oir-item-info {
    min-width: 0;
}

.order-item-row .oir-item-name {
    color: var(--oir-text);

    font-size: 15px;
    line-height: 1.4;

    font-weight: 700;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.order-item-row .oir-notes {
    display: flex;
    align-items: center;
    gap: 6px;

    margin-top: 5px;

    color: #94a3b8;

    font-size: 11px;
    font-weight: 500;

    max-width: 100%;
}

.order-item-row .oir-notes i {
    color: #8b5cf6;
    font-size: 10px;
    flex-shrink: 0;
}

.order-item-row .oir-notes span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


/* ================================================================
   LABELS
   ================================================================ */

.order-item-row .oir-label {
    display: block;

    margin-bottom: 3px;

    color: #94a3b8;

    font-size: 9px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 0.08em;
}


/* ================================================================
   QUANTITY
   ================================================================ */

.order-item-row .oir-quantity {
    text-align: center;

    padding: 7px 8px;

    background: #f8fafc;

    border: 1px solid #edf1f6;
    border-radius: 11px;
}

.order-item-row .oir-qty-value {
    display: block;

    color: var(--oir-primary);

    font-size: 14px;
    font-weight: 800;
}


/* ================================================================
   PRICE
   ================================================================ */

.order-item-row .oir-price {
    padding-left: 12px;

    border-left: 1px solid #edf1f6;

    color: #475569;

    font-size: 13px;
    font-weight: 600;

    text-align: right;
}

.order-item-row .oir-price small {
    color: #94a3b8;
    font-size: 10px;
    font-weight: 500;
}


/* ================================================================
   SUBTOTAL
   ================================================================ */

.order-item-row .oir-subtotal {
    padding: 9px 12px;

    text-align: right;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #f5f3ff
        );

    border: 1px solid rgba(37, 99, 235, 0.08);
}

.order-item-row .oir-subtotal strong {
    display: block;

    color: var(--oir-primary);

    font-size: 15px;
    font-weight: 800;

    white-space: nowrap;
}

.order-item-row .oir-subtotal small {
    color: #64748b;
    font-size: 10px;
    font-weight: 600;
}


/* ================================================================
   RESPONSIVE — TABLET
   ================================================================ */

@media (max-width: 900px) {

    .order-item-row {
        grid-template-columns:
            44px
            minmax(140px, 1fr)
            68px
            95px
            110px;

        gap: 10px;
        padding: 12px;
    }

    .order-item-row .oir-food-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        font-size: 16px;
    }

    .order-item-row .oir-item-name {
        font-size: 14px;
    }

    .order-item-row .oir-subtotal strong {
        font-size: 14px;
    }
}


/* ================================================================
   RESPONSIVE — MOBILE
   ================================================================ */

@media (max-width: 650px) {

    .order-item-row {
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 10px;

        padding: 13px;
        border-radius: 15px;
    }

    .order-item-row .oir-food-icon {
        grid-row: span 2;

        width: 42px;
        height: 42px;
    }

    .order-item-row .oir-item-info {
        padding-right: 2px;
    }

    .order-item-row .oir-item-name {
        font-size: 14px;
    }

    .order-item-row .oir-quantity,
    .order-item-row .oir-price,
    .order-item-row .oir-subtotal {
        grid-column: 2;
    }

    .order-item-row .oir-quantity {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;

        margin-top: 2px;
        padding: 7px 10px;

        text-align: left;
    }

    .order-item-row .oir-quantity .oir-label {
        margin: 0;
    }

    .order-item-row .oir-qty-value {
        display: inline;
    }

    .order-item-row .oir-price {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 7px 0;

        border-left: 0;
        border-top: 1px solid #edf1f6;

        text-align: left;
    }

    .order-item-row .oir-price .oir-label {
        margin: 0;
    }

    .order-item-row .oir-subtotal {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 9px 11px;

        text-align: left;
    }

    .order-item-row .oir-subtotal .oir-label {
        margin: 0;
    }
}


/* ================================================================
   SMALL MOBILE
   ================================================================ */

@media (max-width: 380px) {

    .order-item-row {
        padding: 11px;
        gap: 8px;
    }

    .order-item-row .oir-food-icon {
        width: 38px;
        height: 38px;
        font-size: 14px;
    }

    .order-item-row .oir-item-name {
        font-size: 13px;
    }

    .order-item-row .oir-notes {
        font-size: 10px;
    }

    .order-item-row .oir-price,
    .order-item-row .oir-subtotal {
        font-size: 12px;
    }

    .order-item-row .oir-subtotal strong {
        font-size: 13px;
    }
}
</style>

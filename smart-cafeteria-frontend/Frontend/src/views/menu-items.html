

<!-- ================================================================
     SMART CAFETERIA ORDERING SYSTEM - MENU ITEM CARD
     ================================================================ -->

<div class="menu-item-card" data-id="{{id}}">

    <!-- IMAGE -->
    <div class="item-image">

        {{#if image}}
            <img src="{{image}}" alt="{{name}}" loading="lazy">
        {{else}}
            <div class="item-placeholder" aria-hidden="true">
                <i class="fas fa-utensils"></i>
            </div>
        {{/if}}

        {{#unless availability}}
            <span class="unavailable-badge">
                <i class="fas fa-ban"></i>
                <span>Unavailable</span>
            </span>
        {{/unless}}

    </div>


    <!-- CONTENT -->
    <div class="item-body">

        <div class="item-category">
            <i class="fas fa-tag" aria-hidden="true"></i>
            <span>{{category}}</span>
        </div>

        <div class="item-name">
            {{name}}
        </div>

        <div class="item-desc">
            {{description}}
        </div>


        <!-- FOOTER -->
        <div class="item-footer">

            <span class="item-price">
                {{price}}
                <small>ብር</small>
            </span>


            {{#if availability}}

                <button
                    class="btn-add {{#if inCart}}in-cart{{/if}}"
                    data-id="{{id}}"
                    type="button"
                >

                    <span class="add-text">
                        <i class="fas fa-cart-plus" aria-hidden="true"></i>
                        <span>Add</span>
                    </span>

                    <span class="added">
                        <i class="fas fa-check" aria-hidden="true"></i>
                        <span>Added</span>
                    </span>

                </button>

            {{else}}

                <span class="unavailable-text">
                    <i class="fas fa-circle-xmark" aria-hidden="true"></i>
                    <span>Unavailable</span>
                </span>

            {{/if}}

        </div>

    </div>

</div>


<style>

/* ================================================================
   SMART CAFETERIA — MENU CARD
   ================================================================ */

.menu-item-card {
    width: 100%;
    min-width: 0;
    position: relative;

    background: #ffffff;

    border: 1px solid #e8edf5;
    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 8px 25px rgba(15, 23, 42, 0.07);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}


/* TOP COLOR LINE */

.menu-item-card::before {
    content: "";
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 3px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed,
            #ec4899,
            #f59e0b
        );

    opacity: 0;

    transition: opacity .3s ease;

    z-index: 10;
}


.menu-item-card:hover {
    transform: translateY(-6px);

    border-color: #bfdbfe;

    box-shadow:
        0 20px 45px rgba(15, 23, 42, .12),
        0 8px 20px rgba(37, 99, 235, .08);
}


.menu-item-card:hover::before {
    opacity: 1;
}


/* ================================================================
   IMAGE
   ================================================================ */

.menu-item-card .item-image {
    position: relative;

    width: 100%;
    height: 190px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #dbeafe,
            #e0e7ff,
            #fce7f3
        );
}


.menu-item-card .item-image img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transition:
        transform .5s ease,
        filter .3s ease;
}


.menu-item-card:hover .item-image img {
    transform: scale(1.07);
    filter: saturate(1.08);
}


/* ================================================================
   PLACEHOLDER ICON
   ================================================================ */

.menu-item-card .item-placeholder {
    width: 76px;
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(255,255,255,.82);

    border: 1px solid rgba(255,255,255,.95);

    box-shadow:
        0 10px 30px rgba(37,99,235,.12);

    color: #2563eb;

    font-size: 32px;
}


/* ================================================================
   UNAVAILABLE BADGE
   ================================================================ */

.menu-item-card .unavailable-badge {
    position: absolute;

    top: 12px;
    right: 12px;

    z-index: 5;

    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 7px 12px;

    background: #dc2626;
    color: #ffffff;

    border-radius: 999px;

    font-size: 11px;
    font-weight: 700;

    box-shadow:
        0 6px 18px rgba(220,38,38,.28);
}


/* ================================================================
   BODY
   ================================================================ */

.menu-item-card .item-body {
    padding: 17px 18px 18px;

    background: #ffffff;
}


/* ================================================================
   CATEGORY
   ================================================================ */

.menu-item-card .item-category {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    max-width: 100%;

    padding: 5px 10px;

    border-radius: 999px;

    background: #eff6ff;

    border: 1px solid #dbeafe;

    color: #2563eb;

    font-size: 10px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: .06em;
}


.menu-item-card .item-category i {
    font-size: 9px;
}


/* ================================================================
   NAME
   ================================================================ */

.menu-item-card .item-name {
    margin-top: 9px;
    margin-bottom: 5px;

    color: #0f172a;

    font-size: 18px;
    line-height: 1.35;

    font-weight: 800;

    letter-spacing: -.02em;

    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 1;

    overflow: hidden;

    transition: color .25s ease;
}


.menu-item-card:hover .item-name {
    color: #2563eb;
}


/* ================================================================
   DESCRIPTION
   ================================================================ */

.menu-item-card .item-desc {
    min-height: 40px;

    margin-bottom: 14px;

    color: #64748b;

    font-size: 13px;
    line-height: 1.6;

    display: -webkit-box;

    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;

    overflow: hidden;
}


/* ================================================================
   FOOTER
   ================================================================ */

.menu-item-card .item-footer {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding-top: 14px;

    border-top: 1px solid #edf1f6;
}


/* ================================================================
   PRICE
   ================================================================ */

.menu-item-card .item-price {
    display: inline-flex;

    align-items: baseline;

    gap: 5px;

    color: #1d4ed8;

    font-size: 21px;
    line-height: 1;

    font-weight: 800;
}


.menu-item-card .item-price small {
    color: #64748b;

    font-size: 12px;
    font-weight: 600;
}


/* ================================================================
   ADD BUTTON
   ================================================================ */

.menu-item-card .btn-add {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    min-width: 88px;
    min-height: 38px;

    padding: 8px 14px;

    border: 0;
    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: #ffffff;

    font-family: 'Poppins', sans-serif;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 7px 18px rgba(37,99,235,.22);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
}


.menu-item-card .btn-add:hover {
    transform: translateY(-2px);

    filter: brightness(1.06);

    box-shadow:
        0 10px 24px rgba(37,99,235,.30);
}


.menu-item-card .btn-add:active {
    transform: scale(.96);
}


/* ================================================================
   BUTTON ICON
   ================================================================ */

.menu-item-card .btn-add i {
    font-size: 11px;
}


/* ================================================================
   ADDED STATE
   ================================================================ */

.menu-item-card .btn-add .added {
    display: none;
}


.menu-item-card .btn-add.in-cart {
    background:
        linear-gradient(
            135deg,
            #16a34a,
            #059669
        );

    box-shadow:
        0 7px 18px rgba(22,163,74,.22);
}


.menu-item-card .btn-add.in-cart .add-text {
    display: none;
}


.menu-item-card .btn-add.in-cart .added {
    display: inline-flex;

    align-items: center;
    gap: 6px;
}


/* ================================================================
   UNAVAILABLE TEXT
   ================================================================ */

.menu-item-card .unavailable-text {
    display: inline-flex;

    align-items: center;
    gap: 6px;

    padding: 7px 10px;

    color: #dc2626;

    background: #fef2f2;

    border: 1px solid #fee2e2;

    border-radius: 9px;

    font-size: 11px;
    font-weight: 700;
}


/* ================================================================
   TABLET
   ================================================================ */

@media (max-width: 900px) {

    .menu-item-card .item-image {
        height: 175px;
    }

    .menu-item-card .item-body {
        padding: 15px;
    }

    .menu-item-card .item-name {
        font-size: 17px;
    }

}


/* ================================================================
   MOBILE
   ================================================================ */

@media (max-width: 600px) {

    .menu-item-card {
        border-radius: 16px;
    }

    .menu-item-card .item-image {
        height: 180px;
    }

    .menu-item-card .item-body {
        padding: 15px;
    }

    .menu-item-card .item-name {
        font-size: 16px;
    }

    .menu-item-card .item-desc {
        font-size: 12px;
    }

    .menu-item-card .item-price {
        font-size: 19px;
    }

    .menu-item-card .btn-add {
        min-width: 80px;
        padding: 8px 11px;
        font-size: 11px;
    }

}


/* ================================================================
   SMALL PHONE
   ================================================================ */

@media (max-width: 380px) {

    .menu-item-card .item-image {
        height: 155px;
    }

    .menu-item-card .item-body {
        padding: 13px;
    }

    .menu-item-card .item-footer {
        gap: 6px;
    }

    .menu-item-card .item-price {
        font-size: 18px;
    }

    .menu-item-card .btn-add {
        min-width: 74px;
        padding: 7px 9px;
    }

}


/* ================================================================
   ACCESSIBILITY
   ================================================================ */

.menu-item-card button:focus-visible {
    outline: 3px solid rgba(37,99,235,.25);
    outline-offset: 3px;
}


@media (prefers-reduced-motion: reduce) {

    .menu-item-card,
    .menu-item-card *,
    .menu-item-card img {
        transition: none !important;
    }

    .menu-item-card:hover {
        transform: none;
    }

}

</style>

openapi: 3.0.0
info:
  title: Smart Cafeteria Ordering System API
  description: Backend RESTful API documentation for authentication, food menu management, and order status updates.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Development Server

paths:
  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Successful authentication
        '400':
          description: Invalid input

  /menu:
    get:
      summary: Fetch Menu Items
      responses:
        '200':
          description: Returns array of food items

  /orders:
    post:
      summary: Place Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                totalPrice:
                  type: number
      responses:
        '201':
          description: Order created successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT